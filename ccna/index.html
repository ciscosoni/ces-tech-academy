 from 3.3.3.3 icmp_seq=13 ttl=254 time=0.581 ms\n84 bytes from 3.3.3.3 icmp_seq=14 ttl=254 time=0.586 ms\n84 bytes from 3.3.3.3 icmp_seq=15 ttl=254 time=0.532 ms\n84 bytes from 3.3.3.3 icmp_seq=16 ttl=254 time=0.625 ms\n84 bytes from 3.3.3.3 icmp_seq=17 ttl=254 time=0.559 ms\n84 bytes from 3.3.3.3 icmp_seq=18 ttl=254 time=0.646 ms\n84 bytes from 3.3.3.3 icmp_seq=19 ttl=254 time=0.615 ms\n84 bytes from 3.3.3.3 icmp_seq=20 ttl=254 time=0.680 ms\n84 bytes from 3.3.3.3 icmp_seq=21 ttl=254 time=0.897 ms\n84 bytes from 3.3.3.3 icmp_seq=22 ttl=254 time=0.649 ms\n84 bytes from 3.3.3.3 icmp_seq=23 ttl=254 time=0.657 ms\n84 bytes from 3.3.3.3 icmp_seq=24 ttl=254 time=0.806 ms\n84 bytes from 3.3.3.3 icmp_seq=25 ttl=254 time=0.790 ms\n84 bytes from 3.3.3.3 icmp_seq=26 ttl=254 time=0.665 ms\n84 bytes from 3.3.3.3 icmp_seq=27 ttl=254 time=0.715 ms\n84 bytes from 3.3.3.3 icmp_seq=28 ttl=254 time=0.579 ms\n84 bytes from 3.3.3.3 icmp_seq=29 ttl=254 time=0.854 ms\n84 bytes from 3.3.3.3 icmp_seq=30 ttl=254 time=0.765 ms\n84 bytes from 3.3.3.3 icmp_seq=31 ttl=254 time=1.201 ms\n84 bytes from 3.3.3.3 icmp_seq=32 ttl=254 time=0.558 ms\n84 bytes from 3.3.3.3 icmp_seq=33 ttl=254 time=0.764 ms\n84 bytes from 3.3.3.3 icmp_seq=34 ttl=254 time=0.665 ms\n84 bytes from 3.3.3.3 icmp_seq=35 ttl=254 time=0.675 ms\n84 bytes from 3.3.3.3 icmp_seq=36 ttl=254 time=0.731 ms\n84 bytes from 3.3.3.3 icmp_seq=37 ttl=254 time=0.637 ms\n84 bytes from 3.3.3.3 icmp_seq=38 ttl=254 time=0.487 ms\n84 bytes from 3.3.3.3 icmp_seq=39 ttl=254 time=0.720 ms\n84 bytes from 3.3.3.3 icmp_seq=40 ttl=254 time=0.721 ms\n\nVPCS> "}, {"id": "15_R1_return", "dev": "R1", "title": "R1: the LAN interface comes back", "text": "R1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#interface Ethernet0/2\nR1(config-if)# no shutdown\nR1(config-if)#end\nR1#\n*Oct  6 10:47:26.436: %SYS-5-CONFIG_I: Configured from console by console\n*Oct  6 10:47:27.632: %HSRP-5-STATECHANGE: Ethernet0/2 Grp 1 state Listen -> Active\nR1#\n*Oct  6 10:47:27.937: %LINK-3-UPDOWN: Interface Ethernet0/2, changed state to up\n*Oct  6 10:47:28.942: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/2, changed state to up\nR1#show standby brief\n                     P indicates configured to preempt.\n                     |\nInterface   Grp  Pri P State   Active          Standby         Virtual IP\nEt0/2       1    110 P Active  local           192.168.1.3     192.168.1.1\nR1#"}, {"id": "16_R2_back", "dev": "R2", "title": "R2: back to standby", "text": "R2#show standby brief\n                     P indicates configured to preempt.\n                     |\nInterface   Grp  Pri P State   Active          Standby         Virtual IP\nEt0/2       1    100   Standby 192.168.1.2     local           192.168.1.1\nR2#"}, {"id": "17_R1_config", "dev": "R1", "title": "final configuration", "text": "R1#show running-config | section interface Ethernet0/2|router ospf\ninterface Ethernet0/2\n description LAN A\n ip address 192.168.1.2 255.255.255.0\n standby 1 ip 192.168.1.1\n standby 1 priority 110\n standby 1 preempt\nrouter ospf 1\n router-id 1.1.1.1\n passive-interface Ethernet0/2\n network 1.1.1.1 0.0.0.0 area 0\n network 10.0.13.0 0.0.0.3 area 0\n network 192.168.1.0 0.0.0.255 area 0\nR1#"}, {"id": "17_R2_config", "dev": "R2", "title": "final configuration", "text": "R2#show running-config | section interface Ethernet0/2|router ospf\ninterface Ethernet0/2\n description LAN A\n ip address 192.168.1.3 255.255.255.0\n standby 1 ip 192.168.1.1\nrouter ospf 1\n router-id 2.2.2.2\n passive-interface Ethernet0/2\n network 2.2.2.2 0.0.0.0 area 0\n network 10.0.23.0 0.0.0.3 area 0\n network 192.168.1.0 0.0.0.255 area 0\nR2#"}, {"id": "17_R3_config", "dev": "R3", "title": "final configuration", "text": "R3#show running-config | section interface Ethernet0/2|router ospf\ninterface Ethernet0/2\n no ip address\n shutdown\nrouter ospf 1\n router-id 3.3.3.3\n network 3.3.3.3 0.0.0.0 area 0\n network 10.0.13.0 0.0.0.3 area 0\n network 10.0.23.0 0.0.0.3 area 0\nR3#"}]}, {"id": "L27", "week": 7, "title": "One address for the whole office", "kind": "build", "mins": 45, "story": "Every PC at HQ has a private address, and the internet does not route private addresses. You translate them at the edge in three ways and watch the translation table fill.", "tasks": ["Mark the inside and the outside interface.", "Static NAT: give one inside host a fixed public address.", "Dynamic NAT: a pool of public addresses for the PCs.", "Remove the pool rule and replace it with overload: many PCs behind one address.", "Read the translation table after each step."], "twist": "You shrink the pool to a single address. What happens to the second PC that tries to go out?", "play": "Send a packet from PC1 to the web server. Its source address is rewritten at R1 before your eyes, and rewritten back on the reply.", "checks": ["In the translation table, which column is the inside local address and which the inside global?", "Which keyword turns a NAT rule into port address translation?", "Which source address does the web server see?"], "cmds": ["ip nat inside", "ip nat outside", "ip nat inside source static 192.168.1.10 203.0.113.17", "ip nat pool OFFICE 203.0.113.18 203.0.113.30 netmask 255.255.255.240", "access-list 1 permit 192.168.1.0 0.0.0.255", "ip nat inside source list 1 pool OFFICE", "clear ip nat translation *", "no ip nat inside source list 1 pool OFFICE", "ip nat inside source list 1 interface e0/3 overload", "show ip nat translations", "show ip nat statistics"], "topics": ["4.1", "1.7"], "topo": {"nodes": [{"id": "PC1", "kind": "pc", "x": 80, "y": 140, "label": "PC1", "sub": [], "site": null}, {"id": "PC2", "kind": "pc", "x": 80, "y": 370, "label": "PC2", "sub": [], "site": null}, {"id": "HUB", "kind": "hub", "x": 230, "y": 255, "label": "Switch", "sub": [], "site": null}, {"id": "R1", "kind": "router", "x": 430, "y": 255, "label": "R1", "sub": [], "site": "HQ"}, {"id": "ISP", "kind": "router", "x": 680, "y": 255, "label": "ISP", "sub": [], "site": "Internet provider"}, {"id": "WEB", "kind": "server", "x": 910, "y": 255, "label": "Web server", "sub": [], "site": null}], "links": [{"a": "PC1", "ai": "eth0", "aip": "192.168.1.10", "b": "HUB", "bi": "", "bip": null, "net": "192.168.1.0/24", "kind": "access", "quiet": true}, {"a": "PC2", "ai": "eth0", "aip": "192.168.1.11", "b": "HUB", "bi": "", "bip": null, "net": "192.168.1.0/24", "kind": "access", "quiet": true}, {"a": "HUB", "ai": "", "aip": null, "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "quiet": true, "label": "inside"}, {"a": "R1", "ai": "e0/3", "aip": "203.0.113.2", "b": "ISP", "bi": "e0/0", "bip": "203.0.113.1", "net": "203.0.113.0/30", "kind": "eth", "label": "outside"}, {"a": "ISP", "ai": "e0/1", "aip": "198.51.100.1", "b": "WEB", "bi": "e0/0", "bip": "198.51.100.10", "net": "198.51.100.0/24", "kind": "eth", "quiet": true}], "notes": [{"x": 430, "y": 400, "lines": ["private inside: 192.168.1.0/24", "public pool: 203.0.113.16/28"], "anchor": "middle", "cls": "hand"}], "h": 480}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": "The provider's router has a route to the public pool, as a real provider would.", "status": "designed", "scenes": [{"t": "Outbound", "text": "At R1 the private source address becomes a public one.", "path": ["PC1", "HUB", "R1", "ISP", "WEB"], "badges": {"R1": "translate"}}, {"t": "Reply", "text": "The reply is addressed to the public address. R1 looks it up and restores the private one.", "path": ["WEB", "ISP", "R1", "HUB", "PC1"], "badges": {"R1": "translate back"}}], "folder": null, "beyond": null, "devices": 5, "cml": true}, {"id": "L28", "week": 7, "title": "Addresses across the WAN", "kind": "build", "mins": 40, "story": "New PCs at the Depot should get their addresses automatically from the server at HQ. A DHCP request is a broadcast, and routers do not forward broadcasts. Something at the Depot must carry it across.", "tasks": ["Build the DHCP pool for the Depot LAN on R1, with excluded addresses.", "Configure the relay on R3's LAN interface.", "Let PC2 ask for an address and read the binding on R1.", "Make R1 a small DNS server, hand its address out through DHCP, and resolve a name from PC2.", "Make a router interface a DHCP client as well."], "twist": "The pool lives at HQ but the address belongs to the Depot. How does the server know which pool to use?", "play": "Watch the four DHCP messages cross the map: broadcast at the Depot, unicast across the WAN.", "checks": ["Which command configures the relay, and on which interface does it go?", "Name the four messages of a DHCP exchange in order.", "What does the relay add to the request so that the server can choose the right pool?"], "cmds": ["ip dhcp excluded-address 192.168.3.1 192.168.3.9", "ip dhcp pool DEPOT", "network 192.168.3.0 255.255.255.0", "default-router 192.168.3.1", "dns-server 1.1.1.1", "ip dns server", "ip host files.lab.example 192.168.3.100", "ip helper-address 10.0.13.1", "show ip dhcp binding", "show ip dhcp pool", "ip address dhcp", "ip dhcp   (VPCS)"], "topics": ["4.3", "4.6"], "topo": {"nodes": [{"id": "PC1", "kind": "pc", "x": 70, "y": 250, "label": "PC1", "sub": [], "site": null}, {"id": "R1", "kind": "router", "x": 290, "y": 250, "label": "R1", "sub": ["DHCP server", "pool DEPOT 192.168.3.0/24"], "site": "HQ"}, {"id": "R3", "kind": "router", "x": 650, "y": 250, "label": "R3", "sub": ["relay:", "ip helper-address 10.0.13.1"], "site": "Depot"}, {"id": "PC2", "kind": "pc", "x": 920, "y": 250, "label": "PC2", "sub": ["address by DHCP"], "site": null}], "links": [{"a": "PC1", "ai": "eth0", "aip": "192.168.1.10", "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}, {"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth"}, {"a": "R3", "ai": "e0/2", "aip": "192.168.3.1", "b": "PC2", "bi": "eth0", "bip": null, "net": "192.168.3.0/24", "kind": "eth", "name": "LAN B"}], "notes": [{"x": 785, "y": 150, "lines": ["a broadcast stops here.", "the relay carries it on."], "anchor": "middle", "cls": "hand"}], "h": 430}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": "OSPF between the sites is already running. The server answers the relay at its LAN address, so R1 must have a route to the Depot LAN.", "status": "designed", "scenes": [{"t": "Discover", "text": "PC2 broadcasts. R3 hears it on its LAN interface and forwards it to R1 as a unicast.", "path": ["PC2", "R3", "R1"]}, {"t": "Offer", "text": "R1 picks the pool that matches the relay's address and answers through R3.", "path": ["R1", "R3", "PC2"]}], "folder": null, "beyond": "The exam asks you to configure the DHCP client and the relay. Building the server pool is beyond it, and is needed here to have something to relay to.", "devices": 4, "cml": true}, {"id": "L29", "week": 7, "title": "169.254", "kind": "ticket", "mins": 30, "story": "Ticket: \"New Depot PCs show an address starting 169.254 and cannot reach anything.\" Yesterday it worked.", "tasks": ["Confirm the symptom on the PC.", "Find out whether the requests reach the server at all.", "Check the pool: its subnet, its free addresses, its exclusions.", "Fix the cause and renew the lease."], "twist": "Three causes are possible: the relay was removed, the pool is exhausted, or the pool was built for the wrong subnet. Only one is true this time.", "play": "Follow the Discover message on the map and see where it dies.", "checks": ["What does an address in 169.254.0.0/16 tell you?", "Which command shows how many addresses a pool has leased?", "On which router would you look to see whether requests arrive?"], "cmds": ["ipconfig /all", "ipconfig /renew", "show ip dhcp pool", "show ip dhcp binding", "show running-config interface e0/2", "debug ip dhcp server packet"], "topics": ["4.6", "4.3"], "topo": {"nodes": [{"id": "PC1", "kind": "pc", "x": 70, "y": 250, "label": "PC1", "sub": [], "site": null}, {"id": "R1", "kind": "router", "x": 290, "y": 250, "label": "R1", "sub": ["DHCP server", "pool DEPOT 192.168.3.0/24"], "site": "HQ"}, {"id": "R3", "kind": "router", "x": 650, "y": 250, "label": "R3", "sub": ["relay:", "ip helper-address 10.0.13.1"], "site": "Depot"}, {"id": "PC2", "kind": "pc", "x": 920, "y": 250, "label": "PC2", "sub": ["address by DHCP"], "site": null}], "links": [{"a": "PC1", "ai": "eth0", "aip": "192.168.1.10", "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}, {"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth"}, {"a": "R3", "ai": "e0/2", "aip": "192.168.3.1", "b": "PC2", "bi": "eth0", "bip": null, "net": "192.168.3.0/24", "kind": "eth", "name": "LAN B"}], "notes": [{"x": 785, "y": 150, "lines": ["a broadcast stops here.", "the relay carries it on."], "anchor": "middle", "cls": "hand"}], "h": 430}, "images": ["Cisco IOL router", "Windows 10 host"], "runs": "eve", "needs": "The Depot PC is a Windows host in this lab, because the 169.254 address is what Windows shows when no server answers.", "status": "designed", "scenes": [{"t": "Symptom", "text": "PC2 asks for an address and never gets an answer.", "path": ["PC2", "R3"], "stop": "R3"}, {"t": "Root cause", "hidden": true, "text": "The relay command was removed from R3's LAN interface during last night's change. The broadcast stops at R3.", "path": ["PC2", "R3"], "stop": "R3", "badges": {"R3": "no helper"}}], "folder": null, "beyond": null, "devices": 4, "cml": false}, {"id": "L30", "week": 7, "title": "Rebuild the timeline", "kind": "explore", "mins": 40, "story": "There was an outage last night. Three routers logged it, and their logs disagree about when it began, because each router has its own idea of the time. You give them one clock, then rebuild the timeline.", "tasks": ["Compare the three clocks.", "Make R1 the NTP server and R2 and R3 its clients.", "Put date and time on every log message.", "Send the logs to the syslog server and choose the severity level.", "Cause a link flap and put the events in order."], "twist": "NTP does not jump at once. You watch a client go from unsynchronised to synchronised, and learn what stratum means.", "play": "Drag log lines from three routers into one timeline. The real timestamps settle the order.", "checks": ["Which severity number is \"error\"?", "Which levels does \"logging trap 4\" send to the server?", "A client synchronises to a stratum 3 server. What is its own stratum?"], "cmds": ["ntp master 3", "ntp server 1.1.1.1", "show ntp status", "show ntp associations", "service timestamps log datetime msec", "logging host 192.168.1.100", "logging trap warnings", "show logging", "show clock"], "topics": ["4.2", "4.5"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 270, "y": 350, "label": "R1", "sub": ["NTP server"], "site": "HQ"}, {"id": "R2", "kind": "router", "x": 500, "y": 120, "label": "R2", "sub": ["NTP client"], "site": "Hub"}, {"id": "R3", "kind": "router", "x": 730, "y": 350, "label": "R3", "sub": ["NTP client"], "site": "Depot"}, {"id": "LOG", "kind": "server", "x": 70, "y": 350, "label": "Syslog server", "sub": [], "site": null}], "links": [{"a": "R1", "ai": "e0/0", "aip": "10.0.12.1", "b": "R2", "bi": "e0/0", "bip": "10.0.12.2", "net": "10.0.12.0/30", "kind": "eth"}, {"a": "R2", "ai": "e0/1", "aip": "10.0.23.1", "b": "R3", "bi": "e0/0", "bip": "10.0.23.2", "net": "10.0.23.0/30", "kind": "eth"}, {"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth"}, {"a": "LOG", "ai": "eth0", "aip": "192.168.1.100", "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}], "notes": [{"x": 860, "y": 180, "lines": ["three clocks,", "three stories"], "anchor": "middle", "cls": "hand"}], "h": 500}, "images": ["Cisco IOL router", "Linux host"], "runs": "eve", "needs": "A Linux host image on the lab server, for the syslog server. OSPF from lab L22 is already running, so every router can reach R1's loopback.", "status": "designed", "scenes": [], "folder": null, "beyond": null, "devices": 4, "cml": true}, {"id": "L31", "week": 7, "title": "Close Telnet, open SSH", "kind": "build", "mins": 40, "story": "A Telnet password showed up in a packet capture during the audit rehearsal. You move remote access to SSH, then back up the configurations before the change window.", "tasks": ["Capture a Telnet login and find the password in clear text.", "Give the router a domain name and a key pair, and allow only SSH on the VTY lines.", "Log in with SSH and capture again.", "Copy the configuration to a TFTP server and compare it with the running one."], "twist": "On this IOS release, SSH version 1 is still accepted until you say otherwise. Newer releases accept only version 2.", "play": "Put the two captures side by side: readable text against encrypted bytes.", "checks": ["Which things must be configured before SSH works on a Cisco router?", "Which command restricts the VTY lines to SSH?", "Does TFTP use TCP or UDP, and does it ask for a login?"], "cmds": ["ip domain-name lab.example", "crypto key generate rsa modulus 2048", "ip ssh version 2", "username admin secret <password>", "line vty 0 4", "transport input ssh", "login local", "show ip ssh", "copy running-config tftp:"], "topics": ["4.8", "4.9", "2.8"], "topo": {"nodes": [{"id": "WS", "kind": "ws", "x": 110, "y": 250, "label": "Admin laptop", "sub": ["SSH client", "TFTP server"], "site": null}, {"id": "R1", "kind": "router", "x": 430, "y": 250, "label": "R1", "sub": ["Lo0 1.1.1.1"], "site": "HQ"}, {"id": "R3", "kind": "router", "x": 800, "y": 250, "label": "R3", "sub": ["Lo0 3.3.3.3"], "site": "Depot"}], "links": [{"a": "WS", "ai": "eth0", "aip": "192.168.1.50", "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}, {"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth", "label": null}], "notes": [], "h": 420}, "images": ["Cisco IOL router", "Linux host"], "runs": "eve", "needs": "A Linux host image on the lab server. A current SSH client must be told to accept the older key exchange and host key types of this IOS release. Logging in with a password is a learner step; the recorded run uses key-based SSH for its own checks.", "status": "designed", "scenes": [], "folder": null, "beyond": null, "devices": 3, "cml": true}, {"id": "L32", "week": 7, "title": "Ask the router with SNMP", "kind": "demo", "mins": 30, "story": "Who noticed that the Depot link was at 90 percent before the users did? Nobody, because nothing was watching. You let a management station ask the router questions, and let the router raise its hand when something breaks.", "tasks": ["Configure a read-only community, a contact and a location.", "Poll the interface table from the management station.", "Configure a trap receiver and cause a link-down event.", "Compare polling with traps: who starts the conversation?"], "twist": "With version 2c the community string crosses the network in clear text. You find it in a capture, and see why version 3 exists.", "play": "Click the router to browse the values the management station read from it.", "checks": ["Which message does the manager send to read a value?", "Which message does the device send without being asked?", "Which SNMP version adds authentication and encryption?"], "cmds": ["snmp-server community <string> RO", "snmp-server location HQ", "snmp-server contact network team", "snmp-server host 192.168.1.50 version 2c <string>", "snmp-server enable traps", "show snmp", "snmpwalk   (on the management station)"], "topics": ["4.4"], "topo": {"nodes": [{"id": "WS", "kind": "ws", "x": 110, "y": 250, "label": "Admin laptop", "sub": ["management station"], "site": null}, {"id": "R1", "kind": "router", "x": 430, "y": 250, "label": "R1", "sub": ["Lo0 1.1.1.1"], "site": "HQ"}, {"id": "R3", "kind": "router", "x": 800, "y": 250, "label": "R3", "sub": ["Lo0 3.3.3.3"], "site": "Depot"}], "links": [{"a": "WS", "ai": "eth0", "aip": "192.168.1.50", "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}, {"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth", "label": "polls and traps"}], "notes": [], "h": 420}, "images": ["Cisco IOL router", "Linux host"], "runs": "eve", "needs": "A Linux host image on the lab server.", "status": "designed", "scenes": [], "folder": null, "beyond": "The exam asks you to explain what SNMP does. Configuring it is beyond it.", "devices": 3, "cml": true}, {"id": "L33", "week": 7, "title": "Mark the voice", "kind": "demo", "mins": 35, "story": "Voice breaks up every night when the backup starts. Both share one slow WAN link. You teach the router to tell the two apart and to serve voice first.", "tasks": ["Classify voice and backup traffic as it enters R1 from the LAN.", "Mark voice as EF and read the counters.", "Shape the WAN interface to the speed of the circuit, with a priority queue for voice inside the shaper.", "Start the backup and compare the voice path with and without the policy."], "twist": "Marking alone changes nothing. Something must act on the mark where the queue forms.", "play": "Packets of two colours reach the WAN interface on the map. With the policy on, the voice packets leave first.", "checks": ["Put in order: queue, classify, mark.", "What is the difference between policing and shaping?", "Which DSCP marking is used for voice?"], "cmds": ["class-map match-any VOICE", "match access-group name VOICE-TRAFFIC", "policy-map MARK-IN", "set dscp ef", "policy-map WAN-OUT", "priority percent 20", "policy-map SHAPE-2M", "shape average 2000000", "service-policy WAN-OUT   (inside the shaper)", "service-policy input MARK-IN", "service-policy output SHAPE-2M", "show policy-map interface e0/1"], "topics": ["4.7"], "topo": {"nodes": [{"id": "PC1", "kind": "pc", "x": 80, "y": 140, "label": "PC1", "sub": ["voice call"], "site": null}, {"id": "PC2", "kind": "pc", "x": 80, "y": 370, "label": "PC2", "sub": ["backup job"], "site": null}, {"id": "HUB", "kind": "hub", "x": 230, "y": 255, "label": "Switch", "sub": [], "site": null}, {"id": "R1", "kind": "router", "x": 430, "y": 255, "label": "R1", "sub": [], "site": "HQ"}, {"id": "R3", "kind": "router", "x": 690, "y": 255, "label": "R3", "sub": [], "site": "Depot"}, {"id": "SRV", "kind": "server", "x": 920, "y": 255, "label": "Server", "sub": [], "site": null}], "links": [{"a": "PC1", "ai": "eth0", "aip": "192.168.1.10", "b": "HUB", "bi": "", "bip": null, "net": "192.168.1.0/24", "kind": "access", "quiet": true}, {"a": "PC2", "ai": "eth0", "aip": "192.168.1.11", "b": "HUB", "bi": "", "bip": null, "net": "192.168.1.0/24", "kind": "access", "quiet": true}, {"a": "HUB", "ai": "", "aip": null, "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "quiet": true}, {"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth", "label": "slow WAN link"}, {"a": "R3", "ai": "e0/2", "aip": "192.168.3.1", "b": "SRV", "bi": "e0/0", "bip": "192.168.3.100", "net": "192.168.3.0/24", "kind": "eth", "quiet": true}], "notes": [{"x": 560, "y": 400, "lines": ["classify and mark at the edge,", "queue on the slow link, where it is congested"], "anchor": "middle", "cls": "hand"}], "h": 480}, "images": ["Cisco IOL router", "Linux host"], "runs": "eve", "needs": "Linux hosts on the lab server, to generate the two kinds of traffic. Virtual links never fill up by themselves, so the shaper stands in for the slow circuit.", "status": "designed", "scenes": [], "folder": null, "beyond": "The exam asks you to explain what each step does at one hop. Configuring a policy is beyond it; you watch it and read the counters.", "devices": 5, "cml": true}, {"id": "L34", "week": 8, "title": "Pass the audit", "kind": "build", "mins": 40, "story": "An audit is coming. The auditor's first question is always the same: who can log in to your routers, and how do you know? You close the doors one at a time.", "tasks": ["Replace the enable password with an enable secret.", "Create local users and require them on the console and the VTY lines.", "Encrypt the remaining clear-text passwords, and see what that is worth.", "Add an idle timeout, a login banner and a limit on failed attempts."], "twist": "The output of \"service password-encryption\" can be reversed in seconds. You compare it with a real hash in the same configuration.", "play": "Click each door on the map, console, VTY and enable, to see how it is locked before and after.", "checks": ["Enable password and enable secret are both set. Which one is used?", "Which line command makes the router ask for a username?", "What does \"exec-timeout 5 0\" do?"], "cmds": ["enable secret <password>", "username admin privilege 15 secret <password>", "line console 0", "login local", "exec-timeout 5 0", "service password-encryption", "banner login", "login block-for 60 attempts 3 within 30", "show running-config | include secret|password"], "topics": ["5.3", "5.4", "2.8"], "topo": {"nodes": [{"id": "WS", "kind": "ws", "x": 180, "y": 160, "label": "Admin laptop", "sub": ["SSH client"], "site": null, "lp": "t"}, {"id": "R1", "kind": "router", "x": 520, "y": 250, "label": "R1", "sub": [], "site": "HQ"}, {"id": "PC1", "kind": "pc", "x": 860, "y": 250, "label": "PC1", "sub": [], "site": null}], "links": [{"a": "WS", "ai": "usb", "aip": null, "b": "R1", "bi": "con 0", "bip": null, "net": null, "kind": "console", "label": "console: local password"}, {"a": "R1", "ai": "e0/2", "aip": "192.168.1.1", "b": "PC1", "bi": "eth0", "bip": "192.168.1.10", "net": "192.168.1.0/24", "kind": "eth", "label": "VTY lines: SSH only"}], "notes": [{"x": 180, "y": 330, "lines": ["console, VTY and enable:", "three doors, three locks"], "anchor": "start", "cls": "hand"}], "h": 430}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": "Logging in with a password is a learner step. The recorded run captures the configuration and the verification output.", "status": "designed", "scenes": [], "folder": null, "beyond": null, "devices": 3, "cml": true}, {"id": "L35", "week": 8, "title": "Guests: internet only", "kind": "build", "mins": 45, "story": "Guests must reach the internet and nothing else. You write the rule as an access list, and before you apply it you predict, flow by flow, what will pass.", "tasks": ["Write the rule in plain language first.", "Turn it into a named extended access list.", "Choose the interface and the direction.", "Test six flows and compare with your predictions.", "Read the hit counters."], "twist": "Guests still need DHCP and DNS. Did your first version let those through?", "play": "For each of six flows, click permit or deny on the map before the real test result appears.", "checks": ["Where should an extended access list be placed: near the source or near the destination?", "What stands at the end of every access list, although you never typed it?", "Which wildcard mask matches 192.168.10.0/24?"], "cmds": ["ip access-list extended GUEST-IN", "permit udp any eq bootpc any eq bootps", "deny ip 192.168.30.0 0.0.0.255 192.168.10.0 0.0.0.255", "permit ip 192.168.30.0 0.0.0.255 any", "ip access-group GUEST-IN in", "show access-lists", "show ip interface e0/1"], "topics": ["5.6"], "topo": {"nodes": [{"id": "PC1", "kind": "pc", "x": 90, "y": 130, "label": "PC1", "sub": ["STAFF"], "site": null}, {"id": "PC2", "kind": "pc", "x": 90, "y": 390, "label": "PC2", "sub": ["GUEST"], "site": null}, {"id": "R1", "kind": "router", "x": 400, "y": 260, "label": "R1", "sub": [], "site": "HQ"}, {"id": "ISP", "kind": "router", "x": 660, "y": 260, "label": "ISP", "sub": [], "site": "Internet provider"}, {"id": "WEB", "kind": "server", "x": 910, "y": 260, "label": "Web server", "sub": [], "site": null}], "links": [{"a": "PC1", "ai": "eth0", "aip": "192.168.10.10", "b": "R1", "bi": "e0/0", "bip": "192.168.10.1", "net": "192.168.10.0/24", "kind": "eth", "vlan": 10}, {"a": "PC2", "ai": "eth0", "aip": "192.168.30.10", "b": "R1", "bi": "e0/1", "bip": "192.168.30.1", "net": "192.168.30.0/24", "kind": "eth", "vlan": 30, "label": "ACL GUEST-IN, inbound"}, {"a": "R1", "ai": "e0/3", "aip": "203.0.113.2", "b": "ISP", "bi": "e0/0", "bip": "203.0.113.1", "net": "203.0.113.0/30", "kind": "eth"}, {"a": "ISP", "ai": "e0/1", "aip": "198.51.100.1", "b": "WEB", "bi": "e0/0", "bip": "198.51.100.10", "net": "198.51.100.0/24", "kind": "eth", "quiet": true}], "notes": [{"x": 640, "y": 420, "lines": ["guests: internet yes,", "staff network no"], "anchor": "middle", "cls": "hand"}], "h": 500}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [{"t": "Guest to the internet", "text": "Permitted. The packet passes the deny line and matches the permit that follows.", "path": ["PC2", "R1", "ISP", "WEB"]}, {"t": "Guest to staff", "text": "Denied by the deny line, as the packet enters R1.", "path": ["PC2", "R1"], "stop": "R1"}], "folder": null, "beyond": null, "devices": 5, "cml": true}, {"id": "L36", "week": 8, "title": "One line too early", "kind": "ticket", "mins": 30, "story": "Ticket: \"Since last night's change, guests cannot open any website.\" One line was added to an access list.", "tasks": ["Find which access list is applied where, and in which direction.", "Read the hit counters to see which line is matching.", "Explain why the order of the lines caused this.", "Fix it with sequence numbers, without removing the whole list."], "twist": "The new line is correct. It is in the wrong place.", "play": "Send a guest packet through the list on the map. It stops at the first line that matches.", "checks": ["In which order is an access list read, and when does the router stop reading?", "How do you insert a line between lines 10 and 20?", "Which command sets the hit counters back to zero?"], "cmds": ["show access-lists", "show ip interface e0/1", "ip access-list extended GUEST-IN", "no 5", "30 deny ip any any log", "ip access-list resequence GUEST-IN 10 10", "clear access-list counters"], "topics": ["5.6"], "topo": {"nodes": [{"id": "PC1", "kind": "pc", "x": 90, "y": 130, "label": "PC1", "sub": ["STAFF"], "site": null}, {"id": "PC2", "kind": "pc", "x": 90, "y": 390, "label": "PC2", "sub": ["GUEST"], "site": null}, {"id": "R1", "kind": "router", "x": 400, "y": 260, "label": "R1", "sub": [], "site": "HQ"}, {"id": "ISP", "kind": "router", "x": 660, "y": 260, "label": "ISP", "sub": [], "site": "Internet provider"}, {"id": "WEB", "kind": "server", "x": 910, "y": 260, "label": "Web server", "sub": [], "site": null}], "links": [{"a": "PC1", "ai": "eth0", "aip": "192.168.10.10", "b": "R1", "bi": "e0/0", "bip": "192.168.10.1", "net": "192.168.10.0/24", "kind": "eth", "vlan": 10}, {"a": "PC2", "ai": "eth0", "aip": "192.168.30.10", "b": "R1", "bi": "e0/1", "bip": "192.168.30.1", "net": "192.168.30.0/24", "kind": "eth", "vlan": 30, "label": "ACL GUEST-IN, inbound"}, {"a": "R1", "ai": "e0/3", "aip": "203.0.113.2", "b": "ISP", "bi": "e0/0", "bip": "203.0.113.1", "net": "203.0.113.0/30", "kind": "eth"}, {"a": "ISP", "ai": "e0/1", "aip": "198.51.100.1", "b": "WEB", "bi": "e0/0", "bip": "198.51.100.10", "net": "198.51.100.0/24", "kind": "eth", "quiet": true}], "notes": [{"x": 640, "y": 420, "lines": ["guests: internet yes,", "staff network no"], "anchor": "middle", "cls": "hand"}], "h": 500}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [{"t": "Symptom", "text": "A guest opens a website. The packet is dropped as it enters R1.", "path": ["PC2", "R1"], "stop": "R1"}, {"t": "Root cause", "hidden": true, "text": "A \"deny ip any any log\" line, meant to go last so that dropped traffic would be logged, was entered as line 5. It now matches everything before the permit is reached.", "path": ["PC2", "R1"], "stop": "R1", "badges": {"R1": "line 5 matches"}}], "folder": null, "beyond": null, "devices": 5, "cml": true}, {"id": "L37", "week": 8, "title": "One device per port", "kind": "build", "mins": 35, "story": "A meeting-room socket was shared by a small hub and four laptops. The rule is one device per port. You let the switch enforce it, and you choose what happens when the rule is broken.", "tasks": ["Turn on port security on the access port with a maximum of one address.", "Let the switch learn the address and keep it as a sticky address.", "Plug in a second device and watch the violation.", "Compare the three violation modes and bring the port back."], "twist": "In protect mode nothing is logged. The second device simply does not work, and nobody is told.", "play": "Plug the second device into the map and choose the violation mode: shutdown, restrict or protect. The port reacts as the real one did.", "checks": ["Which violation mode is the default?", "Which modes count the violation and send a log message?", "Where is a sticky address stored?"], "cmds": ["switchport mode access", "switchport port-security", "switchport port-security maximum 1", "switchport port-security mac-address sticky", "switchport port-security violation restrict", "show port-security", "show port-security interface e0/1", "show port-security address"], "topics": ["5.7"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 500, "y": 80, "label": "R1", "sub": [], "site": "HQ"}, {"id": "SW1", "kind": "switch", "x": 500, "y": 230, "label": "SW1", "sub": [], "site": null}, {"id": "HUB", "kind": "hub", "x": 300, "y": 370, "label": "Desk hub", "sub": [], "site": null}, {"id": "PC1", "kind": "pc", "x": 130, "y": 470, "label": "PC1", "sub": ["allowed"], "site": null}, {"id": "PC2", "kind": "pc", "x": 430, "y": 480, "label": "PC2", "sub": ["second device"], "site": null}, {"id": "PC3", "kind": "pc", "x": 800, "y": 400, "label": "PC3", "sub": ["STAFF"], "site": null}], "links": [{"a": "R1", "ai": "e0/2", "aip": "192.168.10.1", "b": "SW1", "bi": "e0/0", "bip": null, "net": "192.168.10.0/24", "kind": "eth", "quiet": true}, {"a": "SW1", "ai": "e0/1", "aip": null, "b": "HUB", "bi": "", "bip": null, "net": null, "kind": "eth", "label": "port security: maximum 1, sticky", "flip": true}, {"a": "HUB", "ai": "", "aip": null, "b": "PC1", "bi": "eth0", "bip": "192.168.10.10", "net": "192.168.10.0/24", "kind": "access", "quiet": true}, {"a": "HUB", "ai": "", "aip": null, "b": "PC2", "bi": "eth0", "bip": "192.168.10.20", "net": "192.168.10.0/24", "kind": "access", "quiet": true}, {"a": "SW1", "ai": "e0/2", "aip": null, "b": "PC3", "bi": "eth0", "bip": "192.168.10.11", "net": "192.168.10.0/24", "kind": "access", "vlan": 10}], "notes": [], "h": 540}, "images": ["Cisco IOL router", "Cisco IOL switch", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [{"t": "One device", "text": "PC1 is learned on the port. Its address becomes sticky.", "path": ["PC1", "HUB", "SW1", "R1"]}, {"t": "A second device", "text": "A frame from a second MAC address arrives on the same port. The violation mode decides what happens next.", "path": ["PC2", "HUB", "SW1"], "stop": "SW1", "warn": ["SW1-HUB"]}], "folder": null, "beyond": null, "devices": 5, "cml": true}, {"id": "L38", "week": 8, "title": "The rogue DHCP server", "kind": "ticket", "mins": 45, "story": "Ticket: \"Some PCs on Floor 1 lose the internet every few hours.\" They all have a strange gateway address. Somebody has connected a second DHCP server.", "tasks": ["Read a failing PC's lease and find the wrong gateway.", "Turn on DHCP snooping for the VLAN and trust only the port towards the real server.", "Renew the leases and read the snooping binding table.", "Add dynamic ARP inspection. Then give the rogue router a PC's address and watch its ARP replies being dropped."], "twist": "DHCP snooping builds a table of who was given which address. Dynamic ARP inspection is the feature that uses that table.", "play": "Two servers answer on the map. Turn on snooping, and the rogue's offer is dropped at its own port.", "checks": ["Which ports must be trusted for DHCP snooping?", "Which table does dynamic ARP inspection check ARP packets against?", "Which DHCP messages are dropped on an untrusted port?"], "cmds": ["ip dhcp snooping", "ip dhcp snooping vlan 10", "no ip dhcp snooping information option", "ip dhcp snooping trust", "show ip dhcp snooping", "show ip dhcp snooping binding", "ip arp inspection vlan 10", "ip arp inspection trust", "show ip arp inspection"], "topics": ["5.7"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 500, "y": 80, "label": "R1", "sub": ["real DHCP server", "gateway 192.168.10.1"], "site": "HQ"}, {"id": "SW1", "kind": "switch", "x": 500, "y": 250, "label": "SW1", "sub": [], "site": null}, {"id": "ROGUE", "kind": "router", "x": 830, "y": 250, "label": "Rogue DHCP", "sub": ["hands out gateway", "192.168.10.66"], "site": null}, {"id": "PC1", "kind": "pc", "x": 250, "y": 420, "label": "PC1", "sub": ["address by DHCP"], "site": null}, {"id": "PC2", "kind": "pc", "x": 600, "y": 440, "label": "PC2", "sub": ["address by DHCP"], "site": null}], "links": [{"a": "R1", "ai": "e0/2", "aip": "192.168.10.1", "b": "SW1", "bi": "e0/0", "bip": null, "net": "192.168.10.0/24", "kind": "eth", "quiet": true, "label": "trusted port"}, {"a": "SW1", "ai": "e0/3", "aip": null, "b": "ROGUE", "bi": "e0/0", "bip": "192.168.10.66", "net": "192.168.10.0/24", "kind": "eth", "quiet": true, "label": "untrusted port"}, {"a": "SW1", "ai": "e0/1", "aip": null, "b": "PC1", "bi": "eth0", "bip": null, "net": "192.168.10.0/24", "kind": "access", "vlan": 10}, {"a": "SW1", "ai": "e0/2", "aip": null, "b": "PC2", "bi": "eth0", "bip": null, "net": "192.168.10.0/24", "kind": "access", "vlan": 10}], "notes": [], "h": 510}, "images": ["Cisco IOL router", "Cisco IOL switch", "VPCS host"], "runs": "eve", "needs": "A snooping switch adds option 82 to requests, and a Cisco router acting as DHCP server rejects those by default. The lab turns the option off and explains why. The rogue is set to answer faster than the real server, so every run gives the same result.", "status": "designed", "scenes": [{"t": "Symptom", "text": "PC1 took the rogue's offer. Its gateway is now 192.168.10.66, and its traffic goes nowhere useful.", "path": ["PC1", "SW1", "ROGUE"], "badges": {"ROGUE": "answers first"}}, {"t": "With snooping", "text": "Server messages are accepted only on the trusted port. The rogue's offer dies at e0/3.", "path": ["ROGUE", "SW1"], "stop": "SW1", "also": [["PC1", "SW1", "R1"]]}], "folder": null, "beyond": null, "devices": 5, "cml": true}, {"id": "L39", "week": 8, "title": "A tunnel over the internet", "kind": "demo", "mins": 35, "story": "The Depot's backup link runs over the public internet. Anyone on the path could read the traffic. You watch a site-to-site IPsec tunnel come up, and see what the provider sees before and after.", "tasks": ["Capture traffic between the sites on the provider's router: it is readable.", "Bring up the prepared IPsec tunnel between R1 and R3.", "Capture again: only encrypted packets between the two routers.", "Read the tunnel's counters, and compare site-to-site with remote-access VPN."], "twist": "The inner addresses disappear from the capture. The provider sees two routers talking, and nothing else.", "play": "Switch the tunnel on and off on the map. Packets on the provider's link change from readable to sealed.", "checks": ["Name three protections IPsec gives to a packet.", "Who are the two ends of a site-to-site VPN? And of a remote-access VPN?", "Which protocol does the provider see between the two routers?"], "cmds": ["show crypto isakmp sa", "show crypto ipsec sa", "show crypto session"], "topics": ["5.5"], "topo": {"nodes": [{"id": "PC1", "kind": "pc", "x": 60, "y": 330, "label": "PC1", "sub": [], "site": null}, {"id": "R1", "kind": "router", "x": 250, "y": 330, "label": "R1", "sub": [], "site": "HQ"}, {"id": "ISP", "kind": "router", "x": 500, "y": 330, "label": "ISP", "sub": [], "site": "Internet provider"}, {"id": "R3", "kind": "router", "x": 750, "y": 330, "label": "R3", "sub": [], "site": "Depot"}, {"id": "PC2", "kind": "pc", "x": 940, "y": 330, "label": "PC2", "sub": [], "site": null}], "links": [{"a": "PC1", "ai": "eth0", "aip": "192.168.1.10", "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}, {"a": "R1", "ai": "e0/3", "aip": "203.0.113.2", "b": "ISP", "bi": "e0/0", "bip": "203.0.113.1", "net": "203.0.113.0/30", "kind": "eth"}, {"a": "ISP", "ai": "e0/1", "aip": "203.0.113.5", "b": "R3", "bi": "e0/3", "bip": "203.0.113.6", "net": "203.0.113.4/30", "kind": "eth"}, {"a": "R3", "ai": "e0/2", "aip": "192.168.3.1", "b": "PC2", "bi": "eth0", "bip": "192.168.3.10", "net": "192.168.3.0/24", "kind": "eth", "name": "LAN B"}, {"a": "R1", "ai": "", "aip": null, "b": "R3", "bi": "", "bip": null, "net": null, "kind": "tunnel", "label": "IPsec tunnel: encrypted between R1 and R3"}], "notes": [{"x": 500, "y": 440, "lines": ["the provider carries the packets but cannot read them"], "anchor": "middle", "cls": "hand"}], "h": 480}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [{"t": "Without the tunnel", "text": "The provider can read source, destination and content.", "path": ["PC1", "R1", "ISP", "R3", "PC2"]}, {"t": "With the tunnel", "text": "Between R1 and R3 every packet is encrypted. Only the two routers' public addresses are visible.", "path": ["PC1", "R1", "ISP", "R3", "PC2"], "badges": {"ISP": "sees ESP only"}}], "folder": null, "beyond": "The exam asks you to describe site-to-site and remote-access VPNs. The tunnel is prepared for you; you bring it up and read what it shows.", "devices": 5, "cml": true}, {"id": "L40", "week": 9, "title": "The scanner WLAN", "kind": "build", "mins": 45, "story": "The Hub wants handheld scanners on Wi-Fi across the sorting floor before the night shift. You connect the controller and the access point correctly, then create the WLAN in the controller's GUI.", "tasks": ["Check the switch ports: a trunk to the controller, an access port with PoE to the access point.", "In the GUI, create the interface for VLAN 40.", "Create the WLAN, choose WPA2 with a pre-shared key, and enable it.", "Join a client and find it in the client list.", "Do the same in the Catalyst 9800 GUI: WLAN profile, policy profile, policy tag."], "twist": "The access point is up and the WLAN is enabled, but the WLAN is mapped to the management interface. The scanners join and land in the wrong VLAN.", "play": "Click through a replica of the controller's screens. Each setting you choose changes what the scanner on the map can do.", "checks": ["Which kind of switch port does a lightweight access point connect to?", "And the controller?", "Which GUI steps turn an empty controller into a working WLAN?"], "cmds": ["GUI: Controller > Interfaces > New", "GUI: WLANs > Create New", "GUI: WLANs > Security > Layer 2 > WPA+WPA2, PSK", "GUI: Monitor > Clients", "switchport mode trunk", "switchport access vlan 99", "show power inline"], "topics": ["5.10", "2.9", "2.7", "1.11"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 130, "y": 330, "label": "R1", "sub": ["gateway and DHCP", "for VLAN 40"], "site": "Hub"}, {"id": "SW1", "kind": "switch", "x": 420, "y": 330, "label": "SW1", "sub": [], "site": null}, {"id": "WLC", "kind": "wlc", "x": 420, "y": 100, "label": "Wireless controller", "sub": ["192.168.99.5"], "site": null}, {"id": "AP1", "kind": "ap", "x": 700, "y": 220, "label": "Access point", "sub": ["on an access port, with PoE", "address by DHCP"], "site": null}, {"id": "SCAN", "kind": "phone", "x": 8 tion, address. Match each one to a screen.", "checks": ["A client associates but gets no address. Which settings do you check?", "Which key method does WPA2-Personal use?", "On the classic (AireOS) controller, which QoS profile does a new WLAN get by default?"], "cmds": ["GUI: WLANs > Edit > General", "GUI: WLANs > Edit > Security", "GUI: WLANs > Edit > QoS", "GUI: WLANs > Edit > Advanced", "GUI: Monitor > Clients > Detail"], "topics": ["2.9", "5.9"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 130, "y": 330, "label": "R1", "sub": ["gateway and DHCP", "for VLAN 40"], "site": "Hub"}, {"id": "SW1", "kind": "switch", "x": 420, "y": 330, "label": "SW1", "sub": [], "site": null}, {"id": "WLC", "kind": "wlc", "x": 420, "y": 100, "label": "Wireless controller", "sub": ["192.168.99.5"], "site": null}, {"id": "AP1", "kind": "ap", "x": 700, "y": 220, "label": "Access point", "sub": ["on an access port, with PoE", "address by DHCP"], "site": null}, {"id": "SCAN", "kind": "phone", "x": 880, "y": 380, "label": "Scanner", "sub": ["WPA2-PSK", "192.168.40.x"], "site": null}], "links": [{"a": "R1", "ai": "e0/0", "aip": null, "b": "SW1", "bi": "e0/0", "bip": null, "net": null, "kind": "trunk", "label": "trunk"}, {"a": "WLC", "ai": "port 1", "aip": null, "b": "SW1", "bi": "e0/1", "bip": null, "net": null, "kind": "trunk", "label": "trunk: VLANs 40, 99"}, {"a": "SW1", "ai": "e0/2", "aip": null, "b": "AP1", "bi": "eth0", "bip": null, "net": "192.168.99.0/24", "kind": "access", "vlan": 99}, {"a": "AP1", "ai": "", "aip": null, "b": "SCAN", "bi": "", "bip": null, "net": null, "kind": "radio", "label": "SSID HUB-SCAN", "flip": true}], "notes": [{"x": 700, "y": 80, "lines": ["client traffic rides a tunnel", "from the AP to the controller"], "anchor": "middle", "cls": "hand"}], "h": 480}, "images": ["Wireless controller", "Real access point", "Real PoE switch"], "runs": "kit", "needs": "A wireless controller, one real access point and a real PoE switch, or Cisco Packet Tracer.", "status": "designed", "scenes": [], "folder": null, "beyond": null, "devices": 5, "cml": false}, {"id": "L42", "week": 10, "title": "Same addresses, two customers", "kind": "build", "mins": 35, "story": "Two customers in the company's hosting rack both use 10.1.1.0/24, and both connect to the same router. You keep them apart without buying a second router.", "tasks": ["Create two VRFs and put each customer's interfaces into one.", "Give both LAN interfaces the same address.", "Read each routing table on its own.", "Ping inside each VRF, and prove that RED cannot reach BLUE."], "twist": "The plain \"show ip route\" now shows neither customer. Each one lives in its own table.", "play": "Switch RED and BLUE on the map. Only that customer's links and routing table light up.", "checks": ["What does a VRF make several of inside one router?", "How does a VRF differ from a VLAN?", "Which command pings from inside a VRF?"], "cmds": ["vrf definition RED", "address-family ipv4", "vrf forwarding RED", "ip address 10.1.1.1 255.255.255.0", "show vrf", "show ip route vrf RED", "ping vrf RED 10.1.1.10"], "topics": ["1.12"], "topo": {"nodes": [{"id": "PC-A", "kind": "pc", "x": 110, "y": 130, "label": "PC-A", "sub": ["customer RED"], "site": null}, {"id": "PC-B", "kind": "pc", "x": 110, "y": 390, "label": "PC-B", "sub": ["customer BLUE"], "site": null}, {"id": "R1", "kind": "router", "x": 460, "y": 260, "label": "R1", "sub": ["two routing tables"], "site": "Shared router"}, {"id": "R2", "kind": "router", "x": 830, "y": 130, "label": "R2", "sub": [], "site": "RED upstream"}, {"id": "R3", "kind": "router", "x": 830, "y": 390, "label": "R3", "sub": [], "site": "BLUE upstream"}], "links": [{"a": "PC-A", "ai": "eth0", "aip": "10.1.1.10", "b": "R1", "bi": "e0/0", "bip": "10.1.1.1", "net": "10.1.1.0/24", "kind": "eth", "grp": "red"}, {"a": "PC-B", "ai": "eth0", "aip": "10.1.1.10", "b": "R1", "bi": "e0/1", "bip": "10.1.1.1", "net": "10.1.1.0/24", "kind": "eth", "grp": "blue"}, {"a": "R1", "ai": "e0/2", "aip": "10.0.12.1", "b": "R2", "bi": "e0/0", "bip": "10.0.12.2", "net": "10.0.12.0/30", "kind": "eth", "grp": "red"}, {"a": "R1", "ai": "e0/3", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth", "grp": "blue"}], "notes": [{"x": 460, "y": 420, "lines": ["same addresses, no clash:", "each VRF is its own router"], "anchor": "middle", "cls": "hand"}], "h": 510}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [], "folder": null, "beyond": "The exam asks you to explain what a VRF is. Configuring one is beyond it, and takes ten minutes.", "devices": 5, "cml": true}, {"id": "L43", "week": 10, "title": "Ask the router over REST", "kind": "build", "mins": 40, "story": "Maya wants the interface list of every router in a spreadsheet by lunchtime. You stop logging in to each one. You ask over the API, and the router answers in JSON.", "tasks": ["Turn on RESTCONF on the router.", "GET the list of interfaces and read the status code.", "Create a loopback interface with PUT and find it in the CLI.", "Change its description with PATCH, then DELETE it. Match each call to its CRUD action."], "twist": "The same request without credentials. Read the status code, and say what kind of problem it reports.", "play": "Build each request from its parts on the page: verb, URL, headers. The router's real response appears beside the map.", "checks": ["Which HTTP verb reads data, and which ones create or replace it?", "What do the status codes 200, 201, 204, 401 and 404 mean?", "Which two data encodings can RESTCONF return?"], "cmds": ["restconf", "ip http secure-server", "ip http authentication local", "username <user> privilege 15 secret <password>", "curl -k -u <user> -H \"Accept: application/yang-data+json\" https://192.168.1.1/restconf/data/ietf-interfaces:interfaces", "show running-config interface Loopback100"], "topics": ["6.5", "6.7"], "topo": {"nodes": [{"id": "WS", "kind": "ws", "x": 110, "y": 250, "label": "Admin laptop", "sub": ["curl, Python"], "site": null}, {"id": "R1", "kind": "router", "x": 430, "y": 250, "label": "R1", "sub": ["CSR1000v", "RESTCONF on"], "site": "HQ"}, {"id": "R3", "kind": "router", "x": 800, "y": 250, "label": "R3", "sub": ["Lo0 3.3.3.3"], "site": "Depot"}], "links": [{"a": "WS", "ai": "eth0", "aip": "192.168.1.50", "b": "R1", "bi": "Gi1", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}, {"a": "R1", "ai": "Gi2", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth", "label": "not used in this lab"}], "notes": [], "h": 420}, "images": ["CSR1000v", "Linux host"], "runs": "eve", "needs": "A Linux host image on the lab server. The API calls carry a username and password, so the recorded run is started by the owner.", "status": "designed", "scenes": [], "folder": null, "beyond": "The exam asks you to describe REST APIs and to read JSON. Sending the calls yourself is beyond it, and the quickest way to understand them.", "devices": 3, "cml": false}, {"id": "L44", "week": 10, "title": "Find it in the JSON", "kind": "explore", "mins": 30, "story": "The API answered with 300 lines of JSON. Somewhere in it is the one interface that somebody has shut down. You learn to read the structure instead of scrolling.", "tasks": ["Tell objects from arrays, and keys from values.", "Find the interface that is not enabled.", "Count the items in a list and name the data type of each value.", "Repair a broken document: one missing comma, one wrong quote."], "twist": "The broken document looks fine to the eye. The error message points one line below the real mistake.", "play": "Fold and unfold the router's real response on the page. Click a value to see its path from the top.", "checks": ["Which characters enclose an object, and which an array?", "Are JSON keys quoted, and with which quotes?", "Is True, with a capital T, a valid JSON value?"], "cmds" ", "mins": 120, "story": "Depot 4 opens in two weeks. You are handed a blank router, a blank switch, an address block and a change window. Everything from weeks 2 to 8 comes together in one build.", "tasks": ["Plan the addresses from 172.16.4.0/24.", "Build the VLANs, the trunk and router-on-a-stick.", "Join the Depot to OSPF and check the routes at HQ.", "Hand out addresses by DHCP relay from HQ.", "Keep guests away from staff with an access list.", "Secure both devices and save a backup.", "Complete the twelve-point verification checklist."], "twist": "You write the rollback plan before the first command. One step will need it.", "play": "The map starts almost empty and fills in as each stage passes its check.", "checks": ["Twelve checks, each answered from your own output, for a score out of 12."], "cmds": ["Everything from weeks 2 to 8. No command list is given."], "topics": ["1.6", "2.1", "2.2", "3.4", "4.6", "5.6", "5.3", "4.8"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 150, "y": 150, "label": "R1", "sub": ["Lo0 1.1.1.1"], "site": "HQ"}, {"id": "R4", "kind": "router", "x": 520, "y": 150, "label": "R4", "sub": ["Lo0 4.4.4.4", "e0/1.10  172.16.4.1", "e0/1.30  172.16.4.129"], "site": "Depot 4"}, {"id": "SW4", "kind": "switch", "x": 520, "y": 350, "label": "SW4", "sub": [], "site": null}, {"id": "PC-A", "kind": "pc", "x": 270, "y": 470, "label": "PC-A", "sub": ["STAFF"], "site": null}, {"id": "PC-B", "kind": "pc", "x": 780, "y": 470, "label": "PC-B", "sub": ["GUEST"], "site": null}], "links": [{"a": "R1", "ai": "e0/3", "aip": "10.0.14.1", "b": "R4", "bi": "e0/0", "bip": "10.0.14.2", "net": "10.0.14.0/30", "kind": "eth", "label": "OSPF area 0"}, {"a": "R4", "ai": "e0/1", "aip": null, "b": "SW4", "bi": "e0/0", "bip": null, "net": null, "kind": "trunk", "label": "trunk: VLANs 10, 30"}, {"a": "SW4", "ai": "e0/1", "aip": null, "b": "PC-A", "bi": "eth0", "bip": null, "net": "172.16.4.0/25", "kind": "access", "vlan": 10}, {"a": "SW4", "ai": "e0/2", "aip": null, "b": "PC-B", "bi": "eth0", "bip": null, "net": "172.16.4.128/26", "kind": "access", "vlan": 30}], "notes": [{"x": 800, "y": 180, "lines": ["a whole site, start to finish,", "in one change window"], "anchor": "middle", "cls": "hand"}], "h": 540}, "images": ["Cisco IOL router", "Cisco IOL switch", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [], "folder": null, "beyond": null, "devices": 5, "cml": true}, {"id": "C2", "week": 11, "title": "The Monday outage", "kind": "capstone", "mins": 90, "story": "Monday, 08:40. Five tickets in ten minutes, across three sites. Some share a cause and some do not. You work them in the right order, with as few commands as you can.", "tasks": ["Triage: which ticket first, and why.", "Find five faults across addressing, routing, services and security.", "Fix each one and prove it.", "Write a three-line incident note for each."], "twist": "Two tickets have the same root cause. Fix the right one first and both close.", "play": "Tickets appear on the map where the users are. Your command count is compared with par.", "checks": ["Five incident notes, each checked against the real cause and the real fix."], "cmds": ["Your choice. Par is 22 commands."], "topics": ["1.6", "3.3", "3.4", "4.6", "5.6"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 270, "y": 350, "label": "R1", "sub": ["Lo0 1.1.1.1"], "site": "HQ"}, {"id": "R2", "kind": "router", "x": 500, "y": 120, "label": "R2", "sub": ["Lo0 2.2.2.2"], "site": "Hub"}, {"id": "R3", "kind": "router", "x": 730, "y": 350, "label": "R3", "sub": ["Lo0 3.3.3.3"], "site": "Depot"}, {"id": "PC1", "kind": "pc", "x": 70, "y": 350, "label": "PC1", "sub": [], "site": null}, {"id": "PC2", "kind": "pc", "x": 930, "y": 350, "label": "PC2", "sub": [], "site": null}], "links": [{"a": "R1", "ai": "e0/0", "aip": "10.0.12.1", "b": "R2", "bi": "e0/0", "bip": "10.0.12.2", "net": "10.0.12.0/30", "kind": "eth", "label": null}, {"a": "R2", "ai": "e0/1", "aip": "10.0.23.1", "b": "R3", "bi": "e0/0", "bip": "10.0.23.2", "net": "10.0.23.0/30", "kind": "eth", "label": null}, {"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth", "label": null}, {"a": "PC1", "ai": "eth0", "aip": "192.168.1.10", "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}, {"a": "PC2", "ai": "eth0", "aip": "192.168.3.10", "b": "R3", "bi": "e0/2", "bip": "192.168.3.1", "net": "192.168.3.0/24", "kind": "eth", "name": "LAN B"}], "notes": [], "h": 500}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [{"t": "08:40", "text": "Five tickets. Three sites. Where do you start?", "warn": ["R1-R3", "R2-R3"], "badges": {"PC1": "ticket 1", "PC2": "tickets 2, 3", "R2": "ticket 4", "R3": "ticket 5"}}], "folder": null, "beyond": null, "devices": 5, "cml": true}], "kinds": {"build": ["Build", "You build it step by step and prove each step with real output."], "predict": ["Predict", "You commit to an answer on the map first. Then the real device shows who was right."], "ticket": ["Ticket", "A fault report arrives. You find the cause with as few commands as you can."], "walk": ["Packet walk", "You follow real captured packets hop by hop."], "explore": ["Investigate", "You are given a question, not steps. The devices hold the answer."], "change": ["Change window", "You change a working network on purpose, with a before, an after and a way back."], "demo": ["Demonstration", "Beyond what the exam asks you to configure. You watch it work and read the output."], "capstone": ["Capstone", "Several weeks of skills in one job."]}, "tests": {"intro": "You are tested the way you will work: on real output, on the map, and against the clock. Every question is original and is tagged with its exam topic, so your results add up to a readiness score per exam domain.", "layers": [["Inside every lesson", "4 to 6 checks", "Questions, matching and a simulator in the flow of the lesson. Explain-it-back is marked by the AI tutor.", "No score. You cannot go on until the case is closed."], ["Lesson quiz", "4 questions", "After each lesson, with an explanation for every answer.", "71 lessons, about 280 questions."], ["Lab checks", "3 to 12 per lab", "Answered from your own output or from the replay: \"Which router is the DR on this link?\"", "48 labs, about 160 checks."], ["Ticket score", "Par for each ticket", "For fault labs: did you find the cause, and in how many commands compared with par?", "9 fault labs."], ["Weekly test", "20 questions, 25 minutes", "Mixed types with exhibits from that week's labs. 80 percent to pass. Each attempt draws its 20 questions from a larger bank, so a second attempt is a different test.", "10 tests. Built so far: 1, with 30 questions."], ["Mock exam", "100 questions, 120 minutes", "Weighted like the real exam, with lab tasks inside. Taken under exam conditions.", "3 exams, 300 questions."]], "types": [["Single and multiple choice", "With an explanation for every option, not only the right one."], ["Exhibit", "Real router or switch output from the labs. Read it and decide."], ["On the map", "Click the port, the link or the router that answers the question."], ["Match and order", "Pair terms with meanings, or put steps in order."], ["Type the command", "A prompt and a goal. You type the command."], ["Lab task", "A short task in the replay terminal, checked on the result."]], "trainers": [["Subnetting trainer", "Unlimited fresh questions: network, broadcast, usable range, number of hosts, and \"same subnet or not\".", true], ["Routing table reader", "A destination and a real routing table. Which line wins?", false], ["Spanning tree predictor", "A fresh topology each time. Mark the root and the blocking port.", false], ["Command recall", "The goal is given. Type the command from memory.", false]], "mock_note": "Cisco gives the exam 120 minutes and does not publish the number of questions. Our mock exams use 100 questions, split by the published domain weights.", "readiness": "After each mock exam you get a score for each of the six exam domains and for each topic, a list of the lessons and labs behind your weak topics, and a review set built from them. We treat 85 percent on two mock exams as ready. That is our own threshold, not Cisco's pass mark, which Cisco does not publish.", "integrity": "All questions are written for this course from the exam topics and from our own lab output. The course contains no real exam questions and never will."}, "sample": [{"topic": "3.4", "q": "Look at the two neighbours on R2. Why does one show FULL/DR and the other FULL/ - ?", "exhibit": {"step": "07_R2_verify", "text": "R2#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n3.3.3.3           1   FULL/DR         00:00:31    10.0.23.2       Ethernet0/1\n1.1.1.1           0   FULL/  -        00:00:30    10.0.12.1       Ethernet0/0"}, "o": ["Ethernet0/0 is a point-to-point network, so no DR is elected there. Ethernet0/1 is a broadcast network.", "The neighbour on Ethernet0/0 has not finished exchanging its database yet.", "Router 1.1.1.1 has priority 0, so R2 ignores it in the election.", "A DR is only shown for the neighbour with the highest router ID."], "a": 0, "why": "On a point-to-point network there is no DR election, and the state is shown as FULL/ - . The Pri column shows 0 there for the same reason. On the broadcast link R3 is the DR."}, {"topic": "3.4", "q": "R2 has lost its neighbour R3. In this debug line, R means received and C means configured. What will bring the neighbour back?", "exhibit": {"step": "14_R2_symptom", "text": "*Oct  6 09:19:39.539: OSPF-1 HELLO Et0/1: Mismatched hello parameters from 10.0.23.2\n*Oct  6 09:19:39.539: OSPF-1 HELLO Et0/1: Dead R 20 C 40, Hello R 5 C 10 Mask R 255.255.255.252 C 255.255.255.252"}, "o": ["Remove the hello interval of 5 seconds from R3's interface, so both ends use 10 again.", "Change the subnet mask on R2 to match R3.", "Raise the dead interval on R3 to 40 and leave its hello interval at 5.", "Clear the OSPF process on R2."], "a": 0, "why": "R2 received hello 5 and dead 20, and is configured for hello 10 and dead 40. Hello and dead intervals must both match. The masks are the same. Raising only the dead timer leaves the hello intervals different."}, {"topic": "3.2", "q": "The direct link from R1 to R3 is down. Every interface in this network has OSPF cost 10. R1 now reaches LAN B, 192.168.3.0/24, with metric 30. Which three interfaces add up to 30?", "exhibit": {"step": "10_R1_linkdown", "text": "Routing entry for 192.168.3.0/24\n  Known via \"ospf 1\", distance 110, metric 30, type intra area\n  Last update from 10.0.12.2 on Ethernet0/0, 00:00:06 ago\n  Routing Descriptor Blocks:\n  * 10.0.12.2, from 3.3.3.3, 00:00:06 ago, via Ethernet0/0\n      Route metric is 30, traffic share count is 1"}, "o": ["R1 towards R2, R2 towards R3, and R3's interface on LAN B.", "R1 towards R2, R2 towards R3, and R3 towards R1.", "R1's LAN A interface, R1 towards R2, and R2 towards R3.", "The three router loopbacks."], "a": 0, "why": "OSPF adds the cost of each outgoing interface on the way to the destination network, including the interface that connects to that network. Before the failure it was two interfaces: 20."}, {"topic": "3.1", "q": "R1 shows this entry before any failure. What do the two \"via\" lines mean?", "exhibit": {"step": "06_R1_verify", "text": "O        10.0.23.0/30 [110/20] via 10.0.13.2, 00:00:50, Ethernet0/1\n                      [110/20] via 10.0.12.2, 00:00:18, Ethernet0/0"}, "o": ["Two paths of equal cost. R1 shares traffic for that network between both.", "A primary route and a floating backup route.", "The second line is the return path from R3.", "An error: one prefix can have only one next hop."], "a": 0, "why": "Both paths to 10.0.23.0/30 have metric 20, so OSPF installs both and the router load-shares. A backup route would not appear in the table while the primary is present."}, {"topic": "3.4", "q": "Both routers on this link have OSPF priority 1 and started within the same wait period. Why did R3 become the DR?", "exhibit": {"step": "07_R2_verify", "text": "  Designated Router (ID) 3.3.3.3, Interface address 10.0.23.2\n  Backup Designated router (ID) 2.2.2.2, Interface address 10.0.23.1"}, "o": ["Priorities are equal, so the higher router ID wins: 3.3.3.3 against 2.2.2.2.", "The higher interface IP address on the link decides, and R3 has it.", "R3 was configured last, and the newest router takes over.", "The lower router ID wins, as in spanning tree."], "a": 0, "why": "Priority is compared first, then router ID, and higher wins. A router that joins later does not take over: the election is not repeated while the DR stays up."}, {"topic": "3.4", "q": "PC1 normally reaches PC2 through two routers, R1 and R3. This trace was taken during a failure. Which link was down?", "exhibit": {"step": "11_PC1_reroute", "text": "VPCS> trace 192.168.3.10\ntrace to 192.168.3.10, 8 hops max, press Ctrl+C to stop\n 1   192.168.1.1   0.302 ms  0.145 ms  0.134 ms\n 2   10.0.12.2   0.330 ms  0.232 ms  0.264 ms\n 3   10.0.23.2   0.388 ms  0.337 ms  0.349 ms\n 4   *192.168.3.10   0.579 ms (ICMP type:3, code:3, Destination port unreachable)"}, "o": ["R1 to R3", "R1 to R2", "R2 to R3", "PC2 to R3"], "a": 0, "why": "The second hop is 10.0.12.2, which is R2, and a third router, 10.0.23.2, appears before PC2. The traffic went round through the Hub, so the direct link from R1 to R3 was not available."}, {"topic": "1.6", "q": "The link between R2 and R3 uses 10.0.23.0/30. How many addresses can be given to interfaces, and which ones?", "exhibit": null, "o": ["Two: 10.0.23.1 and 10.0.23.2", "Four: 10.0.23.0 to 10.0.23.3", "Three: 10.0.23.1 to 10.0.23.3", "Two: 10.0.23.0 and 10.0.23.1"], "a": 0, "why": "A /30 has four addresses. The first is the network address and the last, 10.0.23.3, is the broadcast address. Two are left for the two routers."}, {"topic": "3.4", "q": "Which command shows the hello and dead intervals of one OSPF interface?", "exhibit": null, "o": ["show ip ospf interface Ethernet0/1", "show ip ospf neighbor", "show ip route ospf", "show ip protocols"], "a": 0, "why": "\"show ip ospf interface\" prints the timer intervals, the network type, the cost, and the DR and BDR. The neighbour table shows only the time left on the dead timer."}], "status": {"done": ["The curriculum: 12 weeks, 71 lessons, 46 labs and 2 capstones, each mapped to the exam topics.", "Coverage of all 53 topics of CCNA 200-301 version 1.1, checked by the build.", "The interactive lab map: one data file per lab draws the topology, addresses, subnet cards and scenes.", "Week 6, the pilot week: 7 narrated, interactive lessons with 7 simulators and 28 quiz questions, in the same player as the ACI and SD-WAN courses.", "Six lab runs for week 6 performed on real Cisco IOS on the CES Tech lab server (L22 to L26, and the default-route demonstration L25b). Their real output is on the lab pages, in the lessons and in the test.", "The week 6 test: 20 timed questions drawn from a bank of 30, with exhibits that the build cuts from the real captures.", "A check on the lab server that the switch and router images accept the commands the labs need.", "An independent technical review of this curriculum by a second AI reviewer, with its findings applied.", "The subnetting trainer."], "todo": ["Perform the other 42 labs on the lab server and capture their output.", "Write, record and review the other 64 lessons.", "Write the rest of the question bank: about 940 original questions in all, of which 58 exist.", "Build the other 9 weekly tests, the mock exam engine and the readiness report.", "Build the per-lab interactions: predicting on the map, the replay terminal, ticket scoring.", "Learner accounts, so progress follows the learner between devices."], "needs": [], "order
