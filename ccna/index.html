p route 192.168.3.0 255.255.255.0 10.0.13.2", "ip route 0.0.0.0 0.0.0.0 10.0.13.1", "ip route 192.168.1.10 255.255.255.255 10.0.13.1", "show ip route", "show ip route static", "traceroute 192.168.3.10"], "topics": ["3.1", "3.3"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 270, "y": 350, "label": "R1", "sub": ["Lo0 1.1.1.1"], "site": "HQ"}, {"id": "R2", "kind": "router", "x": 500, "y": 120, "label": "R2", "sub": ["Lo0 2.2.2.2"], "site": "Hub"}, {"id": "R3", "kind": "router", "x": 730, "y": 350, "label": "R3", "sub": ["Lo0 3.3.3.3"], "site": "Depot"}, {"id": "PC1", "kind": "pc", "x": 70, "y": 350, "label": "PC1", "sub": [], "site": null}, {"id": "PC2", "kind": "pc", "x": 930, "y": 350, "label": "PC2", "sub": [], "site": null}], "links": [{"a": "R1", "ai": "e0/0", "aip": "10.0.12.1", "b": "R2", "bi": "e0/0", "bip": "10.0.12.2", "net": "10.0.12.0/30", "kind": "eth", "label": null}, {"a": "R2", "ai": "e0/1", "aip": "10.0.23.1", "b": "R3", "bi": "e0/0", "bip": "10.0.23.2", "net": "10.0.23.0/30", "kind": "eth", "label": null}, {"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth", "label": null}, {"a": "PC1", "ai": "eth0", "aip": "192.168.1.10", "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}, {"a": "PC2", "ai": "eth0", "aip": "192.168.3.10", "b": "R3", "bi": "e0/2", "bip": "192.168.3.1", "net": "192.168.3.0/24", "kind": "eth", "name": "LAN B"}], "notes": [], "h": 500}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [{"t": "One route only", "text": "R1 knows the way to LAN B. The request arrives. R3 has no route back to LAN A, so the reply dies there.", "path": ["PC1", "R1", "R3", "PC2"], "back": ["PC2", "R3"], "stop": "R3"}, {"t": "Both routes", "text": "With the return route in place, the reply comes home.", "path": ["PC1", "R1", "R3", "PC2"], "back": ["PC2", "R3", "R1", "PC1"]}], "folder": null, "beyond": null, "devices": 5, "cml": true}, {"id": "L19", "week": 5, "title": "Which route wins?", "kind": "predict", "mins": 30, "story": "R1 has five static routes that overlap. For six destinations you say which route the router will use, before the router tells you.", "tasks": ["Read the five routes on the board.", "For each destination, pick the route you expect.", "Check each one with a routing lookup for that address.", "Add a second route to the same prefix with a different administrative distance and see which is installed."], "twist": "One destination matches five routes at once, counting the default. The longest match wins, whatever order they were typed in.", "play": "Pick a destination address and click the exit you expect, R2 or R3. The router's real lookup shows the winner.", "checks": ["172.16.10.200 matches a /16, a /24, a /25, a /32 and the default route. Which one is used?", "Two routes to the same prefix come from different sources. What decides?", "Two routes to the same prefix come from the same protocol. What decides?"], "cmds": ["show ip route 172.16.10.200", "show ip route 172.16.0.0 255.255.0.0 longer-prefixes", "show ip cef 172.16.10.130"], "topics": ["3.1", "3.2"], "topo": {"nodes": [{"id": "PC1", "kind": "pc", "x": 70, "y": 270, "label": "PC1", "sub": [], "site": null}, {"id": "R1", "kind": "router", "x": 290, "y": 270, "label": "R1", "sub": [], "site": "HQ"}, {"id": "R2", "kind": "router", "x": 600, "y": 110, "label": "R2", "sub": ["Lo: 172.16.x.x networks"], "site": "Hub"}, {"id": "R3", "kind": "router", "x": 600, "y": 430, "label": "R3", "sub": ["Lo: 172.16.x.x networks"], "site": "Depot"}], "links": [{"a": "PC1", "ai": "eth0", "aip": "192.168.1.10", "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}, {"a": "R1", "ai": "e0/0", "aip": "10.0.12.1", "b": "R2", "bi": "e0/0", "bip": "10.0.12.2", "net": "10.0.12.0/30", "kind": "eth"}, {"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth"}], "notes": [{"x": 740, "y": 190, "lines": ["R1's static routes", "172.16.0.0/16       via R2", "172.16.10.0/24      via R3", "172.16.10.128/25    via R2", "172.16.10.200/32    via R3", "0.0.0.0/0           via R2"], "anchor": "start", "cls": "board"}], "h": 520}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [], "folder": null, "beyond": null, "devices": 4, "cml": true}, {"id": "L20", "week": 5, "title": "Test the backup", "kind": "build", "mins": 35, "story": "The Depot has a backup path through the Hub that has never been tested. You build a floating static route, then cut the main link in a controlled way to prove that the backup takes over.", "tasks": ["Add the primary static routes over the direct link, on R1 and on R3.", "Add the backups through the Hub with a higher administrative distance, and give R2 a route to each LAN.", "Confirm that only the primary routes are in the routing tables.", "Shut the direct link at both ends, read the tables and the trace, then restore it."], "twist": "The backup route is configured but invisible in the routing table until the primary fails.", "play": "Cut the link on the map. The path redraws through the Hub, and the routing table entry changes with it.", "checks": ["What is the default administrative distance of a static route?", "Why must the backup route have a higher distance than the primary?", "Where can you see a static route that is configured but not installed?"], "cmds": ["ip route 192.168.3.0 255.255.255.0 10.0.13.2", "ip route 192.168.3.0 255.255.255.0 10.0.12.2 10", "show ip route static", "show running-config | include ip route", "traceroute 192.168.3.10"], "topics": ["3.3", "3.2"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 270, "y": 350, "label": "R1", "sub": ["Lo0 1.1.1.1"], "site": "HQ"}, {"id": "R2", "kind": "router", "x": 500, "y": 120, "label": "R2", "sub": ["Lo0 2.2.2.2"], "site": "Hub"}, {"id": "R3", "kind": "router", "x": 730, "y": 350, "label": "R3", "sub": ["Lo0 3.3.3.3"], "site": "Depot"}, {"id": "PC1", "kind": "pc", "x": 70, "y": 350, "label": "PC1", "sub": [], "site": null}, {"id": "PC2", "kind": "pc", "x": 930, "y": 350, "label": "PC2", "sub": [], "site": null}], "links": [{"a": "R1", "ai": "e0/0", "aip": "10.0.12.1", "b": "R2", "bi": "e0/0", "bip": "10.0.12.2", "net": "10.0.12.0/30", "kind": "eth", "label": "backup, distance 10"}, {"a": "R2", "ai": "e0/1", "aip": "10.0.23.1", "b": "R3", "bi": "e0/0", "bip": "10.0.23.2", "net": "10.0.23.0/30", "kind": "eth", "label": null}, {"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth", "label": "primary"}, {"a": "PC1", "ai": "eth0", "aip": "192.168.1.10", "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}, {"a": "PC2", "ai": "eth0", "aip": "192.168.3.10", "b": "R3", "bi": "e0/2", "bip": "192.168.3.1", "net": "192.168.3.0/24", "kind": "eth", "name": "LAN B"}], "notes": [], "h": 500}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": "On virtual routers the far end of a link stays up when one end is shut, so this lab shuts both ends. Pulling a real cable takes both ends down at once.", "status": "designed", "scenes": [{"t": "Primary path", "text": "Traffic uses the direct link. The backup route waits outside the routing table.", "path": ["PC1", "R1", "R3", "PC2"]}, {"t": "Direct link down", "text": "The primary route is withdrawn at both ends. The floating static routes take its place.", "down": ["R1-R3"], "path": ["PC1", "R1", "R2", "R3", "PC2"]}, {"t": "Restored", "text": "The primary returns and replaces the backup, because its distance is lower.", "path": ["PC1", "R1", "R3", "PC2"]}], "folder": null, "beyond": null, "devices": 5, "cml": true}, {"id": "L21", "week": 5, "title": "The same in IPv6", "kind": "build", "mins": 35, "story": "Everything you did by hand in IPv4 you now do in IPv6: a network route, a default route, a host route and a floating backup.", "tasks": ["Add IPv6 static routes between the HQ and Depot LANs.", "Add an IPv6 default route at the Depot.", "Use a link-local next hop and note what else you must type.", "Add a floating static route through the Hub and test it by shutting the direct link at both ends."], "twist": "A link-local next hop needs the exit interface as well. Why?", "play": "The same map with IPv6 addresses. Click a link to see its prefix and both ends.", "checks": ["How is the IPv6 default route written?", "What must accompany a link-local next hop?", "Which command turns on IPv6 forwarding?"], "cmds": ["ipv6 unicast-routing", "ipv6 route 2001:db8:3::/64 2001:db8:13::2", "ipv6 route ::/0 2001:db8:13::1", "ipv6 route 2001:db8:3::/64 e0/1 fe80::3", "ipv6 route 2001:db8:3::/64 2001:db8:12::2 10", "show ipv6 route"], "topics": ["3.3", "1.8"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 270, "y": 350, "label": "R1", "sub": [], "site": "HQ"}, {"id": "R2", "kind": "router", "x": 500, "y": 120, "label": "R2", "sub": [], "site": "Hub"}, {"id": "R3", "kind": "router", "x": 730, "y": 350, "label": "R3", "sub": [], "site": "Depot"}, {"id": "PC1", "kind": "pc", "x": 70, "y": 350, "label": "PC1", "sub": [], "site": null}, {"id": "PC2", "kind": "pc", "x": 930, "y": 350, "label": "PC2", "sub": [], "site": null}], "links": [{"a": "R1", "ai": "e0/0", "aip": "2001:db8:12::1", "b": "R2", "bi": "e0/0", "bip": "2001:db8:12::2", "net": "2001:db8:12::/64", "kind": "eth"}, {"a": "R2", "ai": "e0/1", "aip": "2001:db8:23::1", "b": "R3", "bi": "e0/0", "bip": "2001:db8:23::2", "net": "2001:db8:23::/64", "kind": "eth"}, {"a": "R1", "ai": "e0/1", "aip": "2001:db8:13::1", "b": "R3", "bi": "e0/1", "bip": "2001:db8:13::2", "net": "2001:db8:13::/64", "kind": "eth"}, {"a": "PC1", "ai": "eth0", "aip": "2001:db8:1::10", "b": "R1", "bi": "e0/2", "bip": "2001:db8:1::1", "net": "2001:db8:1::/64", "kind": "eth", "name": "LAN A"}, {"a": "PC2", "ai": "eth0", "aip": "2001:db8:3::10", "b": "R3", "bi": "e0/2", "bip": "2001:db8:3::1", "net": "2001:db8:3::/64", "kind": "eth", "name": "LAN B"}], "notes": [{"x": 500, "y": 440, "lines": ["every interface also has a link-local address: fe80::/10"], "anchor": "middle", "cls": "hand"}], "h": 500}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [], "folder": null, "beyond": null, "devices": 5, "cml": true}, {"id": "L22", "week": 6, "title": "OSPF across three sites", "kind": "build", "mins": 50, "story": "Twelve more depots are coming and static routes will not scale. You turn on OSPF across the three sites, break a link to watch the network heal, then chase a neighbour that went missing.", "tasks": ["Configure single-area OSPF on R1, R2 and R3, each with a router ID.", "Verify the neighbours, the DR and BDR on the broadcast link, and the routes.", "Shut the direct HQ to Depot link and follow the traffic through the Hub.", "Find and fix the fault that stops R2 and R3 from being neighbours."], "twist": "A hello timer was changed on one side. The link is up, pings across it work, and the neighbour is gone.", "play": "Step through the five scenes. Each one redraws the path on the map and puts the real router output beside it.", "checks": ["R1 lists its neighbours as FULL/ - , but R2 lists R3 as FULL/DR. Why the difference?", "During the failure the metric to LAN B changes from 20 to 30. Which interfaces add up to 30?", "In the debug line \"Hello R 5 C 10\", what do R and C stand for?"], "cmds": ["router ospf 1", "router-id 1.1.1.1", "network 10.0.12.0 0.0.0.3 area 0", "passive-interface Ethernet0/2", "ip ospf network point-to-point", "show ip ospf neighbor", "show ip ospf interface brief", "show ip route ospf", "debug ip ospf hello"], "topics": ["3.4", "3.2", "3.1"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 270, "y": 350, "label": "R1", "sub": ["Lo0 1.1.1.1"], "site": "HQ"}, {"id": "R2", "kind": "router", "x": 500, "y": 120, "label": "R2", "sub": ["Lo0 2.2.2.2"], "site": "Hub"}, {"id": "R3", "kind": "router", "x": 730, "y": 350, "label": "R3", "sub": ["Lo0 3.3.3.3"], "site": "Depot"}, {"id": "PC1", "kind": "pc", "x": 70, "y": 350, "label": "PC1", "sub": [], "site": null}, {"id": "PC2", "kind": "pc", "x": 930, "y": 350, "label": "PC2", "sub": [], "site": null}], "links": [{"a": "R1", "ai": "e0/0", "aip": "10.0.12.1", "b": "R2", "bi": "e0/0", "bip": "10.0.12.2", "net": "10.0.12.0/30", "kind": "eth", "label": null}, {"a": "R2", "ai": "e0/1", "aip": "10.0.23.1", "b": "R3", "bi": "e0/0", "bip": "10.0.23.2", "net": "10.0.23.0/30", "kind": "eth", "label": null}, {"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth", "label": null}, {"a": "PC1", "ai": "eth0", "aip": "192.168.1.10", "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}, {"a": "PC2", "ai": "eth0", "aip": "192.168.3.10", "b": "R3", "bi": "e0/2", "bip": "192.168.3.1", "net": "192.168.3.0/24", "kind": "eth", "name": "LAN B"}], "notes": [], "h": 500}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": "On the link between R2 and R3 the DR depends on timing. In our run the two interfaces came up within 40 seconds of each other, so the higher router ID, R3, won. If R2 is up longer than that before R3 joins, R2 elects itself and stays DR. Both results are healthy.", "status": "performed", "scenes": [{"t": "Built and verified", "text": "All three routers are neighbours. PC1 reaches PC2 over the direct link, with two routers on the way. On the link between R2 and R3, the only broadcast link between routers, R3 was elected DR and R2 BDR.", "path": ["PC1", "R1", "R3", "PC2"], "back": ["PC2", "R3", "R1", "PC1"], "badges": {"R3": "DR", "R2": "BDR"}, "out": ["06_R1_verify", "07_R2_verify", "08_R3_verify", "09_PC1_reach"]}, {"t": "Direct link down", "text": "The link between R1 and R3 is shut. Within seconds OSPF recalculates. The route to LAN B now goes through R2, the metric rises from 20 to 30, and the trace shows three routers.", "down": ["R1-R3"], "path": ["PC1", "R1", "R2", "R3", "PC2"], "out": ["10_R1_linkdown", "11_PC1_reroute"]}, {"t": "Link restored", "text": "The link comes back. The neighbour reaches FULL about six seconds later, and the direct route with metric 20 returns.", "path": ["PC1", "R1", "R3", "PC2"], "out": ["12_R1_linkup"]}, {"t": "A neighbour goes missing", "text": "The hello interval on R3 was changed to 5 seconds. Within a minute R2 declares R3 dead. The link is still up and users notice nothing, because their traffic uses the direct link. The debug on R2 names the cause.", "warn": ["R2-R3"], "path": ["PC1", "R1", "R3", "PC2"], "out": ["13_R3_fault", "14_R2_symptom"]}, {"t": "Found and fixed", "text": "On R3 the interface shows hello 5 and dead 20, against 10 and 40 on R2. Removing the setting brings the neighbour back to FULL.", "badges": {"R3": "DR", "R2": "BDR"}, "out": ["15_R3_diagnose_fix", "16_R2_after_fix"]}], "folder": "ccna-ospf-01", "beyond": null, "devices": 5, "cml": true, "steps": [{"id": "01_R1_config", "dev": "R1", "title": "R1: addresses and OSPF", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R1\nR1(config)#no ip domain-lookup\nR1(config)#interface Loopback0\nR1(config-if)# ip address 1.1.1.1 255.255.255.255\nR1(config-if)#interface Ethernet0/0\nR1(config-if)# description Link to R2\nR1(config-if)# ip address 10.0.12.1 255.255.255.252\nR1(config-if)#\n*Oct  6 09:15:51.624: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR1(config-if)# ip ospf network point-to-point\nR1(config-if)# no shutdown\nR1(config-if)#interface Ethernet0/1\nR1(config-if)# description Link to R3\nR1(config-if)# ip address 10.0.13.1 255.255.255.252\nR1(config-if)# ip ospf network point-to-point\nR1(config-if)# no shutdown\nR1(config-if)#interface Ethernet0/2\nR1(config-if)#\n*Oct  6 09:15:55.643: %LINK-3-UPDOWN: Interface Ethernet0/0, changed state to up\n*Oct  6 09:15:56.647: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/0, changed state to up\nR1(config-if)# description LAN A\nR1(config-if)# ip address 192.168.1.1 255.255.255.0\nR1(config-if)# no shutdown\nR1(config-if)#router ospf 1\nR1(config-router)# router-id 1.1.1.1\nR1(config-router)# passive-interface Ethernet0/2\nR1(config-router)#\n*Oct  6 09:15:58.160: %LINK-3-UPDOWN: Interface Ethernet0/1, changed state to up\n*Oct  6 09:15:59.165: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/1, changed state to up\nR1(config-router)# network 1.1.1.1 0.0.0.0 area 0\nR1(config-router)# network 10.0.12.0 0.0.0.3 area 0\nR1(config-router)# network 10.0.13.0 0.0.0.3 area 0\nR1(config-router)# network 192.168.1.0 0.0.0.255 area 0\nR1(config-router)#\n*Oct  6 09:16:00.174: %LINK-3-UPDOWN: Interface Ethernet0/2, changed state to up\n*Oct  6 09:16:01.182: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/2, changed state to up\nR1(config-router)#end\nR1#"}, {"id": "02_R2_config", "dev": "R2", "title": "R2: addresses and OSPF", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R2\nR2(config)#no ip domain-lookup\nR2(config)#interface Loopback0\nR2(config-if)# ip address 2.2.2.2 255.255.255.255\nR2(config-if)#interface Ethernet0/0\nR2(config-if)# description Link to R1\nR2(config-if)# ip address 10.0.12.2 255.255.255.252\nR2(config-if)#\n*Oct  6 09:16:18.784: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR2(config-if)# ip ospf network point-to-point\nR2(config-if)# no shutdown\nR2(config-if)#interface Ethernet0/1\nR2(config-if)# description Link to R3\nR2(config-if)# ip address 10.0.23.1 255.255.255.252\nR2(config-if)# no shutdown\nR2(config-if)#router ospf 1\nR2(config-router)# router-id 2.2.2.2\nR2(config-router)#\n*Oct  6 09:16:22.804: %LINK-3-UPDOWN: Interface Ethernet0/0, changed state to up\n*Oct  6 09:16:23.811: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/0, changed state to up\nR2(config-router)# network 2.2.2.2 0.0.0.0 area 0\nR2(config-router)# network 10.0.12.0 0.0.0.3 area 0\nR2(config-router)# network 10.0.23.0 0.0.0.3 area 0\nR2(config-router)#end\nR2#\n*Oct  6 09:16:24.811: %LINK-3-UPDOWN: Interface Ethernet0/1, changed state to up\n*Oct  6 09:16:25.816: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/1, changed state to up\n*Oct  6 09:16:25.827: %SYS-5-CONFIG_I: Configured from console by console\nR2#"}, {"id": "03_R3_config", "dev": "R3", "title": "R3: addresses and OSPF", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R3\nR3(config)#no ip domain-lookup\nR3(config)#interface Loopback0\nR3(config-if)# ip address 3.3.3.3 255.255.255.255\nR3(config-if)#interface Ethernet0/0\nR3(config-if)# description Link to R2\nR3(config-if)# ip address 10.0.23.2 255.255.255.252\nR3(config-if)# no shutdown\nR3(config-if)#\n*Oct  6 09:16:49.337: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR3(config-if)#interface Ethernet0/1\nR3(config-if)# description Link to R1\nR3(config-if)# ip address 10.0.13.2 255.255.255.252\nR3(config-if)# ip ospf network point-to-point\nR3(config-if)# no shutdown\nR3(config-if)#interface Ethernet0/2\nR3(config-if)#\n*Oct  6 09:16:52.854: %LINK-3-UPDOWN: Interface Ethernet0/0, changed state to up\n*Oct  6 09:16:53.861: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/0, changed state to up\nR3(config-if)# description LAN B\nR3(config-if)# ip address 192.168.3.1 255.255.255.0\nR3(config-if)# no shutdown\nR3(config-if)#router ospf 1\nR3(config-router)# router-id 3.3.3.3\nR3(config-router)# passive-interface Ethernet0/2\nR3(config-router)#\n*Oct  6 09:16:55.566: %LINK-3-UPDOWN: Interface Ethernet0/1, changed state to up\n*Oct  6 09:16:56.566: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/1, changed state to up\nR3(config-router)# network 3.3.3.3 0.0.0.0 area 0\nR3(config-router)# network 10.0.23.0 0.0.0.3 area 0\nR3(config-router)# network 10.0.13.0 0.0.0.3 area 0\nR3(config-router)# network 192.168.3.0 0.0.0.255 area 0\nR3(config-router)#\n*Oct  6 09:16:57.576: %LINK-3-UPDOWN: Interface Ethernet0/2, changed state to up\n*Oct  6 09:16:58.584: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/2, changed state to up\nR3(config-router)#end\nR3#"}, {"id": "04_PC1_config", "dev": "PC1", "title": "PC1: address", "text": "VPCS> ip 192.168.1.10/24 192.168.1.1\nChecking for duplicate address...\nPC1 : 192.168.1.10 255.255.255.0 gateway 192.168.1.1\n\nVPCS> show ip\n\nNAME        : VPCS[1]\nIP/MASK     : 192.168.1.10/24\nGATEWAY     : 192.168.1.1\nDNS         : \nMAC         : 00:50:79:66:68:68\nLPORT       : 20000\nRHOST:PORT  : 127.0.0.1:30000\nMTU         : 1500\n\nVPCS> "}, {"id": "05_PC2_config", "dev": "PC2", "title": "PC2: address", "text": "VPCS> ip 192.168.3.10/24 192.168.3.1\nChecking for duplicate address...\nPC1 : 192.168.3.10 255.255.255.0 gateway 192.168.3.1\n\nVPCS> show ip\n\nNAME        : VPCS[1]\nIP/MASK     : 192.168.3.10/24\nGATEWAY     : 192.168.3.1\nDNS         : \nMAC         : 00:50:79:66:68:69\nLPORT       : 20000\nRHOST:PORT  : 127.0.0.1:30000\nMTU         : 1500\n\nVPCS> "}, {"id": "06_R1_verify", "dev": "R1", "title": "R1: verification", "text": "R1#show ip interface brief\nInterface                  IP-Address      OK? Method Status                Protocol\nEthernet0/0                10.0.12.1       YES manual up                    up      \nEthernet0/1                10.0.13.1       YES manual up                    up      \nEthernet0/2                192.168.1.1     YES manual up                    up      \nEthernet0/3                unassigned      YES unset  administratively down down    \nLoopback0                  1.1.1.1         YES manual up                    up      \nR1#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n3.3.3.3           0   FULL/  -        00:00:34    10.0.13.2       Ethernet0/1\n2.2.2.2           0   FULL/  -        00:00:39    10.0.12.2       Ethernet0/0\nR1#show ip ospf interface brief\nInterface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C\nLo0          1     0               1.1.1.1/32         1     LOOP  0/0\nEt0/2        1     0               192.168.1.1/24     10    DR    0/0\nEt0/1        1     0               10.0.13.1/30       10    P2P   1/1\nEt0/0        1     0               10.0.12.1/30       10    P2P   1/1\nR1#show ip route ospf\nCodes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP\n       D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area \n       N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2\n       E1 - OSPF external type 1, E2 - OSPF external type 2\n       i - IS-IS, su - IS-IS summary, L1 - IS-IS level-1, L2 - IS-IS level-2\n       ia - IS-IS inter area, * - candidate default, U - per-user static route\n       o - ODR, P - periodic downloaded static route, H - NHRP, l - LISP\n       a - application route\n       + - replicated route, % - next hop override\n\nGateway of last resort is not set\n\n      2.0.0.0/32 is subnetted, 1 subnets\nO        2.2.2.2 [110/11] via 10.0.12.2, 00:01:28, Ethernet0/0\n      3.0.0.0/32 is subnetted, 1 subnets\nO        3.3.3.3 [110/11] via 10.0.13.2, 00:00:50, Ethernet0/1\n      10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks\nO        10.0.23.0/30 [110/20] via 10.0.13.2, 00:00:50, Ethernet0/1\n                      [110/20] via 10.0.12.2, 00:00:18, Ethernet0/0\nO     192.168.3.0/24 [110/20] via 10.0.13.2, 00:00:50, Ethernet0/1\nR1#show ip protocols\n*** IP Routing is NSF aware ***\n\nRouting Protocol is \"application\"\n  Sending updates every 0 seconds\n  Invalid after 0 seconds, hold down 0, flushed after 0\n  Outgoing update filter list for all interfaces is not set\n  Incoming update filter list for all interfaces is not set\n  Maximum path: 32\n  Routing for Networks:\n  Routing Information Sources:\n    Gateway         Distance      Last Update\n  Distance: (default is 4)\n\nRouting Protocol is \"ospf 1\"\n  Outgoing update filter list for all interfaces is not set\n  Incoming update filter list for all interfaces is not set\n  Router ID 1.1.1.1\n  Number of areas in this router is 1. 1 normal 0 stub 0 nssa\n  Maximum path: 4\n  Routing for Networks:\n    1.1.1.1 0.0.0.0 area 0\n    10.0.12.0 0.0.0.3 area 0\n    10.0.13.0 0.0.0.3 area 0\n    192.168.1.0 0.0.0.255 area 0\n  Passive Interface(s):\n    Ethernet0/2\n  Routing Information Sources:\n    Gateway         Distance      Last Update\n    3.3.3.3              110      00:00:18\n    2.2.2.2              110      00:01:28\n  Distance: (default is 110)\n\nR1#ping 3.3.3.3 source 1.1.1.1\nType escape sequence to abort.\nSending 5, 100-byte ICMP Echos to 3.3.3.3, timeout is 2 seconds:\nPacket sent with a source address of 1.1.1.1 \n!!!!!\nSuccess rate is 100 percent (5/5), round-trip min/avg/max = 1/1/1 ms\nR1#"}, {"id": "07_R2_verify", "dev": "R2", "title": "R2: verification (the link to R3 is a broadcast link, so a DR and BDR are elected)", "text": "R2#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n3.3.3.3           1   FULL/DR         00:00:31    10.0.23.2       Ethernet0/1\n1.1.1.1           0   FULL/  -        00:00:30    10.0.12.1       Ethernet0/0\nR2#show ip ospf interface Ethernet0/1\nEthernet0/1 is up, line protocol is up \n  Internet Address 10.0.23.1/30, Area 0, Attached via Network Statement\n  Process ID 1, Router ID 2.2.2.2, Network Type BROADCAST, Cost: 10\n  Topology-MTID    Cost    Disabled    Shutdown      Topology Name\n        0           10        no          no            Base\n  Transmit Delay is 1 sec, State BDR, Priority 1\n  Designated Router (ID) 3.3.3.3, Interface address 10.0.23.2\n  Backup Designated router (ID) 2.2.2.2, Interface address 10.0.23.1\n  Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5\n    oob-resync timeout 40\n    Hello due in 00:00:06\n  Supports Link-local Signaling (LLS)\n  Cisco NSF helper support enabled\n  IETF NSF helper support enabled\n  Index 3/3, flood queue length 0\n  Next 0x0(0)/0x0(0)\n  Last flood scan length is 1, maximum is 1\n  Last flood scan time is 0 msec, maximum is 0 msec\n  Neighbor Count is 1, Adjacent neighbor count is 1 \n    Adjacent with neighbor 3.3.3.3  (Designated Router)\n  Suppress hello for 0 neighbor(s)\nR2#show ip ospf interface Ethernet0/0\nEthernet0/0 is up, line protocol is up \n  Internet Address 10.0.12.2/30, Area 0, Attached via Network Statement\n  Process ID 1, Router ID 2.2.2.2, Network Type POINT_TO_POINT, Cost: 10\n  Topology-MTID    Cost    Disabled    Shutdown      Topology Name\n        0           10        no          no            Base\n  Transmit Delay is 1 sec, State POINT_TO_POINT\n  Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5\n    oob-resync timeout 40\n    Hello due in 00:00:05\n  Supports Link-local Signaling (LLS)\n  Cisco NSF helper support enabled\n  IETF NSF helper support enabled\n  Index 2/2, flood queue length 0\n  Next 0x0(0)/0x0(0)\n  Last flood scan length is 2, maximum is 2\n  Last flood scan time is 0 msec, maximum is 0 msec\n  Neighbor Count is 1, Adjacent neighbor count is 1 \n    Adjacent with neighbor 1.1.1.1\n  Suppress hello for 0 neighbor(s)\nR2#show ip route ospf\nCodes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP\n       D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area \n       N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2\n       E1 - OSPF external type 1, E2 - OSPF external type 2\n       i - IS-IS, su - IS-IS summary, L1 - IS-IS level-1, L2 - IS-IS level-2\n       ia - IS-IS inter area, * - candidate default, U - per-user static route\n       o - ODR, P - periodic downloaded static route, H - NHRP, l - LISP\n       a - application route\n       + - replicated route, % - next hop override\n\nGateway of last resort is not set\n\n      1.0.0.0/32 is subnetted, 1 subnets\nO        1.1.1.1 [110/11] via 10.0.12.1, 00:01:35, Ethernet0/0\n      3.0.0.0/32 is subnetted, 1 subnets\nO        3.3.3.3 [110/11] via 10.0.23.2, 00:00:22, Ethernet0/1\n      10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks\nO        10.0.13.0/30 [110/20] via 10.0.23.2, 00:00:22, Ethernet0/1\n                      [110/20] via 10.0.12.1, 00:01:35, Ethernet0/0\nO     192.168.1.0/24 [110/20] via 10.0.12.1, 00:01:35, Ethernet0/0\nO     192.168.3.0/24 [110/20] via 10.0.23.2, 00:00:22, Ethernet0/1\nR2#"}, {"id": "08_R3_verify", "dev": "R3", "title": "R3: verification", "text": "R3#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1           0   FULL/  -        00:00:36    10.0.13.1       Ethernet0/1\n2.2.2.2           1   FULL/BDR        00:00:34    10.0.23.1       Ethernet0/0\nR3#show ip route ospf\nCodes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP\n       D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area \n       N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2\n       E1 - OSPF external type 1, E2 - OSPF external type 2\n       i - IS-IS, su - IS-IS summary, L1 - IS-IS level-1, L2 - IS-IS level-2\n       ia - IS-IS inter area, * - candidate default, U - per-user static route\n       o - ODR, P - periodic downloaded static route, H - NHRP, l - LISP\n       a - application route\n       + - replicated route, % - next hop override\n\nGateway of last resort is not set\n\n      1.0.0.0/32 is subnetted, 1 subnets\nO        1.1.1.1 [110/11] via 10.0.13.1, 00:00:54, Ethernet0/1\n      2.0.0.0/32 is subnetted, 1 subnets\nO        2.2.2.2 [110/11] via 10.0.23.1, 00:00:24, Ethernet0/0\n      10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks\nO        10.0.12.0/30 [110/20] via 10.0.23.1, 00:00:24, Ethernet0/0\n                      [110/20] via 10.0.13.1, 00:00:54, Ethernet0/1\nO     192.168.1.0/24 [110/20] via 10.0.13.1, 00:00:54, Ethernet0/1\nR3#show ip ospf database\n\n            OSPF Router with ID (3.3.3.3) (Process ID 1)\n\n\t\tRouter Link States (Area 0)\n\nLink ID         ADV Router      Age         Seq#       Checksum Link count\n1.1.1.1         1.1.1.1         61          0x80000004 0x00448B 6\n2.2.2.2         2.2.2.2         30          0x80000003 0x001A3E 4\n3.3.3.3         3.3.3.3         29          0x80000004 0x00457C 5\n\n\t\tNet Link States (Area 0)\n\nLink ID         ADV Router      Age         Seq#       Checksum\n10.0.23.2       3.3.3.3         29          0x80000001 0x006990\nR3#"}, {"id": "09_PC1_reach", "dev": "PC1", "title": "PC1: reach PC2 across the OSPF network", "text": "VPCS> ping 192.168.3.10\n\n84 bytes from 192.168.3.10 icmp_seq=1 ttl=62 time=0.876 ms\n84 bytes from 192.168.3.10 icmp_seq=2 ttl=62 time=0.798 ms\n84 bytes from 192.168.3.10 icmp_seq=3 ttl=62 time=0.693 ms\n84 bytes from 192.168.3.10 icmp_seq=4 ttl=62 time=0.651 ms\n84 bytes from 192.168.3.10 icmp_seq=5 ttl=62 time=0.890 ms\n\nVPCS> trace 192.168.3.10\ntrace to 192.168.3.10, 8 hops max, press Ctrl+C to stop\n 1   192.168.1.1   0.232 ms  0.155 ms  0.155 ms\n 2   10.0.13.2   0.434 ms  0.400 ms  0.465 ms\n 3   *192.168.3.10   0.748 ms (ICMP type:3, code:3, Destination port unreachable)\n\nVPCS> "}, {"id": "10_R1_linkdown", "dev": "R1", "title": "R1: path to LAN B before the failure", "text": "R1#show ip route 192.168.3.0\nRouting entry for 192.168.3.0/24\n  Known via \"ospf 1\", distance 110, metric 20, type intra area\n  Last update from 10.0.13.2 on Ethernet0/1, 00:01:04 ago\n  Routing Descriptor Blocks:\n  * 10.0.13.2, from 3.3.3.3, 00:01:04 ago, via Ethernet0/1\n      Route metric is 20, traffic share count is 1\nR1#\n\nR1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#interface Ethernet0/1\nR1(config-if)# shutdown\nR1(config-if)#end\nR1#\n*Oct  6 09:18:17.766: %OSPF-5-ADJCHG: Process 1, Nbr 3.3.3.3 on Ethernet0/1 from FULL to DOWN, Neighbor Down: Interface down or detached\n*Oct  6 09:18:18.263: %SYS-5-CONFIG_I: Configured from console by console\nR1#\n*Oct  6 09:18:19.765: %LINK-5-CHANGED: Interface Ethernet0/1, changed state to administratively down\n*Oct  6 09:18:20.771: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/1, changed state to down\nR1#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n2.2.2.2           0   FULL/  -        00:00:32    10.0.12.2       Ethernet0/0\nR1#show ip route 192.168.3.0\nRouting entry for 192.168.3.0/24\n  Known via \"ospf 1\", distance 110, metric 30, type intra area\n  Last update from 10.0.12.2 on Ethernet0/0, 00:00:06 ago\n  Routing Descriptor Blocks:\n  * 10.0.12.2, from 3.3.3.3, 00:00:06 ago, via Ethernet0/0\n      Route metric is 30, traffic share count is 1\nR1#"}, {"id": "11_PC1_reroute", "dev": "PC1", "title": "PC1: same test while the direct link is down", "text": "VPCS> ping 192.168.3.10\n\n84 bytes from 192.168.3.10 icmp_seq=1 ttl=61 time=0.704 ms\n84 bytes from 192.168.3.10 icmp_seq=2 ttl=61 time=0.928 ms\n84 bytes from 192.168.3.10 icmp_seq=3 ttl=61 time=0.914 ms\n84 bytes from 192.168.3.10 icmp_seq=4 ttl=61 time=0.923 ms\n84 bytes from 192.168.3.10 icmp_seq=5 ttl=61 time=0.702 ms\n\nVPCS> trace 192.168.3.10\ntrace to 192.168.3.10, 8 hops max, press Ctrl+C to stop\n 1   192.168.1.1   0.302 ms  0.145 ms  0.134 ms\n 2   10.0.12.2   0.330 ms  0.232 ms  0.264 ms\n 3   10.0.23.2   0.388 ms  0.337 ms  0.349 ms\n 4   *192.168.3.10   0.579 ms (ICMP type:3, code:3, Destination port unreachable)\n\nVPCS> "}, {"id": "12_R1_linkup", "dev": "R1", "title": "R1   Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5\nR2#debug ip ospf hello\nOSPF hello debugging is on\nR2#\n*Oct  6 09:19:35.358: OSPF-1 HELLO Et0/1: Send hello to 224.0.0.5 area 0 from 10.0.23.1\nR2#\n*Oct  6 09:19:39.539: OSPF-1 HELLO Et0/1: Rcv hello from 3.3.3.3 area 0 10.0.23.2\n*Oct  6 09:19:39.539: OSPF-1 HELLO Et0/1: Mismatched hello parameters from 10.0.23.2\n*Oct  6 09:19:39.539: OSPF-1 HELLO Et0/1: Dead R 20 C 40, Hello R 5 C 10 Mask R 255.255.255.252 C 255.255.255.252\nR2#\n*Oct  6 09:19:41.543: OSPF-1 HELLO Et0/0: Rcv hello from 1.1.1.1 area 0 10.0.12.1\nR2#undebug all\nAll possible debugging has been turned off\nR2#"}, {"id": "15_R3_diagnose_fix", "dev": "R3", "title": "R3: the other end of the link", "text": "R3#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1           0   FULL/  -        00:00:36    10.0.13.1       Ethernet0/1\nR3#show ip ospf interface Ethernet0/0 | include Timer\n  Timer intervals configured, Hello 5, Dead 20, Wait 20, Retransmit 5\nR3#show running-config interface Ethernet0/0\nBuilding configuration...\n\nCurrent configuration : 117 bytes\n!\ninterface Ethernet0/0\n description Link to R2\n ip address 10.0.23.2 255.255.255.252\n ip ospf hello-interval 5\nend\n\nR3#\n\nR3#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR3(config)#interface Ethernet0/0\nR3(config-if)# no ip ospf hello-interval\nR3(config-if)#\n*Oct  6 09:19:54.459: %OSPF-5-ADJCHG: Process 1, Nbr 2.2.2.2 on Ethernet0/0 from LOADING to FULL, Loading Done\nR3(config-if)#end\nR3#\n*Oct  6 09:19:56.433: %SYS-5-CONFIG_I: Configured from console by console\nR3#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1           0   FULL/  -        00:00:39    10.0.13.1       Ethernet0/1\n2.2.2.2           1   FULL/BDR        00:00:36    10.0.23.1       Ethernet0/0\nR3#"}, {"id": "16_R2_after_fix", "dev": "R  election does not pre-empt. A better candidate that arrives late waits its turn, and when the DR fails it is the BDR that moves up, whatever the priorities say.", "play": "Place the DR and BDR markers on the routers before each scene. Then compare with the real neighbour tables.", "checks": ["Which is compared first in the election: priority or router ID?", "R1 has priority 100 and the DR fails. Why does R2, with priority 1, become the DR?", "What does priority 0 mean, and what happened when it was set on the acting DR?"], "cmds": ["ip ospf priority 100", "ip ospf priority 0", "show ip ospf neighbor", "show ip ospf interface Ethernet0/0", "shutdown   then   no shutdown"], "topics": ["3.4"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 240, "y": 130, "label": "R1", "sub": ["RID 1.1.1.1"], "site": "HQ"}, {"id": "R2", "kind": "router", "x": 500, "y": 130, "label": "R2", "sub": ["RID 2.2.2.2"], "site": "Hub"}, {"id": "R3", "kind": "router", "x": 760, "y": 130, "label": "R3", "sub": ["RID 3.3.3.3"], "site": "Depot"}, {"id": "HUB", "kind": "hub", "x": 500, "y": 340, "label": "Switch", "sub": [], "site": null}], "links": [{"a": "R1", "ai": "e0/0", "aip": "10.0.123.1", "b": "HUB", "bi": "", "bip": null, "net": "10.0.123.0/24", "kind": "eth", "quiet": true}, {"a": "R2", "ai": "e0/0", "aip": "10.0.123.2", "b": "HUB", "bi": "", "bip": null, "net": "10.0.123.0/24", "kind": "eth", "quiet": true}, {"a": "R3", "ai": "e0/0", "aip": "10.0.123.3", "b": "HUB", "bi": "", "bip": null, "net": "10.0.123.0/24", "kind": "eth", "quiet": true}], "notes": [{"x": 500, "y": 430, "lines": ["one shared segment 10.0.123.0/24: who becomes the DR?"], "anchor": "middle", "cls": "hand"}], "h": 470}, "images": ["Cisco IOL router"], "runs": "eve", "needs": "The three interfaces are brought up within the same forty-second wait, so that all three routers take part in the first election.", "status": "performed", "scenes": [{"t": "The first election", "text": "All three interfaces came up within the same forty-second wait. The priorities are equal, so the router IDs decide: R3 is the DR, R2 the BDR, and R1 is neither, which OSPF calls DROTHER.", "badges": {"R3": "DR", "R2": "BDR", "R1": "DROTHER"}, "out": ["08_R1_first", "09_R2_first", "10_R3_first"]}, {"t": "R1 gets priority 100", "text": "R1 now has the highest priority on the segment, and nothing changes. The election is not repeated while the DR is alive.", "badges": {"R3": "DR", "R2": "BDR", "R1": "DROTHER, priority 100"}, "out": ["11_R1_priority", "12_R3_sees"]}, {"t": "The DR leaves", "text": "R3 is taken off the segment. Forty seconds later the others declare it dead. R2, the BDR, moves up to DR. R1 and its priority of 100 only win the empty BDR seat.", "down": ["R3-HUB"], "badges": {"R2": "DR", "R1": "BDR"}, "out": ["13_R3_drfails", "14_R2_promoted", "15_R1_bdr"]}, {"t": "The old DR returns", "text": "R3 comes back with the highest router ID and finds both seats taken. It becomes a DROTHER.", "badges": {"R2": "DR", "R1": "BDR", "R3": "DROTHER"}, "out": ["16_R3_return"]}, {"t": "The DR steps down", "text": "R2 is given priority 0, which means never DR and never BDR. It gives up the role at once. R1 moves up from BDR to DR, and R3 takes the BDR seat.", "badges": {"R1": "DR", "R3": "BDR", "R2": "DROTHER, priority 0"}, "out": ["17_R2_zero", "18_R1_final", "19_R3_final"]}], "folder": "ccna-l23-dr-election", "beyond": null, "devices": 3, "cml": true, "steps": [{"id": "01_R1_base", "dev": "R1", "title": "R1: starting configuration (the LAN interface stays shut until all three routers are ready)", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R1\nR1(config)#no ip domain-lookup\nR1(config)#interface Loopback0\nR1(config-if)# ip address 1.1.1.1 255.255.255.255\nR1(config-if)#interface Ethernet0/0\nR1(config-if)# description Shared segment at the Hub\nR1(config-if)# ip address 10.0.123.1 255.255.255.0\nR1(config-if)# shutdown\nR1(config-if)#\n*Oct  6 10:43:56.094: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR1(config-if)#router ospf 1\nR1(config-router)# router-id 1.1.1.1\nR1(config-router)# network 1.1.1.1 0.0.0.0 area 0\nR1(config-router)# network 10.0.123.0 0.0.0.255 area 0\nR1(config-router)#end\nR1#"}, {"id": "02_R2_base", "dev": "R2", "title": "R2: starting configuration (the LAN interface stays shut until all three routers are ready)", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R2\nR2(config)#no ip domain-lookup\nR2(config)#interface Loopback0\nR2(config-if)# ip address 2.2.2.2 255.255.255.255\nR2(config-if)#interface Ethernet0/0\nR2(config-if)# description Shared segment at the Hub\nR2(config-if)# ip address 10.0.123.2 255.255.255.0\nR2(config-if)#\n*Oct  6 10:44:16.672: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR2(config-if)# shutdown\nR2(config-if)#router ospf 1\nR2(config-router)# router-id 2.2.2.2\nR2(config-router)# network 2.2.2.2 0.0.0.0 area 0\nR2(config-router)# network 10.0.123.0 0.0.0.255 area 0\nR2(config-router)#end\nR2#"}, {"id": "03_R3_base", "dev": "R3", "title": "R3: starting configuration (the LAN interface stays shut until all three routers are ready)", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R3\nR3(config)#no ip domain-lookup\nR3(config)#interface Loopback0\nR3(config-if)# ip address 3.3.3.3 255.255.255.255\nR3(config-if)#interface Ethernet0/0\nR3(config-if)# description Shared segment at the Hub\nR3(config-if)# ip address 10.0.123.3 255.255.255.0\nR3(config-if)#\n*Oct  6 10:44:37.656: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR3(config-if)# shutdown\nR3(config-if)#router ospf 1\nR3(config-router)# router-id 3.3.3.3\nR3(config-router)# network 3.3.3.3 0.0.0.0 area 0\nR3(config-router)# network 10.0.123.0 0.0.0.255 area 0\nR3(config-router)#end\nR3#"}, {"id": "04_R1_up", "dev": "R1", "title": "R1: the interface comes up", "text": "R1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#interface Ethernet0/0\nR1(config-if)# no shutdown\nR1(config-if)#end\nR1#"}, {"id": "05_R2_up", "dev": "R2", "title": "R2: the interface comes up", "text": "R2#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR2(config)#interface Ethernet0/0\nR2(config-if)# no shutdown\nR2(config-if)#end\nR2#"}, {"id": "06_R3_up", "dev": "R3", "title": "R3: the interface comes up", "text": "R3#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR3(config)#interface Ethernet0/0\nR3(config-if)# no shutdown\nR3(config-if)#end\nR3#"}, {"id": "08_R1_first", "dev": "R1", "title": "R1: the first election", "text": "R1#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n2.2.2.2           1   FULL/BDR        00:00:35    10.0.123.2      Ethernet0/0\n3.3.3.3           1   FULL/DR         00:00:37    10.0.123.3      Ethernet0/0\nR1#show ip ospf interface Ethernet0/0\nEthernet0/0 is up, line protocol is up \n  Internet Address 10.0.123.1/24, Area 0, Attached via Network Statement\n  Process ID 1, Router ID 1.1.1.1, Network Type BROADCAST, Cost: 10\n  Topology-MTID    Cost    Disabled    Shutdown      Topology Name\n        0           10        no          no            Base\n  Transmit Delay is 1 sec, State DROTHER, Priority 1\n  Designated Router (ID) 3.3.3.3, Interface address 10.0.123.3\n  Backup Designated router (ID) 2.2.2.2, Interface address 10.0.123.2\n  Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5\n    oob-resync timeout 40\n    Hello due in 00:00:00\n  Supports Link-local Signaling (LLS)\n  Cisco NSF helper support enabled\n  IETF NSF helper support enabled\n  Index 2/2, flood queue length 0\n  Next 0x0(0)/0x0(0)\n  Last flood scan length is 1, maximum is 1\n  Last flood scan time is 0 msec, maximum is 0 msec\n  Neighbor Count is 2, Adjacent neighbor count is 2 \n    Adjacent with neighbor 2.2.2.2  (Backup Designated Router)\n    Adjacent with neighbor 3.3.3.3  (Designated Router)\n  Suppress hello for 0 neighbor(s)\nR1#"}, {"id": "09_R2_first", "dev": "R2", "title": "R2: the first election", "text": "R2#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1           1   FULL/DROTHER    00:00:38    10.0.123.1      Ethernet0/0\n3.3.3.3           1   FULL/DR         00:00:35    10.0.123.3      Ethernet0/0\nR2#show ip ospf interface Ethernet0/0 | include State|Designated\n  Internet Address 10.0.123.2/24, Area 0, Attached via Network Statement\n  Transmit Delay is 1 sec, State BDR, Priority 1\n  Designated Router (ID) 3.3.3.3, Interface address 10.0.123.3\n  Backup Designated router (ID) 2.2.2.2, Interface address 10.0.123.2\n    Adjacent with neighbor 3.3.3.3  (Designated Router)\nR2#"}, {"id": "10_R3_first", "dev": "R3", "title": "R3: the first election", "text": "R3#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1           1   FULL/DROTHER    00:00:36    10.0.123.1      Ethernet0/0\n2.2.2.2           1   FULL/BDR        00:00:31    10.0.123.2      Ethernet0/0\nR3#show ip ospf interface Ethernet0/0 | include State|Designated\n  Internet Address 10.0.123.3/24, Area 0, Attached via Network Statement\n  Transmit Delay is 1 sec, State DR, Priority 1\n  Designated Router (ID) 3.3.3.3, Interface address 10.0.123.3\n  Backup Designated router (ID) 2.2.2.2, Interface address 10.0.123.2\n    Adjacent with neighbor 2.2.2.2  (Backup Designated Router)\nR3#"}, {"id": "11_R1_priority", "dev": "R1", "title": "R1: priority raised to 100", "text": "R1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#interface Ethernet0/0\nR1(config-if)# ip ospf priority 100\nR1(config-if)#end\nR1#\n*Oct  6 10:45:59.832: %SYS-5-CONFIG_I: Configured from console by console\nR1#show ip ospf interface Ethernet0/0 | include State|Designated\n  Internet Address 10.0.123.1/24, Area 0, Attached via Network Statement\n  Transmit Delay is 1 sec, State DROTHER, Priority 100\n  Designated Router (ID) 3.3.3.3, Interface address 10.0.123.3\n  Backup Designated router (ID) 2.2.2.2, Interface address 10.0.123.2\n    Adjacent with neighbor 2.2.2.2  (Backup Designated Router)\n    Adjacent with neighbor 3.3.3.3  (Designated Router)\nR1#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n2.2.2.2           1   FULL/BDR        00:00:30    10.0.123.2      Ethernet0/0\n3.3.3.3           1   FULL/DR         00:00:32    10.0.123.3      Ethernet0/0\nR1#"}, {"id": "12_R3_sees", "dev": "R3", "title": "R3: what the DR sees after R1 raised its priority", "text": "R3#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1         100   FULL/DROTHER    00:00:33    10.0.123.1      Ethernet0/0\n2.2.2.2           1   FULL/BDR        00:00:38    10.0.123.2      Ethernet0/0\nR3#"}, {"id": "13_R3_drfails", "dev": "R3", "title": "R3: the DR leaves the segment", "text": "R3#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR3(config)#interface Ethernet0/0\nR3(config-if)# shutdown\nR3(config-if)#end\nR3#"}, {"id": "14_R2_promoted", "dev": "R2", "title": "R2: the DR is gone", "text": "*Oct  6 10:47:07.337: %OSPF-5-ADJCHG: Process 1, Nbr 3.3.3.3 on Ethernet0/0 from FULL to DOWN, Neighbor Down: Dead timer expired\nR2#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1         100   FULL/BDR        00:00:39    10.0.123.1      Ethernet0/0\nR2#show ip ospf interface Ethernet0/0 | include State|Designated\n  Internet Address 10.0.123.2/24, Area 0, Attached via Network Statement\n  Transmit Delay is 1 sec, State DR, Priority 1\n  Designated Router (ID) 2.2.2.2, Interface address 10.0.123.2\n  Backup Designated router (ID) 1.1.1.1, Interface address 10.0.123.1\n    Adjacent with neighbor 1.1.1.1  (Backup Designated Router)\nR2#"}, {"id": "15_R1_bdr", "dev": "R1", "title": "R1: priority 100, and still not the DR", "text": "R1#show ip ospf interface Ethernet0/0 | include State|Designated\n  Internet Address 10.0.123.1/24, Area 0, Attached via Network Statement\n  Transmit Delay is 1 sec, State BDR, Priority 100\n  Designated Router (ID) 2.2.2.2, Interface address 10.0.123.2\n  Backup Designated router (ID) 1.1.1.1, Interface address 10.0.123.1\n    Adjacent with neighbor 2.2.2.2  (Designated Router)\nR1#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n2.2.2.2           1   FULL/DR         00:00:34    10.0.123.2      Ethernet0/0\nR1#"}, {"id": "16_R3_return", "dev": "R3", "title": "R3: the old DR comes back", "text": "R3#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR3(config)#interface Ethernet0/0\nR3(config-if)# no shutdown\nR3(config-if)#end\nR3#\n*Oct  6 10:47:23.419: %SYS-5-CONFIG_I: Configured from console by console\nR3#\n*Oct  6 10:47:24.923: %LINK-3-UPDOWN: Interface Ethernet0/0, changed state to up\n*Oct  6 10:47:25.927: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/0, changed state to up\nR3#\n*Oct  6 10:47:30.437: %OSPF-5-ADJCHG: Process 1, Nbr 1.1.1.1 on Ethernet0/0 from LOADING to FULL, Loading Done\n*Oct  6 10:47:30.837: %OSPF-5-ADJCHG: Process 1, Nbr 2.2.2.2 on Ethernet0/0 from LOADING to FULL, Loading Done\nR3#show ip ospf interface Ethernet0/0 | include State|Designated\n  Internet Address 10.0.123.3/24, Area 0, Attached via Network Statement\n  Transmit Delay is 1 sec, State DROTHER, Priority 1\n  Designated Router (ID) 2.2.2.2, Interface address 10.0.123.2\n  Backup Designated router (ID) 1.1.1.1, Interface address 10.0.123.1\n    Adjacent with neighbor 1.1.1.1  (Backup Designated Router)\n    Adjacent with neighbor 2.2.2.2  (Designated Router)\nR3#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1         100   FULL/BDR        00:00:36    10.0.123.1      Ethernet0/0\n2.2.2.2           1   FULL/DR         00:00:31    10.0.123.2      Ethernet0/0\nR3#"}, {"id": "17_R2_zero", "dev": "R2", "title": "R2: priority set to 0 while it is the DR", "text": "R2#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR2(config)#interface Ethernet0/0\nR2(config-if)# ip ospf priority 0\nR2(config-if)#end\nR2#\n*Oct  6 10:48:22.499: %SYS-5-CONFIG_I: Configured from console by console\nR2#\n*Oct  6 10:48:34.414: %OSPF-5-ADJCHG: Process 1, Nbr 3.3.3.3 on Ethernet0/0 from LOADING to FULL, Loading Done\nR2#show ip ospf interface Ethernet0/0 | include State|Designated\n  Internet Address 10.0.123.2/24, Area 0, Attached via Network Statement\n  Transmit Delay is 1 sec, State DROTHER, Priority 0\n  Designated Router (ID) 1.1.1.1, Interface address 10.0.123.1\n  Backup Designated router (ID) 3.3.3.3, Interface address 10.0.123.3\n    Adjacent with neighbor 1.1.1.1  (Designated Router)\n    Adjacent with neighbor 3.3.3.3  (Backup Designated Router)\nR2#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1         100   FULL/DR         00:00:30    10.0.123.1      Ethernet0/0\n3.3.3.3           1   FULL/BDR        00:00:38    10.0.123.3      Ethernet0/0\nR2#"}, {"id": "18_R1_final", "dev": "R1", "title": "R1: after R2 stepped down", "text": "R1#show ip ospf interface Ethernet0/0 | include State|Designated\n  Internet Address 10.0.123.1/24, Area 0, Attached via Network Statement\n  Transmit Delay is 1 sec, State DR, Priority 100\n  Designated Router (ID) 1.1.1.1, Interface address 10.0.123.1\n  Backup Designated router (ID) 3.3.3.3, Interface address 10.0.123.3\n    Adjacent with neighbor 3.3.3.3  (Backup Designated Router)\nR1#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n2.2.2.2           0   FULL/DROTHER    00:00:33    10.0.123.2      Ethernet0/0\n3.3.3.3           1   FULL/BDR        00:00:36    10.0.123.3      Ethernet0/0\nR1#"}, {"id": "19_R3_final", "dev": "R3", "title": "R3: after R2 stepped down", "text": "R3#show ip ospf interface Ethernet0/0 | include State|Designated\n  Internet Address 10.0.123.3/24, Area 0, Attached via Network Statement\n  Transmit Delay is 1 sec, State BDR, Priority 1\n  Designated Router (ID) 1.1.1.1, Interface address 10.0.123.1\n  Backup Designated router (ID) 3.3.3.3, Interface address 10.0.123.3\n    Adjacent with neighbor 1.1.1.1  (Designated Router)\nR3#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1         100   FULL/DR         00:00:36    10.0.123.1      Ethernet0/0\n2.2.2.2           0   FULL/DROTHER    00:00:31    10.0.123.2      Ethernet0/0\nR3#"}, {"id": "20_R1_config", "dev": "R1", "title": "final configuration", "text": "R1#show running-config | section interface Ethernet0/0|router ospf\ninterface Ethernet0/0\n description Shared segment at the Hub\n ip address 10.0.123.1 255.255.255.0\n ip ospf priority 100\nrouter ospf 1\n router-id 1.1.1.1\n network 1.1.1.1 0.0.0.0 area 0\n network 10.0.123.0 0.0.0.255 area 0\nR1#"}, {"id": "20_R2_config", "dev": "R2", "title": "final configuration", "text": "R2#show running-config | section interface Ethernet0/0|router ospf\ninterface Ethernet0/0\n description Shared segment at the Hub\n ip address 10.0.123.2 255.255.255.0\n ip ospf priority 0\nrouter ospf 1\n router-id 2.2.2.2\n network 2.2.2.2 0.0.0.0 area 0\n network 10.0.123.0 0.0.0.255 area 0\nR2#"}, {"id": "20_R3_config", "dev": "R3", "title": "final configuration", "text": "R3#show running-config | section interface Ethernet0/0|router ospf\ninterface Ethernet0/0\n description Shared segment at the Hub\n ip address 10.0.123.3 255.255.255.0\nrouter ospf 1\n router-id 3.3.3.3\n network 3.3.3.3 0.0.0.0 area 0\n network 10.0.123.0 0.0.0.255 area 0\nR3#"}]}, {"id": "L24", "week": 6, "title": "Neighbour stuck: four tickets", "kind": "ticket", "mins": 45, "story": "Four tickets, one symptom: \"no OSPF neighbour\". Each has a different cause. You learn the checklist that finds any of them in under five commands.", "tasks": ["Ticket 1: R1 has lost R2.", "Ticket 2: R2 has lost R3, on the broadcast link.", "Ticket 3: R3 has lost R1.", "Ticket 4: R1 and R3 again, with a strange message in the log.", "For each one: find the cause, prove it with output, fix it."], "twist": "Each fault leaves a different fingerprint, and not always on the router that raised the ticket. Twice the answer is on the other end of the link.", "play": "Each ticket marks the suspect link in amber and shows the real output. Decide on the cause before you reveal it.", "checks": ["Name the settings that must match on both ends before two OSPF routers become neighbours.", "Which command shows the area and the timers of an interface?", "Which interface setting stops hellos being sent at all?"], "cmds": ["show ip ospf neighbor", "show ip ospf interface brief", "show ip ospf interface Ethernet0/1", "show ip protocols", "debug ip ospf hello", "undebug all", "show ip ospf | include ID", "clear ip ospf process"], "topics": ["3.4"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 270, "y": 350, "label": "R1", "sub": ["Lo0 1.1.1.1"], "site": "HQ"}, {"id": "R2", "kind": "router", "x": 500, "y": 120, "label": "R2", "sub": ["Lo0 2.2.2.2"], "site": "Hub"}, {"id": "R3", "kind": "router", "x": 730, "y": 350, "label": "R3", "sub": ["Lo0 3.3.3.3"], "site": "Depot"}], "links": [{"a": "R1", "ai": "e0/0", "aip": "10.0.12.1", "b": "R2", "bi": "e0/0", "bip": "10.0.12.2", "net": "10.0.12.0/30", "kind": "eth", "label": null}, {"a": "R2", "ai": "e0/1", "aip": "10.0.23.1", "b": "R3", "bi": "e0/0", "bip": "10.0.23.2", "net": "10.0.23.0/30", "kind": "eth", "label": null}, {"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth", "label": null}], "notes": [], "h": 500}, "images": ["Cisco IOL router"], "runs": "eve", "needs": "The lab starts from the working network of lab L22. The faults are planted one at a time, and each is fixed before the next.", "status": "performed", "scenes": [{"t": "Ticket 1", "text": "R1 has lost R2. Its log says only that the dead timer expired.", "warn": ["R1-R2"], "out": ["07_R1_ticket1"]}, {"t": "Ticket 1: the cause", "hidden": "Reveal ticket 1", "text": "The answer is on the other router. R2's log names the cause about every ten seconds: a hello from the backbone area arrives on an interface that R2 has in area 1. The Area column of \"show ip ospf interface brief\" shows it on both ends.", "warn": ["R1-R2"], "badges": {"R2": "e0/0 in area 1"}, "out": ["07_R2_ownlog", "08_R2_ticket1"]}, {"t": "Ticket 2", "text": "R2 has lost R3, and yet it can ping it.", "warn": ["R2-R3"], "out": ["10_R2_ticket2"]}, {"t": "Ticket 2: the cause", "hidden": "Reveal ticket 2", "text": "The debug line says it: the hello from R3 carries mask 255.255.255.0, and R2 is configured with 255.255.255.252. On a broadcast link the masks must match. The ping works because both addresses are still on the link.", "warn": ["R2-R3"], "badges": {"R3": "mask /24"}, "out": ["11_R3_ticket2"]}, {"t": "Ticket 3", "text": "R3 has lost R1. Its debug shows hellos going out on the link to R1, and none coming back.", "warn": ["R1-R3"], "out": ["13_R3_ticket3"]}, {"t": "Ticket 3: the cause", "hidden": "Reveal ticket 3", "text": "On R1 the interface is passive: \"No Hellos (Passive interface)\". A passive interface still advertises its network, but it never sends a hello, so it never forms a neighbour.", "warn": ["R1-R3"], "badges": {"R1": "e0/1 passive"}, "out": ["14_R1_ticket3"]}, {"t": "Ticket 4", "text": "R1 logs a duplicate router ID, then drops R3. R2 now lists two neighbours that both call themselves 1.1.1.1.", "warn": ["R1-R3"], "out": ["16_R1_ticket4", "17_R2_ticket4"]}, {"t": "Ticket 4: the cause", "hidden": "Reveal ticket 4", "text": "R3 was given the router ID 1.1.1.1, which belongs to R1. A changed router ID takes effect only when the OSPF process is cleared, both when the fault went in and when it is taken out.", "warn": ["R1-R3"], "badges": {"R3": "router ID 1.1.1.1"}, "out": ["18_R3_ticket4", "19_R1_final"]}], "folder": "ccna-l24-ospf-tickets", "beyond": null, "devices": 3, "cml": true, "steps": [{"id": "01_R1_base", "dev": "R1", "title": "R1: starting configuration: the working network of lab L22", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R1\nR1(config)#no ip domain-lookup\nR1(config)#interface Loopback0\nR1(config-if)# ip address 1.1.1.1 255.255.255.255\nR1(config-if)#interface Ethernet0/0\nR1(config-if)# description Link to R2\nR1(config-if)# ip address 10.0.12.1 255.255.255.252\nR1(config-if)# ip ospf network point-to-point\nR1(config-if)#\n*Oct  6 10:43:56.097: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR1(config-if)# no shutdown\nR1(config-if)#interface Ethernet0/1\nR1(config-if)# description Link to R3\nR1(config-if)# ip address 10.0.13.1 255.255.255.252\nR1(config-if)# ip ospf network point-to-point\nR1(config-if)# no shutdown\nR1(config-if)#interface Ethernet0/2\nR1(config-if)# description LAN A\nR1(config-if)#\n*Oct  6 10:44:00.315: %LINK-3-UPDOWN: Interface Ethernet0/0, changed state to up\n*Oct  6 10:44:01.315: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/0, changed state to up\nR1(config-if)# ip address 192.168.1.1 255.255.255.0\nR1(config-if)# no shutdown\nR1(config-if)#router ospf 1\nR1(config-router)# router-id 1.1.1.1\nR1(config-router)#\n*Oct  6 10:44:02.827: %LINK-3-UPDOWN: Interface Ethernet0/1, changed state to up\n*Oct  6 10:44:03.828: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/1, changed state to up\nR1(config-router)# passive-interface Ethernet0/2\nR1(config-router)# network 1.1.1.1 0.0.0.0 area 0\nR1(config-router)# network 10.0.12.0 0.0.0.3 area 0\nR1(config-router)# network 10.0.13.0 0.0.0.3 area 0\nR1(config-router)#\n*Oct  6 10:44:04.835: %LINK-3-UPDOWN: Interface Ethernet0/2, changed state to up\n*Oct  6 10:44:05.839: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/2, changed state to up\nR1(config-router)# network 192.168.1.0 0.0.0.255 area 0\nR1(config-router)#end\nR1#"}, {"id": "02_R2_base", "dev": "R2", "title": "R2: starting configuration: the working network of lab L22", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R2\nR2(config)#no ip domain-lookup\nR2(config)#interface Loopback0\nR2(config-if)# ip address 2.2.2.2 255.255.255.255\nR2(config-if)#interface Ethernet0/0\nR2(config-if)# description Link to R1\nR2(config-if)# ip address 10.0.12.2 255.255.255.252\nR2(config-if)#\n*Oct  6 10:44:25.926: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR2(config-if)# ip ospf network point-to-point\nR2(config-if)# no shutdown\nR2(config-if)#interface Ethernet0/1\nR2(config-if)# description Link to R3\nR2(config-if)# ip address 10.0.23.1 255.255.255.252\nR2(config-if)# no shutdown\nR2(config-if)#router ospf 1\nR2(config-router)# router-id 2.2.2.2\nR2(config-router)# network 2.2.2.2 0.0.0.0 area 0\nR2(config-router)# network 10.0.12.0 0.0.0.3 area 0\nR2(config-router)#\n*Oct  6 10:44:29.937: %LINK-3-UPDOWN: Interface Ethernet0/0, changed state to up\n*Oct  6 10:44:30.937: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/0, changed state to up\nR2(config-router)# network 10.0.23.0 0.0.0.3 area 0\nR2(config-router)#end\nR2#"}, {"id": "03_R3_base", "dev": "R3", "title": "R3: starting configuration: the working network of lab L22", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R3\nR3(config)#no ip domain-lookup\nR3(config)#interface Loopback0\nR3(config-if)# ip address 3.3.3.3 255.255.255.255\nR3(config-if)#interface Ethernet0/0\nR3(config-if)# description Link to R2\nR3(config-if)# ip address 10.0.23.2 255.255.255.252\nR3(config-if)# no shutdown\nR3(config-if)#\n*Oct  6 10:44:56.542: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR3(config-if)#interface Ethernet0/1\nR3(config-if)# description Link to R1\nR3(config-if)# ip address 10.0.13.2 255.255.255.252\nR3(config-if)# ip ospf network point-to-point\nR3(config-if)# no shutdown\nR3(config-if)#interface Ethernet0/2\nR3(config-if)#\n*Oct  6 10:45:00.054: %LINK-3-UPDOWN: Interface Ethernet0/0, changed state to up\n*Oct  6 10:45:01.059: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/0, changed state to up\nR3(config-if)# description LAN B\nR3(config-if)# ip address 192.168.3.1 255.255.255.0\nR3(config-if)# no shutdown\nR3(config-if)#router ospf 1\nR3(config-router)# router-id 3.3.3.3\nR3(config-router)# passive-interface Ethernet0/2\nR3(config-router)#\n*Oct  6 10:45:02.670: %LINK-3-UPDOWN: Interface Ethernet0/1, changed state to up\n*Oct  6 10:45:03.674: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/1, changed state to up\nR3(config-router)# network 3.3.3.3 0.0.0.0 area 0\nR3(config-router)# network 10.0.23.0 0.0.0.3 area 0\nR3(config-router)# network 10.0.13.0 0.0.0.3 area 0\nR3(config-router)# network 192.168.3.0 0.0.0.255 area 0\nR3(config-router)#\n*Oct  6 10:45:04.677: %LINK-3-UPDOWN: Interface Ethernet0/2, changed state to up\n*Oct  6 10:45:05.682: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/2, changed state to up\nR3(config-router)#end\nR3#"}, {"id": "05_R1_healthy", "dev": "R1", "title": "R1: the healthy network", "text": "R1#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n3.3.3.3           0   FULL/  -        00:00:39    10.0.13.2       Ethernet0/1\n2.2.2.2           0   FULL/  -        00:00:34    10.0.12.2       Ethernet0/0\nR1#show ip route ospf | begin Gateway\nGateway of last resort is not set\n\n      2.0.0.0/32 is subnetted, 1 subnets\nO        2.2.2.2 [110/11] via 10.0.12.2, 00:01:25, Ethernet0/0\n      3.0.0.0/32 is subnetted, 1 subnets\nO        3.3.3.3 [110/11] via 10.0.13.2, 00:00:47, Ethernet0/1\n      10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks\nO        10.0.23.0/30 [110/20] via 10.0.13.2, 00:00:47, Ethernet0/1\n                      [110/20] via 10.0.12.2, 00:00:14, Ethernet0/0\nO     192.168.3.0/24 [110/20] via 10.0.13.2, 00:00:47, Ethernet0/1\nR1#"}, {"id": "06_R2_fault1", "dev": "R2", "title": "R2: fault 1 planted", "text": "R2#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR2(config)#router ospf 1\nR2(config-router)# no network 10.0.12.0 0.0.0.3 area 0\nR2(config-router)# network 10.0.12.0 0.0.0.3 area 1\nR2(config-router)#\n*Oct  6 10:51:57.153: %OSPF-5-ADJCHG: Process 1, Nbr 1.1.1.1 on Ethernet0/0 from FULL to DOWN, Neighbor Down: Interface down or detached\nR2(config-router)#end\nR2#"}, {"id": "07_R1_ticket1", "dev": "R1", "title": "R1: ticket 1 - no neighbour on the link to R2", "text": "*Oct  6 10:52:34.631: %OSPF-5-ADJCHG: Process 1, Nbr 2.2.2.2 on Ethernet0/0 from FULL to DOWN, Neighbor Down: Dead timer expired\nR1#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n3.3.3.3           0   FULL/  -        00:00:38    10.0.13.2       Ethernet0/1\nR1#show ip ospf interface brief\nInterface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C\nLo0          1     0               1.1.1.1/32         1     LOOP  0/0\nEt0/1        1     0               10.0.13.1/30       10    P2P   1/1\nEt0/2        1     0               192.168.1.1/24     10    DR    0/0\nEt0/0        1     0               10.0.12.1/30       10    P2P   0/0\nR1#"}, {"id": "07_R2_ownlog", "dev": "R2", "title": "R2: its own console while the fault is in place", "text": "*Oct  6 10:51:58.254: %SYS-5-CONFIG_I: Configured from console by console\nR2#\n*Oct  6 10:52:02.665: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\nR2#show logging | include ERRRCV|OSPF-4\n*Oct  6 10:46:06.777: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\n*Oct  6 10:46:11.785: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\n*Oct  6 10:46:18.289: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\n*Oct  6 10:46:26.362: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\n*Oct  6 10:46:35.903: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\n*Oct  6 10:46:46.466: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\n*Oct  6 10:46:55.515: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\n*Oct  6 10:47:04.724: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\n*Oct  6 10:47:13.775: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\n*Oct  6 10:47:22.884: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\n*Oct  6 10:47:32.184: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\n*Oct  6 10:51:57.656: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\n*Oct  6 10:52:02.665: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\nR2#"}, {"id": "08_R2_ticket1", "dev": "R2", "title": "R2: the other end of the link, and the fix", "text": "*Oct  6 10:52:48.101: %OSPF-4-ERRRCV: Received invalid packet: mismatched area ID from backbone area from 10.0.12.1, Ethernet0/0\nR2#show ip ospf interface brief\nInterface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C\nLo0          1     0               2.2.2.2/32         1     LOOP  0/0\nEt0/1        1     0               10.0.23.1/30       10    DR    1/1\nEt0/0        1     1               10.0.12.2/30       10    P2P   0/0\nR2#show running-config | section router ospf\nrouter ospf 1\n router-id 2.2.2.2\n network 2.2.2.2 0.0.0.0 area 0\n network 10.0.12.0 0.0.0.3 area 1\n network 10.0.23.0 0.0.0.3 area 0\nR2#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR2(config)#router ospf 1\nR2(config-router)# no network 10.0.12.0 0.0.0.3 area 1\nR2(config-router)# network 10.0.12.0 0.0.0.3 area 0\nR2(config-router)#\n*Oct  6 10:52:56.089: %OSPF-5-ADJCHG: Process 1, Nbr 1.1.1.1 on Ethernet0/0 from LOADING to FULL, Loading Done\nR2(config-router)#end\nR2#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1           0   FULL/  -        00:00:38    10.0.12.1       Ethernet0/0\n3.3.3.3           1   FULL/BDR        00:00:38    10.0.23.2       Ethernet0/1\nR2#"}, {"id": "09_R3_fault2", "dev": "R3", "title": "R3: fault 2 planted", "text": "R3#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR3(config)#interface Ethernet0/0\nR3(config-if)# ip address 10.0.23.2 255.255.255.0\nR3(config-if)#end\nR3#"}, {"id": "10_R2_ticket2", "dev": "R2", "title": "R2: ticket 2 - no neighbour on the link to R3", "text": "*Oct  6 10:48:19.306: %OSPF-5-ADJCHG: Process 1, Nbr 3.3.3.3 on Ethernet0/1 from FULL to DOWN, Neighbor Down: Dead timer expired\nR2#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1           0   FULL/  -        00:00:38    10.0.12.1       Ethernet0/0\nR2#ping 10.0.23.2\nType escape sequence to abort.\nSending 5, 100-byte ICMP Echos to 10.0.23.2, timeout is 2 seconds:\n.!!!!\nSuccess rate is 80 percent (4/5), round-trip min/avg/max = 1/1/1 ms\nR2#debug ip ospf hello\nOSPF hello debugging is on\nR2#\n*Oct  6 10:48:24.860: OSPF-1 HELLO Et0/0: Send hello to 224.0.0.5 area 0 from 10.0.12.2\nR2#\n*Oct  6 10:48:28.961: OSPF-1 HELLO Et0/1: Rcv hello from 3.3.3.3 area 0 10.0.23.2\n*Oct  6 10:48:28.961: OSPF-1 HELLO Et0/1: Mismatched hello parameters from 10.0.23.2\n*Oct  6 10:48:28.961: OSPF-1 HELLO Et0/1: Dead R 40 C 40, Hello R 10 C 10 Mask R 255.255.255.0 C 255.255.255.252\n*Oct  6 10:48:29.606: OSPF-1 HELLO Et0/0: Rcv hello from 1.1.1.1 area 0 10.0.12.1\nR2#undebug all\nAll possible debugging has been turned off\nR2#\n*Oct  6 10:48:31.306: OSPF-1 HELLO Et0/1: Send hello to 224.0.0.5 area 0 from 10.0.23.1\nR2#"}, {"id": "11_R3_ticket2", "dev": "R3", "title": "R3: the other end of the link, and the fix", "text": "R3#show ip interface Ethernet0/0 | include Internet address\n  Internet address is 10.0.23.2/24\nR3#show ip ospf interface Ethernet0/0 | include Internet Address\n  Internet Address 10.0.23.2/24, Area 0, Attached via Network Statement\nR3#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR3(config)#interface Ethernet0/0\nR3(config-if)# ip address 10.0.23.2 255.255.255.252\nR3(config-if)#\n*Oct  6 10:48:41.110: %OSPF-5-ADJCHG: Process 1, Nbr 2.2.2.2 on Ethernet0/0 from LOADING to FULL, Loading Done\nR3(config-if)#end\nR3#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n2.2.2.2           1   FULL/DR         00:00:38    10.0.23.1       Ethernet0/0\n1.1.1.1           0   FULL/  -        00:00:38    10.0.13.1       Ethernet0/1\nR3#"}, {"id": "12_R1_fault3", "dev": "R1", "title": "R1: fault 3 planted", "text": "R1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#router ospf 1\nR1(config-router)# passive-interface Ethernet0/1\nR1(config-router)#end\nR1#"}, {"id": "13_R3_ticket3", "dev": "R3", "title": "R3: ticket 3 - no neighbour on the link to R1", "text": "*Oct  6 10:49:24.460: %OSPF-5-ADJCHG: Process 1, Nbr 1.1.1.1 on Ethernet0/1 from FULL to DOWN, Neighbor Down: Dead timer expired\nR3#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n2.2.2.2           1   FULL/DR         00:00:32    10.0.23.1       Ethernet0/0\nR3#debug ip ospf hello\nOSPF hello debugging is on\nR3#\n*Oct  6 10:49:29.233: OSPF-1 HELLO Et0/0: Rcv hello from 2.2.2.2 area 0 10.0.23.1\nR3#\n*Oct  6 10:49:32.309: OSPF-1 HELLO Et0/1: Send hello to 224.0.0.5 area 0 from 10.0.13.2\nR3#\n*Oct  6 10:49:33.813: OSPF-1 HELLO Et0/0: Send hello to 224.0.0.5 area 0 from 10.0.23.2\nR3#\n*Oct  6 10:49:39.128: OSPF-1 HELLO Et0/0: Rcv hello from 2.2.2.2 area 0 10.0.23.1\nR3#\n*Oct  6 10:49:41.652: OSPF-1 HELLO Et0/1: Send hello to 224.0.0.5 area 0 from 10.0.13.2\nR3#\n*Oct  6 10:49:43.796: OSPF-1 HELLO Et0/0: Send hello to 224.0.0.5 area 0 from 10.0.23.2\nR3#\n*Oct  6 10:49:48.395: OSPF-1 HELLO Et0/0: Rcv hello from 2.2.2.2 area 0 10.0.23.1\nR3#\n*Oct  6 10:49:51.287: OSPF-1 HELLO Et0/1: Send hello to 224.0.0.5 area 0 from 10.0.13.2\nR3#undebug all\nAll possible debugging has been turned off\nR3#"}, {"id": "14_R1_ticket3", "dev": "R1", "title": "R1: the other end of the link, and the fix", "text": "R1#show ip ospf interface Ethernet0/1 | include line protocol|Hello|Passive\nEthernet0/1 is up, line protocol is up \n  Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5\n    No Hellos (Passive interface) \nR1#show ip protocols | begin Passive\n  Passive Interface(s):\n    Ethernet0/1\n    Ethernet0/2\n  Routing Information Sources:\n    Gateway         Distance      Last Update\n    3.3.3.3              110      00:01:02\n    2.2.2.2              110      00:01:30\n  Distance: (default is 110)\n\nR1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#router ospf 1\nR1(config-router)# no passive-interface Ethernet0/1\nR1(config-router)#\n*Oct  6 10:49:56.429: %OSPF-5-ADJCHG: Process 1, Nbr 3.3.3.3 on Ethernet0/1 from LOADING to FULL, Loading Done\nR1(config-router)#end\nR1#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n3.3.3.3           0   FULL/  -        00:00:39    10.0.13.2       Ethernet0/1\n2.2.2.2           0   FULL/  -        00:00:39    10.0.12.2       Ethernet0/0\nR1#"}, {"id": "15_R3_fault4", "dev": "R3", "title": "R3: fault 4 planted", "text": "R3#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR3(config)#router ospf 1\nR3(config-router)# router-id 1.1.1.1\n% OSPF: Reload or use \"clear ip ospf process\" command, for this to take effect\nR3(config-router)#end\nR3#clear ip ospf process\nReset ALL OSPF processes? [no]: \n*Oct  6 10:53:02.114: %SYS-5-CONFIG_I: Configured from console by console\nyes\nR3#"}, {"id": "16_R1_ticket4", "dev": "R1", "title": "R1: ticket 4 - R3 will not become a neighbour", "text": "*Oct  6 10:53:03.301: %OSPF-4-DUP_RTRID_NBR: OSPF detected duplicate router-id 1.1.1.1 from 10.0.13.2 on interface Ethernet0/1\nR1#\n*Oct  6 10:53:43.266: %OSPF-5-ADJCHG: Process 1, Nbr 3.3.3.3 on Ethernet0/1 from FULL to DOWN, Neighbor Down: Dead timer expired\nR1#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n2.2.2.2           0   FULL/  -        00:00:36    10.0.12.2       Ethernet0/0\nR1#"}, {"id": "17_R2_ticket4", "dev": "R2", "title": "R2: what the third router sees", "text": "R2#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1           0   FULL/  -        00:00:37    10.0.12.1       Ethernet0/0\n1.1.1.1           1   FULL/BDR        00:00:34    10.0.23.2       Ethernet0/1\nR2#"}, {"id": "18_R3_ticket4", "dev": "R3", "title": "R3: the cause, and the fix", "text": "R3#show ip ospf | include ID\n Routing Process \"ospf 1\" with ID 1.1.1.1\nR3#show running-config | section router ospf\nrouter ospf 1\n router-id 1.1.1.1\n passive-interface Ethernet0/2\n network 3.3.3.3 0.0.0.0 area 0\n network 10.0.13.0 0.0.0.3 area 0\n network 10.0.23.0 0.0.0.3 area 0\n network 192.168.3.0 0.0.0.255 area 0\nR3#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR3(config)#router ospf 1\nR3(config-router)# router-id 3.3.3.3\n% OSPF: Reload or use \"clear ip ospf process\" command, for this to take effect\nR3(config-router)#end\nR3#clear ip ospf process\nReset ALL OSPF processes? [no]: yes\nR3#\n*Oct  6 10:54:01.212: %SYS-5-CONFIG_I: Configured from console by console\nR3#\n*Oct  6 10:54:02.400: %OSPF-5-ADJCHG: Process 1, Nbr 2.2.2.2 on Ethernet0/0 from FULL to DOWN, Neighbor Down: Interface down or detached\n*Oct  6 10:54:02.403: %OSPF-5-ADJCHG: Process 1, Nbr 1.1.1.1 on Ethernet0/1 from LOADING to FULL, Loading Done\nR3#\n*Oct  6 10:54:42.406: %OSPF-5-ADJCHG: Process 1, Nbr 2.2.2.2 on Ethernet0/0 from LOADING to FULL, Loading Done\nR3#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n2.2.2.2           1   FULL/DR         00:00:36    10.0.23.1       Ethernet0/0\n1.1.1.1           0   FULL/  -        00:00:36    10.0.13.1       Ethernet0/1\nR3#"}, {"id": "19_R1_final", "dev": "R1", "title": "R1: all four tickets closed", "text": "R1#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n3.3.3.3           0   FULL/  -        00:00:36    10.0.13.2       Ethernet0/1\n2.2.2.2           0   FULL/  -        00:00:36    10.0.12.2       Ethernet0/0\nR1#show ip route ospf | begin Gateway\nGateway of last resort is not set\n\n      2.0.0.0/32 is subnetted, 1 subnets\nO        2.2.2.2 [110/11] via 10.0.12.2, 00:01:52, Ethernet0/0\n      3.0.0.0/32 is subnetted, 1 subnets\nO        3.3.3.3 [110/11] via 10.0.13.2, 00:00:54, Ethernet0/1\n      10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks\nO        10.0.23.0/30 [110/20] via 10.0.13.2, 00:00:15, Ethernet0/1\n                      [110/20] via 10.0.12.2, 00:01:52, Ethernet0/0\nO     192.168.3.0/24 [110/20] via 10.0.13.2, 00:00:54, Ethernet0/1\nR1#"}]}, {"id": "L25", "week": 6, "title": "Take the fast path", "kind": "change", "mins": 35, "story": "Traffic from HQ to the Depot takes the old 100 Mbps direct circuit, while a new 1 Gbps path through the Hub sits idle. To OSPF the two look the same. You teach it the difference without a single static route.", "tasks": ["Read the cost of each link and add up both paths.", "Set the real bandwidth of each circuit on its interfaces.", "Raise the reference bandwidth on every router and read the costs again.", "Check the new best path in the routing table and with a trace.", "Type a cost by hand on one interface and see it override the calculation."], "twist": "With default settings every link of 100 Mbps or faster costs 1. OSPF cannot tell fast from very fast until you change the reference bandwidth.", "play": "Step through the scenes. The path on the map moves as the costs change, and the real routing table is beside it.", "checks": ["How does OSPF calculate the cost of an interface?", "After the change, the route to LAN B has metric 1020. Which three interfaces add up to it?", "Why must the reference bandwidth be the same on every router?"], "cmds": ["bandwidth 1000000", "auto-cost reference-bandwidth 10000   (under router ospf)", "ip ospf cost 5", "show ip ospf interface brief", "show ip route 192.168.3.0", "show ip route ospf"], "topics": ["3.4", "3.2"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 270, "y": 350, "label": "R1", "sub": ["Lo0 1.1.1.1"], "site": "
