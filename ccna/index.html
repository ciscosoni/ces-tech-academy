<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231B2A4A'/%3E%3Cpath d='M14 46V18h36' fill='none' stroke='%234FA8D6' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='44' cy='42' r='7' fill='%234FA8D6'/%3E%3C/svg%3E">
<title>CCNA in Practice · CES Tech Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Kalam:wght@400;700&display=swap">
</head>
<body>

<style>
/* Layout: a programme guide. Navy masthead with six sections; each section is one column of content; a lab opens as a workspace with the map on the left and the brief on the right. Same tokens as the course pages (page.tmpl.html). */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --sunk:#E9EFF6;
  --ink:#1B2A4A; --text:#333333; --muted:#5A6880; --line:#D3DDE8;
  --navy:#1B2A4A; --on-navy:#FFFFFF; --on-navy-dim:#BFD9EC;
  --accent:#4FA8D6; --accent-ink:#1D6C9A; --accent-wash:#E6F2FA;
  --good:#1B7A4B; --good-wash:#E3F4EA; --bad:#B23A30; --bad-wash:#FBE9E7;
  --warn-ink:#6B4700; --warn-wash:#FFF3DC; --warn-line:#D98A00;
  --code-bg:#10203C; --code-ink:#E3EEF8;
  --sans:Carlito,Calibri,"Segoe UI",Candara,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --hand:Kalam,"Segoe Print","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1524; --surface:#152038; --sunk:#0F192C;
  --ink:#EAF1F8; --text:#CDD7E4; --muted:#93A3BA; --line:#2A3B5A;
  --navy:#111C33; --on-navy:#FFFFFF; --on-navy-dim:#A9C6DC;
  --accent:#4FA8D6; --accent-ink:#7FC4EA; --accent-wash:#18304A;
  --good:#5CC98F; --good-wash:#133324; --bad:#F08A80; --bad-wash:#3A1B18;
  --warn-ink:#F2CF8A; --warn-wash:#33280F; --warn-line:#D98A00;
  --code-bg:#0A1222; --code-ink:#DCE8F5; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#152038; --sunk:#0F192C;
  --ink:#EAF1F8; --text:#CDD7E4; --muted:#93A3BA; --line:#2A3B5A;
  --navy:#111C33; --on-navy:#FFFFFF; --on-navy-dim:#A9C6DC;
  --accent:#4FA8D6; --accent-ink:#7FC4EA; --accent-wash:#18304A;
  --good:#5CC98F; --good-wash:#133324; --bad:#F08A80; --bad-wash:#3A1B18;
  --warn-ink:#F2CF8A; --warn-wash:#33280F; --warn-line:#D98A00;
  --code-bg:#0A1222; --code-ink:#DCE8F5; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.5;margin:0}
h1,h2,h3,h4{color:var(--ink);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,1.3rem + 3vw,3.1rem)}
h2{font-size:clamp(1.4rem,1.2rem + .8vw,1.75rem)}
h3{font-size:1.15rem}
h4{font-size:1rem}
p{margin:0}
ul,ol{margin:0;padding-left:1.2em}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent-ink)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:.86em}

.top{background:var(--navy);color:var(--on-navy);border-bottom:4px solid var(--accent);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1200px;margin:0 auto;padding:10px 20px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 28px}
.brand{display:flex;flex-direction:column;padding-bottom:10px;color:var(--on-navy);text-decoration:none}
.brand b{font-size:1.3rem;letter-spacing:.01em}
.brand b span{font-weight:400;color:var(--on-navy-dim)}
.brand i{font-size:.78rem;color:var(--on-navy-dim)}
.nav{display:flex;gap:2px;overflow-x:auto;max-width:100%;margin-left:auto}
.nav a{color:var(--on-navy-dim);text-decoration:none;padding:9px 14px 11px;border-radius:8px 8px 0 0;white-space:nowrap;font-weight:700;font-size:.98rem}
.nav a:hover{color:var(--on-navy)}
.nav a[aria-current="page"]{background:var(--bg);color:var(--ink)}

main{max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:36px 90px}
section + section{margin-top:56px}
.lead{font-size:1.18rem;max-width:66ch;margin-top:12px}
.sec-h{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.sec-h p{max-width:70ch}

.hero{display:flex;flex-direction:column;gap:14px}
.hero .strap{font-family:var(--hand);font-size:clamp(1.25rem,1rem + 1vw,1.7rem);color:var(--accent-ink);line-height:1.2}
.hero .lede{font-size:1.2rem;max-width:64ch}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;list-style:none;padding:0;margin-top:6px}
.facts li{display:flex;flex-direction:column}
.facts b{font-size:1.7rem;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.facts span{font-size:.9rem;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:8px;padding:10px 18px;font-weight:700;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:6px 12px;font-size:.92rem}
:root[data-theme="dark"] .btn:not(.ghost){background:var(--accent);border-color:var(--accent);color:#0D1524}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn:not(.ghost){background:var(--accent);border-color:var(--accent);color:#0D1524} }

/* the map board */
.board{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#16264A}
.board-scroll{overflow-x:auto}
.board-scroll > div{min-width:760px}
.board-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:#101D3A;border-bottom:1px solid #26396A;color:#C5DCEF;font-size:.92rem}
.board-bar .grow{flex:1}
.chipbtn{background:#1F3463;border:1px solid #35507F;color:#EAF4FB;border-radius:18px;padding:5px 13px;font-size:.92rem;white-space:nowrap}
.chipbtn:hover{border-color:#9CD0F0}
.chipbtn[aria-pressed="true"]{background:#F6C453;border-color:#F6C453;color:#16264A;font-weight:700}
.chipbtn.reveal{border-style:dashed;border-color:#F6C453;color:#F6C453}
.board-cap{padding:12px 16px;background:#101D3A;border-top:1px solid #26396A;color:#EAF4FB;min-height:3.2em}
.board-cap b{color:#F6C453;font-family:var(--hand);font-weight:400;font-size:1.1rem;margin-right:8px}
.board-hint{font-size:.88rem;color:#9FB9D8}

.weekstrip{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#101D3A;border-bottom:1px solid #26396A}
.weekstrip button{flex:0 0 auto;min-width:44px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:22px 34px}
.diff h3{display:flex;gap:10px;align-items:baseline}
.diff p{margin-top:6px}
.diff h3::before{content:"";flex:0 0 10px;height:10px;border-radius:50%;background:var(--accent);transform:translateY(-1px)}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px;counter-reset:s}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;counter-increment:s}
.steps li b{display:block;color:var(--ink);font-size:1.08rem}
.steps li b::before{content:counter(s);display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--accent-wash);color:var(--accent-ink);font-size:.85em;margin-right:8px}
.note{border-left:4px solid var(--warn-line);background:var(--warn-wash);color:var(--warn-ink);padding:12px 16px;border-radius:0 8px 8px 0;font-size:.95rem}
.note + .note{margin-top:10px}
.note.plain{border-left-color:var(--line);background:var(--sunk);color:var(--muted)}

/* weeks */
.week{background:var(--surface);border:1px solid var(--line);border-radius:10px;scroll-margin-top:96px}
.week + .week{margin-top:12px}
.week > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:4px 18px;align-items:center;padding:16px 20px}
.week > summary::-webkit-details-marker{display:none}
.wk-n{grid-row:span 2;width:3.1rem;height:3.1rem;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.wk-n small{display:block;font-size:.55rem;letter-spacing:.1em;font-weight:400;margin-bottom:-4px;text-transform:uppercase}
.week h3{font-size:1.3rem}
.wk-f{grid-column:2;color:var(--muted);font-size:.95rem}
.wk-c{grid-row:span 2;color:var(--muted);font-size:.9rem;text-align:right;white-space:nowrap}
.week[open] > summary{border-bottom:1px solid var(--line)}
.wk-b{padding:18px 20px 22px;display:flex;flex-direction:column;gap:18px}
.wk-brief{font-size:1.08rem;max-width:74ch}
.lesson{display:grid;grid-template-columns:3.2rem minmax(0,1fr);gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.lesson .lid{font-family:var(--mono);color:var(--muted);font-size:.9rem;padding-top:2px}
.lesson b{color:var(--ink);font-size:1.05rem}
.lesson .case{grid-column:2}
.lesson .how{grid-column:2;color:var(--muted);font-size:.95rem}
.lesson .how::before{content:"Hands-on: ";font-weight:700}
.tchips{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tchip{font-family:var(--mono);font-size:.74rem;background:var(--sunk);color:var(--muted);border-radius:4px;padding:1px 7px;text-decoration:none}
a.tchip:hover{color:var(--accent-ink)}
.lablinks{display:flex;flex-wrap:wrap;gap:8px}
.lablink{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 12px;text-decoration:none;color:var(--ink);background:var(--bg)}
.lablink:hover{border-color:var(--accent)}
.lablink .mono{color:var(--muted)}
.kind{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-radius:20px;padding:2px 10px;background:var(--accent-wash);color:var(--accent-ink);white-space:nowrap}
.kind.k-ticket{background:var(--bad-wash);color:var(--bad)}
.kind.k-predict,.kind.k-explore{background:var(--warn-wash);color:var(--warn-ink)}
.kind.k-capstone{background:var(--navy);color:#fff}
.kind.done{background:var(--good-wash);color:var(--good)}
.kind.todo{background:var(--sunk);color:var(--muted)}

/* labs */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.fbtn{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:.95rem}
.fbtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:20px}
.labcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease}
.labcard:hover,.labcard:focus-visible{transform:translateY(-3px);box-shadow:0 10px 26px rgba(16,32,60,.16)}
.labcard .mini{background:#16264A;aspect-ratio:2/1;overflow:hidden;display:grid;place-items:center}
.labcard .mini svg{width:100%;height:100%}
.labcard-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.labcard h3{font-size:1.1rem}
.labmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.85rem;color:var(--muted)}
.labcard p{font-size:.93rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* one lab */
.back{display:inline-block;margin-bottom:14px;text-decoration:none;font-weight:700}
.labhead{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.labhead .story{font-size:1.15rem;max-width:74ch}
.labwork{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:30px;align-items:start;margin-top:22px}
@media (max-width:980px){.labwork{grid-template-columns:minmax(0,1fr)}}
.labmain{display:flex;flex-direction:column;gap:16px;min-width:0}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.side h3{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px}
.side ol,.side ul{display:flex;flex-direction:column;gap:6px}
.twist{font-family:var(--hand);font-size:1.12rem;color:var(--ink);line-height:1.35}
.cmds{display:flex;flex-wrap:wrap;gap:6px}
.cmds code{font-family:var(--mono);font-size:.78rem;background:var(--sunk);border-radius:4px;padding:2px 7px;color:var(--ink);overflow-wrap:anywhere}
.facts2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.95rem}
.facts2 dt{color:var(--muted)}
.facts2 dd{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.card h3{margin-bottom:8px}
.card .hint{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 16px;font-family:var(--mono);font-size:.88rem}
.kv dt{color:var(--muted);font-family:var(--sans);font-size:.95rem}
.kv dd{margin:0;overflow-wrap:anywhere}
.bits{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 6px}
.bits span{display:flex;gap:1px}
.bits i{width:9px;height:18px;border-radius:2px;border:1px solid var(--accent);display:block}
.bits i.n{background:var(--accent)}
.bitkey{font-size:.85rem;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th{text-align:left;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.m{font-family:var(--mono);font-size:.84rem;white-space:nowrap}
.term{background:var(--code-bg);border-radius:8px;overflow:hidden}
.term + .term{margin-top:10px}
.term > summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 14px;color:#9FB6CF;font-family:var(--mono);font-size:.8rem}
.term > summary::-webkit-details-marker{display:none}
.term > summary::before{content:"+";color:#F6C453;font-weight:700;width:1em}
.term[open] > summary::before{content:"\2212"}
.term > summary b{color:#EAF4FB;font-weight:500}
.term pre,pre.ex{margin:0;padding:12px 14px;overflow:auto;max-height:420px;color:var(--code-ink);font-family:var(--mono);font-size:.78rem;line-height:1.5;tab-size:2;border-top:1px solid rgba(255,255,255,.1)}
pre.ex{background:var(--code-bg);border-radius:8px;border:0;max-height:260px}
.real{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--good);background:var(--good-wash);border-radius:4px;padding:1px 7px}

/* tests */
.bp{display:flex;flex-direction:column;gap:8px;max-width:760px}
.bp-row{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 5.5rem;gap:12px;align-items:center;font-size:.95rem}
.bp-bar{height:14px;border-radius:7px;background:var(--sunk);overflow:hidden}
.bp-bar i{display:block;height:100%;background:var(--accent);border-radius:7px}
.bp-row span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:560px){.bp-row{grid-template-columns:minmax(0,1fr) 5.5rem}.bp-bar{grid-column:1 / -1;grid-row:2}}
.trainer{display:flex;flex-direction:column;gap:12px;max-width:640px}
.trainer .q{font-size:1.2rem;color:var(--ink)}
.trainer .q code{font-family:var(--mono);background:var(--sunk);border-radius:4px;padding:1px 8px}
.trainer form{display:flex;flex-wrap:wrap;gap:10px}
.trainer input{font:inherit;font-family:var(--mono);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;flex:1 1 200px}
.fb{border-radius:8px;padding:10px 14px}
.fb.ok{background:var(--good-wash);color:var(--good)}
.fb.no{background:var(--bad-wash);color:var(--bad)}
.fb .mono{color:inherit}
.quiz{display:flex;flex-direction:column;gap:18px;max-width:820px}
.qcard{display:flex;flex-direction:column;gap:10px}
.qcard .qq{font-size:1.1rem;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 14px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.why{color:var(--muted)}
/* weekly test */
.tst{max-width:860px;display:flex;flex-direction:column;gap:16px}
.tst-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;box-shadow:0 2px 10px rgba(16,32,60,.08)}
.tst-time{font-family:var(--mono);font-size:1.3rem;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;min-width:4.2ch}
.tst-time.low{color:var(--bad)}
.tst-nav{display:flex;flex-wrap:wrap;gap:5px}
.tst-n{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--bg);font-size:.82rem;padding:0;font-variant-numeric:tabular-nums}
.tst-n.done{background:var(--accent-wash);border-color:var(--accent);color:var(--ink)}
.tst-n[aria-current="true"]{box-shadow:0 0 0 2px var(--navy)}
.tst-n.ok{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.tst-n.no{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.opt.sel{border-color:var(--accent-ink);background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--accent-ink);color:var(--ink)}
.opt .box{display:inline-block;width:1.1em;font-family:var(--mono)}
.cmdline{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:.95rem;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:11px 14px}
.cmdline span{white-space:nowrap;color:#9CD0F0}
.cmdline input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed #5F7EAE;color:#fff;font:inherit;padding:2px 0}
.cmdline input:focus{outline:none;border-bottom-color:#F6C453}
.tst-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.score{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline}
.score b{font-size:clamp(2.6rem,1.6rem + 5vw,4.4rem);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.verdict{font-weight:700;border-radius:20px;padding:4px 14px}
.verdict.pass{background:var(--good-wash);color:var(--good)}.verdict.fail{background:var(--bad-wash);color:var(--bad)}
.brk{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 3.5rem;gap:8px 14px;align-items:center;max-width:680px}
.brk i{display:block;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.brk i u{display:block;height:100%;background:var(--accent);text-decoration:none}
.brk span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.rev{display:flex;flex-direction:column;gap:14px}
.rev .qcard{scroll-margin-top:96px}
.rev .mine{font-size:.95rem}
.rev .mine b.ok{color:var(--good)}.rev .mine b.no{color:var(--bad)}

<script>
/* lab_lib.js: the living lab map.

   One lab topology (plain data, see programs/ccna/topologies.py) goes in; an SVG map comes out that explains
   itself: every interface is labelled, every link shows its subnet, hosts show their address. The page can then
   ask the map to show a scene (a packet path, a failed link, a fault), to hide the addresses for self-testing,
   or to light up part of the network.

   LabMap.mount(hostElement, topology, options) returns a controller:
       setScene(scene | null)     scene: {path, back, also, stop, down, warn, badges}
       setQuiz(true | false)      hide or show the host parts of the addresses
       setLit(ids | null)         dim every node that is not in the list
       setSelected(sel | null)    highlight a picked node or link
       destroy()
   options: {mini: true}          a small non-interactive drawing for cards
            {onPick: fn}          called with {type:'node', id} or {type:'link', i} when the learner picks something
   LabMap.subnet('10.0.12.0/30')  the facts of an IPv4 or IPv6 subnet, for the subnet card
*/
const LabMap = (() => {
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const RAD = {router: 32, switch: 34, l3switch: 34, pc: 28, server: 30, cloud: 50, ap: 26, wlc: 34, hub: 24, ws: 30, phone: 22};
  const HOST = {pc: 1, server: 1, ws: 1, phone: 1};
  const KIND_NAME = {router: 'Router', switch: 'Switch', l3switch: 'Layer 3 switch', pc: 'PC', server: 'Server', cloud: 'Network', ap: 'Access point', wlc: 'Wireless controller', hub: 'Switch (not configured in this lab)', ws: 'Laptop', phone: 'Handheld'};
  const SW = '<rect class="lm-bx" x="-34" y="-22" width="68" height="44" rx="8"/>';
  const ICON = {
    router: '<circle class="lm-bx" r="30"/><path class="lm-ln" d="M-17,0 h34 M0,-17 v34 M9,-8 l8,8 l-8,8 M-9,-8 l-8,8 l8,8"/>',
    switch: SW + '<path class="lm-ln" d="M-18,-8 h34 M9,-14 l7,6 l-7,6 M18,8 h-34 M-9,2 l-7,6 l7,6"/>',
    l3switch: SW + '<circle class="lm-ln" r="13"/><path class="lm-ln" d="M-7,0 h14 M0,-7 v14"/>',
    pc: '<rect class="lm-bx" x="-24" y="-22" width="48" height="33" rx="4"/><path class="lm-ln" d="M0,11 v9 M-14,21 h28"/>',
    ws: '<rect class="lm-bx" x="-22" y="-20" width="44" height="29" rx="3"/><path class="lm-bx" d="M-27,12 h54 l5,9 h-64 z"/>',
    server: '<rect class="lm-bx" x="-21" y="-30" width="42" height="60" rx="5"/><path class="lm-ln2" d="M-12,-15 h24 M-12,-2 h24"/><circle class="lm-ok" cx="10" cy="18" r="4"/>',
    cloud: '<path class="lm-bx" d="M-30,24 q-26,0 -26,-22 q0,-22 26,-22 q5,-26 36,-26 q30,0 36,24 q26,-2 26,23 q0,23 -26,23 z"/>',
    ap: '<rect class="lm-bx" x="-24" y="-4" width="48" height="18" rx="9"/><path class="lm-ln" d="M-10,-12 q10,-9 20,0 M-18,-20 q18,-15 36,0"/>',
    wlc: SW + '<path class="lm-ln" d="M-9,4 q9,-8 18,0 M-17,-4 q17,-14 34,0"/><circle class="lm-ok" cx="0" cy="11" r="3.5"/>',
    hub: '<rect class="lm-bx2" x="-26" y="-13" width="52" height="26" rx="6"/><path class="lm-ln2" d="M-16,0 h4 M-6,0 h4 M4,0 h4 M14,0 h4"/>',
    phone: '<rect class="lm-bx" x="-12" y="-22" width="24" height="44" rx="5"/><path class="lm-ln2" d="M-6,-12 h12 M-6,-5 h12"/><circle class="lm-ln" cx="0" cy="12" r="3"/>',
  };

  /* ---------- addresses ---------- */
  const isV6 = s => String(s).indexOf(':') >= 0;
  const toInt = ip => ip.split('.').reduce((a, o) => a * 256 + (+o), 0);
  const toIp = n => [n / 16777216 | 0, (n / 65536 | 0) % 256, (n / 256 | 0) % 256, n % 256].join('.');
  function subnet(net) {
    if (!net) return null;
    const [addr, p] = net.split('/'); const prefix = +p;
    if (isV6(addr)) return {v: 6, net, prefix, hostBits: 128 - prefix};
    const size = Math.pow(2, 32 - prefix), base = Math.floor(toInt(addr) / size) * size;
    return {v: 4, net: toIp(base) + '/' + prefix, network: toIp(base), prefix, mask: toIp(4294967296 - size), wildcard: toIp(size - 1), size,
            first: prefix >= 31 ? toIp(base) : toIp(base + 1), last: prefix >= 31 ? toIp(base + size - 1) : toIp(base + size - 2),
            broadcast: toIp(base + size - 1), hosts: prefix >= 31 ? size : size - 2};
  }
  /* The part of an address that is worth showing on a link end: '.1' for 10.0.12.1/30, '::1' for 2001:db8:12::1/64. */
  function hostPart(ip, net) {
    if (!ip) return '';
    if (isV6(ip)) { const i = ip.lastIndexOf('::'); return i >= 0 ? ip.slice(i) : ':' + ip.split(':').slice(-1)[0]; }
    const prefix = net ? +net.split('/')[1] : 24, keep = prefix >= 24 ? 1 : prefix >= 16 ? 2 : 3;
    return '.' + ip.split('.').slice(4 - keep).join('.');
  }

  /* ---------- geometry ---------- */
  const W = 1000;
  const tw = (s, px) => String(s).length * px;                       // rough text width
  function labelSide(n, links, byId) {                               // where the name goes: the side with no link
    const dirs = links.filter(l => l.a === n.id || l.b === n.id).map(l => { const o = byId[l.a === n.id ? l.b : l.a]; return Math.atan2(o.y - n.y, o.x - n.x); });
    const cand = [['b', Math.PI / 2], ['t', -Math.PI / 2], ['r', 0], ['l', Math.PI]];
    const clear = a => dirs.length ? Math.min.apply(null, dirs.map(d => { let x = Math.abs(d - a) % (2 * Math.PI); return x > Math.PI ? 2 * Math.PI - x : x; })) : 9;
    const roomy = cand.filter(([k, a]) => clear(a) >= 0.95 && !(k === 'l' && n.x < 170) && !(k === 'r' && n.x > W - 170));   // below if there is room, then above, then beside
    if (roomy.length) return roomy[0][0];
    let best = 'b', score = -1; cand.forEach(([k, a]) => { const s = clear(a); if (s > score + 0.01) { score = s; best = k; } });
    return best;
  }

  function build(topo, opt) {
    const mini = !!opt.mini, H = topo.h || 500, byId = {}; topo.nodes.forEach(n => byId[n.id] = n);
    const hostAddr = {};                                              // a host's address is written under its name
    topo.links.forEach(l => { [['a', 'aip'], ['b', 'bip']].forEach(([e, k]) => { const n = byId[l[e]]; if (n && HOST[n.kind] && l[k]) (hostAddr[n.id] = hostAddr[n.id] || []).push(l[k]); }); });
    let linksSvg = '', hitSvg = '', pills = '', chips = '', nodesSvg = '', notes = '', top = 0, bottom = H;
    const geo = [], sides = {};
    topo.links.forEach((l, i) => {
      const A = byId[l.a], B = byId[l.b], dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2; let nx = -uy, ny = ux; if (ny < 0 || (Math.abs(ny) < 0.01 && nx < 0)) { nx = -nx; ny = -ny; }
      const cls = 'lm-link lm-k-' + l.kind + (l.vlan ? ' lm-v' + l.vlan : '') + (l.grp ? ' lm-g-' + l.grp : '') + (l.bare ? ' lm-bare' : '');
      let d, apex = null;
      if (l.kind === 'tunnel') { apex = {x: mx, y: my - 130}; d = 'M' + A.x + ',' + A.y + ' Q' + mx + ',' + (my - 260) + ' ' + B.x + ',' + B.y; }
      else d = 'M' + A.x + ',' + A.y + ' L' + B.x + ',' + B.y;
      geo.push({A, B, mx, my, ux, uy, nx, ny, len, d, apex});
      if (l.kind === 'bundle') {
        const o = 6; linksSvg += '<g class="' + cls + '" data-l="' + i + '"><path class="lm-wire" d="M' + (A.x + nx * o) + ',' + (A.y + ny * o) + ' L' + (B.x + nx * o) + ',' + (B.y + ny * o) + '"/><path class="lm-wire" d="M' + (A.x - nx * o) + ',' + (A.y - ny * o) + ' L' + (B.x - nx * o) + ',' + (B.y - ny * o) + '"/><ellipse class="lm-ring" cx="' + mx + '" cy="' + my + '" rx="9" ry="17" transform="rotate(' + (Math.atan2(uy, ux) * 180 / Math.PI) + ' ' + mx + ' ' + my + ')"/></g>';
      } else if (l.kind === 'trunk') {
        linksSvg += '<g class="' + cls + '" data-l="' + i + '"><path class="lm-wire" d="' + d + '"/><path class="lm-core" d="' + d + '"/></g>';
      } else linksSvg += '<g class="' + cls + '" data-l="' + i + '"><path class="lm-wire" d="' + d + '"/></g>';
      if (mini) return;
      hitSvg += '<path class="lm-hit" data-l="' + i + '" d="' + d + '" tabindex="0" role="button" aria-label="Link ' + esc(l.a) + ' to ' + esc(l.b) + (l.net ? ', subnet ' + esc(l.net) : '') + '"/>';
      if (l.bare) return;
      /* what is written on the link itself */
      const horizontal = Math.abs(uy) < 0.2, vertical = Math.abs(ux) < 0.2;
      const pillText = (l.kind === 'access' && l.vlan) ? 'VLAN ' + l.vlan : (l.quiet ? null : l.net);
      const hand = l.name && l.label ? l.name + ': ' + l.label : (l.name || l.label);
      const px = apex ? apex.x : mx, py = apex ? apex.y : my;
      if (pillText) {
        const w = tw(pillText, 7.3) + 18; let cx = px, cy = py;
        if (horizontal) cy = py - (l.kind === 'bundle' ? 32 : 21); else if (vertical) cx = px + w / 2 + 10;
        pills += '<g class="lm-pill' + (l.vlan ? ' lm-v' + l.vlan : '') + '" data-l="' + i + '"><rect x="' + (cx - w / 2) + '" y="' + (cy - 11) + '" width="' + w + '" height="22" rx="11"/><text x="' + cx + '" y="' + (cy + 4.5) + '" text-anchor="middle">' + esc(pillText) + '</text></g>';
      }
      if (hand) {
        let hx, hy, anchor = 'middle';
        if (apex) { hx = px; hy = py - 14; }
        else if (horizontal) { hx = px; hy = py + (pillText ? 34 : (l.kind === 'bundle' ? -26 : -16)); }
        else if (vertical) { hx = px - 42; hy = py + 5; anchor = 'end'; }
        else { const f = l.flip ? -1 : 1, k = pillText ? 30 : 16; hx = px + f * nx * k; hy = py + f * ny * k + 6; anchor = f * nx > 0 ? 'start' : 'end'; }
        notes += '<text class="lm-hand" x="' + hx + '" y="' + hy + '" text-anchor="' + anchor + '">' + esc(hand) + '</text>';
      }
      /* interface chips, one at each end that has something to say */
      [['a', A, 1], ['b', B, -1]].forEach(([e, N, s]) => {
        if (HOST[N.kind] || N.kind === 'hub' || N.kind === 'cloud') return;
        const ifn = l[e + 'i'], ip = l[e + 'ip'], hp = hostPart(ip, l.net); if (!ifn && !hp) return;
        const text = ifn + (ifn && hp ? ' ' : '') + hp, w = tw(text, 7.0) + 14;
        let dist = RAD[N.kind] + 12 + w / 2; if (dist > len * 0.42) dist = len * 0.42;
        let cx = N.x + s * ux * dist, cy = N.y + s * uy * dist;
        if (apex) { cx = N.x + s * 60; cy = N.y - 58; }
        chips += '<g class="lm-chip" data-l="' + i + '" data-e="' + e + '"><rect x="' + (cx - w / 2) + '" y="' + (cy - 10) + '" width="' + w + '" height="20" rx="5"/><text x="' + cx + '" y="' + (cy + 4.2) + '" text-anchor="middle">' + (ifn ? '<tspan class="lm-if">' + esc(ifn) + '</tspan>' : '') + (hp ? '<tspan class="lm-hp" dx="' + (ifn ? 5 : 0) + '" data-full="' + esc(hp) + '">' + esc(hp) + '</tspan>' : '') + '</text></g>';
      });
    });
    topo.nodes.forEach(n => {
      const r = RAD[n.kind] || 30, side = n.lp || labelSide(n, topo.links, byId); sides[n.id] = side;
      const addrs = (hostAddr[n.id] || []).filter((v, k, a) => a.indexOf(v) === k), lines = [];
      lines.push({cls: 'lm-name', html: esc(n.label) + (n.site ? '<tspan class="lm-site" dx="7">' + esc(n.site) + '</tspan>' : ''), h: mini ? 30 : 19});
      if (!mini) { addrs.forEach(a => lines.push({cls: 'lm-sub lm-addr', html: '<tspan class="lm-hp" data-full="' + esc(a) + '">' + esc(a) + '</tspan>', h: 16})); (n.sub || []).forEach(s => lines.push({cls: 'lm-sub', html: esc(s), h: 16})); }
      const total = lines.reduce((a, b) => a + b.h, 0); let x = n.x, y, anchor = 'middle';
      if (side === 'b') y = n.y + r + 11; else if (side === 't') y = n.y - r - 15 - total;
      else { y = n.y - total / 2; anchor = side === 'r' ? 'start' : 'end'; x = n.x + (side === 'r' ? 1 : -1) * (r + 14); }
      top = Math.min(top, (side === 't' ? y : n.y - r) - 8); bottom = Math.max(bottom, (side === 'b' ? y + total : n.y + r) + 12);
      let t = '', yy = y; lines.forEach(L => { yy += L.h; t += '<text class="' + L.cls + '" x="' + x + '" y="' + (yy - 3) + '" text-anchor="' + anchor + '">' + L.html + '</text>'; });
      nodesSvg += '<g class="lm-node lm-n-' + n.kind + '" data-n="' + esc(n.id) + '"' + (mini ? '' : ' tabindex="0" role="button" aria-label="' + esc(n.label) + (n.site ? ', ' + esc(n.site) : '') + '"') + '><circle class="lm-halo" cx="' + n.x + '" cy="' + n.y + '" r="' + (r + 12) + '"/><g transform="translate(' + n.x + ',' + n.y + ')">' + (ICON[n.kind] || ICON.router) + '</g>' + t + '</g>';
    });
    if (!mini) (topo.notes || []).forEach(nt => {

ating static route and fail the primary link.", "topics": ["3.3"]}, {"id": "5.5", "title": "Static routes in IPv6", "case": "The same job on the new IPv6 circuit.", "hands_on": "Write four IPv6 static routes, one with a link-local next hop.", "topics": ["3.3"]}, {"id": "5.6", "title": "Follow one packet, hop by hop", "case": "A user at the Depot cannot reach one server at head office. Everything else works.", "hands_on": "Walk the path router by router: which entry matches, where it sends the packet, and where the reply fails.", "topics": ["3.1", "3.2", "3.3"]}]}, {"n": 6, "title": "Let the routers talk", "brief": "Twelve more depots are planned. Static routes will not scale, so the routers must tell each other what they know. And after last month's reboot, the head office gateway must stop being a single point of failure.", "focus": "Single-area OSPF, first hop redundancy", "nodes": ["R1", "R2", "R3"], "lessons": [{"id": "6.1", "title": "OSPF in one picture", "case": "Add a network once, and every router learns it.", "hands_on": "Three steps in one picture, the real configuration and routing table, then a simulator: bring the Depot LAN into OSPF the right way.", "topics": ["3.4"]}, {"id": "6.2", "title": "Becoming neighbours", "case": "Two routers, one cable, no neighbour.", "hands_on": "Read the fingerprint of each mismatch in real output. Simulator: fix a link that is wrong in three ways until the neighbour reaches FULL.", "topics": ["3.4"]}, {"id": "6.3", "title": "Point-to-point and broadcast", "case": "Why is there a designated router on a link with only two routers?", "hands_on": "Predict a real election. Simulator: make head office the DR on a three-router segment, and find out why priorities alone are not enough.", "topics": ["3.4"]}, {"id": "6.4", "title": "Cost and the best path", "case": "Traffic takes the slow link.", "hands_on": "Add up real path costs. Simulator: make the costs match the link speeds and trace both directions.", "topics": ["3.4", "3.2"]}, {"id": "6.5", "title": "A default route for everyone", "case": "Every depot needs the way out to the internet.", "hands_on": "Read O*E2 in a real routing table. Simulator: advertise a default from head office, then take the provider line down.", "topics": ["3.4", "3.3"]}, {"id": "6.6", "title": "Is OSPF healthy?", "case": "A change went in last night. How do you prove this morning that routing is as it should be?", "hands_on": "Five commands that answer it: neighbours, interfaces, database, routes, protocol settings. Read real output of each, then choose the command that answers a colleague's question.", "topics": ["3.4", "3.1"]}, {"id": "6.7", "title": "A backup for the gateway", "case": "The gateway router reboots and 300 PCs lose the network.", "hands_on": "A real failover, ping by ping. Simulator: fail the active gateway, bring it back, and design for both.", "topics": ["3.5"]}]}, {"n": 7, "title": "Run the services", "brief": "Internet access for every PC, addresses handed out automatically, names instead of numbers, one clock for every log. The quiet services nobody notices until they stop.", "focus": "NAT, DHCP, DNS, NTP, syslog, SNMP, SSH, TFTP and FTP, QoS", "nodes": ["R1", "R3", "ISP", "WEB", "SRV"], "lessons": [{"id": "7.1", "title": "NAT", "case": "200 PCs and one public address.", "hands_on": "Follow one packet out and back and fill in the translation table.", "topics": ["4.1", "1.7"]}, {"id": "7.2", "title": "DHCP: server, client, relay", "case": "New PCs at the Depot get addresses starting 169.254.", "hands_on": "Place the relay on the right interface of a three-site network.", "topics": ["4.3", "4.6"]}, {"id": "7.3", "title": "DNS", "case": "Ping by address works. Ping by name does not.", "hands_on": "Trace one name lookup from the PC to the answer.", "topics": ["4.3"]}, {"id": "7.4", "title": "NTP", "case": "Three logs disagree about when the outage began.", "hands_on": "Build the time hierarchy and read \"show ntp status\".", "topics": ["4.2"]}, {"id": "7.5", "title": "Syslog", "case": "Severity 3 at 02:14. Is that bad?", "hands_on": "Take real log messages apart: timestamp, facility, severity, description. Then choose which levels go to the server.", "topics": ["4.5"]}, {"id": "7.6", "title": "SNMP", "case": "Who noticed the link at 90 percent before the users did?", "hands_on": "Polling against traps: decide which one catches each of six events.", "topics": ["4.4"]}, {"id": "7.7", "title": "Remote access with SSH", "case": "A Telnet password is found in a packet capture.", "hands_on": "Compare a Telnet capture with an SSH capture. Then rank the ways to manage a device: console, Telnet, SSH, HTTP, HTTPS and a cloud dashboard.", "topics": ["4.8", "2.8"]}, {"id": "7.8", "title": "Moving files: TFTP and FTP", "case": "Fourteen configurations to back up before the change window.", "hands_on": "Choose TFTP or FTP for five jobs.", "topics": ["4.9"]}, {"id": "7.9", "title": "QoS, hop by hop", "case": "Voice breaks up when the nightly backup starts.", "hands_on": "Simulator: classify, mark, queue, police and shape at one congested interface.", "topics": ["4.7"]}]}, {"n": 8, "title": "Lock it down", "brief": "An audit is coming. The auditor will ask who can log in to your routers, what guests can reach, and what happens when someone plugs in a device that should not be there.", "focus": "Security concepts, device access, passwords, AAA, access lists, Layer 2 security, VPNs", "nodes": ["R1", "SW1", "SW2", "ISP", "R3"], "lessons": [{"id": "8.1", "title": "Threats, weaknesses and defences", "case": "A phishing email, an unpatched switch and a default password.", "hands_on": "Match six incidents to threat, vulnerability, exploit and mitigation.", "topics": ["5.1"]}, {"id": "8.2", "title": "The human layer", "case": "The comms-room door was propped open with a chair.", "hands_on": "Walk a site and spot eight weaknesses that no firewall will fix.", "topics": ["5.2"]}, {"id": "8.3", "title": "Passwords on the device", "case": "\"enable password cisco\" turns up in a configuration backup.", "hands_on": "Read a configuration and rank its passwords from weakest to strongest.", "topics": ["5.3"]}, {"id": "8.4", "title": "Password policy and what replaces passwords", "case": "The auditor asks about multifactor authentication.", "hands_on": "Build a login policy from the parts: length, lockout, a second factor, certificates.", "topics": ["5.4"]}, {"id": "8.5", "title": "AAA: who, what, and the record", "case": "Who changed the access list last night?", "hands_on": "Sort twelve events into authentication, authorization or accounting; compare TACACS+ and RADIUS.", "topics": ["5.8", "2.8"]}, {"id": "8.6", "title": "Access control lists", "case": "Guests must reach the internet and nothing else.", "hands_on": "Simulator: send six packets through an access list and predict each result.", "topics": ["5.6"]}, {"id": "8.7", "title": "Layer 2 attacks and defences", "case": "A rogue DHCP server hands out the wrong gateway.", "hands_on": "Place port security, DHCP snooping and dynamic ARP inspection on a switch.", "topics": ["5.7"]}, {"id": "8.8", "title": "VPNs", "case": "The Depot's backup link runs across the public internet.", "hands_on": "Site-to-site against remote access: who are the two ends, and what is protected?", "topics": ["5.5"]}]}, {"n": 9, "title": "Go wireless", "brief": "The Hub wants handheld scanners on Wi-Fi across the sorting floor. Forty access points, one controller, and a night shift that starts at ten.", "focus": "Radio basics, wireless architectures, wiring a WLAN, wireless security, the controller GUI", "nodes": ["R2", "WLC", "AP1"], "lessons": [{"id": "9.1", "title": "Radio basics", "case": "Three access points, all on channel 6.", "hands_on": "Plan channels for a floor of access points without overlap.", "topics": ["1.11"]}, {"id": "9.2", "title": "Architectures and AP modes", "case": "Forty access points. Do you configure each one?", "hands_on": "Autonomous, controller-based or cloud-managed: choose for four sites.", "topics": ["2.6", "1.1"]}, {"id": "9.3", "title": "Wiring a WLAN", "case": "The access point has power but no clients.", "hands_on": "Connect an access point and a controller to the right kinds of switch port: access, trunk, and a LAG to the controller.", "topics": ["2.7"]}, {"id": "9.4", "title": "Wireless security", "case": "The scanners only support WPA2.", "hands_on": "Compare WPA, WPA2 and WPA3 and pick the settings the scanners can use.", "topics": ["5.9"]}, {"id": "9.5", "title": "A WLAN in the controller GUI", "case": "Create the scanner WLAN before the night shift.", "hands_on": "Simulator: replicas of both controller GUIs, the classic one and the Catalyst 9800 one. Create the WLAN in each and read every tab.", "topics": ["5.10", "2.9"]}]}, {"n": 10, "title": "Automate the routine", "brief": "Twelve depots, the same configuration each time. Maya's instruction: \"Stop typing. Start describing.\" You meet controllers, APIs and the tools that push one intent to many devices.", "focus": "Virtualization, controller-based networking, AI in operations, REST, JSON, Ansible and Terraform", "nodes": ["R1", "R2", "R3", "WLC"], "lessons": [{"id": "10.1", "title": "Servers, containers and VRFs", "case": "Two customers, the same IP addresses, one router.", "hands_on": "Compare a virtual machine, a container and a VRF: what does each one virtualize?", "topics": ["1.12"]}, {"id": "10.2", "title": "Why automate", "case": "Depot 9 received Depot 8's configuration with one typo.", "hands_on": "Count the steps and the chances of error: by hand against by tool.", "topics": ["6.1"]}, {"id": "10.3", "title": "Controller-based networking", "case": "One screen for forty switches.", "hands_on": "The same change made twice: device by device, and once on a controller. Compare what you touch and what can go wrong.", "topics": ["6.2", "1.1"]}, {"id": "10.4", "title": "Inside a software-defined network", "case": "The controller says the fabric is healthy. What is a fabric?", "hands_on": "Place control plane, data plane, northbound and southbound APIs, underlay and overlay on one diagram.", "topics": ["6.3"]}, {"id": "10.5", "title": "AI and machine learning in operations", "case": "The dashboard predicted the link failure. How?", "hands_on": "Sort eight tasks: predictive AI, generative AI, or neither.", "topics": ["6.4"]}, {"id": "10.6", "title": "REST APIs", "case": "Get the interface list without logging in to a command line.", "hands_on": "Build four requests from verb, URL and headers and read the status codes.", "topics": ["6.5"]}, {"id": "10.7", "title": "Reading JSON", "case": "Find the one interface that has been shut down, in 300 lines of JSON.", "hands_on": "Fold, unfold and repair real JSON from a router.", "topics": ["6.7"]}, {"id": "10.8", "title": "Ansible and Terraform", "case": "The same change on twelve routers before lunch.", "hands_on": "Read a playbook and a plan and say what each will do.", "topics": ["6.6"]}]}, {"n": 11, "title": "Prove it", "brief": "Two jobs with no step-by-step instructions. First you open a new depot from a blank router in one change window. Then a Monday morning arrives with five tickets in ten minutes.", "focus": "Two capstones, troubleshooting method, reading exam questions", "nodes": ["R1", "R2", "R3", "SW1", "SW2", "SW3", "PC2"], "lessons": [{"id": "11.1", "title": "A method for any fault", "case": "Five tickets at once. Where do you start?", "hands_on": "Top-down, bottom-up and divide-and-conquer on three real faults.", "topics": []}, {"id": "11.2", "title": "How to read an exam question", "case": "An exhibit, four options, ninety seconds.", "hands_on": "Work six exhibit questions aloud: what to read first and what to ignore.", "topics": []}]}, {"n": 12, "title": "Exam week", "brief": "Three full mock exams under exam conditions, a readiness report for each of the six exam domains, and a review plan built from your own weak topics.", "focus": "Mock exams, readiness report, targeted review", "nodes": [], "lessons": []}], "labs": [{"id": "L01", "week": 0, "title": "First login", "kind": "build", "mins": 30, "story": "Day one. Maya, your team lead, hands you a console cable and a router that has never been configured. Before you touch the live network, you must be able to move around a Cisco device without getting lost.", "tasks": ["Connect on the console and move between user, privileged and configuration mode.", "Give the router a name and an address on LAN A, then ping PC1.", "Compare the running configuration with the startup configuration.", "Save, reload, and prove the configuration survived."], "twist": "You reload once without saving, on purpose, and see exactly what is lost.", "play": "Click the router to see each mode, its prompt and what you can do there.", "checks": ["Which prompt shows that you are in privileged mode?", "After a reload without saving, which configuration does the router load?", "Which command gives a one-line summary of every interface?"], "cmds": ["enable", "configure terminal", "hostname R1", "show running-config", "show startup-config", "copy running-config startup-config", "show ip interface brief", "show version", "reload"], "topics": ["1.6"], "topo": {"nodes": [{"id": "WS", "kind": "ws", "x": 180, "y": 160, "label": "Your laptop", "sub": ["terminal program"], "site": null, "lp": "t"}, {"id": "R1", "kind": "router", "x": 520, "y": 250, "label": "R1", "sub": [], "site": "HQ"}, {"id": "PC1", "kind": "pc", "x": 860, "y": 250, "label": "PC1", "sub": [], "site": null}], "links": [{"a": "WS", "ai": "usb", "aip": null, "b": "R1", "bi": "con 0", "bip": null, "net": null, "kind": "console", "label": "console cable, no IP address needed"}, {"a": "R1", "ai": "e0/2", "aip": "192.168.1.1", "b": "PC1", "bi": "eth0", "bip": "192.168.1.10", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}], "notes": [{"x": 180, "y": 330, "lines": ["user mode  >", "privileged mode  #", "configuration mode  (config)#"], "anchor": "start", "cls": "hand"}], "h": 430}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [], "folder": null, "beyond": null, "devices": 3, "cml": true}, {"id": "L02", "week": 1, "title": "Watch a switch learn", "kind": "predict", "mins": 30, "story": "A user asks how the switch \"knows\" where the printer is. You empty the switch's memory and watch it learn again, one frame at a time.", "tasks": ["Ping between the PCs once, so that each PC knows the others' MAC addresses.", "Clear the switch's MAC address table and confirm it is empty.", "Ping from PC1 to PC2 and read the table after each frame.", "Say which frames were flooded and which were forwarded to one port.", "Shorten the ageing time and watch an entry disappear."], "twist": "PC3 has not sent a single frame since the table was cleared. Predict what the switch does with a frame addressed to it.", "play": "Before each ping, click the ports you expect the frame to leave from. The real MAC address table then shows whether you were right.", "checks": ["Which address does a switch learn from a frame: the source or the destination?", "What does a switch do with a frame for a MAC address it has not learned?", "What is the default ageing time of a learned address?"], "cmds": ["show mac address-table", "clear mac address-table dynamic", "mac address-table aging-time 60", "show mac address-table aging-time", "show arp   (VPCS)"], "topics": ["1.13"], "topo": {"nodes": [{"id": "SW1", "kind": "switch", "x": 500, "y": 150, "label": "SW1", "sub": [], "site": null}, {"id": "PC1", "kind": "pc", "x": 200, "y": 370, "label": "PC1", "sub": [], "site": null}, {"id": "PC2", "kind": "pc", "x": 500, "y": 390, "label": "PC2", "sub": [], "site": null}, {"id": "PC3", "kind": "pc", "x": 800, "y": 370, "label": "PC3", "sub": [], "site": null}], "links": [{"a": "SW1", "ai": "e0/1", "aip": null, "b": "PC1", "bi": "eth0", "bip": "192.168.1.10", "net": "192.168.1.0/24", "kind": "access", "quiet": true}, {"a": "SW1", "ai": "e0/2", "aip": null, "b": "PC2", "bi": "eth0", "bip": "192.168.1.11", "net": "192.168.1.0/24", "kind": "access", "quiet": true}, {"a": "SW1", "ai": "e0/3", "aip": null, "b": "PC3", "bi": "eth0", "bip": "192.168.1.12", "net": "192.168.1.0/24", "kind": "access", "quiet": true}], "notes": [{"x": 660, "y": 120, "lines": ["one VLAN, one subnet:", "192.168.1.0/24"], "anchor": "start", "cls": "hand"}], "h": 470}, "images": ["Cisco IOL switch", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [{"t": "Unknown destination", "text": "The PCs already know each other's MAC addresses. The switch has just been cleared, so it has not learned PC2: the frame leaves from every other port.", "path": ["PC1", "SW1", "PC2"], "also": [["SW1", "PC3"]]}, {"t": "Known destination", "text": "PC2 answers. The switch learned PC1 a moment ago, so the reply leaves from one port only.", "path": ["PC2", "SW1", "PC1"]}], "folder": null, "beyond": null, "devices": 4, "cml": true}, {"id": "L03", "week": 1, "title": "Handshake under the microscope", "kind": "walk", "mins": 35, "story": "The tracking application retries when a packet is lost. The voice call just carries on. You capture both kinds of traffic on the wire and compare them packet by packet.", "tasks": ["Start a capture on the link to the server.", "Open a TCP connection to port 80 and find the three handshake packets.", "Send a UDP request and note what is missing.", "Close the TCP connection and find the packets that end it."], "twist": "You try a closed TCP port and a closed UDP port. The two refusals look completely different.", "play": "Step through the real capture. Each packet lights its direction on the map and shows its flags and port numbers.", "checks": ["In which order are the three handshake packets sent, and by whom?", "Which of the two protocols numbers its bytes so that lost data can be resent?", "How does a client learn that a UDP port is closed?"], "cmds": ["ping 192.168.1.100 -3 -p 80   (VPCS: TCP)", "ping 192.168.1.100 -2 -p 69   (VPCS: UDP)", "ip http server", "show tcp brief", "tcpdump   (on the lab server)"], "topics": ["1.5"], "topo": {"nodes": [{"id": "PC1", "kind": "pc", "x": 130, "y": 250, "label": "PC1", "sub": [], "site": null}, {"id": "SW1", "kind": "switch", "x": 430, "y": 250, "label": "SW1", "sub": [], "site": null}, {"id": "SRV1", "kind": "server", "x": 800, "y": 250, "label": "SRV1", "sub": ["web server, TCP 80", "TFTP server, UDP 69"], "site": null}], "links": [{"a": "PC1", "ai": "eth0", "aip": "192.168.1.10", "b": "SW1", "bi": "e0/1", "bip": null, "net": "192.168.1.0/24", "kind": "access", "quiet": true}, {"a": "SW1", "ai": "e0/2", "aip": null, "b": "SRV1", "bi": "e0/0", "bip": "192.168.1.100", "net": "192.168.1.0/24", "kind": "access", "label": "capture point"}], "notes": [{"x": 430, "y": 130, "lines": ["TCP: SYN, SYN-ACK, ACK, then data", "UDP: just the data"], "anchor": "middle", "cls": "hand"}], "h": 400}, "images": ["Cisco IOL router", "Cisco IOL switch", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [{"t": "TCP: three packets first", "text": "SYN, SYN-ACK, ACK. Only then does the data move.", "path": ["PC1", "SW1", "SRV1"], "back": ["SRV1", "SW1", "PC1"]}, {"t": "UDP: just send", "text": "One datagram, no handshake, no promise that it arrived.", "path": ["PC1", "SW1", "SRV1"]}], "folder": null, "beyond": null, "devices": 3, "cml": true}, {"id": "L04", "week": 1, "title": "The slow port", "kind": "ticket", "mins": 30, "story": "Ticket: \"The label printer on Floor 1 is painfully slow, but only on this wall port.\" Pings succeed. Something on the link itself is wrong.", "tasks": ["Read the interface counters at both ends of the link.", "Compare the speed and duplex settings on both sides.", "Fix the mismatch and clear the counters.", "Confirm that the counters stay clean under load."], "twist": "One side is fixed at half duplex, the other runs full. Small pings pass, large transfers crawl.", "play": "Click each end of the link to put its speed, duplex and error counters side by side.", "checks": ["Which counter grows on the half-duplex side of a duplex mismatch?", "Which errors grow on the full-duplex side?", "Which command shows speed and duplex of every port in one table?"], "cmds": ["show interfaces e0/0", "show interfaces status", "duplex full", "duplex auto", "clear counters", "show cdp neighbors detail"], "topics": ["1.4"], "topo": {"nodes": [{"id": "PC1", "kind": "pc", "x": 130, "y": 250, "label": "PC1", "sub": [], "site": null}, {"id": "SW1", "kind": "switch", "x": 440, "y": 250, "label": "SW1", "sub": [], "site": null}, {"id": "R1", "kind": "router", "x": 800, "y": 250, "label": "R1", "sub": [], "site": "HQ"}], "links": [{"a": "PC1", "ai": "eth0", "aip": "192.168.1.10", "b": "SW1", "bi": "e0/1", "bip": null, "net": "192.168.1.0/24", "kind": "access", "quiet": true}, {"a": "SW1", "ai": "e0/0", "aip": null, "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "label": "speed and duplex must match at both ends"}], "notes": [], "h": 400}, "images": ["Cisco IOL router", "Cisco IOL switch", "VPCS host"], "runs": "eve", "needs": "The duplex mismatch warning is real on the lab server. Genuine collision and error counters need one real switch, because virtual interfaces do not collide.", "status": "designed", "scenes": [{"t": "Symptom", "text": "Pings pass. File transfers crawl. The link is up at both ends.", "warn": ["SW1-R1"], "path": ["PC1", "SW1", "R1"]}, {"t": "Root cause", "hidden": true, "text": "Duplex mismatch: one end half, one end full. Late collisions on one side, CRC errors on the other.", "warn": ["SW1-R1"], "badges": {"SW1": "full", "R1": "half"}}], "folder": null, "beyond": null, "devices": 3, "cml": true}, {"id": "L05", "week": 2, "title": "The Depot address plan", "kind": "build", "mins": 45, "story": "The Depot has outgrown its flat network. You are given one block, 192.168.3.0/24, and three groups of devices of different sizes. Cut the block to fit, and prove the plan works.", "tasks": ["Work out a subnet for each group: 100 scanners, 50 office PCs, 20 printers.", "Configure the three gateways on R3 and one host in each subnet.", "Ping between the groups, and from R3 to HQ across the WAN link.", "Write down the first, last and broadcast address of every subnet."], "twist": "A fourth group of 10 cameras arrives. Is there room left in the /24, and exactly where?", "play": "Click any link: its subnet card shows the network, mask, usable range and broadcast address. Switch on \"Test yourself\" first to hide the addresses.", "checks": ["How many usable addresses does a /26 have?", "What is the broadcast address of 192.168.3.128/26?", "Which is the first free address block after the printers' subnet?"], "cmds": ["ip address 192.168.3.129 255.255.255.192", "show ip interface brief", "show ip route connected", "ping"], "topics": ["1.6", "1.7"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 120, "y": 250, "label": "R1", "sub": [], "site": "HQ"}, {"id": "R3", "kind": "router", "x": 440, "y": 250, "label": "R3", "sub": [], "site": "Depot"}, {"id": "PC-A", "kind": "pc", "x": 800, "y": 90, "label": "PC-A", "sub": ["100 scanners"], "site": null}, {"id": "PC-B", "kind": "pc", "x": 860, "y": 250, "label": "PC-B", "sub": ["50 office PCs"], "site": null}, {"id": "PC-C", "kind": "pc", "x": 800, "y": 410, "label": "PC-C", "sub": ["20 printers"], "site": null}], "links": [{"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth"}, {"a": "R3", "ai": "e0/2", "aip": "192.168.3.1", "b": "PC-A", "bi": "eth0", "bip": "192.168.3.10", "net": "192.168.3.0/25", "kind": "eth"}, {"a": "R3", "ai": "e0/3", "aip": "192.168.3.129", "b": "PC-B", "bi": "eth0", "bip": "192.168.3.130", "net": "192.168.3.128/26", "kind": "eth"}, {"a": "R3", "ai": "e0/0", "aip": "192.168.3.193", C3", "HUB"], "stop": "HUB", "badges": {"PC3": "mask /16"}}], "folder": null, "beyond": null, "devices": 5, "cml": true}, {"id": "L07", "week": 2, "title": "Dual stack to the Hub", "kind": "build", "mins": 40, "story": "The carrier's new circuit to the Hub is ready for IPv6. IPv4 stays, and IPv6 is added beside it. You address the link and both LANs, and learn to read the kinds of address each interface now shows.", "tasks": ["Turn on IPv6 routing and give each interface a global address.", "Find each interface's link-local address and ping it.", "Build one address with EUI-64 and work out where its last 64 bits came from.", "Let PC1 form its own address and read the gateway it learned."], "twist": "You set a manual link-local address, fe80::1, on R1, and see why engineers like to do that.", "play": "Click a link to see its prefix and both global addresses. Click a router to see the global, link-local and multicast addresses on each interface.", "checks": ["Which prefix do link-local addresses start with?", "In EUI-64, what is inserted in the middle of the MAC address, and which bit is flipped?", "Which multicast address reaches all routers on a link?"], "cmds": ["ipv6 unicast-routing", "ipv6 address 2001:db8:12::1/64", "ipv6 address 2001:db8:1::/64 eui-64", "ipv6 address fe80::1 link-local", "show ipv6 interface brief", "show ipv6 interface e0/2", "ip auto   (VPCS)"], "topics": ["1.8", "1.9"], "topo": {"nodes": [{"id": "PC1", "kind": "pc", "x": 80, "y": 250, "label": "PC1", "sub": [], "site": null}, {"id": "R1", "kind": "router", "x": 320, "y": 250, "label": "R1", "sub": [], "site": "HQ"}, {"id": "R2", "kind": "router", "x": 680, "y": 250, "label": "R2", "sub": [], "site": "Hub"}, {"id": "PC2", "kind": "pc", "x": 920, "y": 250, "label": "PC2", "sub": [], "site": null}], "links": [{"a": "PC1", "ai": "eth0", "aip": "2001:db8:1::10", "b": "R1", "bi": "e0/2", "bip": "2001:db8:1::1", "net": "2001:db8:1::/64", "kind": "eth", "name": "LAN A"}, {"a": "R1", "ai": "e0/0", "ai l cannot reach it. That is the point of the whole exercise.", "play": "Hover a VLAN in the legend to light every port and link that carries it.", "checks": ["Which VLAN are all ports in by default?", "Which command lists the ports in each VLAN?", "Does a trunk carry a VLAN that has not been created on the switch?"], "cmds": ["vlan 10", "name STAFF", "switchport mode access", "switchport access vlan 10", "switchport voice vlan 20", "switchport trunk encapsulation dot1q", "switchport mode trunk", "show vlan brief", "show interfaces trunk", "show interfaces e0/1 switchport"], "topics": ["2.1", "2.2"], "topo": {"nodes": [{"id": "SW1", "kind": "switch", "x": 300, "y": 150, "label": "SW1", "sub": [], "site": "Floor 1"}, {"id": "SW2", "kind": "switch", "x": 700, "y": 150, "label": "SW2", "sub": [], "site": "Floor 2"}, {"id": "PC1", "kind": "pc", "x": 140, "y": 390, "label": "PC1", "sub": ["STAFF"], "site": null}, {"id": "PC2", "kind": "pc", "x": 440, "y": 390, "label": "PC2", "sub": ["GUEST"], "site": null}, {"id": "PC3", "kind": "pc", "x": 700, "y": 390, "label": "PC3", "sub": ["STAFF"], "site": null}], "links": [{"a": "SW1", "ai": "e0/0", "aip": null, "b": "SW2", "bi": "e0/0", "bip": null, "net": null, "kind": "trunk", "label": "802.1Q trunk: VLANs 10, 20, 30"}, {"a": "SW1", "ai": "e0/1", "aip": null, "b": "PC1", "bi": "eth0", "bip": "192.168.10.10", "net": "192.168.10.0/24", "kind": "access", "vlan": 10}, {"a": "SW1", "ai": "e0/2", "aip": null, "b": "PC2", "bi": "eth0", "bip": "192.168.30.10", "net": "192.168.30.0/24", "kind": "access", "vlan": 30}, {"a": "SW2", "ai": "e0/1", "aip": null, "b": "PC3", "bi": "eth0", "bip": "192.168.10.11", "net": "192.168.10.0/24", "kind": "access", "vlan": 10}], "notes": [{"x": 860, "y": 300, "lines": ["same VLAN, different", "floors: one network"], "anchor": "middle", "cls": "hand"}], "h": 470}, "images": ["Cisco IOL switch", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [{"t": "Staff to staff, across floors", "text": "Same VLAN on both switches. The trunk carries the frame with a VLAN 10 tag.", "path": ["PC1", "SW1", "SW2", "PC3"]}, {"t": "Guest to staff, same switch", "text": "Different VLANs. With no router between them, the frame goes nowhere.", "path": ["PC2", "SW1"], "stop": "SW1"}], "folder": null, "beyond": null, "devices": 5, "cml": true}, {"id": "L10", "week": 3, "title": "VLAN 30 is missing upstairs", "kind": "ticket", "mins": 35, "story": "Ticket: \"Guests on Floor 2 get no network. Guests on Floor 1 are fine.\" Nothing was changed, says everyone.", "tasks": ["Compare the VLAN list on both switches.", "Read the trunk: which VLANs are allowed, and which are active.", "Check the native VLAN at both ends.", "Fix the cause and confirm that guests on both floors reach each other."], "twist": "VLAN 30 was removed from the trunk's allowed list. While you are there you find a second, quieter fault: the native VLAN differs between the two ends.", "play": "Click the trunk to compare its two ends side by side.", "checks": ["Which command shows the VLANs allowed on a trunk?", "Which log message reports a native VLAN mismatch, and which protocol detects it?", "Which VLAN do untagged frames on a trunk belong to?"], "cmds": ["show interfaces trunk", "switchport trunk allowed vlan add 30", "switchport trunk native vlan 99", "show vlan brief", "show cdp neighbors"], "topics": ["2.1", "2.2"], "topo": {"nodes": [{"id": "SW1", "kind": "switch", "x": 300, "y": 150, "label": "SW1", "sub": [], "site": "Floor 1"}, {"id": "SW2", "kind": "switch", "x": 700, "y": 150, "label": "SW2", "sub": [], "site": "Floor 2"}, {"id": "PC1", "kind": "pc", "x": 140, "y": 390, "label": "PC1", "sub": ["STAFF"], "site": null}, {"id": "PC2", "kind": "pc", "x": 440, "y": 390, "label": "PC2", "sub": ["GUEST"], "site": null}, {"id": "PC3", "kind": "pc", "x": 700, "y": 390, "label": "PC3", "sub": ["GUEST"], "site": null}], "links": [{"a": "SW1", "ai": "e0/0", "aip": null, "b": "SW2", "bi": "e0/0", "bip": ck down in the other.", "checks": ["Which command sets the VLAN on a router subinterface?", "What must be enabled on a Layer 3 switch before its SVIs route?", "When is an SVI up and up?"], "cmds": ["interface e0/0.10", "encapsulation dot1Q 10", "ip address 192.168.10.1 255.255.255.0", "ip routing", "interface vlan 10", "show ip route", "show interfaces trunk"], "topics": ["2.1", "2.2"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 500, "y": 90, "label": "R1", "sub": ["e0/0.10  192.168.10.1", "e0/0.30  192.168.30.1"], "site": "HQ"}, {"id": "SW1", "kind": "switch", "x": 500, "y": 270, "label": "SW1", "sub": [], "site": null}, {"id": "PC1", "kind": "pc", "x": 200, "y": 430, "label": "PC1", "sub": ["STAFF"], "site": null}, {"id": "PC2", "kind": "pc", "x": 500, "y": 450, "label": "PC2", "sub": ["GUEST"], "site": null}, {"id": "PC3", "kind": "pc", "x": 800, "y": 430, "label": "PC3", "sub": ["STAFF"], "site": null}], "links": [{"a": "R1", "ai": "e0/0", "aip": null, "b": "SW1", "bi": "e0/0", "bip": null, "net": null, "kind": "trunk", "label": "trunk: one cable, two subinterfaces"}, {"a": "SW1", "ai": "e0/1", "aip": null, "b": "PC1", "bi": "eth0", "bip": "192.168.10.10", "net": "192.168.10.0/24", "kind": "access", "vlan": 10}, {"a": "SW1", "ai": "e0/2", "aip": null, "b": "PC2", "bi": "eth0", "bip": "192.168.30.10", "net": "192.168.30.0/24", "kind": "access", "vlan": 30}, {"a": "SW1", "ai": "e0/3", "aip": null, "b": "PC3", "bi": "eth0", "bip": "192.168.10.11", "net": "192.168.10.0/24", "kind": "access", "vlan": 10}], "notes": [], "h": 520}, "images": ["Cisco IOL router", "Cisco IOL switch", "VPCS host"], "runs": "eve", "needs": null, "status": "designed", "scenes": [{"t": "Staff to guest", "text": "Up the trunk tagged VLAN 10, routed on R1, back down tagged VLAN 30.", "path": ["PC1", "SW1", "R1", "SW1", "PC2"]}, {"t": "Staff to staff", "text": "Same VLAN. The switch forwards it. The router never sees the frame.", "path": ["PC1", "SW1", "PC3"]}], "folder": null, "beyond": null, "devices": 5, "cml": true}, {"id": "L12", "week": 3, "title": "Draw the map from CDP", "kind": "explore", "mins": 35, "story": "The network diagram is two years old and the engineer who drew it has left. You have one console session. Rebuild the map by asking the devices.", "tasks": ["Start at R1 and list its neighbours with CDP.", "Hop from device to device and record every link and port.", "Turn on LLDP and compare what it reports.", "Turn CDP off on a port that faces another company."], "twist": "CDP has been turned off on one device, and LLDP still finds it. Which of the two would you rely on in a network with more than one vendor?", "play": "The map starts with its labels hidden. Read the real CDP output and reveal each port; your map is checked against the real one.", "checks": ["Which command shows a neighbour's IP address and software version?", "Which of the two protocols is on by default on Cisco devices?", "Why would you turn CDP off on an internet-facing port?"], "cmds": ["show cdp neighbors", "show cdp neighbors detail", "lldp run", "show lldp neighbors", "no cdp enable", "no lldp transmit"], "topics": ["2.3"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 500, "y": 80, "label": "R1", "sub": ["Lo0 1.1.1.1"], "site": "HQ"}, {"id": "SW1", "kind": "switch", "x": 280, "y": 240, "label": "SW1", "sub": ["Vlan99 192.168.99.11"], "site": null}, {"id": "SW2", "kind": "switch", "x": 720, "y": 240, "label": "SW2", "sub": ["Vlan99 192.168.99.12"], "site": null}, {"id": "SW3", "kind": "switch", "x": 500, "y": 400, "label": "SW3", "sub": ["Vlan99 192.168.99.13"], "site": null}, {"id": "R2", "kind": "router", "x": 860, "y": 420, "label": "R2", "sub": ["Lo0 2.2.2.2"], "site": "Hub"}], "links": [{"a": "R1", "ai": "e0/0", "aip": null, "b": "SW1", "bi": "e0/0", "bip": null, "net": null, "kind": "eth"}, {"a": "R1", "ai": "e0/1", "aip": null, "b": "SW2", "bi": "e0/0", "bip": null, "net": null, "kind": "eth"}, {"a": "SW1", "ai": "e0/1", "aip": null, "b": ices": 5, "cml": true}, {"id": "L15", "week": 4, "title": "The desk switch", "kind": "ticket", "mins": 30, "story": "Ticket: \"My port died the moment I plugged in my own little switch.\" The access port did exactly what it had been told to do.", "tasks": ["Find the state of the port and the reason for it.", "Read the log line that explains it.", "Remove the cause, then bring the port back.", "Decide which ports in this network should have PortFast and BPDU guard, and where root guard and loop guard belong."], "twist": "After the desk switch is unplugged the port stays down. It does not heal by itself unless you configure it to.", "play": "Plug the desk switch into the map and watch the port go to err-disabled. Click the port for its log.", "checks": ["Which state does BPDU guard put a port in?", "What does PortFast let an access port skip?", "Name two ways to bring an err-disabled port back."], "cmds": ["spanning-tree portfast", "spanning-tree bpduguard enable", "show interfaces status err-disabled", "errdisable recovery cause bpduguard", "spanning-tree guard root", "spanning-tree guard loop", "spanning-tree bpdufilter enable"], "topics": ["2.5"], "topo": {"nodes": [{"id": "PC1", "kind": "pc", "x": 110, "y": 250, "label": "PC1", "sub": ["STAFF"], "site": null}, {"id": "SW1", "kind": "switch", "x": 400, "y": 250, "label": "SW1", "sub": [], "site": "Floor 1"}, {"id": "DESK", "kind": "switch", "x": 700, "y": 250, "label": "Desk switch", "sub": ["brought from home"], "site": null}, {"id": "PC2", "kind": "pc", "x": 920, "y": 250, "label": "PC2", "sub": [], "site": null}], "links": [{"a": "PC1", "ai": "eth0", "aip": "192.168.10.10", "b": "SW1", "bi": "e0/1", "bip": null, "net": "192.168.10.0/24", "kind": "access", "vlan": 10, "label": "PortFast"}, {"a": "SW1", "ai": "e0/2", "aip": null, "b": "DESK", "bi": "e0/0", "bip": null, "net": null, "kind": "eth", "label": "PortFast + BPDU guard"}, {"a": "DESK", "ai": "e0/1", "aip": null, "b": "PC2", "bi": "eth0", "bip": "192.168.1
