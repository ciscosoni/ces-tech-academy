HQ"}, {"id": "R2", "kind": "router", "x": 500, "y": 120, "label": "R2", "sub": ["Lo0 2.2.2.2"], "site": "Hub"}, {"id": "R3", "kind": "router", "x": 730, "y": 350, "label": "R3", "sub": ["Lo0 3.3.3.3"], "site": "Depot"}, {"id": "PC1", "kind": "pc", "x": 70, "y": 350, "label": "PC1", "sub": [], "site": null}, {"id": "PC2", "kind": "pc", "x": 930, "y": 350, "label": "PC2", "sub": [], "site": null}], "links": [{"a": "R1", "ai": "e0/0", "aip": "10.0.12.1", "b": "R2", "bi": "e0/0", "bip": "10.0.12.2", "net": "10.0.12.0/30", "kind": "eth", "label": "1 Gbps"}, {"a": "R2", "ai": "e0/1", "aip": "10.0.23.1", "b": "R3", "bi": "e0/0", "bip": "10.0.23.2", "net": "10.0.23.0/30", "kind": "eth", "label": "1 Gbps"}, {"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth", "label": "100 Mbps"}, {"a": "PC1", "ai": "eth0", "aip": "192.168.1.10", "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}, {"a": "PC2", "ai": "eth0", "aip": "192.168.3.10", "b": "R3", "bi": "e0/2", "bip": "192.168.3.1", "net": "192.168.3.0/24", "kind": "eth", "name": "LAN B"}], "notes": [], "h": 500}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": "The lab server's Ethernet interfaces all report 10 Mbps, so the bandwidth command stands in for the speed of the real circuits. It changes what OSPF calculates, not how fast the link is.", "status": "performed", "scenes": [{"t": "As the lab server sees it", "text": "Every Ethernet interface on the lab server reports 10 Mbps, so every link costs 10. The first job is to tell each interface the speed of its real circuit.", "path": ["PC1", "R1", "R3", "PC2"], "out": ["07_R1_default"]}, {"t": "Before: fast and very fast look alike", "text": "With the real speeds set and the default reference of 100 Mbps, the 100 Mbps circuit and the 1 Gbps circuits all cost 1. One hop beats two, so traffic takes the slower direct circuit. The metric is 11: one circuit, plus 10 for the Depot LAN.", "path": ["PC1", "R1", "R3", "PC2"], "out": ["08_R1_bandwidth", "11_R1_before", "12_PC1_before"]}, {"t": "After: the reference is 10 Gbps", "text": "With the reference bandwidth raised on all three routers, the direct circuit costs 100 and each 1 Gbps circuit costs 10. The path through the Hub wins: 10 + 10, plus 1000 for the Depot LAN, which still reports 10 Mbps.", "path": ["PC1", "R1", "R2", "R3", "PC2"], "out": ["13_R1_reference", "16_R1_after", "17_PC1_after"]}, {"t": "A cost typed by hand", "text": "A cost of 5 typed on the direct interface overrides the calculation, and the traffic moves back. Removing it returns the decision to the bandwidths.", "path": ["PC1", "R1", "R3", "PC2"], "out": ["18_R1_manual"]}], "folder": "ccna-l25-ospf-cost", "beyond": null, "devices": 5, "cml": true, "steps": [{"id": "01_R1_base", "dev": "R1", "title": "R1: starting configuration: the working network of lab L22", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R1\nR1(config)#no ip domain-lookup\nR1(config)#interface Loopback0\nR1(config-if)# ip address 1.1.1.1 255.255.255.255\nR1(config-if)#interface Ethernet0/0\nR1(config-if)# description Link to R2\nR1(config-if)# ip address 10.0.12.1 255.255.255.252\nR1(config-if)#\n*Oct  6 10:43:49.558: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR1(config-if)# ip ospf network point-to-point\nR1(config-if)# no shutdown\nR1(config-if)#interface Ethernet0/1\nR1(config-if)# description Link to R3\nR1(config-if)# ip address 10.0.13.1 255.255.255.252\nR1(config-if)# ip ospf network point-to-point\nR1(config-if)# no shutdown\nR1(config-if)#interface Ethernet0/2\nR1(config-if)#\n*Oct  6 10:43:53.573: %LINK-3-UPDOWN: Interface Ethernet0/0, changed state to up\nR1(config-if)# description LAN A\nR1(config-if)# ip address 192.168.1.1 255.255.255.0\nR1(config-if)#\n*Oct  6 10:43:54.579: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/0, changed state to up\nR1(config-if)# no shutdown\nR1(config-if)#router ospf 1\nR1(config-router)# router-id 1.1.1.1\nR1(config-router)# passive-interface Ethernet0/2\nR1(config-router)#\n*Oct  6 10:43:56.084: %LINK-3-UPDOWN: Interface Ethernet0/1, changed state to up\n*Oct  6 10:43:57.088: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/1, changed state to up\nR1(config-router)# network 1.1.1.1 0.0.0.0 area 0\nR1(config-router)# network 10.0.12.0 0.0.0.3 area 0\nR1(config-router)# network 10.0.13.0 0.0.0.3 area 0\nR1(config-router)# network 192.168.1.0 0.0.0.255 area 0\nR1(config-router)#\n*Oct  6 10:43:58.094: %LINK-3-UPDOWN: Interface Ethernet0/2, changed state to up\n*Oct  6 10:43:59.102: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/2, changed state to up\nR1(config-router)#end\nR1#"}, {"id": "02_R2_base", "dev": "R2", "title": "R2: starting configuration: the working network of lab L22", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R2\nR2(config)#no ip domain-lookup\nR2(config)#interface Loopback0\nR2(config-if)# ip address 2.2.2.2 255.255.255.255\nR2(config-if)#interface Ethernet0/0\nR2(config-if)# description Link to R1\nR2(config-if)# ip address 10.0.12.2 255.255.255.252\nR2(config-if)#\n*Oct  6 10:44:16.662: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR2(config-if)# ip ospf network point-to-point\nR2(config-if)# no shutdown\nR2(config-if)#interface Ethernet0/1\nR2(config-if)# description Link to R3\nR2(config-if)# ip address 10.0.23.1 255.255.255.252\nR2(config-if)# no shutdown\nR2(config-if)#router ospf 1\nR2(config-router)# router-id 2.2.2.2\nR2(config-router)#\n*Oct  6 10:44:20.678: %LINK-3-UPDOWN: Interface Ethernet0/0, changed state to up\n*Oct  6 10:44:21.679: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/0, changed state to up\nR2(config-router)# network 2.2.2.2 0.0.0.0 area 0\nR2(config-router)# network 10.0.12.0 0.0.0.3 area 0\nR2(config-router)# network 10.0.23.0 0.0.0.3 area 0\nR2(config-router)#end\nR2#\n*Oct  6 10:44:22.692: %LINK-3-UPDOWN: Interface Ethernet0/1, changed state to up\n*Oct  6 10:44:23.696: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/1, changed state to up\n*Oct  6 10:44:23.705: %SYS-5-CONFIG_I: Configured from console by console\nR2#"}, {"id": "03_R3_base", "dev": "R3", "title": "R3: starting configuration: the working network of lab L22", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R3\nR3(config)#no ip domain-lookup\nR3(config)#interface Loopback0\nR3(config-if)# ip address 3.3.3.3 255.255.255.255\nR3(config-if)#interface Ethernet0/0\nR3(config-if)# description Link to R2\nR3(config-if)# ip address 10.0.23.2 255.255.255.252\nR3(config-if)# no shutdown\nR3(config-if)#\n*Oct  6 10:44:47.287: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR3(config-if)#interface Ethernet0/1\nR3(config-if)# description Link to R1\nR3(config-if)# ip address 10.0.13.2 255.255.255.252\nR3(config-if)# ip ospf network point-to-point\nR3(config-if)# no shutdown\nR3(config-if)#interface Ethernet0/2\nR3(config-if)#\n*Oct  6 10:44:50.804: %LINK-3-UPDOWN: Interface Ethernet0/0, changed state to up\n*Oct  6 10:44:51.811: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/0, changed state to up\nR3(config-if)# description LAN B\nR3(config-if)# ip address 192.168.3.1 255.255.255.0\nR3(config-if)# no shutdown\nR3(config-if)#router ospf 1\nR3(config-router)# router-id 3.3.3.3\nR3(config-router)# passive-interface Ethernet0/2\nR3(config-router)#\n*Oct  6 10:44:53.313: %LINK-3-UPDOWN: Interface Ethernet0/1, changed state to up\nR3(config-router)# network 3.3.3.3 0.0.0.0 area 0\nR3(config-router)# network 10.0.23.0 0.0.0.3 area 0\nR3(config-router)#\n*Oct  6 10:44:54.318: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/1, changed state to up\n*Oct  6 10:44:55.331: %LINK-3-UPDOWN: Interface Ethernet0/2, changed state to up\nR3(config-router)# network 10.0.13.0 0.0.0.3 area 0\nR3(config-router)# network 192.168.3.0 0.0.0.255 area 0\nR3(config-router)#end\nR3#"}, {"id": "04_PC1_base", "dev": "PC1", "title": "PC1: address", "text": "VPCS> ip 192.168.1.10/24 192.168.1.1\nChecking for duplicate address...\nPC1 : 192.168.1.10 255.255.255.0 gateway 192.168.1.1\n\nVPCS> show ip\n\nNAME        : VPCS[1]\nIP/MASK     : 192.168.1.10/24\nGATEWAY     : 192.168.1.1\nDNS         : \nMAC         : 00:50:79:66:68:73\nLPORT       : 20000\nRHOST:PORT  : 127.0.0.1:30000\nMTU         : 1500\n\nVPCS> "}, {"id": "05_PC2_base", "dev": "PC2", "title": "PC2: address", "text": "VPCS> ip 192.168.3.10/24 192.168.3.1\nChecking for duplicate address...\nPC1 : 192.168.3.10 255.255.255.0 gateway 192.168.3.1\n\nVPCS> show ip\n\nNAME        : VPCS[1]\nIP/MASK     : 192.168.3.10/24\nGATEWAY     : 192.168.3.1\nDNS         : \nMAC         : 00:50:79:66:68:74\nLPORT       : 20000\nRHOST:PORT  : 127.0.0.1:30000\nMTU         : 1500\n\nVPCS> "}, {"id": "07_R1_default", "dev": "R1", "title": "R1: costs as the lab server reports them (every Ethernet interface says 10 Mbps)", "text": "R1#show interfaces Ethernet0/1 | include BW\n  MTU 1500 bytes, BW 10000 Kbit/sec, DLY 1000 usec, \nR1#show ip ospf interface brief\nInterface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C\nLo0          1     0               1.1.1.1/32         1     LOOP  0/0\nEt0/2        1     0               192.168.1.1/24     10    DR    0/0\nEt0/1        1     0               10.0.13.1/30       10    P2P   1/1\nEt0/0        1     0               10.0.12.1/30       10    P2P   1/1\nR1#show ip route 192.168.3.0\nRouting entry for 192.168.3.0/24\n  Known via \"ospf 1\", distance 110, metric 20, type intra area\n  Last update from 10.0.13.2 on Ethernet0/1, 00:00:53 ago\n  Routing Descriptor Blocks:\n  * 10.0.13.2, from 3.3.3.3, 00:00:53 ago, via Ethernet0/1\n      Route metric is 20, traffic share count is 1\nR1#"}, {"id": "08_R1_bandwidth", "dev": "R1", "title": "R1: the real speed of each circuit", "text": "R1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#interface Ethernet0/0\nR1(config-if)# bandwidth 1000000\nR1(config-if)#interface Ethernet0/1\nR1(config-if)# bandwidth 100000\nR1(config-if)#end\nR1#"}, {"id": "09_R2_bandwidth", "dev": "R2", "title": "R2: the real speed of each circuit", "text": "R2#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR2(config)#interface Ethernet0/0\nR2(config-if)# bandwidth 1000000\nR2(config-if)#interface Ethernet0/1\nR2(config-if)# bandwidth 1000000\nR2(config-if)#end\nR2#"}, {"id": "10_R3_bandwidth", "dev": "R3", "title": "R3: the real speed of each circuit", "text": "R3#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR3(config)#interface Ethernet0/0\nR3(config-if)# bandwidth 1000000\nR3(config-if)#interface Ethernet0/1\nR3(config-if)# bandwidth 100000\nR3(config-if)#end\nR3#"}, {"id": "11_R1_before", "dev": "R1", "title": "R1: with the default reference bandwidth, 100 Mbps and 1 Gbps cost the same", "text": "R1#show ip ospf interface brief\nInterface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C\nLo0          1     0               1.1.1.1/32         1     LOOP  0/0\nEt0/2        1     0               192.168.1.1/24     10    DR    0/0\nEt0/1        1     0               10.0.13.1/30       1     P2P   1/1\nEt0/0        1     0               10.0.12.1/30       1     P2P   1/1\nR1#show ip route 192.168.3.0\nRouting entry for 192.168.3.0/24\n  Known via \"ospf 1\", distance 110, metric 11, type intra area\n  Last update from 10.0.13.2 on Ethernet0/1, 00:00:18 ago\n  Routing Descriptor Blocks:\n  * 10.0.13.2, from 3.3.3.3, 00:00:18 ago, via Ethernet0/1\n      Route metric is 11, traffic share count is 1\nR1#"}, {"id": "12_PC1_before", "dev": "PC1", "title": "PC1: the path before the change", "text": "VPCS> trace 192.168.3.10\ntrace to 192.168.3.10, 8 hops max, press Ctrl+C to stop\n 1   192.168.1.1   0.550 ms  0.278 ms  0.717 ms\n 2   10.0.13.2   0.706 ms  0.790 ms  0.694 ms\n 3   *192.168.3.10   1.274 ms (ICMP type:3, code:3, Destination port unreachable)\n\nVPCS> "}, {"id": "13_R1_reference", "dev": "R1", "title": "R1: reference bandwidth raised to 10 Gbps", "text": "R1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#router ospf 1\nR1(config-router)# auto-cost reference-bandwidth 10000\n% OSPF: Reference bandwidth is changed. \n        Please ensure reference bandwidth is consistent across all routers.\nR1(config-router)#end\nR1#"}, {"id": "14_R2_reference", "dev": "R2", "title": "R2: reference bandwidth raised to 10 Gbps", "text": "R2#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR2(config)#router ospf 1\nR2(config-router)# auto-cost reference-bandwidth 10000\n% OSPF: Reference bandwidth is changed. \n        Please ensure reference bandwidth is consistent across all routers.\nR2(config-router)#end\nR2#"}, {"id": "15_R3_reference", "dev": "R3", "title": "R3: reference bandwidth raised to 10 Gbps", "text": "R3#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR3(config)#router ospf 1\nR3(config-router)# auto-cost reference-bandwidth 10000\n% OSPF: Reference bandwidth is changed. \n        Please ensure reference bandwidth is consistent across all routers.\nR3(config-router)#end\nR3#"}, {"id": "16_R1_after", "dev": "R1", "title": "R1: the costs now tell the circuits apart", "text": "R1#show ip ospf interface brief\nInterface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C\nLo0          1     0               1.1.1.1/32         1     LOOP  0/0\nEt0/2        1     0               192.168.1.1/24     1000  DR    0/0\nEt0/1        1     0               10.0.13.1/30       100   P2P   1/1\nEt0/0        1     0               10.0.12.1/30       10    P2P   1/1\nR1#show ip route 192.168.3.0\nRouting entry for 192.168.3.0/24\n  Known via \"ospf 1\", distance 110, metric 1020, type intra area\n  Last update from 10.0.12.2 on Ethernet0/0, 00:00:08 ago\n  Routing Descriptor Blocks:\n  * 10.0.12.2, from 3.3.3.3, 00:00:08 ago, via Ethernet0/0\n      Route metric is 1020, traffic share count is 1\nR1#show ip route ospf | begin Gateway\nGateway of last resort is not set\n\n      2.0.0.0/32 is subnetted, 1 subnets\nO        2.2.2.2 [110/11] via 10.0.12.2, 00:00:19, Ethernet0/0\n      3.0.0.0/32 is subnetted, 1 subnets\nO        3.3.3.3 [110/21] via 10.0.12.2, 00:00:19, Ethernet0/0\n      10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks\nO        10.0.23.0/30 [110/20] via 10.0.12.2, 00:00:19, Ethernet0/0\nO     192.168.3.0/24 [110/1020] via 10.0.12.2, 00:00:09, Ethernet0/0\nR1#"}, {"id": "17_PC1_after", "dev": "PC1", "title": "PC1: the path after the change", "text": "VPCS> trace 192.168.3.10\ntrace to 192.168.3.10, 8 hops max, press Ctrl+C to stop\n 1   192.168.1.1   0.715 ms  0.307 ms  0.464 ms\n 2   10.0.12.2   1.085 ms  0.509 ms  0.721 ms\n 3   10.0.23.2   0.738 ms  0.682 ms  0.642 ms\n 4   *192.168.3.10   1.219 ms (ICMP type:3, code:3, Destination port unreachable)\n\nVPCS> "}, {"id": "18_R1_manual", "dev": "R1", "title": "R1: a cost typed by hand overrides the calculation", "text": "R1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#interface Ethernet0/1\nR1(config-if)# ip ospf cost 5\nR1(config-if)#end\nR1#\n*Oct  6 10:47:01.859: %SYS-5-CONFIG_I: Configured from console by console\nR1#show ip ospf interface brief\nInterface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C\nLo0          1     0               1.1.1.1/32         1     LOOP  0/0\nEt0/2        1     0               192.168.1.1/24     1000  DR    0/0\nEt0/1        1     0               10.0.13.1/30       5     P2P   1/1\nEt0/0        1     0               10.0.12.1/30       10    P2P   1/1\nR1#show ip route 192.168.3.0\nRouting entry for 192.168.3.0/24\n  Known via \"ospf 1\", distance 110, metric 1005, type intra area\n  Last update from 10.0.13.2 on Ethernet0/1, 00:00:08 ago\n  Routing Descriptor Blocks:\n  * 10.0.13.2, from 3.3.3.3, 00:00:08 ago, via Ethernet0/1\n      Route metric is 1005, traffic share count is 1\nR1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#interface Ethernet0/1\nR1(config-if)# no ip ospf cost\nR1(config-if)#end\nR1#\n*Oct  6 10:47:16.887: %SYS-5-CONFIG_I: Configured from console by console\nR1#show ip route 192.168.3.0\nRouting entry for 192.168.3.0/24\n  Known via \"ospf 1\", distance 110, metric 1020, type intra area\n  Last update from 10.0.12.2 on Ethernet0/0, 00:00:07 ago\n  Routing Descriptor Blocks:\n  * 10.0.12.2, from 3.3.3.3, 00:00:07 ago, via Ethernet0/0\n      Route metric is 1020, traffic share count is 1\nR1#"}, {"id": "19_R1_config", "dev": "R1", "title": "final configuration", "text": "R1#show running-config | section interface Ethernet0/[01]|router ospf\ninterface Ethernet0/0\n description Link to R2\n bandwidth 1000000\n ip address 10.0.12.1 255.255.255.252\n ip ospf network point-to-point\ninterface Ethernet0/1\n description Link to R3\n bandwidth 100000\n ip address 10.0.13.1 255.255.255.252\n ip ospf network point-to-point\nrouter ospf 1\n router-id 1.1.1.1\n auto-cost reference-bandwidth 10000\n passive-interface Ethernet0/2\n network 1.1.1.1 0.0.0.0 area 0\n network 10.0.12.0 0.0.0.3 area 0\n network 10.0.13.0 0.0.0.3 area 0\n network 192.168.1.0 0.0.0.255 area 0\nR1#"}, {"id": "19_R2_config", "dev": "R2", "title": "final configuration", "text": "R2#show running-config | section interface Ethernet0/[01]|router ospf\ninterface Ethernet0/0\n description Link to R1\n bandwidth 1000000\n ip address 10.0.12.2 255.255.255.252\n ip ospf network point-to-point\ninterface Ethernet0/1\n description Link to R3\n bandwidth 1000000\n ip address 10.0.23.1 255.255.255.252\nrouter ospf 1\n router-id 2.2.2.2\n auto-cost reference-bandwidth 10000\n network 2.2.2.2 0.0.0.0 area 0\n network 10.0.12.0 0.0.0.3 area 0\n network 10.0.23.0 0.0.0.3 area 0\nR2#"}, {"id": "19_R3_config", "dev": "R3", "title": "final configuration", "text": "R3#show running-config | section interface Ethernet0/[01]|router ospf\ninterface Ethernet0/0\n description Link to R2\n bandwidth 1000000\n ip address 10.0.23.2 255.255.255.252\ninterface Ethernet0/1\n description Link to R1\n bandwidth 100000\n ip address 10.0.13.2 255.255.255.252\n ip ospf network point-to-point\nrouter ospf 1\n router-id 3.3.3.3\n auto-cost reference-bandwidth 10000\n passive-interface Ethernet0/2\n network 3.3.3.3 0.0.0.0 area 0\n network 10.0.13.0 0.0.0.3 area 0\n network 10.0.23.0 0.0.0.3 area 0\n network 192.168.3.0 0.0.0.255 area 0\nR3#"}]}, {"id": "L25b", "week": 6, "title": "A default route for everyone", "kind": "build", "mins": 25, "story": "Every depot needs the way out to the internet, and there is only one exit: at head office. You do not type a default route on fifteen routers. You type one command on one.", "tasks": ["Give R1 a default route towards the internet provider.", "Advertise it into OSPF and find it on R2 and R3.", "Trace an internet address from the Depot.", "Fail the internet link and watch the default route disappear everywhere.", "Try the same with the word \"always\", and decide when you would want it."], "twist": "When head office loses its exit, every depot loses its default route within seconds. That is the behaviour you want.", "play": "Step through the scenes. The path from the Depot towards the internet appears, vanishes and returns with the default route.", "checks": ["What do the letters O*E2 in the routing table tell you?", "The default route has metric 1 on R2 and on R3. Why does it not grow with the distance?", "What does the word \"always\" change, and how do you remove it again?"], "cmds": ["ip route 0.0.0.0 0.0.0.0 203.0.113.1", "default-information originate", "default-information originate always", "show ip route | begin Gateway", "show ip route 0.0.0.0"], "topics": ["3.4", "3.3"], "topo": {"nodes": [{"id": "R1", "kind": "router", "x": 270, "y": 350, "label": "R1", "sub": ["Lo0 1.1.1.1", "Lo1 203.0.113.2: the internet exit"], "site": "HQ"}, {"id": "R2", "kind": "router", "x": 500, "y": 120, "label": "R2", "sub": ["Lo0 2.2.2.2"], "site": "Hub"}, {"id": "R3", "kind": "router", "x": 730, "y": 350, "label": "R3", "sub": ["Lo0 3.3.3.3"], "site": "Depot"}, {"id": "PC1", "kind": "pc", "x": 70, "y": 350, "label": "PC1", "sub": [], "site": null}, {"id": "PC2", "kind": "pc", "x": 930, "y": 350, "label": "PC2", "sub": [], "site": null}], "links": [{"a": "R1", "ai": "e0/0", "aip": "10.0.12.1", "b": "R2", "bi": "e0/0", "bip": "10.0.12.2", "net": "10.0.12.0/30", "kind": "eth", "label": null}, {"a": "R2", "ai": "e0/1", "aip": "10.0.23.1", "b": "R3", "bi": "e0/0", "bip": "10.0.23.2", "net": "10.0.23.0/30", "kind": "eth", "label": null}, {"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth", "label": null}, {"a": "PC1", "ai": "eth0", "aip": "192.168.1.10", "b": "R1", "bi": "e0/2", "bip": "192.168.1.1", "net": "192.168.1.0/24", "kind": "eth", "name": "LAN A"}, {"a": "PC2", "ai": "eth0", "aip": "192.168.3.10", "b": "R3", "bi": "e0/2", "bip": "192.168.3.1", "net": "192.168.3.0/24", "kind": "eth", "name": "LAN B"}], "notes": [], "h": 500}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": "A loopback interface on R1 stands in for the link to the internet provider. The lab continues from lab L25, so the Depot reaches head office through the Hub.", "status": "performed", "scenes": [{"t": "No way out", "text": "R1 has a default route towards the internet provider. The Depot has none: \"Gateway of last resort is not set\".", "path": ["PC2", "R3"], "stop": "R3", "out": ["01_R1_internet", "02_R3_before"]}, {"t": "One command at head office", "text": "R1 advertises its default route into OSPF. Every router learns it as an external route, marked O*E2, and a packet for an internet address finds its way to head office.", "path": ["PC2", "R3", "R2", "R1"], "badges": {"R1": "internet exit"}, "out": ["03_R1_originate", "04_R3_after", "05_R2_after", "06_PC2_out"]}, {"t": "The exit fails", "text": "The internet link at head office goes down. R1 loses its own default route and withdraws it from everyone. The depots stop sending internet traffic to a router that cannot deliver it.", "path": ["PC2", "R3"], "stop": "R3", "badges": {"R1": "no exit"}, "out": ["07_R1_exitfails", "08_R3_withdrawn"]}, {"t": "With \"always\"", "text": "With the word \"always\", R1 advertises a default route whether it has one or not. Typing the command again without the word does not remove it: the command has to be taken out and entered again.", "path": ["PC2", "R3", "R2", "R1"], "out": ["09_R1_always", "10_R3_always", "11_R1_restore", "12_R1_tidy", "13_R3_tidy"]}], "folder": "ccna-w6-default-route", "beyond": null, "devices": 5, "cml": true, "steps": [{"id": "01_R1_internet", "dev": "R1", "title": "R1: the way out to the internet (a loopback stands in for the provider link)", "text": "R1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#interface Loopback1\nR1(config-if)# description Stands in for the link to the internet provider\nR1(config-if)# ip address 203.0.113.2 255.255.255.252\nR1(config-if)#ip route 0.0.0.0 0.0.0.0 203.0.113.1\nR1(config)#end\nR1#\n*Oct  6 10:48:39.770: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback1, changed state to up\n*Oct  6 10:48:40.775: %SYS-5-CONFIG_I: Configured from console by console\nR1#show ip route static | begin Gateway\nGateway of last resort is 203.0.113.1 to network 0.0.0.0\n\nS*    0.0.0.0/0 [1/0] via 203.0.113.1\nR1#"}, {"id": "02_R3_before", "dev": "R3", "title": "R3: before, the Depot has no way out", "text": "R3#show ip route | begin Gateway\nGateway of last resort is not set\n\n      1.0.0.0/32 is subnetted, 1 subnets\nO        1.1.1.1 [110/21] via 10.0.23.1, 00:01:54, Ethernet0/0\n      2.0.0.0/32 is subnetted, 1 subnets\nO        2.2.2.2 [110/11] via 10.0.23.1, 00:01:54, Ethernet0/0\n      3.0.0.0/32 is subnetted, 1 subnets\nC        3.3.3.3 is directly connected, Loopback0\n      10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks\nO        10.0.12.0/30 [110/20] via 10.0.23.1, 00:01:54, Ethernet0/0\nC        10.0.13.0/30 is directly connected, Ethernet0/1\nL        10.0.13.2/32 is directly connected, Ethernet0/1\nC        10.0.23.0/30 is directly connected, Ethernet0/0\nL        10.0.23.2/32 is directly connected, Ethernet0/0\nO     192.168.1.0/24 [110/1020] via 10.0.23.1, 00:01:54, Ethernet0/0\n      192.168.3.0/24 is variably subnetted, 2 subnets, 2 masks\nC        192.168.3.0/24 is directly connected, Ethernet0/2\nL        192.168.3.1/32 is directly connected, Ethernet0/2\nR3#"}, {"id": "03_R1_originate", "dev": "R1", "title": "R1: tell everyone about the default route", "text": "R1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#router ospf 1\nR1(config-router)# default-information originate\nR1(config-router)#end\nR1#"}, {"id": "04_R3_after", "dev": "R3", "title": "R3: the Depot has learned a default route", "text": "R3#show ip route | begin Gateway\nGateway of last resort is 10.0.23.1 to network 0.0.0.0\n\nO*E2  0.0.0.0/0 [110/1] via 10.0.23.1, 00:00:08, Ethernet0/0\n      1.0.0.0/32 is subnetted, 1 subnets\nO        1.1.1.1 [110/21] via 10.0.23.1, 00:02:10, Ethernet0/0\n      2.0.0.0/32 is subnetted, 1 subnets\nO        2.2.2.2 [110/11] via 10.0.23.1, 00:02:10, Ethernet0/0\n      3.0.0.0/32 is subnetted, 1 subnets\nC        3.3.3.3 is directly connected, Loopback0\n      10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks\nO        10.0.12.0/30 [110/20] via 10.0.23.1, 00:02:10, Ethernet0/0\nC        10.0.13.0/30 is directly connected, Ethernet0/1\nL        10.0.13.2/32 is directly connected, Ethernet0/1\nC        10.0.23.0/30 is directly connected, Ethernet0/0\nL        10.0.23.2/32 is directly connected, Ethernet0/0\nO     192.168.1.0/24 [110/1020] via 10.0.23.1, 00:02:10, Ethernet0/0\n      192.168.3.0/24 is variably subnetted, 2 subnets, 2 masks\nC        192.168.3.0/24 is directly connected, Ethernet0/2\nL        192.168.3.1/32 is directly connected, Ethernet0/2\nR3#show ip route 0.0.0.0\nRouting entry for 0.0.0.0/0, supernet\n  Known via \"ospf 1\", distance 110, metric 1, candidate default path\n  Tag 1, type extern 2, forward metric 20\n  Last update from 10.0.23.1 on Ethernet0/0, 00:00:09 ago\n  Routing Descriptor Blocks:\n  * 10.0.23.1, from 1.1.1.1, 00:00:09 ago, via Ethernet0/0\n      Route metric is 1, traffic share count is 1\n      Route tag 1\nR3#"}, {"id": "05_R2_after", "dev": "R2", "title": "R2: so has the Hub", "text": "R2#show ip route ospf | include 0.0.0.0\nGateway of last resort is 10.0.12.1 to network 0.0.0.0\nO*E2  0.0.0.0/0 [110/1] via 10.0.12.1, 00:00:10, Ethernet0/0\n      10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks\nR2#"}, {"id": "06_PC2_out", "dev": "PC2", "title": "PC2: a packet for an internet address now finds its way to head office", "text": "VPCS> trace 198.51.100.10 -m 4\ntrace to 198.51.100.10, 4 hops max, press Ctrl+C to stop\n 1   192.168.3.1   0.166 ms  0.269 ms  0.135 ms\n 2   10.0.23.1   0.496 ms  0.489 ms  0.370 ms\n 3   10.0.12.1   1.437 ms  0.685 ms  0.714 ms\n 4     *  *  *\n\nVPCS> "}, {"id": "07_R1_exitfails", "dev": "R1", "title": "R1: the internet link fails", "text": "R1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#interface Loopback1\nR1(config-if)# shutdown\nR1(config-if)#end\nR1#\n*Oct  6 10:49:08.483: %SYS-5-CONFIG_I: Configured from console by console\nR1#\n*Oct  6 10:49:09.988: %LINK-5-CHANGED: Interface Loopback1, changed state to administratively down\n*Oct  6 10:49:10.993: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback1, changed state to down\nR1#show ip route static | begin Gateway\nGateway of last resort is not set\n\nR1#"}, {"id": "08_R3_withdrawn", "dev": "R3", "title": "R3: the default route has been withdrawn", "text": "R3#show ip route | begin Gateway\nGateway of last resort is not set\n\n      1.0.0.0/32 is subnetted, 1 subnets\nO        1.1.1.1 [110/21] via 10.0.23.1, 00:02:35, Ethernet0/0\n      2.0.0.0/32 is subnetted, 1 subnets\nO        2.2.2.2 [110/11] via 10.0.23.1, 00:02:35, Ethernet0/0\n      3.0.0.0/32 is subnetted, 1 subnets\nC        3.3.3.3 is directly connected, Loopback0\n      10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks\nO        10.0.12.0/30 [110/20] via 10.0.23.1, 00:02:35, Ethernet0/0\nC        10.0.13.0/30 is directly connected, Ethernet0/1\nL        10.0.13.2/32 is directly connected, Ethernet0/1\nC        10.0.23.0/30 is directly connected, Ethernet0/0\nL        10.0.23.2/32 is directly connected, Ethernet0/0\nO     192.168.1.0/24 [110/1020] via 10.0.23.1, 00:02:35, Ethernet0/0\n      192.168.3.0/24 is variably subnetted, 2 subnets, 2 masks\nC        192.168.3.0/24 is directly connected, Ethernet0/2\nL        192.168.3.1/32 is directly connected, Ethernet0/2\nR3#"}, {"id": "09_R1_always", "dev": "R1", "title": "R1: with \"always\", the default is advertised even when R1 has none itself", "text": "R1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#router ospf 1\nR1(config-router)# default-information originate always\nR1(config-router)#end\nR1#"}, {"id": "10_R3_always", "dev": "R3", "title": "R3: the default is back, although head office has no exit", "text": "R3#show ip route ospf | include 0.0.0.0\nGateway of last resort is 10.0.23.1 to network 0.0.0.0\nO*E2  0.0.0.0/0 [110/1] via 10.0.23.1, 00:00:12, Ethernet0/0\n      10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks\nR3#"}, {"id": "11_R1_restore", "dev": "R1", "title": "R1: the link returns. Typing the command again without \"always\" does not remove it", "text": "R1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#interface Loopback1\nR1(config-if)# no shutdown\nR1(config-if)#router ospf 1\nR1(config-router)# default-information originate\nR1(config-router)#end\nR1#show running-config | section router ospf\nrouter ospf 1\n router-id 1.1.1.1\n auto-cost reference-bandwidth 10000\n passive-interface Ethernet0/2\n network 1.1.1.1 0.0.0.0 area 0\n network 10.0.12.0 0.0.0.3 area 0\n network 10.0.13.0 0.0.0.3 area 0\n network 192.168.1.0 0.0.0.255 area 0\n default-information originate always\nR1#"}, {"id": "12_R1_tidy", "dev": "R1", "title": "R1: to drop \"always\", remove the command and enter it again", "text": "R1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#router ospf 1\nR1(config-router)# no default-information originate\nR1(config-router)# default-information originate\nR1(config-router)#end\nR1#show running-config | section router ospf\nrouter ospf 1\n router-id 1.1.1.1\n auto-cost reference-bandwidth 10000\n passive-interface Ethernet0/2\n network 1.1.1.1 0.0.0.0 area 0\n network 10.0.12.0 0.0.0.3 area 0\n network 10.0.13.0 0.0.0.3 area 0\n network 192.168.1.0 0.0.0.255 area 0\n default-information originate\nR1#"}, {"id": "13_R3_tidy", "dev": "R3", "title": "R3: half a minute later the default route is back, because head office has its exit again", "text": "R3#show ip route ospf | include 0.0.0.0\nGateway of last resort is 10.0.23.1 to network 0.0.0.0\nO*E2  0.0.0.0/0 [110/1] via 10.0.23.1, 00:00:09, Ethernet0/0\n      10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks\nR3#"}]}, {"id": "L26", "week": 6, "title": "Gateway failover", "kind": "build", "mins": 40, "story": "HQ's gateway router rebooted last month and 300 PCs lost the network for four minutes, although a second router sat right beside it. You give the PCs a gateway that does not live on one router.", "tasks": ["Configure HSRP on both gateways with one virtual address.", "Check which router is active and which is standby.", "Start a long ping from the PC and shut the active router's LAN interface.", "Bring it back and see whether it takes the role back."], "twist": "The PC's gateway address never changes, and neither does the MAC address in its ARP table.", "play": "Fail the active gateway on the map. The active marker moves to the other router, and the real ping shows how many packets it cost.", "checks": ["Which address do the PCs use as their gateway: R1's, R2's or the virtual one?", "Three pings were lost during the failure. Which HSRP timer explains most of that gap?", "R1 took the role back when it returned. Which command made that happen?", "Name two other first hop redundancy protocols."], "cmds": ["standby 1 ip 192.168.1.1", "standby 1 priority 110", "standby 1 preempt", "show standby brief", "show standby", "show arp   (VPCS)"], "topics": ["3.5"], "topo": {"nodes": [{"id": "R3", "kind": "router", "x": 500, "y": 70, "label": "R3", "sub": ["Lo0 3.3.3.3"], "site": "Upstream"}, {"id": "R1", "kind": "router", "x": 300, "y": 220, "label": "R1", "sub": ["HSRP priority 110"], "site": "Gateway A", "lp": "l"}, {"id": "R2", "kind": "router", "x": 700, "y": 220, "label": "R2", "sub": ["HSRP priority 100"], "site": "Gateway B", "lp": "r"}, {"id": "HUB", "kind": "hub", "x": 500, "y": 350, "label": "Switch", "sub": [], "site": null}, {"id": "PC1", "kind": "pc", "x": 500, "y": 470, "label": "PC1", "sub": [], "site": null}], "links": [{"a": "R1", "ai": "e0/1", "aip": "10.0.13.1", "b": "R3", "bi": "e0/1", "bip": "10.0.13.2", "net": "10.0.13.0/30", "kind": "eth"}, {"a": "R2", "ai": "e0/1", "aip": "10.0.23.1", "b": "R3", "bi": "e0/0", "bip": "10.0.23.2", "net": "10.0.23.0/30", "kind": "eth"}, {"a": "R1", "ai": "e0/2", "aip": "192.168.1.2", "b": "HUB", "bi": "", "bip": null, "net": "192.168.1.0/24", "kind": "eth", "quiet": true}, {"a": "R2", "ai": "e0/2", "aip": "192.168.1.3", "b": "HUB", "bi": "", "bip": null, "net": "192.168.1.0/24", "kind": "eth", "quiet": true}, {"a": "HUB", "ai": "", "aip": null, "b": "PC1", "bi": "eth0", "bip": "192.168.1.10", "net": "192.168.1.0/24", "kind": "access", "quiet": true}], "notes": [{"x": 720, "y": 380, "lines": ["virtual gateway", "192.168.1.1", "the PC never knows", "which router answered"], "anchor": "start", "cls": "hand"}], "h": 540}, "images": ["Cisco IOL router", "VPCS host"], "runs": "eve", "needs": null, "status": "performed", "scenes": [{"t": "Normal", "text": "R1 is active and answers for the virtual gateway 192.168.1.1. For the gateway 192.168.1.1, the PC's ARP table holds the virtual MAC address 0000.0c07.ac01, not R1's own. In R1's first output the standby router is still unknown: R2 needs a few more seconds to work its way up to standby.", "path": ["PC1", "HUB", "R1", "R3"], "badges": {"R1": "active", "R2": "standby"}, "out": ["09_R1_state", "10_R2_state", "11_PC1_normal"]}, {"t": "Gateway A fails", "text": "R1's LAN interface goes down in the middle of a forty-packet ping. Three packets are lost while R2 waits for the rest of its ten-second hold time. Then R2 is active, with the same address and the same MAC address.", "down": ["R1-HUB"], "path": ["PC1", "HUB", "R2", "R3"], "badges": {"R2": "active"}, "out": ["12_PC1_during", "12_R1_fail", "13_R2_active", "14_PC1_after"]}, {"t": "Gateway A returns", "text": "R1 has the higher priority and is allowed to pre-empt, so it takes the role back at once. This time not one ping is lost.", "path": ["PC1", "HUB", "R1", "R3"], "badges": {"R1": "active", "R2": "standby"}, "out": ["15_PC1_return", "15_R1_return", "16_R2_back"]}], "folder": "ccna-l26-hsrp", "beyond": "The exam asks you to describe what first hop redundancy is for. Configuring HSRP is beyond it; one failover watched live makes the idea stick.", "devices": 4, "cml": true, "steps": [{"id": "01_R1_base", "dev": "R1", "title": "R1: starting configuration (gateway A)", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R1\nR1(config)#no ip domain-lookup\nR1(config)#interface Loopback0\nR1(config-if)# ip address 1.1.1.1 255.255.255.255\nR1(config-if)#interface Ethernet0/1\nR1(config-if)# description Uplink to R3\nR1(config-if)# ip address 10.0.13.1 255.255.255.252\nR1(config-if)#\n*Oct  6 10:43:50.082: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR1(config-if)# ip ospf network point-to-point\nR1(config-if)# no shutdown\nR1(config-if)#interface Ethernet0/2\nR1(config-if)# description LAN A\nR1(config-if)# ip address 192.168.1.2 255.255.255.0\nR1(config-if)# no shutdown\nR1(config-if)#router ospf 1\nR1(config-router)# router-id 1.1.1.1\nR1(config-router)# passive-interface Ethernet0/2\nR1(config-router)# network 1.1.1.1 0.0.0.0 area 0\nR1(config-router)#\n*Oct  6 10:43:54.095: %LINK-3-UPDOWN: Interface Ethernet0/1, changed state to up\n*Oct  6 10:43:55.096: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/1, changed state to up\nR1(config-router)# network 10.0.13.0 0.0.0.3 area 0\nR1(config-router)# network 192.168.1.0 0.0.0.255 area 0\nR1(config-router)#\n*Oct  6 10:43:56.105: %LINK-3-UPDOWN: Interface Ethernet0/2, changed state to up\nR1(config-router)#end\nR1#"}, {"id": "02_R2_base", "dev": "R2", "title": "R2: starting configuration (gateway B)", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R2\nR2(config)#no ip domain-lookup\nR2(config)#interface Loopback0\nR2(config-if)# ip address 2.2.2.2 255.255.255.255\nR2(config-if)#interface Ethernet0/1\nR2(config-if)# description Uplink to R3\nR2(config-if)# ip address 10.0.23.1 255.255.255.252\nR2(config-if)#\n*Oct  6 10:44:17.084: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR2(config-if)# ip ospf network point-to-point\nR2(config-if)# no shutdown\nR2(config-if)#interface Ethernet0/2\nR2(config-if)# description LAN A\nR2(config-if)# ip address 192.168.1.3 255.255.255.0\nR2(config-if)# no shutdown\nR2(config-if)#router ospf 1\nR2(config-router)# router-id 2.2.2.2\nR2(config-router)#\n*Oct  6 10:44:21.104: %LINK-3-UPDOWN: Interface Ethernet0/1, changed state to up\n*Oct  6 10:44:22.109: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/1, changed state to up\nR2(config-router)# passive-interface Ethernet0/2\nR2(config-router)# network 2.2.2.2 0.0.0.0 area 0\nR2(config-router)# network 10.0.23.0 0.0.0.3 area 0\nR2(config-router)# network 192.168.1.0 0.0.0.255 area 0\nR2(config-router)#\n*Oct  6 10:44:23.113: %LINK-3-UPDOWN: Interface Ethernet0/2, changed state to up\n*Oct  6 10:44:24.118: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/2, changed state to up\nR2(config-router)#end\nR2#"}, {"id": "03_R3_base", "dev": "R3", "title": "R3: starting configuration (upstream router)", "text": "Router#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nRouter(config)#hostname R3\nR3(config)#no ip domain-lookup\nR3(config)#interface Loopback0\nR3(config-if)# ip address 3.3.3.3 255.255.255.255\nR3(config-if)#interface Ethernet0/0\nR3(config-if)# description Link to R2\nR3(config-if)# ip address 10.0.23.2 255.255.255.252\nR3(config-if)# ip ospf network point-to-point\nR3(config-if)#\n*Oct  6 10:44:48.098: %LINEPROTO-5-UPDOWN: Line protocol on Interface Loopback0, changed state to up\nR3(config-if)# no shutdown\nR3(config-if)#interface Ethernet0/1\nR3(config-if)# description Link to R1\nR3(config-if)# ip address 10.0.13.2 255.255.255.252\nR3(config-if)# ip ospf network point-to-point\nR3(config-if)# no shutdown\nR3(config-if)#router ospf 1\nR3(config-router)# router-id 3.3.3.3\nR3(config-router)#\n*Oct  6 10:44:52.420: %LINK-3-UPDOWN: Interface Ethernet0/0, changed state to up\n*Oct  6 10:44:53.425: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/0, changed state to up\nR3(config-router)# network 3.3.3.3 0.0.0.0 area 0\nR3(config-router)# network 10.0.13.0 0.0.0.3 area 0\nR3(config-router)# network 10.0.23.0 0.0.0.3 area 0\nR3(config-router)#\n*Oct  6 10:44:54.934: %LINK-3-UPDOWN: Interface Ethernet0/1, changed state to up\n*Oct  6 10:44:55.938: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet0/1, changed state to up\nR3(config-router)#end\nR3#"}, {"id": "04_PC1_base", "dev": "PC1", "title": "PC1: address, with the virtual gateway", "text": "VPCS> ip 192.168.1.10/24 192.168.1.1\nChecking for duplicate address...\nPC1 : 192.168.1.10 255.255.255.0 gateway 192.168.1.1\n\nVPCS> show ip\n\nNAME        : VPCS[1]\nIP/MASK     : 192.168.1.10/24\nGATEWAY     : 192.168.1.1\nDNS         : \nMAC         : 00:50:79:66:68:78\nLPORT       : 20000\nRHOST:PORT  : 127.0.0.1:30000\nMTU         : 1500\n\nVPCS> "}, {"id": "06_R1_hsrp", "dev": "R1", "title": "R1: HSRP, higher priority, allowed to take the role back", "text": "R1#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)#interface Ethernet0/2\nR1(config-if)# standby 1 ip 192.168.1.1\nR1(config-if)# standby 1 priority 110\nR1(config-if)# standby 1 preempt\nR1(config-if)#end\nR1#"}, {"id": "07_R2_hsrp", "dev": "R2", "title": "R2: HSRP, default priority", "text": "R2#configure terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR2(config)#interface Ethernet0/2\nR2(config-if)# standby 1 ip 192.168.1.1\nR2(config-if)#end\nR2#"}, {"id": "09_R1_state", "dev": "R1", "title": "R1: who is active", "text": "R1#show standby brief\n                     P indicates configured to preempt.\n                     |\nInterface   Grp  Pri P State   Active          Standby         Virtual IP\nEt0/2       1    110 P Active  local           unknown         192.168.1.1\nR1#show standby\nEthernet0/2 - Group 1\n  State is Active\n    2 state changes, last state change 00:00:18\n  Virtual IP address is 192.168.1.1\n  Active virtual MAC address is 0000.0c07.ac01\n    Local virtual MAC address is 0000.0c07.ac01 (v1 default)\n  Hello time 3 sec, hold time 10 sec\n    Next hello sent in 1.312 secs\n  Preemption enabled\n  Active router is local\n  Standby router is unknown\n  Priority 110 (configured 110)\n  Group name is \"hsrp-Et0/2-1\" (default)\nR1#"}, {"id": "10_R2_state", "dev": "R2", "title": "R2: who is standby", "text": "R2#show standby brief\n                     P indicates configured to preempt.\n                     |\nInterface   Grp  Pri P State   Active          Standby         Virtual IP\nEt0/2       1    100   Standby 192.168.1.2     local           192.168.1.1\nR2#"}, {"id": "11_PC1_normal", "dev": "PC1", "title": "PC1: normal operation", "text": "VPCS> ping 3.3.3.3\n\n84 bytes from 3.3.3.3 icmp_seq=1 ttl=254 time=1.240 ms\n84 bytes from 3.3.3.3 icmp_seq=2 ttl=254 time=0.749 ms\n84 bytes from 3.3.3.3 icmp_seq=3 ttl=254 time=0.758 ms\n84 bytes from 3.3.3.3 icmp_seq=4 ttl=254 time=0.729 ms\n84 bytes from 3.3.3.3 icmp_seq=5 ttl=254 time=0.755 ms\n\nVPCS> show arp\n\n00:00:0c:07:ac:01  192.168.1.1 expires in 96 seconds \naa:bb:cc:03:60:20  192.168.1.2 expires in 114 seconds \n\nVPCS> trace 3.3.3.3\ntrace to 3.3.3.3, 8 hops max, press Ctrl+C to stop\n 1   192.168.1.2   0.402 ms  0.200 ms  0.566 ms\n 2   *10.0.13.2   1.014 ms (ICMP type:3, code:3, Destination port unreachable)  *\n\nVPCS> "}, {"id": "12_PC1_during", "dev": "PC1", "title": "PC1: a long ping while gateway A fails", "text": "VPCS> ping 3.3.3.3 -c 40\n\n84 bytes from 3.3.3.3 icmp_seq=1 ttl=254 time=1.967 ms\n84 bytes from 3.3.3.3 icmp_seq=2 ttl=254 time=0.571 ms\n84 bytes from 3.3.3.3 icmp_seq=3 ttl=254 time=0.676 ms\n84 bytes from 3.3.3.3 icmp_seq=4 ttl=254 time=0.442 ms\n84 bytes from 3.3.3.3 icmp_seq=5 ttl=254 time=0.639 ms\n84 bytes from 3.3.3.3 icmp_seq=6 ttl=254 time=0.586 ms\n84 bytes from 3.3.3.3 icmp_seq=7 ttl=254 time=0.659 ms\n84 bytes from
