hen you press Start.", "You can move between questions and change an answer until you finish.", "80 percent to pass: 16 of 20.", "Kinds of question: one answer, choose two, type the command, and click on the map.", "Afterwards you see every question again with the right answer and the reason."], "blueprint": [["A", 3, "OSPF in one picture"], ["B", 4, "Becoming neighbours"], ["C", 3, "Point-to-point and broadcast"], ["D", 3, "Cost and the best path"], ["E", 3, "A default route for everyone"], ["F", 2, "Is OSPF healthy?"], ["G", 2, "A backup for the gateway"]], "questions": 20, "bank": [{"id": "A1", "g": "A", "topic": "3.1", "kind": "single", "q": "This line is from the routing table of R1. What does the number 110 tell you?", "exhibit": {"step": "06_R1_verify", "text": "O     192.168.3.0/24 [110/20] via 10.0.13.2, 00:00:50, Ethernet0/1", "lab": "L22"}, "o": ["The administrative distance: how far the router trusts OSPF as a source of routes", "The OSPF cost of the path to 192.168.3.0/24", "The number of seconds since the route was last updated", "The OSPF process number on R1"], "a": 0, "why": "The brackets hold [administrative distance/metric]. 110 is the administrative distance of OSPF, and 20 is the metric, which for OSPF is the total cost of the path."}, {"id": "A2", "g": "A", "topic": "3.4", "kind": "single", "q": "OSPF runs on all three routers. R3 gets a new LAN, 192.168.30.0/24, on Ethernet0/3. On which routers must you configure something so that every site can reach it?", "o": ["Only on R3", "On R3 and on R1", "On all three routers", "On R1 and R2, but not on R3"], "a": 0, "why": "R3 brings the new interface into OSPF and floods an updated link-state advertisement. R1 and R2 recalculate and install the route by themselves. That is the work a routing protocol takes away."}, {"id": "A3", "g": "A", "topic": "3.4", "kind": "cmd", "prompt": "R1(config-router)#", "q": "R1 has the address 10.0.12.1/30 on Ethernet0/0. Type the network statement that matches the whole subnet 10.0.12.0/30, with its network address and wildcard mask, and puts it into OSPF area 0.", "accept": ["^net(w(o(r(k)?)?)?)? 10\\.0\\.12\\.0 0\\.0\\.0\\.3 a(r(e(a)?)?)? (0|0\\.0\\.0\\.0)$"], "show": "network 10.0.12.0 0.0.0.3 area 0", "why": "A network statement takes an address, a wildcard mask and an area. The wildcard mask of a /30 is 0.0.0.3: the subnet mask 255.255.255.252 with the ones and zeros swapped."}, {"id": "A4", "g": "A", "topic": "3.4", "kind": "multi", "q": "Ethernet0/2 of this router has the address 192.168.1.1/24. Which two statements are true? (Choose two.)", "exhibit": {"step": "06_R1_verify", "text": "  Routing for Networks:\n    1.1.1.1 0.0.0.0 area 0\n    10.0.12.0 0.0.0.3 area 0\n    10.0.13.0 0.0.0.3 area 0\n    192.168.1.0 0.0.0.255 area 0\n  Passive Interface(s):\n    Ethernet0/2", "lab": "L22"}, "o": ["The network 192.168.1.0/24 is advertised to the other OSPF routers", "No OSPF hellos are sent out of Ethernet0/2", "Ethernet0/2 is not part of OSPF", "A second router on that LAN would become a neighbour on Ethernet0/2", "The network 192.168.1.0/24 is advertised as an external route"], "a": [0, 1], "why": "The network statement 192.168.1.0 0.0.0.255 area 0 puts the interface into OSPF, so its network is advertised as a normal route inside the area. Because the interface is passive, no hellos are sent and no neighbour can form there."}, {"id": "B1", "g": "B", "topic": "3.4", "kind": "single", "q": "R2 has lost its neighbour R3 on Ethernet0/1. In the debug, R is what the neighbour sent and C is what R2 has configured. What must be corrected?", "exhibit": {"step": "10_R2_ticket2", "text": "*Oct  6 10:48:28.961: OSPF-1 HELLO Et0/1: Mismatched hello parameters from 10.0.23.2\n*Oct  6 10:48:28.961: OSPF-1 HELLO Et0/1: Dead R 40 C 40, Hello R 10 C 10 Mask R 255.255.255.0 C 255.255.255.252", "lab": "L24"}, "o": ["The subnet mask: R3 uses 255.255.255.0 and R2 uses 255.255.255.252", "The hello timer on R3", "The dead timer on R2", "The area of the interface on R3"], "a": 0, "why": "Dead 40 and 40 match, hello 10 and 10 match. The masks differ. On a broadcast link, a hello with a different mask is ignored."}, {"id": "B2", "g": "B", "topic": "3.4", "kind": "single", "q": "This is R2. R1 has every interface in area 0 and is connected to R2 on 10.0.12.0/30, but the two are not neighbours. Why?", "exhibit": {"step": "08_R2_ticket1", "text": "R2#show ip ospf interface brief\nInterface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C\nLo0          1     0               2.2.2.2/32         1     LOOP  0/0\nEt0/1        1     0               10.0.23.1/30       10    DR    1/1\nEt0/0        1     1               10.0.12.2/30       10    P2P   0/0", "lab": "L24"}, "o": ["R2 has Ethernet0/0 in area 1. Both ends of a link must be in the same area", "Ethernet0/0 on R2 is passive", "The cost on both ends of a link must be different", "Ethernet0/0 is in state P2P, which cannot form a neighbour"], "a": 0, "why": "The Area column shows 1 for Et0/0 and 0 for the others. A hello from an interface in another area is rejected. P2P is the normal state of a point-to-point interface."}, {"id": "B3", "g": "B", "topic": "3.4", "kind": "single", "q": "R3 reports that it has lost its neighbour R1. This is the interface of R1 on that link. What is the cause?", "exhibit": {"step": "14_R1_ticket3", "text": "Ethernet0/1 is up, line protocol is up \n  Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5\n    No Hellos (Passive interface) ", "lab": "L24"}, "o": ["The interface is passive on R1, so R1 sends no hellos on it", "The interface is down", "The hello timer of 10 seconds is too slow for this link", "The dead timer on R1 has expired"], "a": 0, "why": "\"No Hellos (Passive interface)\" says it directly. The interface is up, and the timers are the defaults. A link between two routers must not be passive."}, {"id": "B4", "g": "B", "topic": "3.4", "kind": "single", "q": "R2 lists the same neighbour ID twice, with two different addresses on two interfaces. R2 has one link to R1 and one link to R3. What does this show?", "exhibit": {"step": "17_R2_ticket4", "text": "R2#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1           0   FULL/  -        00:00:37    10.0.12.1       Ethernet0/0\n1.1.1.1           1   FULL/BDR        00:00:34    10.0.23.2       Ethernet0/1", "lab": "L24"}, "o": ["Two different routers are using the router ID 1.1.1.1", "R1 is connected to R2 by two links", "This is normal when one of the links is a broadcast link", "R2 runs two OSPF processes"], "a": 0, "why": "10.0.12.1 is R1 and 10.0.23.2 is R3, yet both announce themselves as 1.1.1.1. Router IDs must be unique. The two routers with the same ID cannot become neighbours of each other, and routing in the area becomes unreliable."}, {"id": "B5", "g": "B", "topic": "3.4", "kind": "multi", "q": "Which two of these must be the same on both routers before they become OSPF neighbours on an Ethernet link? (Choose two.)", "o": ["The area of the interface", "The hello and dead timers", "The OSPF process ID", "The router ID", "The interface cost"], "a": [0, 1], "why": "Area and timers are carried in the hello and must match. The process ID is local to each router, the router IDs must be different, and the cost can differ at each end."}, {"id": "B6", "g": "B", "topic": "3.4", "kind": "single", "q": "This message appears on R2 about 40 seconds after a change was made on R3. Which statement fits it?", "exhibit": {"step": "14_R2_symptom", "text": "*Oct  6 09:19:32.140: %OSPF-5-ADJCHG: Process 1, Nbr 3.3.3.3 on Ethernet0/1 from FULL to DOWN, Neighbor Down: Dead timer expired", "lab": "L22"}, "o": ["For the whole dead interval, R2 received no hello from R3 that it could accept", "The interface Ethernet0/1 on R2 went down", "The OSPF process on R2 was restarted", "R3 and R2 have the same router ID"], "a": 0, "why": "\"Dead timer expired\" means the neighbour was not heard for 40 seconds. If the interface had gone down, the reason would read \"Interface down or detached\" and the message would come at once."}, {"id": "C1", "g": "C", "topic": "3.4", "kind": "single", "q": "This is R3, the DR of the segment. R1 has just been given priority 100. What happens to the DR role?", "exhibit": {"step": "12_R3_sees", "text": "R3#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n1.1.1.1         100   FULL/DROTHER    00:00:33    10.0.123.1      Ethernet0/0\n2.2.2.2           1   FULL/BDR        00:00:38    10.0.123.2      Ethernet0/0", "lab": "L23"}, "o": ["Nothing. R3 stays the DR until it leaves the segment or OSPF is restarted", "R1 takes over as soon as its next hello is received", "R1 takes over when the dead interval of 40 seconds has passed", "R2 becomes the DR, because the BDR is promoted when priorities change"], "a": 0, "why": "The election is not pre-emptive. R3 sees the new priority (100 in the Pri column) and keeps the role. Priority only counts when an election takes place."}, {"id": "C2", "g": "C", "topic": "3.4", "kind": "single", "q": "The DR of this segment, 3.3.3.3, has just failed. R1 has priority 100 and R2 has priority 1. This is R2. Why is R2 the DR and not R1?", "exhibit": {"step": "14_R2_promoted", "text": "  Transmit Delay is 1 sec, State DR, Priority 1\n  Designated Router (ID) 2.2.2.2, Interface address 10.0.123.2\n  Backup Designated router (ID) 1.1.1.1, Interface address 10.0.123.1", "lab": "L23"}, "o": ["R2 was the BDR, and the BDR is promoted when the DR fails", "R2 has a higher interface address than R1 on the segment", "A priority above 99 is not valid, so R1 was ignored", "A router that was DROTHER can never take a role later"], "a": 0, "why": "When the DR disappears, the BDR takes over at once, whatever the priorities are. The election that follows is only for the empty BDR role, and R1 won that with its priority of 100."}, {"id": "C3", "g": "C", "topic": "3.4", "kind": "map", "lab": "L23", "pick": "R2", "q": "Before these three routers are switched on, R3 is given \"ip ospf priority 0\" on this segment. R1 and R2 keep the default priority. All three start at the same moment. Click the router that becomes the DR.", "why": "R3 has priority 0 and can never take a role. R1 and R2 both have priority 1, so the higher router ID wins: 2.2.2.2. R1 becomes the BDR."}, {"id": "C4", "g": "C", "topic": "3.4", "kind": "single", "q": "This is the neighbour table of R1 on a shared segment. What can you say about router 2.2.2.2?", "exhibit": {"step": "18_R1_final", "text": "R1#show ip ospf neighbor\n\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n2.2.2.2           0   FULL/DROTHER    00:00:33    10.0.123.2      Ethernet0/0\n3.3.3.3           1   FULL/BDR        00:00:36    10.0.123.3      Ethernet0/0", "lab": "L23"}, "o": ["It can never become DR or BDR on this segment, because its priority is 0", "It is not fully adjacent with R1", "It is the DR of the segment", "It is unreachable"], "a": 0, "why": "The Pri column shows 0 for 2.2.2.2, and its role is DROTHER. R1 is the DR here (the table shows R1's neighbours: one DROTHER and the BDR), so R1 is fully adjacent with both."}, {"id": "D1", "g": "D", "topic": "3.4", "kind": "single", "q": "On this router the reference bandwidth has been set to 10000 Mbps. Which bandwidth does the router have for Ethernet0/1?", "exhibit": {"step": "16_R1_after", "text": "R1#show ip ospf interface brief\nInterface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C\nLo0          1     0               1.1.1.1/32         1     LOOP  0/0\nEt0/2        1     0               192.168.1.1/24     1000  DR    0/0\nEt0/1        1     0               10.0.13.1/30       100   P2P   1/1\nEt0/0        1     0               10.0.12.1/30       10    P2P   1/1", "lab": "L25"}, "o": ["100 Mbps", "1 Gbps", "10 Mbps", "10 Gbps"], "a": 0, "why": "Cost = reference bandwidth / interface bandwidth. Et0/1 has cost 100, and 10000 / 100 = 100 Mbps. Et0/0 (cost 10) is 1 Gbps and Et0/2 (cost 1000) is 10 Mbps."}, {"id": "D2", "g": "D", "topic": "3.4", "kind": "single", "q": "Ethernet0/0 is a 1 Gbps link and Ethernet0/1 is a 100 Mbps link. Both show cost 1. Why?", "exhibit": {"step": "11_R1_before", "text": "R1#show ip ospf interface brief\nInterface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C\nLo0          1     0               1.1.1.1/32         1     LOOP  0/0\nEt0/2        1     0               192.168.1.1/24     10    DR    0/0\nEt0/1        1     0               10.0.13.1/30       1     P2P   1/1\nEt0/0        1     0               10.0.12.1/30       1     P2P   1/1", "lab": "L25"}, "o": ["The default reference bandwidth is 100 Mbps, and a cost cannot be lower than 1", "OSPF gives every point-to-point link the cost 1", "The cost is the number of neighbours on the interface", "The cost was typed by hand on both interfaces"], "a": 0, "why": "100 / 100 = 1 and 100 / 1000 = 0.1, which is raised to 1. With the default reference, OSPF cannot tell 100 Mbps from anything faster."}, {"id": "D3", "g": "D", "topic": "3.2", "kind": "single", "q": "R1 reaches 192.168.3.0/24 through R2 and R3. The outgoing interface of R1 has cost 10, and the outgoing interface of R2 towards R3 has cost 10. What is the cost of R3's interface on 192.168.3.0/24?", "exhibit": {"step": "16_R1_after", "text": "Routing entry for 192.168.3.0/24\n  Known via \"ospf 1\", distance 110, metric 1020, type intra area\n  Last update from 10.0.12.2 on Ethernet0/0, 00:00:08 ago\n  Routing Descriptor Blocks:\n  * 10.0.12.2, from 3.3.3.3, 00:00:08 ago, via Ethernet0/0\n      Route metric is 1020, traffic share count is 1", "lab": "L25"}, "o": ["1000", "1020", "100", "10"], "a": 0, "why": "The metric is the sum of the outgoing interface costs along the path, including the interface where the destination network is attached: 10 + 10 + 1000 = 1020."}, {"id": "D4", "g": "D", "topic": "3.2", "kind": "single", "q": "Before this, the route to 192.168.3.0/24 had metric 1020 through Ethernet0/0. Then \"ip ospf cost 5\" was configured on Ethernet0/1, where the cost had been 100. What does the output show?", "exhibit": {"step": "18_R1_manual", "text": "Routing entry for 192.168.3.0/24\n  Known via \"ospf 1\", distance 110, metric 1005, type intra area\n  Last update from 10.0.13.2 on Ethernet0/1, 00:00:08 ago\n  Routing Descriptor Blocks:\n  * 10.0.13.2, from 3.3.3.3, 00:00:08 ago, via Ethernet0/1\n      Route metric is 1005, traffic share count is 1", "lab": "L25"}, "o": ["A cost set on an interface replaces the calculated cost, and the path with the lower total wins", "A cost set by hand is added to the calculated cost", "The route moved because Ethernet0/1 has the higher interface number", "OSPF now shares the traffic between both paths"], "a": 0, "why": "The direct path now costs 5 + 1000 = 1005, which beats 1020, so the route moved to Ethernet0/1. Only one next hop is listed, so there is no load sharing."}, {"id": "D5", "g": "D", "topic": "3.4", "kind": "cmd", "prompt": "R1(config-router)#", "q": "Type the command that sets the OSPF reference bandwidth to 10 Gbps.", "accept": ["^au(t(o(-(c(o(s(t)?)?)?)?)?)?)? r(e(f(e(r(e(n(c(e(-(b(a(n(d(w(i(d(t(h)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)? 10000$"], "show": "auto-cost reference-bandwidth 10000", "why": "The value is in Mbps, so 10 Gbps is 10000. Set the same value on every router of the OSPF domain."}, {"id": "E1", "g": "E", "topic": "3.4", "kind": "single", "q": "R3 has just learned this route. R1 is the router with the internet line. Which configuration produced it?", "exhibit": {"step": "04_R3_after", "text": "Gateway of last resort is 10.0.23.1 to network 0.0.0.0\n\nO*E2  0.0.0.0/0 [110/1] via 10.0.23.1, 00:00:08, Ethernet0/0", "lab": "L25b"}, "o": ["\"default-information originate\" under router ospf on R1, which has a default route of its own", "\"ip route 0.0.0.0 0.0.0.0 10.0.23.1\" on R3", "\"network 0.0.0.0 255.255.255.255 area 0\" under router ospf on R1", "\"ip default-gateway 10.0.23.1\" on R3"], "a": 0, "why": "O*E2 is an OSPF external route that is a candidate default. A static route on R3 would show as S*. The network statement only puts interfaces into OSPF, and ip default-gateway is for a device that does not route."}, {"id": "E2", "g": "E", "topic": "3.1", "kind": "single", "q": "Read this entry on R3. Which router originated the default route?", "exhibit": {"step": "04_R3_after", "text": "Routing entry for 0.0.0.0/0, supernet\n  Known via \"ospf 1\", distance 110, metric 1, candidate default path\n  Tag 1, type extern 2, forward metric 20\n  Last update from 10.0.23.1 on Ethernet0/0, 00:00:09 ago\n  Routing Descriptor Blocks:\n  * 10.0.23.1, from 1.1.1.1, 00:00:09 ago, via Ethernet0/0\n      Route metric is 1, traffic share count is 1", "lab": "L25b"}, "o": ["The router with the ID 1.1.1.1", "The router with the address 10.0.23.1", "R3 itself", "It cannot be read from this output"], "a": 0, "why": "\"from 1.1.1.1\" names the router that advertised the route. 10.0.23.1 is only the next hop: the neighbour on R3's best path towards 1.1.1.1."}, {"id": "E3", "g": "E", "topic": "3.4", "kind": "single", "q": "R1 has \"default-information originate\", without the keyword always. A minute ago R3 had an O*E2 default route. Now it shows this. What is the most likely reason?", "exhibit": {"step": "08_R3_withdrawn", "text": "R3#show ip route | begin Gateway\nGateway of last resort is not set", "lab": "L25b"}, "o": ["R1 has lost its own default route, so it has stopped advertising one", "External routes are removed after 60 seconds unless they are refreshed by hand", "R3 must be reloaded before it accepts a default route again", "R1 and R3 are in different areas"], "a": 0, "why": "Without always, a router advertises a default only while it has one in its own routing table. When the exit at R1 fails, the default is withdrawn everywhere, so no site sends traffic towards a dead exit."}, {"id": "E4", "g": "E", "topic": "3.2", "kind": "map", "lab": "L25b", "pick": "R2", "q": "R1 advertises the default route. On R3, the gateway of last resort is 10.0.23.1. A packet from PC2 for an internet address has just arrived at R3. Click the router that receives it next.", "why": "10.0.23.1 is R2's address on the link to R3. A router only knows the next hop: R3 hands the packet to R2, and R2 has its own default route towards R1."}, {"id": "F1", "g": "F", "topic": "3.4", "kind": "single", "q": "This is part of \"show ip ospf database\" on a router in area 0. What does the single entry tell you?", "exhibit": {"step": "08_R3_verify", "text": "\t\tNet Link States (Area 0)\n\nLink ID         ADV Router      Age         Seq#       Checksum\n10.0.23.2       3.3.3.3         29          0x80000001 0x006990", "lab": "L22"}, "o": ["The area has one shared segment on which a designated router has a neighbour, and 3.3.3.3 is that DR", "One network in the area is down", "The router 3.3.3.3 has exactly one neighbour", "One LAN with PCs exists in the area"], "a": 0, "why": "A network LSA is written by the DR of a shared segment on which it has at least one fully adjacent neighbour. Point-to-point links, and LANs where a router is alone, do not produce one."}, {"id": "F2", "g": "F", "topic": "3.4", "kind": "single", "q": "After a change you want one command that lists every interface running OSPF on a router, with its area, its cost and its number of neighbours. Which one?", "o": ["show ip ospf interface brief", "show ip ospf neighbor", "show ip route ospf", "show ip ospf database"], "a": 0, "why": "show ip ospf interface brief has one line per OSPF interface: area, address, cost, state and neighbours (F/C)."}, {"id": "F3", "g": "F", "topic": "3.4", "kind": "single", "q": "R1 is connected to two other routers, and to a LAN that has only PCs. Is anything wrong in this output?", "exhibit": {"step": "06_R1_verify", "text": "R1#show ip ospf interface brief\nInterface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C\nLo0          1     0               1.1.1.1/32         1     LOOP  0/0\nEt0/2        1     0               192.168.1.1/24     10    DR    0/0\nEt0/1        1     0               10.0.13.1/30       10    P2P   1/1\nEt0/0        1     0               10.0.12.1/30       10    P2P   1/1", "lab": "L22"}, "o": ["No. Lo0 and Et0/2 have no neighbours because no other router is there, and Et0/1 and Et0/0 have one each", "Yes. Et0/2 is in state DR, and a LAN interface must not be a DR", "Yes. Et0/2 has lost its neighbour: it shows 0/0", "Yes. The loopback must have cost 0"], "a": 0, "why": "0/0 on a loopback and on a LAN with only PCs is expected. The router calls itself DR on Et0/2 because it is alone on that segment. The two router links each show 1/1: one neighbour, fully adjacent."}, {"id": "G1", "g": "G", "topic": "3.5", "kind": "single", "q": "This is R2. The PCs use 192.168.1.1 as their default gateway. Which router answers for 192.168.1.1 at this moment?", "exhibit": {"step": "10_R2_state", "text": "R2#show standby brief\n                     P indicates configured to preempt.\n                     |\nInterface   Grp  Pri P State   Active          Standby         Virtual IP\nEt0/2       1    100   Standby 192.168.1.2     local           192.168.1.1", "lab": "L26"}, "o": ["The router with the interface address 192.168.1.2", "R2 itself", "Both routers, sharing the load", "Neither: 192.168.1.1 is not in use"], "a": 0, "why": "R2 is in state Standby, and the Active column shows 192.168.1.2. The active router answers ARP for the virtual address and forwards the traffic."}, {"id": "G2", "g": "G", "topic": "3.5", "kind": "single", "q": "During this ping from a PC, the LAN interface of the active HSRP router was shut down. The timers are the defaults. What explains the gap?", "exhibit": {"step": "12_PC1_during", "text": "84 bytes from 3.3.3.3 icmp_seq=11 ttl=254 time=0.475 ms\n84 bytes from 3.3.3.3 icmp_seq=12 ttl=254 time=0.839 ms\n3.3.3.3 icmp_seq=13 timeout\n3.3.3.3 icmp_seq=14 timeout\n3.3.3.3 icmp_seq=15 timeout\n84 bytes from 3.3.3.3 icmp_seq=16 ttl=254 time=0.803 ms\n84 bytes from 3.3.3.3 icmp_seq=17 ttl=254 time=0.548 ms", "lab": "L26"}, "o": ["The standby router waited for the hold time of 10 seconds before it took over", "The PC needed time to learn a new default gateway address", "OSPF needed 40 seconds to notice the failure", "The ARP entry on the PC had to expire first"], "a": 0, "why": "With hello 3 and hold 10, the standby router takes over about 10 seconds after the last hello. The PC changed nothing: its gateway address and the MAC address stayed the same."}, {"id": "G3", "g": "G", "topic": "3.5", "kind": "single", "q": "After an HSRP failover, the PC still has this ARP table. Its gateway is 192.168.1.1. Why did the PC not need a new ARP entry for its gateway?", "exhibit": {"step": "14_PC1_after", "text": "VPCS> show arp\n\n00:00:0c:07:ac:01  192.168.1.1 expires in 89 seconds \naa:bb:cc:03:70:20  192.168.1.3 expires in 72 seconds \naa:bb:cc:03:60:20  192.168.1.2 expires in 66 seconds ", "lab": "L26"}, "o": ["The new active router answers for the same virtual MAC address, 0000.0c07.ac01", "The PC sent its traffic to 192.168.1.3 by itself", "ARP entries are not used for a default gateway", "The failed router kept forwarding with its own MAC address"], "a": 0, "why": "The virtual IP address and the virtual MAC address move together to the new active router, so the entry on the PC stays valid. 0000.0c07.acXX is the HSRP version 1 virtual MAC address, with the group number as the last two digits."}, {"id": "G4", "g": "G", "topic": "3.5", "kind": "multi", "q": "Which two statements about HSRP with default settings are true? (Choose two.)", "o": ["Hellos are sent every 3 seconds, and the hold time is 10 seconds", "A returning router with a higher priority does not take the active role back", "The default priority is 1", "The router with the lowest priority becomes active", "HSRP is an open standard that every vendor implements"], "a": [0, 1], "why": "Hello 3 and hold 10 are the defaults, and preemption is off unless \"standby preempt\" is configured. The default priority is 100, the highest priority wins, and HSRP is a Cisco protocol: VRRP is the open standard."}]}}, "built": {"6": {"lessons": 7, "sims": 7, "course": "ccna-w06", "url": "../ccna-w06/", "site": "../ccna-w06/", "note": "All seven lessons are built: narrated, interactive, with a simulator in each, and every terminal shows real output from this week's labs."}}, "exam": {"version": "200-301 v1.1", "minutes": 120, "source": "https://learningcontent.cisco.com/documents/marketing/exam-topics/200-301-CCNA-v1.1.pdf", "domains": [{"id": "1", "title": "Network Fundamentals", "weight": 20, "topics": [{"id": "1.1", "text": "Explain the role and function of network components", "subs": ["Routers", "Layer 2 and Layer 3 switches", "Next-generation firewalls and IPS", "Access points", "Controllers", "Endpoints", "Servers", "PoE"], "lessons": ["1.1", "9.2", "10.3"], "labs": []}, {"id": "1.2", "text": "Describe characteristics of network topology architectures", "subs": ["Two-tier", "Three-tier", "Spine-leaf", "WAN", "Small office/home office (SOHO)", "On-premises and cloud"], "lessons": ["1.2"], "labs": []}, {"id": "1.3", "text": "Compare physical interface and cabling types", "subs": ["Single-mode fiber, multimode fiber, copper", "Connections (Ethernet shared media and point-to-point)"], "lessons": ["1.3"], "labs": []}, {"id": "1.4", "text": "Identify interface and cable issues (collisions, errors, mismatch duplex, and/or speed)", "subs": [], "lessons": ["1.4"], "labs": ["L04"]}, {"id": "1.5", "text": "Compare TCP to UDP", "subs": [], "lessons": ["1.6"], "labs": ["L03"]}, {"id": "1.6", "text": "Configure and verify IPv4 addressing and subnetting", "subs": [], "lessons": ["0.3", "2.1", "2.2", "2.3"], "labs": ["L01", "L05", "L06", "C1", "C2"]}, {"     '<div class="card trainer" style="margin-top:24px"><h3>Subnetting trainer</h3><p class="q" id="sq"></p><form id="sf" autocomplete="off"><input id="sa" aria-label="Your answer" placeholder="Your answer" inputmode="decimal"><button class="btn" type="submit">Check</button><button class="btn ghost" type="button" id="sn">New question</button></form><div id="sfb" aria-live="polite"></div><p class="muted" id="ss"></p></div></section>' +
    '<section><div class="sec-h"><h2>Warm-up: eight questions on one lab</h2><p>Untimed, with the answer after each question. The exhibits are real output from lab L22, captured on Cisco IOS on the lab server. <a href="#lab-L22">Open the lab</a></p></div><div class="quiz" id="quiz"></div><p class="lead" id="score" aria-live="polite"></p></section>' +
    '<section><p class="note plain">' + h(T.integrity) + '</p></section>';
  var q, done = 0, right = 0;
  function ask() { q = subnetQuestion(); $('#sq').innerHTML = q.text; $('#sa').value = ''; $('#sfb').innerHTML = ''; }
  $('#sf').addEventListener('submit', function (e) { e.preventDefault(); var v = $('#sa').value.trim(); if (!v) return; var ok = v === q.answer; done++; if (ok) right++; $('#sfb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><b>' + (ok ? 'Correct.' : 'Not quite. The answer is <span class="mono">' + q.answer + '</span>.') + '</b> ' + h(q.why) + '</div>'; $('#ss').textContent = right + ' right out of ' + done; });
  $('#sn').addEventListener('click', ask); ask();
  var answered = 0, good = 0;
  $('#quiz').innerHTML = D.sample.map(function (s, k) {
    var order = s.o.map(function (_, i) { return i; }); for (var i = order.length - 1; i > 0; i--) { var j = (k * 7 + i * 3) % (i + 1), t = order[i]; order[i] = order[j]; order[j] = t; }
    return '<div class="card qcard" data-q="' + k + '"><div class="labmeta"><span>Question ' + (k + 1) + ' of ' + D.sample.length + '</span><a class="tchip" href="#exam" title="' + h(topicText[s.topic]) + '">' + s.topic + '</a>' + (s.exhibit ? '<span class="real">Real output</span>' : '') + '</div><p class="qq">' + h(s.q) + '</p>' +
      (s.exhibit ? '<pre class="ex" tabindex="0">' + h(s.exhibit.text) + '</pre>' : '') + '<div class="opts">' + order.map(function (i) { return '<button class="opt" data-i="' + i + '">' + h(s.o[i]) + '</button>'; }).join('') + '</div><p class="why" hidden></p></div>';
  }).join('');
  $('#quiz').addEventListener('click', function (e) {
    var b = e.target.closest('.opt'); if (!b || b.disabled) return; var card = b.closest('.qcard'), s = D.sample[+card.getAttribute('data-q')], i = +b.getAttribute('data-i');
    $$('.opt', card).forEach(function (o) { o.disabled = true; if (+o.getAttribute('data-i') === s.a) o.classList.add('right'); }); if (i !== s.a) b.classList.add('wrong'); else good++;
    var w = $('.why', card); w.hidden = false; w.textContent = s.why; answered++;
    if (answered === D.sample.length) $('#score').textContent = 'You answered ' + good + ' of ' + D.sample.length + ' correctly.';
  });
}

/* ------------------------------------------------------------------ weekly test */
var leave = [];      // things to stop when the view changes (the test clock)
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function mmss(s) { s = Math.max(0, s); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
function viewWeekTest(n) {
  var W = D.weekly[n];
  if (!W) { main.innerHTML = '<section><div class="sec-h"><p class="eyebrow">Weekly test</p><h1>Week ' + h(n) + ' test</h1><p class="lead">This test is designed and not built yet. <a href="#tests">How the tests work</a></p></div></section>'; return; }
  var st = null, timer = null, map = null, gname = {}; W.blueprint.forEach(function (b) { gname[b[0]] = b[2]; });
  function stop() { if (timer) { clearInterval(timer); timer = null; } if (map) { map.destroy(); map = null; } }
  leave.push(stop);
  function draw() {
    var out = [];
    W.blueprint.forEach(function (b) { out = out.concat(shuffle(W.bank.filter(function (q) { return q.g === b[0]; })).slice(0, b[1])); });
    return out.map(function (q) { return {q: q, order: shuffle((q.o || []).map(function (_, i) { return i; })), ans: null}; });
  }
  function has(it) { var a = it.ans; return !(a == null || a === '' || (a instanceof Array && !a.length)); }
  function right(it) {
    var q = it.q, a = it.ans; if (!has(it)) return false;
    if (q.kind === 'single') return a === q.a;
    if (q.kind === 'multi') return a.slice().sort().join() === q.a.slice().sort().join();
    if (q.kind === 'cmd') { var v = a.trim().toLowerCase().replace(/\s+/g, ' '); return q.accept.some(function (rx) { return new RegExp(rx).test(v); }); }
    return a === q.pick;
  }
  function head(sub) { return '<div class="sec-h"><p class="eyebrow">Weekly test</p><h1>' + h(W.title) + '</h1>' + (sub ? '<p class="lead">' + sub + '</p>' : '') + '</div>'; }
  function exhibitOf(q) { return q.exhibit ? '<pre class="ex" tabindex="0">' + h(q.exhibit.text) + '</pre>' : ''; }
  function meta(q, k) { return '<div class="labmeta"><span>Question ' + (k + 1) + ' of ' + st.items.length + '</span><a class="tchip" href="#exam" title="' + h(topicText[q.topic]) + '">' + q.topic + '</a>' + (q.exhibit ? '<span class="real">Real output &middot; lab ' + h(q.exhibit.lab) + '</span>' : '') + '<span>' + ({single: 'One answer', multi: 'Choose ' + (q.a && q.a.length === 2 ? 'two' : q.a ? q.a.length : ''), cmd: 'Type the command', map: 'Click on the map'})[q.kind] + '</span></div>'; }

  function intro() {
    stop(); var best = store('ces-ccna-test-' + n);
    main.innerHTML = '<section class="tst">' + head(h(W.intro)) + '<div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>Before you start</h3><ul>' + W.rules.map(function (r) { return '<li>' + h(r) + '</li>'; }).join('') + '</ul>' +
      '<div class="tst-foot"><button class="btn" id="tstart">Start the test</button><a class="btn ghost" href="#week-' + n + '">Back to week ' + n + '</a>' + (best ? '<span class="muted">Your best result on this device: ' + h(best) + ' percent</span>' : '') + '</div></div></section>';
    $('#tstart').addEventListener('click', function () { st = {items: draw(), i: 0, left: W.minutes * 60, used: 0, warn: false}; run(); });
  }
  function run() {
    stop();
    timer = setInterval(function () { st.left--; st.used++; var t = $('#tclock'); if (t) { t.textContent = mmss(st.left); t.classList.toggle('low', st.left <= 120); } if (st.left <= 0) result(true); }, 1000);
    paint();
  }
  function paint() {
    if (map) { map.destroy(); map = null; }
    var it = st.items[st.i], q = it.q, body = '';
    if (q.kind === 'single' || q.kind === 'multi') body = '<div class="opts" id="topts">' + it.order.map(function (i) { var on = q.kind === 'single' ? it.ans === i : (it.ans || []).indexOf(i) >= 0; return '<button class="opt' + (on ? ' sel' : '') + '" data-i="' + i + '" aria-pressed="' + on + '">' + (q.kind === 'multi' ? '<span class="box" aria-hidden="true">' + (on ? '&#9745;' : '&#9744;') + '</span> ' : '') + h(q.o[i]) + '</button>'; }).join('') + '</div>';
    else if (q.kind === 'cmd') body = '<label class="cmdline"><span>' + h(q.prompt) + '</span><input id="tcmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your command" value="' + h(it.ans || '') + '"></label><p class="muted" style="font-size:.9rem">Abbreviated commands are accepted, as on a real router.</p>';
    else body = '<div class="board"><div class="board-scroll"><div id="tmap"></div></div><div class="board-cap" id="tcap" aria-live="polite">' + (it.ans ? '<b>Your answer</b>' + h(it.ans) : 'Click a device on the map.') + '</div></div>';
    main.innerHTML = '<section class="tst">' + head('') +
      '<div class="tst-bar"><span class="tst-time' + (st.left <= 120 ? ' low' : '') + '" id="tclock" role="timer" aria-label="Time left">' + mmss(st.left) + '</span><div class="tst-nav" id="tnav" role="group" aria-label="Questions">' + st.items.map(function (x, k) { return '<button class="tst-n' + (has(x) ? ' done' : '') + '" data-k="' + k + '" aria-current="' + (k === st.i) + '" aria-label="Question ' + (k + 1) + (has(x) ? ', answered' : '') + '">' + (k + 1) + '</button>'; }).join('') + '</div></div>' +
      '<div class="card qcard" id="tq" data-id="' + h(q.id) + '">' + meta(q, st.i) + '<p class="qq">' + h(q.q) + '</p>' + exhibitOf(q) + body + '</div>' +
      '<div class="tst-foot"><button class="btn ghost" id="tprev"' + (st.i ? '' : ' disabled') + '>Previous</button>' + (st.i < st.items.length - 1 ? '<button class="btn" id="tnext">Next</button>' : '') + '<span style="flex:1"></span><button class="btn' + (st.i < st.items.length - 1 ? ' ghost' : '') + '" id="tfin">Finish the test</button></div><p class="fb no" id="twarn" hidden></p></section>';
    if (q.kind === 'cmd') $('#tcmd').addEventListener('input', function () { it.ans = this.value; mark(); });
    if (q.kind === 'map') { var lab = byId[q.lab]; map = LabMap.mount($('#tmap'), lab.topo, {onPick: function (p) { if (p.type !== 'node') { $('#tcap').textContent = 'Click a device, not a link.'; return; } it.ans = p.id; map.setSelected(p); $('#tcap').innerHTML = '<b>Your answer</b>' + h(p.id); mark(); }}); if (it.ans) map.setSelected({type: 'node', id: it.ans}); }
    if ($('#topts')) $('#topts').addEventListener('click', function (e) {
      var b = e.target.closest('.opt'); if (!b) return; var i = +b.getAttribute('data-i');
      if (q.kind === 'single') it.ans = i; else { var a = it.ans || [], at = a.indexOf(i); if (at >= 0) a.splice(at, 1); else a.push(i); it.ans = a; }
      paint(); var again = $('#topts .opt[data-i="' + i + '"]'); if (again) again.focus({preventScroll: true});
    });
    $('#tnav').addEventListener('click', function (e) { var b = e.target.closest('.tst-n'); if (b) { st.i = +b.getAttribute('data-k'); st.warn = false; paint(); } });
    $('#tprev').addEventListener('click', function () { st.i--; st.warn = false; paint(); });
    if ($('#tnext')) $('#tnext').addEventListener('click', function () { st.i++; st.warn = false; paint(); });
    $('#tfin').addEventListener('click', function () {
      var open = st.items.filter(function (x) { return !has(x); }).length;
      if (open && !st.warn) { st.warn = true; var w = $('#twarn'); w.hidden = false; w.textContent = open + (open === 1 ? ' question is' : ' questions are') + ' not answered yet. Press Finish the test again to hand in anyway.'; return; }
      result(false);
    });
  }
  function mark() { var b = $('#tnav .tst-n[data-k="' + st.i + '"]'); if (b) b.classList.toggle('done', has(st.items[st.i])); }
  function answerText(it, mine) {
    var q = it.q;
    if (q.kind === 'single') return mine ? (has(it) ? q.o[it.ans] : '') : q.o[q.a];
    if (q.kind === 'multi') return (mine ? (it.ans || []) : q.a).slice().sort().map(function (i) { return q.o[i]; }).join(' / ');
    if (q.kind === 'cmd') return mine ? (it.ans || '') : q.show;
    return mine ? (it.ans || '') : q.pick;
  }
  function result(timeUp) {
    stop();
    var good = st.items.filter(right).length, total = st.items.length, pct = Math.round(100 * good / total), pass = pct >= W.pass_pct;
    var best = +store('ces-ccna-test-' + n) || 0; if (pct > best) store('ces-ccna-test-' + n, String(pct));
    var groups = W.blueprint.map(function (b) { var its = st.items.filter(function (x) { return x.q.g === b[0]; }); return [b[2], its.filter(right).length, its.length]; });
    var weak = groups.filter(function (g) { return g[1] < g[2]; }).map(function (g) { return g[0]; });
    main.innerHTML = '<section class="tst">' + head(timeUp ? 'Time is up. Your answers so far have been handed in.' : '') +
      '<div class="card" style="display:flex;flex-direction:column;gap:14px"><div class="score"><b id="tscore">' + pct + '%</b><span class="verdict ' + (pass ? 'pass' : 'fail') + '" id="tverdict">' + (pass ? 'Passed' : 'Not passed yet') + '</span><span class="muted">' + good + ' of ' + total + ' right &middot; ' + mmss(st.used) + ' used &middot; ' + W.pass_pct + ' percent needed</span></div>' +
      '<div class="brk">' + groups.map(function (g) { return '<span>' + h(g[0]) + '</span><i><u style="width:' + (g[2] ? 100 * g[1] / g[2] : 0) + '%"></u></i><span>' + g[1] + ' / ' + g[2] + '</span>'; }).join('') + '</div>' +
      '<p>' + (weak.length ? 'Go back to: ' + weak.map(h).join(', ') + '.' : 'Every lesson of the week is covered.') + ' <a href="#week-' + n + '">Week ' + n + '</a></p>' +
      '<div class="tst-foot"><button class="btn" id="tagain">Try again with a fresh draw</button><a class="btn ghost" href="#tests">All tests</a></div></div>' +
      '<h2>Every question, with the reason</h2><div class="tst-nav" style="margin-bottom:4px">' + st.items.map(function (x, k) { return '<a class="tst-n ' + (right(x) ? 'ok' : 'no') + '" href="#" data-j="' + k + '" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none">' + (k + 1) + '</a>'; }).join('') + '</div>' +
      '<div class="rev">' + st.items.map(function (x, k) { var ok = right(x), q = x.q;
        return '<div class="card qcard" id="rv' + k + '" data-id="' + h(q.id) + '">' + meta(q, k) + '<p class="qq">' + h(q.q) + '</p>' + exhibitOf(q) +
          '<p class="mine"><b class="' + (ok ? 'ok' : 'no') + '">' + (ok ? 'Right.' : has(x) ? 'Not right.' : 'Not answered.') + '</b> ' + (has(x) ? 'Your answer: <span' + (q.kind === 'cmd' ? ' class="mono"' : '') + '>' + h(answerText(x, true)) + '</span>' : '') + '</p>' +
          (ok ? '' : '<p class="mine"><b>Correct answer:</b> <span' + (q.kind === 'cmd' ? ' class="mono"' : '') + '>' + h(answerText(x, false)) + '</span></p>') + '<p class="why">' + h(q.why) + '</p></div>'; }).join('') + '</div></section>';
    window.scrollTo(0, 0);
    $('#tagain').addEventListener('click', intro);
    main.querySelector('.tst-nav').addEventListener('click', function (e) { var a = e.target.closest('[data-j]'); if (!a) return; e.preventDefault(); var el = $('#rv' + a.getAttribute('data-j')); if (el) el.scrollIntoView({block: 'start'}); });
  }
  intro();
}

/* ------------------------------------------------------------------ exam map */
function viewExam() {
  main.innerHTML = '<section><div class="sec-h"><p class="eyebrow">' + h(D.exam.version) + '</p><h1>Every exam topic, and where you learn it</h1><p class="lead">All ' + S.topics + ' topics of the published exam blueprint are taught in at least one lesson, and ' + S.topics_with_lab + ' of them are practised in at least one lab. The build of this page fails if a topic is left uncovered.</p><p class="muted">Topic wording from Cisco\'s published exam topics for ' + h(D.exam.version) + '. <a href="' + h(D.exam.source) + '" rel="noopener">Cisco\'s document</a></p></div>' +
    D.exam.domains.map(function (d, k) {
      return '<details class="dom"' + (k === 0 ? ' open' : '') + '><summary><h3>' + d.id + '.0 ' + h(d.title) + '</h3><span>' + d.weight + ' percent of the exam &middot; ' + d.topics.length + ' topics</span></summary>' + d.topics.map(function (t) {
        return '<div class="topic"><span class="tid">' + t.id + '</span><div><p style="color:var(--ink)">' + h(t.text) + '</p>' + (t.subs.length ? '<p class="subs">' + t.subs.map(h).join(' &middot; ') + '</p>' : '') + '</div><div class="where"><span>Lessons</span>' + t.lessons.map(function (l) { return '<a class="tchip" href="#week-' + lessonWeek[l] + '">' + l + '</a>'; }).join('') + (t.labs.length ? '<span style="margin-left:8px">Labs</span>' + t.labs.map(function (l) { return '<a class="tchip" href="#lab-' + l + '" title="' + h(labById[l].title) + '">' + l + '</a>'; }).join('') : '<span style="margin-left:8px">Taught in lessons, no lab</span>') + '</div></div>';
      }).join('') + '</details>';
    }).join('') + '</section><section><p class="note plain">' + h(P.trademark) + '</p></section>';
}

/* ------------------------------------------------------------------ status */
function viewStatus() {
  var s = D.status;
  main.innerHTML = '<section><div class="sec-h"><p class="eyebrow">Where this stands</p><h1>Built, designed, and still needed</h1><p class="lead">' + h(P.notice) + '</p></div>' +
    '<div class="lists"><div><h2 style="margin-bottom:12px">Exists today</h2><ul>' + s.done.map(function (x) { return '<li>' + h(x) + '</li>'; }).join('') + '</ul></div><div><h2 style="margin-bottom:12px">Still to build</h2><ul>' + s.todo.map(function (x) { return '<li>' + h(x) + '</li>'; }).join('') + '</ul></div></div></section>' +
    (s.needs.length ? '<section><div class="sec-h"><h2>What it needs from CES Tech</h2></div><dl class="needs" style="max-width:76ch">' + s.needs.map(function (n) { return '<dt>' + h(n[0]) + '</dt><dd>' + h(n[1]) + '</dd>'; }).join('') + '</dl></section>' : '') +
    '<section><div class="sec-h"><h2>Suggested order of building</h2></div><div class="tw"><table style="max-width:760px"><tbody>' + s.order.map(function (o) { return '<tr><td style="white-space:nowrap"><b>' + h(o[0]) + '</b></td><td>' + h(o[1]) + '</td></tr>'; }).join('') + '</tbody></table></div></section>' +
    '<section><p class="note plain">' + h(P.trademark) + '</p></section>';
}

/* ------------------------------------------------------------------ routing */
function route() {
  leave.forEach(function (f) { f(); }); leave = [];
  freeMaps(); var hash = (location.hash || '#overview').slice(1), tab = hash;
  if (hash.indexOf('lab-') === 0) { tab = 'labs'; viewLab(hash.slice(4)); }
  else if (hash.indexOf('week-') === 0) { tab = 'weeks'; viewWeeks(hash.slice(5)); }
  else if (hash === 'weeks') viewWeeks(null);
  else if (hash === 'labs') viewLabs();
  else if (hash === 'tests') viewTests();
  else if (hash.indexOf('test-') === 0) { tab = 'tests'; viewWeekTest(hash.slice(5)); }
  else if (hash === 'exam') viewExam();
  else if (hash === 'status') viewStatus();
  else { tab = 'overview'; viewOverview(); }
  $('#nav').innerHTML = (D.public ? '<a href="../">All courses</a>' : '') + TABS.map(function (t) { return '<a href="#' + t[0] + '"' + (t[0] === tab ? ' aria-current="page"' : '') + '>' + t[1] + '</a>'; }).join('');
  if (hash.indexOf('week-') !== 0) window.scrollTo(0, 0);
  store('ces-ccna-last', hash);
}
$('#foot').innerHTML = '<span>' + h(P.brand) + ' &middot; ' + h(P.title) + ' &middot; ' + h(P.exam) + '</span><span>' + h(P.trademark) + '</span>';
window.addEventListener('hashchange', route);
route();
})();
</script>

</body>
