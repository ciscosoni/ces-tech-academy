<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231B2A4A'/%3E%3Cpath d='M14 46V18h36' fill='none' stroke='%234FA8D6' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='44' cy='42' r='7' fill='%234FA8D6'/%3E%3C/svg%3E">
<title>CES Tech Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Kalam:wght@400;700&display=swap">

<script src="config.js"></script>
<script>
/* Bridge between the course page and the CES Tech Academy backend (backend/server.py).
   The page asks for an AI helper with window.claude.use('sample'). Inside a Claude artifact that object already exists.
   On the standalone site we provide it here: if a backend answers at CES_BACKEND + /api/health and says the tutor is on,
   the tutor and the AI marking work; if not, the page hides the tutor and shows model answers instead. */
window.CES_STANDALONE = !window.claude;
window.claude = window.claude || { use: async function (name) {
  if (name !== 'sample' || window.CES_BACKEND === null) return null;
  var base = String(window.CES_BACKEND || '').replace(/\/$/, ''), api = function (p) { return (base ? base + '/' : '') + 'api/' + p; };
  try {
    var r = await fetch(api('health'), {cache: 'no-store'}); if (!r.ok) return null;
    var j = await r.json(); if (!j || !j.tutor) return null;
  } catch (e) { return null; }
  return async function (input, opts) {
    opts = opts || {};
    var messages = typeof input === 'string' ? [{role: 'user', content: input}] : input, res;
    try { res = await fetch(api('ask'), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({messages: messages}), signal: opts.signal}); }
    catch (e) { var err = new Error('tutor'); err.code = e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error'; throw err; }
    if (!res.ok) { var er = new Error('tutor'); er.code = res.status === 429 ? 'rate_limited' : 'upstream_error'; throw er; }
    var out = await res.json();
    if (opts.onText) opts.onText({text: out.text, delta: out.text});
    return {text: out.text, truncated: !!out.truncated};
  };
}};
</script>
</head>
<body>

<style>
/* Layout: a learning workspace. Navy masthead, course outline on the left, one lesson at a time on the right, tutor in a corner drawer. */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --sunk:#E9EFF6;
  --ink:#1B2A4A; --text:#333333; --muted:#5A6880; --line:#D3DDE8;
  --navy:#1B2A4A; --on-navy:#FFFFFF; --on-navy-dim:#BFD9EC;
  --accent:#4FA8D6; --accent-ink:#1D6C9A; --accent-wash:#E6F2FA;
  --good:#1B7A4B; --good-wash:#E3F4EA; --bad:#B23A30; --bad-wash:#FBE9E7;
  --warn-ink:#6B4700; --warn-wash:#FFF3DC; --warn-line:#D98A00;
  --code-bg:#10203C; --code-ink:#E3EEF8;
  --sans:Carlito,Calibri,"Segoe UI",Candara,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1524; --surface:#152038; --sunk:#0F192C;
  --ink:#EAF1F8; --text:#CDD7E4; --muted:#93A3BA; --line:#2A3B5A;
  --navy:#111C33; --on-navy:#FFFFFF; --on-navy-dim:#A9C6DC;
  --accent:#4FA8D6; --accent-ink:#7FC4EA; --accent-wash:#18304A;
  --good:#5CC98F; --good-wash:#133324; --bad:#F08A80; --bad-wash:#3A1B18;
  --warn-ink:#F2CF8A; --warn-wash:#33280F; --warn-line:#D98A00;
  --code-bg:#0A1222; --code-ink:#DCE8F5; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#152038; --sunk:#0F192C;
  --ink:#EAF1F8; --text:#CDD7E4; --muted:#93A3BA; --line:#2A3B5A;
  --navy:#111C33; --on-navy:#FFFFFF; --on-navy-dim:#A9C6DC;
  --accent:#4FA8D6; --accent-ink:#7FC4EA; --accent-wash:#18304A;
  --good:#5CC98F; --good-wash:#133324; --bad:#F08A80; --bad-wash:#3A1B18;
  --warn-ink:#F2CF8A; --warn-wash:#33280F; --warn-line:#D98A00;
  --code-bg:#0A1222; --code-ink:#DCE8F5; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.5;margin:0}
h1,h2,h3{color:var(--ink);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,1.2rem + 2vw,2.4rem)}
h2{font-size:1.3rem}
h3{font-size:1.08rem}
p{margin:0}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent-ink)}
.muted{color:var(--muted)}

/* masthead */
.top{background:var(--navy);color:var(--on-navy);border-bottom:4px solid var(--accent)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:0;background:none;border:0;padding:0;text-align:left;color:var(--on-navy)}
.brand b{font-size:1.35rem;letter-spacing:.01em}
.brand b span{font-weight:400;color:var(--on-navy-dim)}
.brand i{font-size:.8rem;color:var(--on-navy-dim)}
.prog{display:flex;align-items:center;gap:12px;font-size:.9rem;color:var(--on-navy-dim);min-width:0}
.prog-bar{width:160px;max-width:40vw;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.prog-bar div{height:100%;background:var(--accent);width:0;transition:width .3s}

/* shell */
.shell{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:28px 120px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:36px;align-items:start}
.outline{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.outline .eyebrow{margin:0 0 8px 12px}
.oi{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:6px;padding:10px 12px;color:var(--text);line-height:1.25}
.oi:hover{background:var(--sunk)}
.oi[aria-current="page"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-weight:700}
.oi small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;color:var(--muted);background:var(--surface)}
.oi.done .dot{background:var(--good);border-color:var(--good);color:#fff}
main{min-width:0;display:flex;flex-direction:column;gap:26px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:16px 120px}
  .outline{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .outline .eyebrow{display:none}
  .oi{flex:0 0 auto;grid-template-columns:28px auto;white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
  .oi small{display:none}
}

/* blocks */
.head{display:flex;flex-direction:column;gap:8px}
.lede{font-size:1.12rem;max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.notice{background:var(--warn-wash);color:var(--warn-ink);border-left:5px solid var(--warn-line);padding:12px 16px;font-size:.95rem;border-radius:0 6px 6px 0}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.95rem;color:var(--muted)}
.meta b{color:var(--ink)}
.btn{background:var(--navy);color:var(--on-navy);border:0;border-radius:6px;padding:11px 20px;font-weight:700;align-self:flex-start}
.btn:hover{filter:brightness(1.25)}
.btn.ghost{background:transparent;color:var(--accent-ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn[disabled]{opacity:.5;cursor:default}
:root[data-theme="dark"] .btn:not(.ghost){background:var(--accent);color:#0D1524}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn:not(.ghost){background:var(--accent);color:#0D1524} }
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.spread{justify-content:space-between}
ul.plain{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.mods{display:flex;flex-direction:column}
.mod{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:var(--text)}
.mod:first-child{border-top:0}
.mod:hover b{color:var(--accent-ink)}
.mod b{color:var(--ink);display:block}
.mod span.t{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mod.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.done-banner{background:var(--good-wash);color:var(--good);border-radius:8px;padding:16px 20px;font-weight:700}

/* video + tabs */
.player{background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9;max-width:100%;border:1px solid var(--line)}
.player video{width:100%;height:100%;display:block}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.transcript{max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:6px}
.cue{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;color:var(--text);line-height:1.45}
.cue:hover{background:var(--sunk)}
.cue time{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.cue.on{background:var(--accent-wash);color:var(--ink)}

/* quiz */
.q{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.q legend{font-weight:700;color:var(--ink);padding:0;margin-bottom:8px;max-width:72ch}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.opt input{margin:4px 0 0;accent-color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-wash)}
.opt.wrong{border-color:var(--bad);background:var(--bad-wash)}
.why{font-size:.95rem;padding:8px 12px;border-left:4px solid var(--accent);background:var(--accent-wash);border-radius:0 6px 6px 0;color:var(--ink)}
.score{font-weight:700;color:var(--ink)}
.quiz{display:flex;flex-direction:column;gap:24px}

/* lab */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{background:var(--navy);color:var(--on-navy);text-align:left;padding:9px 12px;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:.84rem;white-space:nowrap}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding:20px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:0}
.step-b{display:flex;flex-direction:column;gap:12px;min-width:0}
.num{width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--on-navy);font-weight:700;display:flex;align-items:center;justify-content:center}
.step.ok .num{background:var(--good)}
.codebox{background:var(--code-bg);border-radius:6px;overflow:hidden;min-width:0}
.codebar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;color:#9FB6CF;font-family:var(--mono);font-size:.76rem;border-bottom:1px solid rgba(255,255,255,.1)}
.copy{background:rgba(255,255,255,.1);border:0;color:#E3EEF8;border-radius:4px;padding:4px 10px;font-size:.78rem;font-family:var(--sans)}
.copy:hover{background:rgba(255,255,255,.2)}
pre{margin:0;padding:14px;overflow:auto;max-height:340px;color:var(--code-ink);font-family:var(--mono);font-size:.8rem;line-height:1.55;tab-size:2}
.expect{font-size:.95rem;color:var(--muted)}
.expect b{color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;font-size:.95rem;cursor:pointer;align-self:flex-start}
.check input{width:18px;height:18px;accent-color:var(--good)}
code{font-family:var(--mono);font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:4px;color:var(--ink)}

/* interactive lesson */
.xp{display:flex;flex-direction:column;gap:12px}
.stage-wrap{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#16264A;aspect-ratio:16/9;max-width:100%}
.stage{width:100%;height:100%;display:block}
.stage text{font-family:var(--sans);fill:#fff}
.stage .t{font-size:34px}.stage .tb{font-size:36px;font-weight:700}.stage .ts{font-size:27px;fill:#C5DCEF}.stage .ts.wt{fill:#fff}
.stage .mono{font-family:var(--mono);font-size:25px;fill:#C5DCEF}
.stage .hand{font-family:Kalam,"Segoe Print","Comic Sans MS",cursive;font-size:38px;fill:#F6C453}
.stage .hand.dimh{fill:#7F9AC4;font-size:32px}
.stage .num{font-size:40px;font-weight:700;fill:#16264A}
.stage .okt{fill:#6FD39A}.stage .badt{fill:#F0776B}.stage .amt{fill:#F6C453}
.stage .ln{fill:none;stroke:#9CD0F0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.stage .ln2{fill:none;stroke:#4E6E9E;stroke-width:2.5}
.stage .bx{fill:#1F3463;stroke:#9CD0F0;stroke-width:3}
.stage .bxa{fill:#235E8C;stroke:#BFE3F7;stroke-width:3}
.stage .plate{fill:#101D3A;stroke:#9CD0F0;stroke-width:2.5}
.stage .chip{fill:#101D3A;stroke:#4FA8D6;stroke-width:3}
.stage .pf{fill:#C5DCEF}
.stage .amber{stroke:#F6C453}.stage .famber{fill:#F6C453}
.stage .okc{stroke:#6FD39A;fill:none}.stage .okf{fill:#6FD39A}.stage .badf{fill:#F0776B}
.stage .pill rect{fill:#F6C453}.stage .pill text{fill:#16264A;font-weight:700;font-size:27px;letter-spacing:.05em}
.stage .pill.blue rect{fill:#9CD0F0}.stage .pill.redp rect{fill:#F0776B}.stage .pill.redp text{fill:#fff}
.stage .lk .lkb{fill:#F0776B}.stage .lk .lks{stroke:#F0776B}
.stage .lk.green .lkb{fill:#6FD39A}.stage .lk.green .lks{stroke:#6FD39A}
.stage .lk .lkb,.stage .lk .lks{transition:fill .3s,stroke .3s}
.stage .cx{opacity:0;transition:opacity .3s}.stage .cx.show{opacity:1}
.stage #xm,.stage #pk{transition:opacity .3s}
.stage [data-in]{opacity:0;transition:opacity .45s ease,transform .45s ease}
.stage [data-in].on{opacity:1;transition-delay:var(--d,0s)}
.stage .rise{transform:translateY(16px)}.stage .rise.on{transform:none}
.stage .draw{stroke-dasharray:var(--len,3000);stroke-dashoffset:var(--len,3000);transition:stroke-dashoffset 1s ease,opacity .2s}
.stage .draw.on{stroke-dashoffset:0;transition-delay:var(--d,0s)}
.stage.instant *{transition:none!important}
.stage .ripple{fill:none;stroke:#F6C453;stroke-width:5;transform-box:fill-box;transform-origin:center;animation:xp-rip 2.4s ease-out infinite}
@keyframes xp-rip{0%{opacity:.9;transform:scale(.04)}100%{opacity:0;transform:scale(1)}}
.xp-cover{position:absolute;inset:0;background:rgba(16,29,58,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;color:#fff}
.xp-cover .eyebrow{color:#9CD0F0}
.xp-cover-t{font-size:clamp(1.3rem,1rem + 2.4vw,2.4rem);font-weight:700;line-height:1.1}
.xp-cover-s{font-size:.9rem;color:#C5DCEF;max-width:46ch}
.xp-start{display:flex;align-items:center;gap:12px;background:#F6C453;color:#16264A;border:0;border-radius:32px;padding:14px 26px 14px 20px;font-weight:700;font-size:1.1rem}
.xp-start:hover{filter:brightness(1.08)}
.xp-play-ic{width:34px;height:34px;border-radius:50%;background:#16264A;color:#F6C453;display:flex;align-items:center;justify-content:center;font-size:.85rem;padding-left:3px}
.xp-prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.12)}
.xp-prog div{height:100%;width:0;background:#F6C453;transition:width .4s}
.xp-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.xp-ctl .btn{align-self:auto;padding:8px 16px}
.xp-pp{min-width:104px}
.xp-speed{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.xp-chapters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.xp-ch{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:.86rem;color:var(--muted);white-space:nowrap}
.xp-ch.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.xp-cap{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-height:3.2em;max-width:none;color:var(--ink)}
.xp-panel:empty{display:none}
.xp-card{background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.xp-opts{display:flex;flex-direction:column;gap:8px}
.xp-opt,.xp-m{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:11px 14px;color:var(--text);line-height:1.3}
.xp-opt:hover:not(:disabled),.xp-m:hover:not(:disabled){border-color:var(--accent);background:var(--accent-wash)}
.xp-opt.right{border-color:var(--good);background:var(--good-wash);color:var(--ink);font-weight:700}
.xp-opt.wrong{border-color:var(--bad);background:var(--bad-wash)}
.xp-fb{font-size:.97rem;color:var(--muted)}.xp-fb.ok{color:var(--good);font-weight:700}.xp-fb.no{color:var(--bad);font-weight:700}
.xp-skip{align-self:flex-start;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:.88rem}
.xp-match{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
.xp-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.xp-m.term{font-weight:700;color:var(--ink)}
.xp-m.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-wash)}
.xp-m.matched{border-color:var(--good);background:var(--good-wash);color:var(--ink);opacity:1}
.xp-n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;font-size:.78rem;font-weight:700;align-items:center;justify-content:center;margin-right:8px}
.xp-sim{display:flex;flex-direction:column;gap:8px}
.xp-simrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.xp-simrow .btn{align-self:auto;padding:7px 14px}
.xp-tog{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:700;color:var(--ink)}
.xp-tog input{width:20px;height:20px;accent-color:var(--good)}
.xp-tog small{font-weight:400;color:var(--muted);font-family:var(--mono)}
@media (max-width:520px){ .xp-match{grid-template-columns:minmax(0,1fr)} }

.stage .badc{stroke:#F0776B;fill:none}
.xp-opt.seen{opacity:.6;text-decoration:line-through}
.xp-log{display:flex;flex-direction:column;gap:6px}
.xp-ta{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);resize:vertical}

<script type="application/json" id="course-data">{"course": {"id": "aci-tenant-design", "title": "ACI Tenant Design in Practice", "brand": "CES Tech Academy", "tagline": "Beyond IT Services, We Deliver Solutions.", "level": "Intermediate", "audience": "Network engineers who know VLANs, VRFs and routing, and are new to designing ACI policy.", "outcomes": ["Explain the ACI policy model and how it maps to a traditional network", "Choose a tenant and VRF model for a given organisation", "Select bridge domain settings for routed and Layer 2 use cases", "Design EPG bindings and contracts with the right scope", "Design an L3Out and produce a seven-table tenant design pack"]}, "lessons": [{"id": "l1", "n": 1, "title": "The policy model", "summary": "A 2 a.m. outage at a bank, an office park, and a simulator where you fix the problem yourself: the five objects every ACI tenant design is built from.", "keypoints": ["The hierarchy is tenant, VRF, bridge domain, EPG, with contracts between EPGs. Each bridge domain belongs to one VRF, and each EPG (inside an application profile) belongs to one bridge domain.", "Office park picture: company = tenant, private room numbering = VRF, floor = bridge domain, team = EPG, door rule = contract.", "Traffic inside an EPG is open. Traffic between EPGs is closed until a contract allows it, even inside one subnet.", "A VLAN ID survives only as a tag on the port. The bridge domain holds the broadcast domain and gateway; the EPG holds security.", "Tenant policy says what exists. Access policies say where it may appear. A mismatch raises fault F0467."], "quiz": [{"q": "Two servers sit in different EPGs in the same VRF, which has default settings. No contract is configured between the EPGs. What happens to traffic between them?", "o": ["It is permitted only if both EPGs share a bridge domain", "It is permitted, because both EPGs are in the same VRF", "It is dropped", "It is flooded to every leaf"], "a": 2, "why": "In an enforced VRF, traffic between two EPGs is dropped until a contract allows it. Sharing a VRF or a bridge domain does not change that."}, {"q": "Which statement about a bridge domain is correct?", "o": ["It can belong to several VRFs at once", "It is identified by one VLAN ID across the fabric", "It is created under Fabric > Access Policies", "It belongs to exactly one VRF and can hold gateway subnets"], "a": 3, "why": "A bridge domain is tenant policy, belongs to one VRF and carries the gateway subnets. It has no VLAN ID of its own."}, {"q": "Which built-in tenant holds objects that every user tenant may reference?", "o": ["default", "infra", "mgmt", "common"], "a": 3, "why": "Objects in tenant common, such as shared VRFs, filters and contracts, can be referenced from every tenant."}, {"q": "A static binding on an EPG raises fault F0467. What is the most likely cause?", "o": ["The VRF is set to unenforced", "No contract is attached to the EPG", "The bridge domain has no subnet", "The port's access policies do not allow that VLAN for the EPG's domain"], "a": 3, "why": "F0467 most often means invalid path or invalid VLAN: the VLAN is not in the domain's pool, or the port's AAEP does not include the EPG's domain."}], "duration": 354.8, "cues": [{"s": 0.35, "e": 11.153, "text": "Imagine this situation. It's two in the morning, and you're in a change window at a bank's data center. Tonight the team is moving the payments application onto a brand new ACI fabric."}, {"s": 11.823, "e": 19.544, "text": "The servers are racked and cabled. The VLANs are correct. The IP addresses are correct. Every check on your list is green."}, {"s": 20.214, "e": 29.81, "text": "Then the application team calls. The web server can't reach the app server. There's no access list anywhere. No link is down. Routing looks fine."}, {"s": 30.48, "e": 34.46, "text": "So, where do you look first? Pick a check, and I'll show you what you find."}, {"s": 45.787, "e": 57.176, "text": "In the network most of us grew up with, you configure one box at a time. Log in to a switch, create the VLAN, add the gateway, write the access list. Then the next switch. And the next."}, {"s": 57.846, "e": 67.842, "text": "ACI turns that around. You describe what the application needs just once, on the controller, which is called the APIC. The APIC then programs every leaf for you."}, {"s": 68.512, "e": 78.928, "text": "So the skill is no longer typing commands quickly. The skill is describing the application correctly. And for that you need ACI's vocabulary. Just five words."}, {"s": 79.828, "e": 85.893, "text": "Let me explain those five words with a place you already know: a large office park, with many companies inside it."}, {"s": 86.563, "e": 96.612, "text": "Many companies rent space in the park. Each company runs its own office, with its own admin team and its own rules. In ACI, each of those companies is a tenant."}, {"s": 97.282, "e": 110.872, "text": "Every company numbers its rooms however it likes. Company A has a Room 101. So does Company B. Nobody gets confused, because the numbering is private to each company. That private numbering is a VRF."}, {"s": 111.542, "e": 130.724, "text": "Now walk into Company A. Each floor is one open hall. If you shout on that floor, everyone on the floor hears you, and nobody on the other floors does. Each floor also has one reception desk, which is the way out. That floor is a bridge domain. The shout is a broadcast, and the reception desk is the default gateway."}, {"s": 131.394, "e": 144.075, "text": "On that floor sit different teams. The web team wears blue ID cards. The app team wears green. People with the same colour of card are treated the same way. Each team is an EPG, an endpoint group."}, {"s": 144.745, "e": 152.751, "text": "And here's the part that matters at two in the morning. Between the teams there's a door with a card reader, and a blue card doesn't open the green team's door."}, {"s": 153.421, "e": 157.888, "text": "Not until somebody adds a rule that says it may. That rule is a contract."}, {"s": 158.558, "e": 162.811, "text": "Your turn. Match each part of the office park to its ACI name."}, {"s": 168.433, "e": 176.822, "text": "Here is the bank's design in real ACI terms. One tenant for production. Inside it, one VRF, which is the routing table."}, {"s": 177.492, "e": 185.605, "text": "Three bridge domains, one for each subnet: web, app and database. Each belongs to that VRF, and each carries its gateway address."}, {"s": 186.275, "e": 194.206, "text": "And three EPGs: the web servers, the app servers and the database servers. Each EPG sits in exactly one bridge domain."}, {"s": 194.876, "e": 207.69, "text": "Two rules are worth remembering. Inside one EPG, servers talk freely, like colleagues in the same team. Between two EPGs, nothing passes until a contract allows it. ACI is an allow-list."}, {"s": 208.36, "e": 221.521, "text": "So, back to two in the morning. You have the controls now. Let the web tier reach the app tier, let the app tier reach the database, and keep the web tier away from the database. Add the contracts, then send traffic to test."}, {"s": 233.102, "e": 242.651, "text": "One habit to leave behind. In the old network, a VLAN did three jobs at once. It was the broadcast domain, it held the gateway, and it was your security boundary."}, {"s": 243.321, "e": 258.552, "text": "ACI splits those jobs. The bridge domain takes the broadcast domain and the gateway. The EPG takes security. And the VLAN number? It survives only at the edge, as a tag on the port that tells the leaf which EPG a frame belongs to."}, {"s": 259.222, "e": 277.132, "text": "Here's why that matters. Say the bank has production and test servers sharing one subnet, which happens more often than anyone admits. In ACI you put them in two EPGs inside the same bridge domain, and they're separated. No new subnet, no change of IP address, and no downtime for re-addressing."}, {"s": 277.802, "e": 286.369, "text": "Quick check. Two servers are in the same subnet and the same bridge domain, but in different EPGs, with no contract. Can they talk?"}, {"s": 302.268, "e": 313.804, "text": "Three tenants exist on every fabric before you create your own. Think of the office park again. Tenant common is the shared cafeteria and the parking. Anything placed there, every company can use."}, {"s": 314.474, "e": 321.758, "text": "Tenant infra is the park's own facility team: power, lifts and plumbing. It keeps the fabric itself running, so you leave it alone."}, {"s": 322.428, "e": 329.037, "text": "And the management tenant is the security control room. It's the way in to manage the switches and the controllers."}, {"s": 329.937, "e": 349.329, "text": "One last idea, and it's the one that catches every new ACI engineer. An access card is useless if the door's card reader was never wired. In ACI, tenant policy is the card. It says what should exist. Access policies are the wiring. They say on which switch, which port and which VLAN it's allowed to appear."}, {"s": 349.999, "e": 364.472, "text": "When the two don't agree, the APIC raises a fault you'll get to know well: F0467. If you see it on day one, don't panic. Check the wiring: the VLAN pool, the domain, and the profile on that port. We'll walk that chain in Lesson 4."}, {"s": 365.142, "e": 375.766, "text": "Try this one. An engineer binds an EPG to a port using VLAN 110. The VLAN pool for that port only allows 100 to 109. Which half is wrong?"}, {"s": 393.726, "e": 405.817, "text": "Let's close the case. At two in the morning, nothing was broken. The web and app servers were in different EPGs, and nobody had written the contract. One contract later, the payments application was up."}, {"s": 406.487, "e": 417.776, "text": "Take three things with you. First, the hierarchy: tenant, VRF, bridge domain, EPG. Each bridge domain belongs to one VRF, and each EPG belongs to one bridge domain."}, {"s": 418.446, "e": 424.646, "text": "Second, the rule: open inside an EPG, closed between EPGs until a contract says otherwise."}, {"s": 425.316, "e": 429.468, "text": "And third, the two halves: tenant policy and access policies must agree."}, {"s": 430.138, "e": 437.421, "text": "In the next lesson we decide how many tenants and VRFs a design really needs. Before that, try the quiz just below."}], "x": {"items": [{"t": "say", "scene": "hook", "step": 0, "chapter": "The 2 a.m. call", "text": "Imagine this situation. It's two in the morning, and you're in a change window at a bank's data center. Tonight the team is moving the payments application onto a brand new ACI fabric.", "a": [0.35, 11.153], "cues": []}, {"t": "say", "scene": "hook", "step": 1, "text": "The servers are racked and cabled. The VLANs are correct. The IP addresses are correct. Every check on your list is green.", "a": [11.823, 19.544], "cues": [13.85, 15.476]}, {"t": "say", "scene": "hook", "step": 4, "fx": "hookDrop", "text": "Then the application team calls. The web server can't reach the app server. There's no access list anywhere. No link is down. Routing looks fine.", "a": [20.214, 29.81], "cues": []}, {"t": "probe", "id": "q1", "scene": "hook", "step": 5, "text": "So, where do you look first? Pick a check, and I'll show you what you find.", "prompt": "The packet is dropped at the leaf. What do you check first?", "checks": [{"k": "cab", "label": "The cable and the optic", "result": "The link is up and the port shows no errors. Not the cause."}, {"k": "vlan", "label": "The VLAN on the leaf port", "result": "The VLAN is deployed on the port and the server's MAC address is learned. Not the cause."}, {"k": "route", "label": "Routing between the two subnets", "result": "Both subnets are in the same VRF and both routes are present. Not the cause."}, {"k": "pol", "label": "The policy between the web and app groups", "result": "There is no contract between the web group and the app group. This is the cause.", "cause": true}], "done": "That's it. Everything physical was healthy. In ACI, nothing talks across groups until a rule allows it. Let's see why, and then you'll fix this yourself.", "a": [30.48, 34.46], "cues": [], "d": [35.13, 44.887]}, {"t": "say", "scene": "ways", "step": 0, "chapter": "Box by box, or once", "text": "In the network most of us grew up with, you configure one box at a time. Log in to a switch, create the VLAN, add the gateway, write the access list. Then the next switch. And the next.", "a": [45.787, 57.176], "cues": []}, {"t": "say", "scene": "ways", "step": 1, "text": "ACI turns that around. You describe what the application needs just once, on the controller, which is called the APIC. The APIC then programs every leaf for you.", "a": [57.846, 67.842], "cues": []}, {"t": "say", "scene": "ways", "step": 2, "text": "So the skill is no longer typing commands quickly. The skill is describing the application correctly. And for that you need ACI's vocabulary. Just five words.", "a": [68.512, 78.928], "cues": []}, {"t": "say", "scene": "park", "step": 0, "chapter": "The office park", "text": "Let me explain those five words with a place you already know: a large office park, with many companies inside it.", "a": [79.828, 85.893], "cues": []}, {"t": "say", "scene": "park", "step": 1, "text": "Many companies rent space in the park. Each company runs its own office, with its own admin team and its own rules. In ACI, each of those companies is a tenant.", "a": [86.563, 96.612], "cues": []}, {"t": "say", "scene": "park", "step": 2, "text": "Every company numbers its rooms however it likes. Company A has a Room 101. So does Company B. Nobody gets confused, because the numbering is private to each company. That private numbering is a VRF.", "a": [97.282, 110.872], "cues": []}, {"t": "say", "scene": "floor", "step": 0, "text": "Now walk into Company A. Each floor is one open hall. If you shout on that floor, everyone on the floor hears you, and nobody on the other floors does. Each floor also has one reception e": "bank", "step": 3, "text": "And three EPGs: the web servers, the app servers and the database servers. Each EPG sits in exactly one bridge domain.", "a": [186.275, 194.206], "cues": []}, {"t": "say", "scene": "bank", "step": 4, "text": "Two rules are worth remembering. Inside one EPG, servers talk freely, like colleagues in the same team. Between two EPGs, nothing passes until a contract allows it. ACI is an allow-list.", "a": [194.876, 207.69], "cues": [196.923, 201.695]}, {"t": "sim", "id": "s1", "scene": "bank", "step": 7, "text": "So, back to two in the morning. You have the controls now. Let the web tier reach the app tier, let the app tier reach the database, and keep the web tier away from the database. Add the contracts, then send traffic to test.", "prompt": "Fix the 2 a.m. problem. Web must reach App, App must reach DB, and Web must not reach DB.", "done": "That's the fix. One contract from web to app, one from app to database, and nothing between web and database. That missing contract was the whole two a.m. problem.", "a": [208.36, 221.521], "cues": [], "d": [222.191, 232.202]}, {"t": "say", "scene": "split", "step": 0, "chapter": "An EPG is not a VLAN", "text": "One habit to leave behind. In the old network, a VLAN did three jobs at once. It was the broadcast domain, it held the gateway, and it was your security boundary.", "a": [233.102, 242.651], "cues": []}, {"t": "say", "scene": "split", "step": 1, "text": "ACI splits those jobs. The bridge domain takes the broadcast domain and the gateway. The EPG takes security. And the VLAN number? It survives only at the edge, as a tag on the port that tells the leaf which EPG a frame belongs to.", "a": [243.321, 258.552], "cues": [250.906]}, {"t": "say", "scene": "split", "step": 3, "text": "Here's why that matters. Say the bank has production and test servers sharing one subnet, which happens more often than anyone admits. In ACI you put them in two EPGs inside the same bridge domain, and they're separated. No new subnet, no change of IP address, and no downtime for re-addressing.", "a": [259.222, 277.132], "cues": [267.05, 272.649]}, {"t": "ask", "id": "q2", "scene": "split", "step": 6, "text": "Quick check. Two servers are in the same subnet and the same bridge domain, but in different EPGs, with no contract. Can they talk?", "prompt": "Same subnet, same bridge domain, different EPGs, no contract. Can the two servers talk?", "options": ["Yes. Same subnet means they can always talk", "No. Different EPGs need a contract, even in one subnet", "Only if both sit on the same leaf"], "answer": 1, "right": "Correct. Same subnet doesn't mean same group. The EPG decides, not the subnet.", "wrong": "Careful, that's the old habit talking. In ACI the EPG decides, not the subnet. Without a contract, they can't talk.", "a": [277.802, 286.369], "cues": [], "r": [287.039, 292.892], "w": [293.562, 301.368]}, {"t": "say", "scene": "shared", "step": 0, "chapter": "Three built-in tenants", "text": "Three tenants exist on every fabric before you create your own. Think of the office park again. Tenant common is the shared cafeteria and the parking. Anything placed there, every company can use.", "a": [302.268, 313.804], "cues": []}, {"t": "say", "scene": "shared", "step": 1, "text": "Tenant infra is the park's own facility team: power, lifts and plumbing. It keeps the fabric itself running, so you leave it alone.", "a": [314.474, 321.758], "cues": []}, {"t": "say", "scene": "shared", "step": 2, "text": "And the management tenant is the security control room. It's the way in to manage the switches and the controllers.", "a": [322.428, 329.037], "cues": []}, {"t": "say", "scene": "halves", "step": 0, "chapter": "The card and the wiring", "text": "One last idea, and it's the one that catches every new ACI engineer. An access card is useless if the door's card reader was never wired. In ACI, tenant policy is the card. It says what should exist. Access policies are the wiring. They say on which switch, which port and which VLAN it's allowed to appear.", "a": [329.937, 349.329], "cues": [338.602, 343.186]}, {"t": "say", "scene": "halves", "step": 3, "text": "When the two don't agree, the APIC raises a fault you'll get to know well: F0467. If you see it on day one, don't panic. Check the wiring: the VLAN pool, the domain, and the profile on that port. We'll walk that chain in Lesson 4.", "a": [349.999, 364.472], "cues": [358.014]}, {"t": "ask", "id": "q3", "scene": "halves", "step": 5, "text": "Try this one. An engineer binds an EPG to a port using VLAN 110. The VLAN pool for that port only allows 100 to 109. Which half is wrong?", "prompt": "EPG bound to a port with VLAN 110. The port's VLAN pool allows only 100 to 109. Which half is wrong?", "options": ["Tenant policy: the contract is missing", "Access policies: VLAN 110 isn't allowed on that port", "Neither. It will work"], "answer": 1, "right": "Right. The card is fine, the wiring is not. That's F0467.", "wrong": "Not quite. The EPG and its contracts are fine. The VLAN isn't permitted on that port, and that's an access policy problem. That's F0467.", "a": [365.142, 375.766], "cues": [], "r": [376.436, 382.012], "w": [382.682, 392.826]}, {"t": "say", "scene": "hook", "step": 6, "fx": "hookPass", "chapter": "Case closed", "text": "Let's close the case. At two in the morning, nothing was broken. The web and app servers were in different EPGs, and nobody had written the contract. One contract later, the payments application was up.", "a": [393.726, 405.817], "cues": []}, {"t": "say", "scene": "recap", "step": 0, "text": "Take three things with you. First, the hierarchy: tenant, VRF, bridge domain, EPG. Each bridge domain belongs to one VRF, and each EPG belongs to one bridge domain.", "a": [406.487, 417.776], "cues": []}, {"t": "say", "scene": "recap", "step": 1, "text": "Second, the rule: open inside an EPG, closed between EPGs until a contract says otherwise.", "a": [418.446, 424.646], "cues": []}, {"t": "say", "scene": "recap", "step": 2, "text": "And third, the two halves: tenant policy and access policies must agree.", "a": [425.316, 429.468], "cues": []}, {"t": "say", "scene": "recap", "step": 3, "text": "In the next lesson we decide how many tenants and VRFs a design really needs. Before that, try the quiz just below.", "a": [430.138, 437.421], "cues": []}], "teachback": {"prompt": "In two or three sentences, explain to a colleague why the web server could not reach the app server at 2 a.m., and what fixed it.", "model": "Nothing was broken. The web and app servers were in different EPGs, and ACI drops traffic between EPGs until a contract allows it. Adding a contract from the web EPG to the app EPG fixed it.", "points": ["the two servers were in different EPGs", "ACI is an allow-list: traffic between EPGs is dropped until a contract allows it", "the fix was a contract from the web EPG to the app EPG"]}, "onthejob": "On a real fabric, the leaf logs packets that a missing contract drops. On the leaf CLI: show logging ip access-list internal packet-log deny. Confirm the syntax for your software release.", "poster": ["hook", 3]}}, {"id": "l2", "n": 2, "title": "Tenants and VRFs", "summary": "A Monday design workshop after the bank buys an insurance company: three opinions, overlapping addresses, and a design desk where you decide the tenants and VRFs yourself.", "keypoints": ["A tenant is an administrative boundary. A VRF is a forwarding boundary.", "Ask two questions: who must administer this independently (tenants), and what must be separated or inspected (VRFs).", "Three patterns cover most designs: one tenant with several VRFs, a tenant per company or customer, a tenant per environment. Applications are application profiles, not tenants.", "Tenant common is shared by all tenants, so a change there has the widest blast radius. Names resolve in the local tenant first, then in common.", "A tenant with its own VRF reaches shared services by route leaking, with a contract whose scope is global. Leaked subnets must be unique, so overlapping ranges need address translation.", "Keep VRFs enforced with ingress enforcement. Every VRF needs its own path to the outside.", "Write the naming convention first. ACI objects cannot be renamed."], "quiz": [{"q": "A group has three subsidiaries. Each has its own network team, and two of them use the same IP ranges. Which model fits best?", "o": ["One tenant per subsidiary", "One tenant, with one bridge domain per subsidiary", "One tenant with one VRF", "Everything in tenant common"], "a": 0, "why": "Independent administration points to separate tenants, and each tenant's own VRF allows the overlapping addresses."}, {"q": "What does setting a VRF to Unenforced do?", "o": ["Disables endpoint learning", "Stops contract enforcement for every EPG in the VRF", "Disables routing in the VRF", "Removes the VRF's L3Out"], "a": 1, "why": "Unenforced allows all EPGs in the VRF to communicate without contracts. Use it only briefly, for migration or troubleshooting."}, {"q": "A filter named F_TCP_443 exists in both tenant common and a user tenant. A contract in the user tenant references F_TCP_443. Which one is used?", "o": ["The one in the user tenant", "Both are merged", "The APIC raises a fault", "The one in common"], "a": 0, "why": "Names resolve in the local tenant first and in common second, so the local object takes over."}, {"q": "Why should the naming convention be agreed before the first object is created?", "o": ["The APIC rejects names without prefixes", "Names affect forwarding performance", "ACI objects cannot be renamed, only deleted and recreated", "Names are limited to eight characters"], "a": 2, "why": "An object's name is part of its identity on the APIC. Changing it means deleting and recreating the object and everything that refers to it."}], "duration": 287.1, "cues": [{"s": 0.35, "e": 8.717, "text": "A year has passed. The bank's fabric is running well, and now the bank has bought an insurance company. On Monday morning, you're in the design workshop."}, {"s": 9.387, "e": 24.367, "text": "Three people are in the room, with three opinions. The network lead wants one tenant for everything. The application architect wants a tenant for every application. And the insurance company's IT manager wants his own tenant, with his own team in control."}, {"s": 25.037, "e": 34.225, "text": "There's one more complication. The insurance company uses the same IP address ranges as the bank. Both of them use 10.10.x.x addresses."}, {"s": 34.895, "e": 36.935, "text": "Before we work it out, whose side are you on?"}, {"s": 51.279, "e": 66.137, "text": "The whole decision rests on keeping two boundaries apart. A tenant is an administrative boundary. It decides who can change what, and it scopes names, faults and health scores. In our office park, the tenant is the lease. It says whose office this is."}, {"s": 66.807, "e": 77.364, "text": "A VRF is a forwarding boundary. It's a separate routing table, so addresses can overlap. And traffic between two VRFs has to cross a firewall, or be leaked on purpose."}, {"s": 78.034, "e": 88.133, "text": "So ask two separate questions. Who must administer this independently? That gives you tenants. And what must be separated or inspected? That gives you VRFs."}, {"s": 89.033, "e": 101.009, "text": "Three patterns cover most real designs. Pattern one is a single tenant with several VRFs. One organisation, one network team. Production, test and the DMZ become VRFs."}, {"s": 101.679, "e": 112.266, "text": "Pattern two is a tenant for each company or business unit. Each one has its own team, and each can reuse the same addresses. Hosting providers and group companies work this way."}, {"s": 112.936, "e": 123.86, "text": "Pattern three is a tenant for each environment: production, UAT and development. Change control stays clean, and automation written for one environment runs unchanged in the next."}, {"s": 124.76, "e": 137.23, "text": "Shared services need a home too. Tenant common is the office park's shared cafeteria. Put a shared VRF there, your standard filters, and the contracts for DNS and NTP, and every tenant can use them."}, {"s": 137.9, "e": 152.849, "text": "One caution. A tenant with its own VRF reaches those services by leaking routes between VRFs, and leaked subnets must be unique. So the insurance company's overlapping addresses would need translating on the way, usually on a firewall."}, {"s": 153.519, "e": 159.762, "text": "But a change in common touches every tenant at once. So keep the list of people who can edit it very short."}, {"s": 160.432, "e": 175.652, "text": "And here's a trap. When a tenant refers to an object by name, the APIC looks in that tenant first, and in common second. If someone creates a local object with the same name, it quietly takes over. A naming convention that marks shared objects prevents this."}, {"s": 176.322, "e": 180.124, "text": "Your turn. Match each situation to the design that fits it."}, {"s": 190.158, "e": 203.105, "text": "Inside a VRF, two settings deserve a decision. The first is policy enforcement. Keep it enforced. Unenforced switches off every contract in the VRF. It's a migration tool, not a design."}, {"s": 203.775, "e": 216.448, "text": "The second is the enforcement direction. Keep it at ingress. Traffic arriving from outside is then filtered on the leaf where the server sits, and not on the border leaf. That protects the border leaf's policy memory."}, {"s": 217.118, "e": 230.198, "text": "And remember what every extra VRF costs. Each one needs its own way out: its own L3Out, or a shared one with route leaking. Three VRFs mean three sets of routing adjacencies to design and to monitor."}, {"s": 230.868, "e": 240.091, "text": "Quick check. During a migration weekend, someone sets the production VRF to unenforced, and forgets to change it back. What's the effect on Monday?"}, {"s": 258.017, "e": 266.751, "text": "Now, back to the workshop. You have the pen. Design the tenant model for the bank and its new insurance company. Keep the two questions in mind."}, {"s": 285.166, "e": 298.591, "text": "One last thing before you leave the workshop. Write the naming convention before you create the first object. ACI objects can't be renamed. A rename means delete and recreate, along with everything that refers to that object."}, {"s": 299.261, "e": 309.891, "text": "And check the numbers. Cisco publishes a Verified Scalability Guide for every release. The limits change between releases, so look them up for yours, and never design from memory."}, {"s": 310.561, "e": 323.301, "text": "One more. A filter exists in tenant common, and somebody creates a filter with exactly the same name in the insurance tenant. A contract in the insurance tenant refers to that name. Which filter does it use?"}, {"s": 333.441, "e": 348.241, "text": "So who won the argument in the workshop? Nobody, completely. The insurance manager gets his tenant. The network lead keeps one tenant for the bank, with VRFs for separation. And the architect's applications become application profiles."}, {"s": 348.911, "e": 354.925, "text": "Take three things with you. First: tenants follow administration, and VRFs follow separation."}, {"s": 355.595, "e": 360.879, "text": "Second: tenant common is powerful and shared. Guard it, and watch for names that shadow it."}, {"s": 361.549, "e": 365.755, "text": "And third: keep your VRFs enforced, and write the naming convention first."}, {"s": 366.425, "e": 373.468, "text": "Next, we go one level down, to the bridge domain, where most forwarding surprises come from. Try the quiz below first."}], "x": {"items": [{"t": "say", "scene": "l2_hook", "step": 0, "chapter": "The design workshop", "text": "A year has passed. The bank's fabric is running well, and now the bank has bought an insurance company. On Monday morning, you're in the design workshop.", "a": [0.35, 8.717], "cues": []}, {"t": "say", "scene": "l2_hook", "step": 1, "text": "Three people are in the room, with three opinions. The network lead wants one tenant for everything. The application architect wants a tenant for every application. And the insurance company's IT manager wants his own tenant, with his own team in control.", "a": [9.387, 24.367], "cues": [12.061, 15.033, 18.956]}, {"t": "say", "scene": "l2_hook", "step": 5, "text": "There's one more complication. The insurance company uses the same IP address ranges as the bank. Both of them use 10.10.x.x addresses.", "a": [25.037, 34.225], "cues": []}, {"t": "ask", "id": "q1", "scene": "l2_hook", "step": 6, "text": "Before we work it out, whose side are you on?", "prompt": "Three opinions in the workshop. Which is closest to the right design?", "options": ["One tenant for everything", "A tenant for every application", "A separate tenant for the insurance company"], "answer": 2, "right": "Good instinct. Now let's see the reasoning, because the reason matters more than the answer.", "wrong": "That's a common position, and by the end of this lesson you'll see why it doesn't hold here. The reason matters more than the answer.", "a": [34.895, 36.935], "cues": [], "r": [37.605, 42.593], "w": [43.263, 50.379]}, {"t": "say", "scene": "l2_bound", "step": 0, "chapter": "Two boundaries", "text": "The whole decision rests on keeping two boundaries apart. A tenant is an administrative boundary. It decides who can change what, and it scopes names, faults and health scores. In our office park, the tenant is the lease. It says whose office this is.", "a": [51.279, 66.137], "cues": []}, {"t": "say", "scene": "l2_bound", "step": 1, "text": "A VRF is a forwarding boundary. It's a separate routing table, so addresses can overlap. And traffic between two VRFs has to cross a firewall, or be leaked on purpose.", "a": [66.807, 77.364], "cues": []}, {"t": "say", "scene": "l2_bound", "step": 2, "text": "So ask two separate questions. Who must administer this independently? That gives you tenants. And what must be separated or inspected? That gives you VRFs.", "a": [78.034, 88.133], "cues": []}, {"t": "say", "scene": "l2_pat", "step": 0, "chapter": "Three patterns", "text": "Three patterns cover most real designs. Pattern one is a single tenant with several VRFs. One organisation, one network team. Production, test and the DMZ become VRFs.", "a": [89.033, 101.009], "cues": []}, {"t": "say", "scene": "l2_pat", "step": 1, "text": "Pattern two is a tenant for each company or business unit. Each one has its own team, and each can reuse the same addresses. Hosting providers and group companies work this way.", "a": [101.679, 112.266], "cues": []}, {"t": "say", "scene": "l2_pat", "step": 2, "text": "Pattern three is a tenant for each environment: production, UAT and development. Change control stays clean, and automation written for one environment runs unchanged in the next.", "a": [112.936, 123.86], "cues": []}, {"t": "say", "scene": "l2_common", "step": 0, "chapter": "Tenant common", "text": "Shared services need a home too. Tenant common is the office park's shared cafeteria. Put a shared VRF there, your standard filters, and the contracts for DNS and NTP, and every tenant can use them.", "a": [124.76, 137.23], "cues": []}, {"t": "say", "scene": "l2_common", "step": 0, "text": "One caution. A tenant with its own VRF reaches those services by leaking routes between VRFs, and leaked subnets must be unique. So the insurance company's overlapping addresses would need translating on the way, usually on a firewall.", "a": [137.9, 152.849], "cues": []}, {"t": "say", "scene": "l2_common", "step": 1, "text": "But a change in common touches every tenant at once. So keep the list of people who can edit it very short.", "a": [153.519, 159.762], "cues": []}, {"t": "say", "scene": "l2_common", "step": 2, "text": "And here's a trap. When a tenant refers to an object by name, the APIC looks in that tenant first, and in common second. If someone creates a local object with the same name, it quietly takes over. A naming convention that marks shared objects prevents this.", "a": [160.432, 175.652], "cues": []}, {"t": "match", "id": "m1", "scene": "l2_common", "step": 2, "text": "Your turn. Match each situation to the design that fits it.", "prompt": "Match each situation to the design that fits it.", "pairs": [["One company, one network team, three security zones", "One tenant, several VRFs"], ["A provider hosting forty customers", "A tenant per customer"], ["Strict separation of production, UAT and development", "A tenant per environment"], ["DNS and NTP used by every tenant", "Tenant common"]], "done": "Good. Notice that none of these is a tenant for every application. Applications belong in application profiles, inside a tenant.", "a": [176.322, 180.124], "cues": [], "d": [180.794, 189.258]}, {"t": "say", "scene": "l2_vrf", "step": 0, "chapter": "VRF settings", "text": "Inside a VRF, two settings deserve a decision. The first is policy enforcement. Keep it enforced. Unenforced switches off every contract in the VRF. It's a migration tool, not a design.", "a": [190.158, 203.105], "cues": []}, {"t": "say", "scene": "l2_vrf", "step": 1, "text": "The second is the enforcement direction. Keep it at ingress. Traffic arriving from outside is then filtered on the leaf where the server sits, and not on the border leaf. That protects the border leaf's policy memory.", "a": [203.775, 216.448], "cues": []}, {"t": "say", "scene": "l2_vrf", "step": 2, "text": "And remember what every extra VRF costs. Each one needs its own way out: its own L3Out, or a shared one with route leaking. Three VRFs mean three sets of routing adjacencies to design and to monitor.", "a": [217.118, 230.198], "cues": []}, {"t": "ask", "id": "q2", "scene": "l2_vrf", "step": 2, "text": "Quick check. During a migration weekend, someone sets the production VRF to unenforced, and forgets to change it back. What's the effect on Monday?", "prompt": "The production VRF was left unenforced after a migration. What is the effect?", "options": ["Routing stops inside the VRF", "Every EPG in the VRF can talk to every other EPG", "Only the L3Out stops working"], "answer": 1, "right": "Exactly. Every contract in that VRF is ignored, so the segmentation is gone, and nothing looks broken.", "wrong": "Not quite. Routing keeps working. What disappears is the security. Every contract in that VRF is ignored, and nothing looks broken.", "a": [230.868, 240.091], "cues": [], "r": [240.761, 247.46], "w": [248.13, 257.117]}, {"t": "sim", "id": "s2", "scene": "l2_desk", "step": 0, "chapter": "Design it", "text": "Now, back to the workshop. You have the pen. Design the tenant model for the bank and its new insurance company. Keep the two questions in mind.", "prompt": "Design the tenant model. The insurance company keeps its own IT team and its 10.10.x.x addresses. Card payments must sit behind a firewall, away from the rest of the bank. DNS and NTP are shared by everyone.", "done": "That's a design you can defend. The insurance company gets its own tenant, because it has its own team and its own addresses. Card payments get their own VRF, because they must be inspected. Shared services live in common. And applications are application profiles, not tenants.", "a": [258.017, 266.751], "cues": [], "d": [267.421, 284.266]}, {"t": "say", "scene": "l2_name", "step": 0, "chapter": "Before you build", "text": "One last thing before you leave the workshop. Write the naming convention before you create the first object. ACI objects can't be renamed. A rename means delete and recreate, along with everything that refers to that object.", "a": [285.166, 298.591], "cues": []}, {"t": "say", "scene": "l2_name", "step": 1, "text": "And check the numbers. Cisco publishes a Verified Scalability Guide for every release. The limits change between releases, so look them up for yours, and never design from memory.", "a": [299.261, 309.891], "cues": []}, {"t": "ask", "id": "q3", "scene": "l2_name", "step": 1, "text": "One more. A filter exists in tenant common, and somebody creates a filter with exactly the same name in the insurance tenant. A contract in the insurance tenant refers to that name. Which filter does it use?", "prompt": "A filter named F_TCP_443 exists in tenant common and in the insurance tenant. A contract in the insurance tenant refers to F_TCP_443. Which one is used?", "options": ["The one in tenant common", "The local one in the insurance tenant", "Both are merged"], "answer": 1, "right": "Right. Local first, then common.", "wrong": "Careful. The APIC looks in the local tenant first, so the local one wins, silently.", "a": [310.561, 323.301], "cues": [], "r": [323.971, 326.683], "w": [327.353, 332.541]}, {"t": "say", "scene": "l2_hook", "step": 7, "chapter": "Case closed", "text": "So who won the argument in the workshop? Nobody, completely. The insurance manager gets his tenant. The network lead keeps one tenant for the bank, with VRFs for separation. And the architect's applications become application profiles.", "a": [333.441, 348.241], "cues": []}, {"t": "say", "scene": "l2_recap", "step": 0, "text": "Take three things with you. First: tenants follow administration, and VRFs follow separation.", "a": [348.911, 354.925], "cues": []}, {"t": "say", "scene": "l2_recap", "step": 1, "text": "Second: tenant common is powerful and shared. Guard it, and watch for names that shadow it.", "a": [355.595, 360.879], "cues": []}, {"t": "say", "scene": "l2_recap", "step": 2, "text": "And third: keep your VRFs enforced, and write the naming convention first.", "a": [361.549, 365.755], "cues": []}, {"t": "say", "scene": "l2_recap", "step": 3, "text": "Next, we go one level down, to the bridge domain, where most forwarding surprises come from. Try the quiz below first.", "a": [366.425, 373.468], "cues": []}], "teachback": {"prompt": "In two or three sentences, explain why the insurance company gets its own tenant while card payments only get their own VRF.", "model": "The insurance company has its own IT team and overlapping addresses, so it needs its own administrative boundary, which is a tenant with its own VRF. Card payments are run by the same bank team but must be separated and inspected by a firewall, which is a forwarding boundary, so a VRF inside the bank's tenant is enough.", "points": ["a tenant is an administrative boundary and the insurance company has its own team", "a VRF is a forwarding boundary and card payments must be separated and inspected by a firewall", "overlapping addresses work because the insurance tenant has its own VRF"]}, "onthejob": "In the APIC, both settings are on the VRF's Policy tab: Policy Control Enforcement Preference (keep Enforced) and Policy Control Enforcement Direction (keep Ingress). Check them after every migration weekend.", "poster": ["l2_hook", 5]}}, {"id": "l3", "n": 3, "title": "Bridge domains", "summary": "Migration weekend, and one backup appliance keeps going silent. Find out why, watch flood and hardware proxy side by side, then fix the bridge domain yourself.", "keypoints": ["For an unknown destination MAC, a bridge domain either floods the frame or sends it to the spine (hardware proxy).", "Hardware proxy only works when the fabric knows every endpoint. A silent host ages out and its traffic is dropped.", "With unicast routing on and a subnet on the bridge domain, the fabric learns host IP addresses, probes them before they age out, and can ARP for a silent host when routed traffic arrives. A Layer 2 only bridge domain has no such safety net.", "Routed profile when ACI is the gateway: unicast routing on, hardware proxy, limit IP learning on.", "Layer 2 profile when the gateway is outside: unicast routing off, unknown unicast flood. ARP is always flooded when unicast routing is off; the ARP flooding setting only matters when routing is on.", "Subnet scope decides visibility: private to VRF, advertised externally, or shared between VRFs."], "quiz": [{"q": "A bridge domain is Layer 2 only. Its gateway is an external firewall, and some hosts are silent until spoken to. Which settings fit?", "o": ["Unicast routing on, flood, ARP flooding off", "Unicast routing off, flood, ARP flooding on", "Unicast routing off, hardware proxy, ARP flooding off", "Unicast routing on, hardware proxy, ARP flooding off"], "a": 1, "why": "Without unicast routing the fabric cannot ARP for silent hosts, so hardware proxy would drop frames to them. Flood with ARP flooding behaves like a classic switch."}, {"q": "With hardware proxy, what does a leaf do with a frame for a MAC address it does not know?", "o": ["Sends it to the spine, which forwards it if the endpoint is known and drops it if not", "Drops it immediately", "Floods it in the bridge domain", "Sends it to the APIC"], "a": 0, "why": "The spine holds the fabric-wide endpoint database. If the endpoint is not there either, the frame is dropped."}, {"q": "A subnet must be announced to the WAN through an L3Out. Which subnet scope is required?", "o": ["Advertised externally", "Shared between VRFs", "No scope is needed", "Private to VRF"], "a": 0, "why": "Only subnets marked Advertised externally may be announced through an L3Out."}, {"q": "During a gateway migration, why set the bridge domain MAC to the legacy HSRP virtual MAC?", "o": ["To enable hardware proxy", "To allow overlapping subnets", "ACI requires an HSRP MAC to route", "So hosts keep a valid ARP entry for the gateway and do not notice the move"], "a": 3, "why": "Hosts already have the gateway IP mapped to the HSRP virtual MAC. Reusing it avoids waiting for ARP caches to refresh."}], "duration": 275.5, "cues": [{"s": 0.35, "e": 15.005, "text": "It's migration weekend. The bank is moving its old data center network into the ACI fabric, one VLAN at a time. The plan is simple. Connect the old network to the fabric at Layer 2, and keep the default gateway on the old core for now."}, {"s": 15.675, "e": 27.877, "text": "By midnight, forty servers in the first VLAN answer every test. But one device doesn't, and it's the backup appliance. It answers for a few minutes, then it goes silent, and it only comes back when somebody logs in to it."}, {"s": 28.547, "e": 32.558, "text": "So, what do you check first? Pick a check, and I'll show you what you find."}, {"s": 44.634, "e": 60.491, "text": "When a frame arrives for a MAC address the leaf doesn't know, the bridge domain has two possible behaviours. The first one is flood. The frame goes to every leaf that has this bridge domain, just like a classic switch. It always arrives, at the cost of extra traffic."}, {"s": 61.161, "e": 74.89, "text": "The second one is hardware proxy. The leaf sends the frame to the spine, and the spine looks it up in the fabric's endpoint database. If the endpoint is known, the frame is delivered to exactly one leaf. That's efficient and quiet."}, {"s": 75.56, "e": 84.373, "text": "But if the spine doesn't know the endpoint either, the frame is dropped. And a silent host, one that hasn't sent anything for a while, ages out of that database."}, {"s": 85.043, "e": 105.881, "text": "When ACI is the gateway, there's a safety net. With unicast routing on and a subnet on the bridge domain, the fabric learns the host's IP address, checks on it before the entry ages out, and can send its own ARP request when routed traffic is looking for it. In a Layer 2 only bridge domain, like ours tonight, that safety net doesn't exist."}, {"s": 106.781, "e": 118.977, "text": "Four bridge domain settings decide all of this. Number one is unicast routing. Turn it on when ACI is the default gateway. Leave it off when the gateway lives on a firewall, or on the old core."}, {"s": 119.647, "e": 126.183, "text": "Number two is Layer 2 unknown unicast. Hardware proxy or flood. That's the choice you just saw."}, {"s": 126.853, "e": 151.502, "text": "Number three is ARP flooding. When it's off, the fabric delivers each ARP request straight to the target it already knows. When it's on, ARP is flooded, like on a classic switch. Turn it on wherever firewalls, load balancers or clusters rely on gratuitous ARP to fail over. This setting only matters when unicast routing is on. With routing off, ARP is always flooded."}, {"s": 152.172, "e": 159.838, "text": "And number four is limit IP learning to subnet. Keep it on, so the fabric ignores addresses that don't belong to the bridge domain."}, {"s": 160.738, "e": 171.37, "text": "In practice, you only need two profiles. The routed profile is for when ACI is the gateway: unicast routing on, a subnet, hardware proxy, and limit IP learning on."}, {"s": 172.04, "e": 184.112, "text": "The Layer 2 profile is for when the gateway is outside: unicast routing off, no subnet, and flood. ARP is flooded anyway when routing is off. Every bridge domain starts here during a migration."}, {"s": 184.782, "e": 189.266, "text": "Your turn. Match each situation to the profile or the setting it needs."}, {"s": 193.763, "e": 206.224, "text": "The backup appliance is still unreachable, and you have the bridge domain settings in front of you. Change what's needed, so that a silent host is always reachable in this Layer 2 bridge domain. Then send a frame to test it."}, {"s": 223.603, "e": 234.622, "text": "A few weeks later, you move the gateway into ACI. It's a planned step. Add the subnet to the bridge domain, enable unicast routing, and shut the old gateway, all in one change window."}, {"s": 235.292, "e": 247.62, "text": "Here's a trick from the field. Set the bridge domain's MAC address to the old HSRP virtual MAC. The servers keep the ARP entry they already have, and they never notice that the gateway moved."}, {"s": 248.29, "e": 254.383, "text": "Quick check. After the gateway has moved into ACI, which profile does this bridge domain need?"}, {"s": 272.096, "e": 289.888, "text": "One more setting lives on the subnet itself, and it's called scope. Private to VRF is the default, and the subnet stays inside its VRF. Advertised externally lets the subnet be announced to the outside, through an L3Out. Shared between VRFs lets it be leaked into another VRF."}, {"s": 290.558, "e": 299.914, "text": "Remember this one. When a new server can't be reached from outside, the subnet is very often still marked private. We'll solve exactly that case in Lesson 5."}, {"s": 300.814, "e": 315.619, "text": "So what happened on migration weekend? The bridge domain was left on hardware proxy, while the gateway was still outside. The quiet backup appliance aged out, and the spine dropped its traffic. Changing unknown unicast to flood fixed it, in one change."}, {"s": 316.289, "e": 322.176, "text": "Take three things with you. First: hardware proxy only works when the fabric knows every endpoint."}, {"s": 322.846, "e": 328.034, "text": "Second: two profiles. Routed when ACI is the gateway, and Layer 2 when it isn't."}, {"s": 328.704, "e": 334.494, "text": "And third: write every bridge domain setting into the design, and confirm the defaults for your software release."}, {"s": 335.164, "e": 341.605, "text": "Next come EPGs and contracts, and an audit finding that nobody expected. Try the quiz below first."}], "x": {"items": [{"t": "say", "scene": "l3_hook", "step": 0, "chapter": "Migration weekend", "text": "It's migration weekend. The bank is moving its old data center network into the ACI fabric, one VLAN at a time. The plan is simple. Connect the old network to the fabric at Layer 2, and keep the default gateway on the old core for now.", "a": [0.35, 15.005], "cues": []}, {"t": "say", "scene": "l3_hook", "step": 1, "text": "By midnight, forty servers in the first VLAN answer every test. But one device doesn't, and it's the backup appliance. It answers for a few minutes, then it goes silent, and it only comes back when somebody logs in to it.", "a": [15.675, 27.877], "cues": [19.421]}, {"t": "probe", "id": "q1", "scene": "l3_hook", "step": 3, "text": "So, what do you check first? Pick a check, and I'll show you what you find.", "prompt": "The backup appliance keeps going silent. What do you check first?", "checks": [{"k": "cab", "label": "The appliance's cable and port", "result": "The link is up and shows no errors. Not the cause."}, {"k": "vlan", "label": "The VLAN binding on its leaf port", "result": "The binding is correct, and other servers in the same EPG work. Not the cause."}, {"k": "con", "label": "The contracts on its EPG", "result": "The other servers in the same EPG reach each other and the gateway. Contracts are not the cause."}, {"k": "bd", "label": "How the bridge domain treats a destination it has not learned", "result": "The bridge domain uses hardware proxy, and the fabric has no entry for the appliance while it is quiet. This is the cause.", "cause": true}], "done": "That's the one. The appliance is a silent host. It only speaks when it's spoken to, and this bridge domain drops traffic for hosts it hasn't learned. Let's see how that works.", "a": [28.547, 32.558], "cues": [], "d": [33.228, 43.734]}, {"t": "say", "scene": "l3_proxy", "step": 0, "fx": "flood", "chapter": "Flood or proxy", "text": "When a frame arrives for a MAC address the leaf doesn't know, the bridge domain has two possible behaviours. The first one is flood. The frame goes to every leaf that has this bridge domain, just like a classic switch. It always arrives, at the cost of extra traffic.", "a": [44.634, 60.491], "cues": [51.032], "fxT": 52.8}, {"t": "say", "scene": "l3_proxy", "step": 2, "fx": "proxyOk", "text": "The second one is hardware proxy. The leaf sends the frame to the spine, and the spine looks it up in the fabric's endpoint database. If the endpoint is known, the frame is delivered to exactly one leaf. That's efficient and quiet.", "a": [61.161, 74.89], "cues": [], "fxT": 63.514}, {"t": "say", "scene": "l3_proxy", "step": 3, "fx": "proxyDrop", "text": "But if the spine doesn't know the endpoint either, the frame is dropped. And a silent host, one that hasn't sent anything for a while, ages out of that database.", "a": [75.56, 84.373], "cues": []}, {"t": "say", "scene": "l3_proxy", "step": 4, "text": "When ACI is the gateway, there's a safety net. With unicast routing on and a subnet on the bridge domain, the fabric learns the host's IP address, checks on it before the entry ages out, and can send its own ARP request when routed traffic is looking for it. In a Layer 2 only bridge domain, like ours tonight, that safety net doesn't exist.", "a": [85.043, 105.881], "cues": []}, {"t": "say", "scene": "l3_knobs", "step": 0, "chapter": "Four settings", "text": "Four bridge domain settings decide all of this. Number one is unicast routing. Turn it on when ACI is the default gateway. Leave it off when the gateway lives on a firewall, or on the old core.", "a": [106.781, 118.977], "cues": []}, {"t": "say", "scene": "l3_knobs", "step": 1, "text": "Number two is Layer 2 unknown unicast. Hardware proxy or flood. That's the choice you just saw.", "a": [119.647, 126.183], "cues": []}, {"t": "say", "scene": "l3_knobs", "step": 2, "text": "Number three is ARP flooding. When it's off, the fabric delivers each ARP request straight to the target it already knows. When it's on, ARP is flooded, like on a classic switch. Turn it on wherever firewalls, load balancers or clusters rely on gratuitous ARP to fail over. This setting only matters when unicast routing is on. With routing off, ARP is always flooded.", "a": [126.853, 151.502], "cues": []}, {"t": "say", "scene": "l3_knobs", "step": 3, "text": "And number four is limit IP learning to subnet. Keep it on, so the fabric ignores addresses that don't belong to the bridge domain.", "a": [152.172, 159.838], "cues": []}, {"t": "say", "scene": "l3_prof", "step": 0, "chapter": "Two profiles", "text": "In practice, you only need two profiles. The routed profile is for when ACI is the gateway: unicast routing on, a subnet, hardware proxy, and limit IP learning on.", "a": [160.738, 171.37], "cues": []}, {"t": "say", "scene": "l3_prof", "step": 1, "text": "The Layer 2 profile is for when the gateway is outside: unicast routing off, no subnet, and flood. ARP is flooded anyway when routing is off. Every bridge domain starts here during a migration.", "a": [172.04, 184.112], "cues": []}, {"t": "match", "id": "m1", "scene": "l3_prof", "step": 1, "text": "Your turn. Match each situation to the profile or the setting it needs.", "prompt": "Match each situation to the profile or setting it needs.", "pairs": [["ACI is the default gateway for the subnet", "Routed profile"], ["The gateway stays on the old core during migration", "Layer 2 profile"], ["A firewall pair fails over using gratuitous ARP", "ARP flooding on"], ["Addresses from other subnets appear in the endpoint table", "Limit IP learning to subnet"]], "done": "Good. Now go and fix tonight's problem.", "a": [184.782, 189.266], "cues": [], "d": [189.936, 192.863]}, {"t": "sim", "id": "s3", "scene": "l3_sim", "step": 0, "chapter": "Fix it", "text": "The backup appliance is still unreachable, and you have the bridge domain settings in front of you. Change what's needed, so that a silent host is always reachable in this Layer 2 bridge domain. Then send a frame to test it.", "prompt": "Make the silent backup appliance reachable. The default gateway stays on the old core tonight.", "done": "That's the fix. Flood for unknown unicast, and routing stays off because the gateway is still outside. ARP was already flooded, because a bridge domain with routing off always floods ARP. The appliance is now reachable, whether it speaks first or not.", "a": [193.763, 206.224], "cues": [], "d": [206.894, 222.703]}, {"t": "say", "scene": "l3_move", "step": 0, "chapter": "Moving the gateway", "text": "A few weeks later, you move the gateway into ACI. It's a planned step. Add the subnet to the bridge domain, enable unicast routing, and shut the old gateway, all in one change window.", "a": [223.603, 234.622], "cues": []}, {"t": "say", "scene": "l3_move", "step": 1, "text": "Here's a trick from the field. Set the bridge domain's MAC address to the old HSRP virtual MAC. The servers keep the ARP entry they already have, and they never notice that the gateway moved.", "a": [235.292, 247.62], "cues": []}, {"t": "ask", "id": "q2", "scene": "l3_move", "step": 1, "text": "Quick check. After the gateway has moved into ACI, which profile does this bridge domain need?", "prompt": "The gateway now lives in ACI. Which profile does the bridge domain need?", "options": ["The Layer 2 profile, unchanged", "The routed profile: unicast routing on, with the subnet", "No profile. The bridge domain can be deleted"], "answer": 1, "right": "Right. And hardware proxy is safe again, because the fabric now learns each host's IP address, and keeps checking that it's still there.", "wrong": "Not quite. Once ACI is the gateway, the bridge domain needs the routed profile: unicast routing on, with the subnet.", "a": [248.29, 254.383], "cues": [], "r": [255.053, 262.918], "w": [263.588, 271.196]}, {"t": "say", "scene": "l3_scope", "step": 0, "chapter": "Subnet scope", "text": "One more setting lives on the subnet itself, and it's called scope. Private to VRF is the default, and the subnet stays inside its VRF. Advertised externally lets the subnet be announced to the outside, through an L3Out. Shared between VRFs lets it be leaked into another VRF.", "a": [272.096, 289.888], "cues": [275.834, 280.818, 286.018]}, {"t": "say", "scene": "l3_scope", "step": 4, "text": "Remember this one. When a new server can't be reached from outside, the subnet is very often still marked private. We'll solve exactly that case in Lesson 5.", "a": [290.558, 299.914], "cues": []}, {"t": "say", "scene": "l3_hook", "step": 4, "chapter": "Case closed", "text": "So what happened on migration weekend? The bridge domain was left on hardware proxy, while the gateway was still outside. The quiet backup appliance aged out, and the spine dropped its traffic. Changing unknown unicast to flood fixed it, in one change.", "a": [300.814, 315.619], "cues": []}, {"t": "say", "scene": "l3_recap", "step": 0, "text": "Take three things with you. First: hardware proxy only works when the fabric knows every endpoint.", "a": [316.289, 322.176], "cues": []}, {"t": "say", "scene": "l3_recap", "step": 1, "text": "Second: two profiles. Routed when ACI is the gateway, and Layer 2 when it isn't.", "a": [322.846, 328.034], "cues": []}, {"t": "say", "scene": "l3_recap", "step": 2, "text": "And third: write every bridge domain setting into the design, and confirm the defaults for your software release.", "a": [328.704, 334.494], "cues": []}, {"t": "say", "scene": "l3_recap", "step": 3, "text": "Next come EPGs and contracts, and an audit finding that nobody expected. Try the quiz below first.", "a": [335.164, 341.605], "cues": []}], "teachback": {"prompt": "In two or three sentences, explain why the backup appliance became unreachable, and which settings fixed it.", "model": "The appliance is a silent host, so its entry aged out of the fabric's endpoint database. The Layer 2 bridge domain used hardware proxy, so the spine dropped frames for an endpoint it did not know. Setting unknown unicast to flood made it reachable.", "points": ["the appliance is a silent host whose endpoint entry aged out", "the bridge domain used hardware proxy, and it was Layer 2 only so the fabric could not rediscover the host", "the fix was to set Layer 2 unknown unicast to flood"]}, "onthejob": "To see whether the fabric currently knows an endpoint, on the leaf CLI: show endpoint mac <address>. In the APIC GUI, Operations > EP Tracker shows where and when an endpoint was last seen. Confirm the syntax for your software release.", "poster": ["l3_hook", 2]}}, {"id": "l4", "n": 4, "title": "EPGs and contracts", "summary": "An auditor finds that HR servers can reach the payments database. Trace it to one shared contr
