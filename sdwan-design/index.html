he router knows", "text": "Remember the heartbeat inside every tunnel. BFD sends a probe every second, and from those probes the router works out three numbers for each tunnel: loss, latency and jitter. So at any moment, the router knows that the MPLS tunnel is clean, and that the internet tunnel is losing four percent.", "a": [35.811, 53.526], "cues": [38.407, 46.528]}, {"t": "say", "scene": "w4_sla", "step": 0, "chapter": "SLA classes", "text": "Application-aware routing puts those numbers to work. First you define an SLA class: the limits that an application can live with. For voice, a common starting point is one percent loss, a hundred and fifty milliseconds of latency, and thirty milliseconds of jitter. Then a policy says: voice traffic needs the voice class, and it prefers the MPLS colour.", "a": [54.426, 75.228], "cues": [57.582, 62.264, 69.977]}, {"t": "say", "scene": "w4_sla", "step": 4, "text": "From then on, the router checks every tunnel against the class. A tunnel that breaks the limits is taken out of use for voice, and the calls move to a tunnel that still meets them. Other traffic doesn't have to move.", "a": [75.898, 87.54], "cues": []}, {"t": "ask", "id": "q2", "scene": "w4_sla", "step": 4, "text": "Quick check. The internet tunnel has four percent loss, and the voice class allows one percent. An email is sent at the same moment, and email has no SLA class. What happens to the email?", "prompt": "The internet tunnel breaks the voice SLA class. What happens to traffic with no SLA class, such as email?", "options": ["It is dropped", "It can keep using both tunnels", "It also moves to MPLS"], "answer": 1, "right": "Right. Only the traffic matched by the policy is steered. Everything else keeps using every available tunnel.", "wrong": "Not quite. Only the traffic matched by the policy is steered. Everything else keeps using every available tunnel.", "a": [88.21, 100.022], "cues": [], "r": [100.692, 107.326], "w": [107.996, 114.843]}, {"t": "say", "scene": "w4_time", "step": 0, "chapter": "How fast it reacts", "text": "One warning before you promise anything to the business. The router doesn't act on a single lost probe. By default, it averages the measurements over ten minutes, and it looks at six of those periods. So with the default timers, moving traffic away from a bad line can take a long time.", "a": [115.743, 132.109], "cues": []}, {"t": "say", "scene": "w4_time", "step": 1, "text": "You can shorten those timers, and many designs do. But shorter timers mean more sensitivity, and a line that's only briefly bad can make traffic jump back and forth. So decide the timers on purpose, and test them.", "a": [132.779, 145.256], "cues": []}, {"t": "sim", "id": "s4", "scene": "w4_sim", "step": 0, "chapter": "Fix it", "text": "Now fix Monday morning. Set the policy for voice, then replay the sales call.", "prompt": "Give voice a policy so that Monday's call stays clean, and still survives if the MPLS circuit fails.", "done": "Monday is fixed. Voice has an SLA class with a one percent loss limit, and it prefers MPLS. When the internet line gets worse, the calls aren't on it. And if MPLS ever fails, voice still has the internet tunnel to fall back on.", "a": [146.156, 150.779], "cues": [], "d": [151.449, 166.084]}, {"t": "say", "scene": "w4_types", "step": 0, "chapter": "Three kinds of policy", "text": "You've now met two kinds of policy, and there's a third. A centralized control policy runs on the Controller, and shapes routes and topology. A centralized data policy, which includes application-aware routing, is sent by the Controller to the routers, and the routers apply it to packets. And a localized policy lives on one router. It covers things like queues for quality of service, and access lists.", "a": [166.984, 190.784], "cues": [175.431, 184.078]}, {"t": "match", "id": "m1", "scene": "w4_types", "step": 2, "text": "Your turn. Match each need to the kind of policy that meets it.", "prompt": "Match each need to the kind of policy that meets it.", "pairs": [["Hide the stores' TLOCs to build hub and spoke", "Centralized control policy"], ["Move voice to a tunnel that meets its SLA class", "Application-aware routing policy"], ["Send guest web traffic straight out at the store", "Centralized data policy with NAT"], ["Queues and shaping on one store's WAN interface", "Localized policy"]], "done": "Good. One more design decision uses a data policy: where traffic leaves for the internet.", "a": [191.454, 195.485], "cues": [], "d": [196.155, 201.711]}, {"t": "say", "scene": "w4_dia", "step": 0, "chapter": "Internet breakout", "text": "Today, when a guest in a store opens a web page, the traffic is carried all the way to the data center, and out to the internet from there. That's a detour through the data center, and it loads the data center's lines twice. The alternative is direct internet access. The store router sends that traffic straight out of its own internet line, using NAT.", "a": [202.611, 222.534], "cues": [217.876]}, {"t": "say", "scene": "w4_dia", "step": 2, "text": "It's faster and cheaper. But the traffic no longer passes the data center firewall, so the security has to move with it: a firewall on the router itself, or a cloud security service. Decide which traffic may break out locally, and what inspects it.", "a": [223.204, 237.712], "cues": []}, {"t": "say", "scene": "w4_hook", "step": 4, "fx": "callClean", "chapter": "Case closed", "text": "And Monday's sales call? The router had been measuring the bad line all along. One policy told it what voice needs, and which line voice prefers. The next Monday, nobody complained.", "a": [238.612, 249.599], "cues": []}, {"t": "say", "scene": "w4_recap", "step": 0, "text": "Take three things with you. First: every tunnel is measured, all the time, for loss, latency and jitter.", "a": [250.269, 256.328], "cues": []}, {"t": "say", "scene": "w4_recap", "step": 1, "text": "Second: an SLA class and a preferred colour tell the router what an application needs. Without them, all tunnels are equal.", "a": [256.998, 264.427], "cues": []}, {"t": "say", "scene": "w4_recap", "step": 2, "text": "And third: know your timers. And when traffic breaks out locally, move the security with it.", "a": [265.097, 270.082], "cues": []}, {"t": "say", "scene": "w4_recap", "step": 3, "text": "In the next lesson, we plan the rollout to a hundred and twenty stores, and we build the design pack. Try the quiz below first.", "a": [270.752, 277.6], "cues": []}], "teachback": {"prompt": "In two or three sentences, explain why the calls were breaking up, and what the voice policy changed.", "model": "With no policy, the router shared the calls equally between the MPLS tunnel and the internet tunnel, and the internet tunnel was losing four percent of its packets on Monday mornings. The policy gives voice an SLA class with a one percent loss limit and a preference for the MPLS colour, so calls use MPLS, and move to the internet tunnel only if MPLS breaks the class or goes down.", "points": ["without a policy all tunnels are treated as equal, so half of the calls used the lossy internet tunnel", "BFD measures loss, latency and jitter per tunnel", "the fix is an SLA class for voice (about one percent loss) with MPLS as the preferred colour"]}, "onthejob": "On a WAN Edge router, show sdwan app-route stats shows loss, latency and jitter for each tunnel, and show sdwan policy from-vsmart shows the data and application-aware routing policies the router has received from the Controller. Confirm the syntax for your software release.", "poster": ["w4_hook", 1]}}, {"id": "l5", "n": 5, "title": "Rollout and the design pack", "summary": "Wave one has moved ten stores, and they cannot reach the hundred and ten still on the old network. Make the data center the bridge in a simulator, then plan profiles, templates, controllers and the seven-table design pack.", "keypoints": ["During a migration the data center is the transit point between the overlay and the old network. Routes must cross in both directions.", "Neither direction is automatic: routes learned from BGP are advertised into OMP only when configured, and OMP routes are redistributed to the core only when configured. With two data centers, plan loop prevention (mark and filter the routes).", "Group sites into a few profiles. One template (or configuration group) per profile; host name, system IP, site ID and addresses are per-site variables.", "Zero-touch provisioning lets a new router fetch its own configuration, provided the trust checks from Lesson 1 pass.", "Plan at least two Controllers and two Validators in different places, a backup or cluster for the Manager, and reachability to the Validator over every transport.", "A complete design is seven tables: site and addressing, transport and colour, VPN, template and variables, policy matrix, controller sheet, migration wave plan."], "quiz": [{"q": "During a migration, migrated stores cannot reach stores that are still on the old network. Where is the fix?", "o": ["On the Validator", "At the data center, where routes must cross between the overlay and the old network in both directions", "On every old store router", "In the BFD timers"], "a": 1, "why": "The data center is the transit point. Old routes are advertised into the overlay, and overlay routes to the old core, with a filter against loops."}, {"q": "How should a hundred and twenty stores be configured?", "o": ["A few site profiles, one template each, with per-site variables", "One template with no variables", "One hand-written configuration for each store", "By copying the pilot store’s configuration by hand"], "a": 0, "why": "Profiles and templates (or configuration groups) keep the design consistent. Variables such as host name, system IP and site ID carry the differences."}, {"q": "What is the minimum sensible controller design for a production overlay?", "o": ["At least two Controllers and two Validators in different places, with a backup plan for the Manager", "Controllers are optional once the tunnels are up", "One Controller for every store", "One Controller and one Validator"], "a": 0, "why": "Redundant Controllers and Validators keep the control plane and onboarding available. The Manager needs a backup or a cluster."}, {"q": "Which table of the design pack records which lines each site profile has, their colours and whether restrict is used?", "o": ["The VPN table", "The transport and colour table", "The controller sheet", "The migration wave plan"], "a": 1, "why": "The transport and colour table holds lines per profile, colours, restrict and NAT."}], "duration": 218.1, "cues": [{"s": 0.35, "e": 12.635, "text": "The pilot is over, and the real rollout has begun. On Saturday night, wave one moved ten stores onto the SD-WAN. A hundred and ten stores are still on the old MPLS network, waiting for their turn."}, {"s": 13.305, "e": 22.977, "text": "On Monday, the ten new stores work well with the data center. But the stock transfer system is failing. A migrated store can't reach a store that hasn't been migrated yet."}, {"s": 23.647, "e": 24.85, "text": "What's your first thought?"}, {"s": 41.53, "e": 66.049, "text": "During a migration, the data center is the bridge. Its WAN Edge routers sit in the overlay. Its core router still talks to the old MPLS network. So routes must cross in both directions. The old network's routes are advertised into the overlay, so that migrated stores can find the old stores. And the overlay's routes are advertised to the core, so that the old stores can find their way back."}, {"s": 66.719, "e": 85.756, "text": "Neither direction is automatic. Routes learned from BGP at the data center aren't sent into the overlay until you say so, and overlay routes aren't handed to the core until you say so. And with two data centers doing this, a route can loop back into the side it came from. So plan the filtering before the first wave."}, {"s": 86.656, "e": 92.38, "text": "Now repair wave one. Switch on what's needed at the data center, then test from a migrated store."}, {"s": 105.014, "e": 120.168, "text": "A hundred and twenty stores can't be a hundred and twenty designs. Group the sites into a few profiles. Here there are four: the data centers, large stores with two routers, standard stores with one router and two lines, and kiosks with an internet line and LTE."}, {"s": 120.838, "e": 135.592, "text": "Each profile gets one template, or one configuration group in newer releases. What differs from store to store goes into variables: the host name, the system IP, the site ID, the addresses. A spreadsheet with one row for each store fills them in."}, {"s": 136.262, "e": 148.159, "text": "And nobody types a configuration on site. With zero-touch provisioning, the new router calls home, is recognised, and receives its template. You saw in Lesson 1 what has to be true for that to work."}, {"s": 148.829, "e": 151.934, "text": "Your turn. Match each description to its name."}, {"s": 158.225, "e": 176.143, "text": "The controllers are part of the design too. Plan at least two Controllers and two Validators, in different places. Plan how the Manager is backed up, or clustered, as the network grows. And make sure that every router can reach the Validator over every transport it has, including a private MPLS circuit."}, {"s": 176.813, "e": 189.179, "text": "Quick check. A kiosk has an internet line and LTE. The data center has MPLS and internet, and the MPLS colour is restricted. Which tunnels can the kiosk build to the data center?"}, {"s": 212.328, "e": 226.352, "text": "That's the whole design. Now let's turn it into something you can use on Monday. A complete SD-WAN design is seven tables. The site and addressing table. The transport and colour table. The VPN table."}, {"s": 227.022, "e": 233.827, "text": "The template and variables sheet. The policy matrix. The controller sheet. And the migration wave plan."}, {"s": 234.497, "e": 243.971, "text": "If those seven tables are complete and reviewed, the rollout is a routine you can repeat. If they aren't, the gaps are found on a Monday morning, by a store that can't trade."}, {"s": 244.871, "e": 259.434, "text": "Wave one was repaired within the hour. The data center routers now join the two networks, in both directions, with a filter against loops. Wave two went out the next Saturday, and nobody noticed. That's exactly how a migration should feel."}, {"s": 260.104, "e": 268.263, "text": "Take three things with you. First: during a migration, the data center joins the old network and the new one, and routes must cross both ways."}, {"s": 268.933, "e": 274.499, "text": "Second: design a few site profiles, with one template each, and let variables carry the differences."}, {"s": 275.169, "e": 278.624, "text": "And third: a design is finished when the seven tables are finished."}, {"s": 279.294, "e": 287.734, "text": "Next comes a lab demonstration. We'll read a running SD-WAN through its API, the way you'd inspect a network that you've just inherited."}], "x": {"items": [{"t": "say", "scene": "w5_hook", "step": 0, "chapter": "Wave one", "text": "The pilot is over, and the real rollout has begun. On Saturday night, wave one moved ten stores onto the SD-WAN. A hundred and ten stores are still on the old MPLS network, waiting for their turn.", "a": [0.35, 12.635], "cues": []}, {"t": "say", "scene": "w5_hook", "step": 1, "fx": "w5Drop", "text": "On Monday, the ten new stores work well with the data center. But the stock transfer system is failing. A migrated store can't reach a store that hasn't been migrated yet.", "a": [13.305, 22.977], "cues": []}, {"t": "ask", "id": "q1", "scene": "w5_hook", "step": 2, "text": "What's your first thought?", "prompt": "Migrated stores reach the data center, but not the stores that are still on the old network. What is the most likely reason?", "options": ["The routers in the old stores are faulty", "The two networks are not exchanging routes with each other", "The tunnels between the migrated stores are down"], "answer": 1, "right": "Yes. For a while, the chain has two networks, and something has to join them. That something is the data center.", "wrong": "Think about what changed. For a while, the chain has two networks, and something has to join them. That something is the data center.", "a": [23.647, 24.85], "cues": [], "r": [25.52, 32.423], "w": [33.093, 40.63]}, {"t": "say", "scene": "w5_transit", "step": 0, "chapter": "Two networks, one company", "text": "During a migration, the data center is the bridge. Its WAN Edge routers sit in the overlay. Its core router still talks to the old MPLS network. So routes must cross in both directions. The old network's routes are advertised into the overlay, so that migrated stores can find the old stores. And the overlay's routes are advertised to the core, so that the old stores can find their way back.", "a": [41.53, 66.049], "cues": [54.326, 60.805]}, {"t": "say", "scene": "w5_transit", "step": 3, "text": "Neither direction is automatic. Routes learned from BGP at the data center aren't sent into the overlay until you say so, and overlay routes aren't handed to the core until you say so. And with two data centers doing this, a route can loop back into the side it came from. So plan the filtering before the first wave.", "a": [66.719, 85.756], "cues": []}, {"t": "sim", "id": "s5", "scene": "w5_sim", "step": 0, "chapter": "Fix it", "text": "Now repair wave one. Switch on what's needed at the data center, then test from a migrated store.", "prompt": "Let migrated stores and old stores reach each other through the data center, safely.", "done": "Wave one is repaired. Routes cross at the data center in both directions, and a filter stops them from looping back. Every later wave now works the same way, until the last old store is gone.", "a": [86.656, 92.38], "cues": [], "d": [93.05, 104.114]}, {"t": "say", "scene": "w5_profiles", "step": 0, "chapter": "Profiles and templates", "text": "A hundred and twenty stores can't be a hundred and twenty designs. Group the sites into a few profiles. Here there are four: the data centers, large stores with two routers, standard stores with one router and two lines, and kiosks with an internet line and LTE.", "a": [105.014, 120.168], "cues": [111.102]}, {"t": "say", "scene": "w5_profiles", "step": 2, "text": "Each profile gets one template, or one configuration group in newer releases. What differs from store to store goes into variables: the host name, the system IP, the site ID, the addresses. A spreadsheet with one row for each store fills them in.", "a": [120.838, 135.592], "cues": []}, {"t": "say", "scene": "w5_profiles", "step": 3, "text": "And nobody types a configuration on site. With zero-touch provisioning, the new router calls home, is recognised, and receives its template. You saw in Lesson 1 what has to be true for that to work.", "a": [136.262, 148.159], "cues": []}, {"t": "match", "id": "m1", "scene": "w5_profiles", "step": 3, "text": "Your turn. Match each description to its name.", "prompt": "Match each description to its name.", "pairs": [["The same hardware, lines and VPNs at many sites", "Site profile"], ["Host name, system IP and site ID of one store", "Template variables"], ["A new router fetches its own configuration", "Zero-touch provisioning"], ["Old and new networks exchange routes here", "Data center as transit"]], "done": "Good. One more thing has to be ready before wave two: the controllers themselves.", "a": [148.829, 151.934], "cues": [], "d": [152.604, 157.325]}, {"t": "say", "scene": "w5_ctrl", "step": 0, "chapter": "Controllers", "text": "The controllers are part of the design too. Plan at least two Controllers and two Validators, in different places. Plan how the Manager is backed up, or clustered, as the network grows. And make sure that every router can reach the Validator over every transport it has, including a private MPLS circuit.", "a": [158.225, 176.143], "cues": [164.977, 169.18]}, {"t": "ask", "id": "q2", "scene": "w5_ctrl", "step": 2, "text": "Quick check. A kiosk has an internet line and LTE. The data center has MPLS and internet, and the MPLS colour is restricted. Which tunnels can the kiosk build to the data center?", "prompt": "A kiosk has internet and LTE. The data center has MPLS (restricted) and internet. Which tunnels can they build?", "options": ["None, because the colours differ", "Internet to internet, and LTE to internet", "LTE to MPLS"], "answer": 1, "right": "Right. Public colours can reach each other over the internet. The restricted MPLS colour only pairs with MPLS, and the kiosk has none.", "wrong": "Not quite. Public colours can reach each other over the internet, so both kiosk lines reach the data center's internet TLOC. The restricted MPLS colour only pairs with MPLS.", "a": [176.813, 189.179], "cues": [], "r": [189.849, 198.986], "w": [199.656, 211.428]}, {"t": "say", "scene": "w5_pack", "step": 0, "chapter": "The design pack", "text": "That's the whole design. Now let's turn it into something you can use on Monday. A complete SD-WAN design is seven tables. The site and addressing table. The transport and colour table. The VPN table.", "a": [212.328, 226.352], "cues": []}, {"t": "say", "scene": "w5_pack", "step": 1, "text": "The template and variables sheet. The policy matrix. The controller sheet. And the migration wave plan.", "a": [227.022, 233.827], "cues": []}, {"t": "say", "scene": "w5_pack", "step": 2, "text": "If those seven tables are complete and reviewed, the rollout is a routine you can repeat. If they aren't, the gaps are found on a Monday morning, by a store that can't trade.", "a": [234.497, 243.971], "cues": []}, {"t": "say", "scene": "w5_hook", "step": 4, "fx": "w5Pass", "chapter": "Case closed", "text": "Wave one was repaired within the hour. The data center routers now join the two networks, in both directions, with a filter against loops. Wave two went out the next Saturday, and nobody noticed. That's exactly how a migration should feel.", "a": [244.871, 259.434], "cues": []}, {"t": "say", "scene": "w5_recap", "step": 0, "text": "Take three things with you. First: during a migration, the data center joins the old network and the new one, and routes must cross both ways.", "a": [260.104, 268.263], "cues": []}, {"t": "say", "scene": "w5_recap", "step": 1, "text": "Second: design a few site profiles, with one template each, and let variables carry the differences.", "a": [268.933, 274.499], "cues": []}, {"t": "say", "scene": "w5_recap", "step": 2, "text": "And third: a design is finished when the seven tables are finished.", "a": [275.169, 278.624], "cues": []}, {"t": "say", "scene": "w5_recap", "step": 3, "text": "Next comes a lab demonstration. We'll read a running SD-WAN through its API, the way you'd inspect a network that you've just inherited.", "a": [279.294, 287.734], "cues": []}], "teachback": {"prompt": "In two or three sentences, explain why migrated stores could not reach the old stores, and what had to be configured at the data center.", "model": "The overlay and the old MPLS network were not exchanging routes. At the data center, the old network's routes had to be advertised into the overlay and the overlay's routes had to be redistributed to the core, so traffic has a path in both directions. With two data centers, a filter is also needed so that routes do not loop back.", "points": ["the two networks were not exchanging routes", "routes must cross at the data center in both directions (old routes into the overlay, overlay routes to the core)", "loop prevention is needed when two data centers redistribute"]}, "onthejob": "On a data center WAN Edge router, show sdwan omp routes shows which prefixes it has learned from the overlay and which it advertises. Before you migrate the first store, check that the old network's prefixes appear there. Confirm the syntax for your software release.", "poster": ["w5_hook", 1]}}, {"id": "l6", "n": 6, "title": "Lab demonstration: reading a live fabric", "summary": "A narrated lab demonstration. Sign in to the SD-WAN Manager API, make four read-only calls, and read the roles, colours, topology and VPNs of a running fabric from the output. Sample output is shown on screen.", "keypoints": ["Everything the Manager shows comes from its REST API. Session sign-in: POST /j_security_check returns a JSESSIONID cookie; GET /dataservice/client/token returns the token needed for requests that change data.", "GET /dataservice/device returns the inventory. The device-type values still use the older names: vmanage, vsmart, vbond, vedge.", "GET /dataservice/device/control/connections?deviceId=<system-ip> shows a router's control connections. There is normally no Validator row once the router has joined.", "GET /dataservice/device/bfd/sessions?deviceId=<system-ip> lists the tunnels with local colour, remote colour and state. Tunnels only to hub sites mean hub and spoke; no cross-colour rows suggest restricted colours.", "GET /dataservice/device/omp/routes/received?deviceId=<system-ip> lists received routes per VPN: the VPN numbers are the service VPNs.", "Read before you change anything. The output shown in this demonstration is sample output."], "quiz": [{"q": "Which API call returns the inventory of controllers and WAN Edge routers?", "o": ["GET /dataservice/device", "GET /dataservice/device/bfd/sessions", "POST /j_security_check", "GET /dataservice/client/token"], "a": 0, "why": "GET /dataservice/device lists every device with its type, system IP, site ID and reachability."}, {"q": "A store router’s BFD sessions show tunnels only to the two data center sites. What does that suggest?", "o": ["The Controller is down", "A hub-and-spoke topology", "The store has no service VPNs", "The store has lost half of its tunnels"], "a": 1, "why": "No tunnels to other stores means the stores are not told about each other: hub and spoke, built with a control policy."}, {"q": "With session-based sign-in, when is the token from /dataservice/client/token needed?", "o": ["For requests that change something, such as POST, PUT and DELETE", "Never; the cookie is always enough", "For every request, including GET", "Only for signing out"], "a": 0, "why": "GET requests need only the session cookie. Requests that change data must also carry the X-XSRF-TOKEN header."}, {"q": "In the inventory output, the API shows the device type \"vbond\". Which role is that?", "o": ["The Controller", "A WAN Edge router", "The Validator", "The Manager"], "a": 2, "why": "The API still uses the older names: vmanage is the Manager, vsmart the Controller, vbond the Validator, and vedge a WAN Edge router."}], "duration": 172.7, "cues": [{"s": 0.35, "e": 12.027, "text": "Here's a situation every engineer meets sooner or later. You inherit an SD-WAN that somebody else designed, and the documents are out of date. How do you find out what the design really is?"}, {"s": 12.697, "e": 30.317, "text": "You ask the network itself. Everything on the Manager's dashboard comes from its REST API, and you can call that API directly. In this demonstration, we'll sign in, make four calls, and read the answers. The output on screen is sample output, from a small fabric like the one in this course."}, {"s": 31.217, "e": 45.088, "text": "The first call signs in. You post a user name and a password to the Manager, and it returns a session cookie. A second call fetches a token, which you need for any request that changes something. We'll only read today, so the cookie is enough."}, {"s": 45.988, "e": 62.434, "text": "Now the first real question: which devices exist? One call returns the whole inventory. Look at the device type column. You can see a Manager, two Controllers, two Validators, and the WAN Edge routers. Notice that the API still uses the older names."}, {"s": 63.104, "e": 67.59, "text": "Your turn. Look at the last column. Which device needs attention?"}, {"s": 81.02, "e": 99.173, "text": "Next, pick one store router and ask about its control connections. Store 12 has connections to both Controllers, over both of its transports, and one connection to the Manager. That's a healthy router. Notice that there's no row for the Validator, because that connection is only needed while a router is joining."}, {"s": 100.073, "e": 116.899, "text": "The third question is about the data plane. Which tunnels does Store 12 have? Each row is one tunnel, with the local colour, the remote colour and the state. Now read it like a designer. Every tunnel ends at site 100 or at site 200, and those are the two data centers."}, {"s": 117.569, "e": 120.087, "text": "So what does this table tell you about the design?"}, {"s": 146.262, "e": 163.987, "text": "The fourth call asks which routes Store 12 has received. Look at the VPN column: ten, twenty and thirty. So there are three service VPNs. And every route comes from a data center router. In VPN 30, the only route is a default route, and that's how guest traffic reaches the internet."}, {"s": 164.887, "e": 172.229, "text": "Now you drive. Here's a question about a different router. Choose the API call that answers it, and send the request."}, {"s": 184.385, "e": 188.621, "text": "One more exercise. Match each question to the call that answers it."}, {"s": 192.268, "e": 203.984, "text": "Look at what four calls gave you: the inventory and the roles, the transports and their colours, the topology, and the service VPNs. That's four of the seven tables in the design pack, read straight from the network."}, {"s": 204.654, "e": 211.49, "text": "Take three things with you. First: the API shows the design as it really is, and not as it was documented."}, {"s": 212.16, "e": 217.708, "text": "Second: tunnels and routes tell you the topology and the segments. Read them like a designer."}, {"s": 218.378, "e": 224.178, "text": "And third: start every takeover, every audit and every migration by reading, before you change anything."}, {"s": 224.848, "e": 236.796, "text": "Now it's your turn. In the hands-on lab, you'll run these calls yourself, against a Cisco DevNet sandbox or your own lab, and fill in the design tables. Thank you for learning with CES Tech Academy."}], "x": {"items": [{"t": "say", "scene": "w6_intro", "step": 0, "chapter": "A network you inherit", "text": "Here's a situation every engineer meets sooner or later. You inherit an SD-WAN that somebody else designed, and the documents are out of date. How do you find out what the design really is?", "a": [0.35, 12.027], "cues": []}, {"t": "say", "scene": "w6_intro", "step": 1, "text": "You ask the network itself. Everything on the Manager's dashboard comes from its REST API, and you can call that API directly. In this demonstration, we'll sign in, make four calls, and read the answers. The output on screen is sample output, from a small fabric like the one in this course.", "a": [12.697, 30.317], "cues": [25.475]}, {"t": "say", "scene": "w6_login", "step": 0, "chapter": "Signing in", "text": "The first call signs in. You post a user name and a password to the Manager, and it returns a session cookie. A second call fetches a token, which you need for any request that changes something. We'll only read today, so the cookie is enough.", "a": [31.217, 45.088], "cues": [37.873, 42.723]}, {"t": "say", "scene": "w6_dev", "step": 0, "chapter": "Who is here", "text": "Now the first real question: which devices exist? One call returns the whole inventory. Look at the device type column. You can see a Manager, two Controllers, two Validators, and the WAN Edge routers. Notice that the API still uses the older names.", "a": [45.988, 62.434], "cues": [49.289, 51.82]}, {"t": "ask", "id": "q1", "scene": "w6_dev", "step": 2, "text": "Your turn. Look at the last column. Which device needs attention?", "prompt": "In the inventory on screen, which device needs attention?", "options": ["controller-2", "store47-edge", "validator-1"], "answer": 1, "right": "Yes. Store 47 is unreachable. One call, and you already know where to look.", "wrong": "Look at the reachability column. Store 47 is the only device that's marked unreachable.", "a": [63.104, 67.59], "cues": [], "r": [68.26, 73.758], "w": [74.428, 80.12]}, {"t": "say", "scene": "w6_ctl", "step": 0, "chapter": "Control connections", "text": "Next, pick one store router and ask about its control connections. Store 12 has connections to both Controllers, over both of its transports, and one connection to the Manager. That's a healthy router. Notice that there's no row for the Validator, because that connection is only needed while a router is joining.", "a": [81.02, 99.173], "cues": [84.969, 93.2]}, {"t": "say", "scene": "w6_bfd", "step": 0, "chapter": "Tunnels", "text": "The third question is about the data plane. Which tunnels does Store 12 have? Each row is one tunnel, with the local colour, the remote colour and the state. Now read it like a designer. Every tunnel ends at site 100 or at site 200, and those are the two data centers.", "a": [100.073, 116.899], "cues": [105.027, 111.272]}, {"t": "ask", "id": "q2", "scene": "w6_bfd", "step": 2, "text": "So what does this table tell you about the design?", "prompt": "Store 12 has tunnels only to the two data centers, and every tunnel joins two TLOCs of the same colour. What does that tell you?", "options": ["Full mesh, with no restriction on colours", "Hub and spoke, with restricted colours", "The store has lost its tunnels to the other stores"], "answer": 1, "right": "Exactly. No tunnels to other stores means a control policy is hiding them. And no rows from MPLS to internet means the colours are restricted. You've just read two design decisions from one table.", "wrong": "Look again. No tunnels to other stores means a control policy is hiding them, so this is hub and spoke. And no rows from MPLS to internet means the colours are restricted.", "a": [117.569, 120.087], "cues": [], "r": [120.757, 133.768], "w": [134.438, 145.362]}, {"t": "say", "scene": "w6_omp", "step": 0, "chapter": "Routes", "text": "The fourth call asks which routes Store 12 has received. Look at the VPN column: ten, twenty and thirty. So there are three service VPNs. And every route comes from a data center router. In VPN 30, the only route is a default route, and that's how guest traffic reaches the internet.", "a": [146.262, 163.987], "cues": [149.756, 155.47]}, {"t": "sim", "id": "s6", "scene": "w6_sim", "step": 0, "chapter": "You drive", "text": "Now you drive. Here's a question about a different router. Choose the API call that answers it, and send the request.", "prompt": "Which API call tells you which transports store30-edge uses, and which sites it has tunnels to?", "done": "That's the one. The BFD sessions list every tunnel with its colours and its remote site. Store 30 looks just like Store 12, and that's what a network built from templates should look like.", "a": [164.887, 172.229], "cues": [], "d": [172.899, 183.715]}, {"t": "match", "id": "m1", "scene": "w6_sim", "step": 0, "text": "One more exercise. Match each question to the call that answers it.", "prompt": "Match each question to the API call that answers it.", "pairs": [["Which devices exist, and which are unreachable?", "/dataservice/device"], ["Is this router connected to the Controllers and the Manager?", "/dataservice/device/control/connections"], ["Which tunnels are up, and on which colours?", "/dataservice/device/bfd/sessions"], ["Which routes did this router receive, in which VPNs?", "/dataservice/device/omp/routes/received"]], "done": "Good. That's your toolkit.", "a": [184.385, 188.621], "cues": [], "d": [189.291, 191.368]}, {"t": "say", "scene": "w6_design", "step": 0, "chapter": "What you found", "text": "Look at what four calls gave you: the inventory and the roles, the transports and their colours, the topology, and the service VPNs. That's four of the seven tables in the design pack, read straight from the network.", "a": [192.268, 203.984], "cues": [199.79]}, {"t": "say", "scene": "w6_recap", "step": 0, "text": "Take three things with you. First: the API shows the design as it really is, and not as it was documented.", "a": [204.654, 211.49], "cues": []}, {"t": "say", "scene": "w6_recap", "step": 1, "text": "Second: tunnels and routes tell you the topology and the segments. Read them like a designer.", "a": [212.16, 217.708], "cues": []}, {"t": "say", "scene": "w6_recap", "step": 2, "text": "And third: start every takeover, every audit and every migration by reading, before you change anything.", "a": [218.378, 224.178], "cues": []}, {"t": "say", "scene": "w6_recap", "step": 3, "text": "Now it's your turn. In the hands-on lab, you'll run these calls yourself, against a Cisco DevNet sandbox or your own lab, and fill in the design tables. Thank you for learning with CES Tech Academy.", "a": [224.848, 236.796], "cues": []}], "teachback": {"prompt": "In two or three sentences, explain how you can tell from API output whether an SD-WAN is hub and spoke, and how many service VPNs it has.", "model": "The BFD sessions of a branch router list its tunnels: if they end only at the hub sites and never at other branches, the topology is hub and spoke. The received OMP routes show a VPN number for every route, and the distinct numbers are the service VPNs.", "points": ["BFD sessions (tunnels) of a branch router end only at hub sites in hub and spoke", "received OMP routes carry a VPN number, and the distinct numbers are the service VPNs", "the answer is read from the API or CLI output, not from documents"]}, "onthejob": "The same data is on the router's command line: show sdwan control connections, show sdwan bfd sessions and show sdwan omp routes. The API is the better tool when you need the answer for a hundred routers at once. Confirm the syntax for your software release.", "poster": ["w6_dev", 1]}}], "lab": {"id": "lab", "title": "Lab: read the design of a live SD-WAN", "heading": "Read the design of a live SD-WAN", "duration": "45 to 60 minutes", "summary": "Sign in to a real SD-WAN Manager through its REST API, ask it the four questions from the lab demonstration, and fill in four of the seven design tables from what it tells you.", "notice": ["Not yet lab-tested.", "The API calls follow Cisco’s published SD-WAN Manager API and the script was tested against a simulated Manager, but nobody has run this lab against a live one yet. Run it once before giving it to learners. Sandbox availability changes: Cisco is rebuilding the DevNet Sandbox service during 2026, and the always-on SD-WAN sandbox has had long maintenance periods."], "downloads": [{"href": "sdwan_lab.py", "label": "sdwan_lab.py", "note": "(Python 3, no extra packages). Runs steps 2 to 6 for you and prints the answers as tables.", "content": "#!/usr/bin/env python3\n\"\"\"CES Tech Academy · Cisco SD-WAN Design in Practice · lab helper\n\nReads the design of a running SD-WAN from its Manager (vManage) REST API. Read-only: it signs in, makes four\nGET calls, prints what it finds as tables, suggests what the design is, and signs out.\n\n    python3 sdwan_lab.py --manager <address[:port]> --user <username> --insecure\n    python3 sdwan_lab.py --manager <address> --user <username> --insecure --edge <system-ip> --save out/\n\n  --insecure   accept a self-signed certificate. Sandboxes and labs need it. Never use it against production.\n  --edge       system IP of the WAN Edge router to inspect (default: the first reachable one)\n  --save DIR   also save the raw JSON replies in DIR\n\nThe password is asked for when the script starts and is never stored. (For automation only, the script reads\nthe environment variable SDWAN_PASS if it is set.) Needs Python 3.8 or later and no extra packages.\n\"\"\"\nimport argparse, getpass, http.cookiejar, json, os, ssl, sys, urllib.error, urllib.parse, urllib.request\n\n\ndef table(rows, cols):\n    \"\"\"Print a list of dicts as an aligned table. cols = [(key, heading), ...].\"\"\"\n    if not rows:\n        print('  (no rows)'); return\n    data = [[str(r.get(k, '-')) for k, _ in cols] for r in rows]\n    width = [max(len(h), *(len(d[i]) for d in data)) for i, (_, h) in enumerate(cols)]\n    print('  ' + '   '.join(h.ljust(width[i]) for i, (_, h) in enumerate(cols)))\n    for d in data:\n        print('  ' + '   '.join(v.ljust(width[i]) for i, v in enumerate(d)))\n\n\nclass Manager:\n    def __init__(self, host, insecure):\n        self.base = 'https://' + host\n        ctx = ssl.create_default_context()\n        if insecure:\n            ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE\n        self.opener = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx),\n                                                  urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))\n\n    def call(self, path, data=None, headers=None, method=None):\n        req = urllib.request.Request(self.base + path, data=data, headers=headers or {}, method=method)\n        with self.opener.open(req, timeout=30) as r:\n            return r.read()\n\n    def login(self, user, password):\n        body = urllib.parse.urlencode({'j_username': user, 'j_password': password}).encode()\n        reply = self.call('/j_security_check', data=body, headers={'Content-Type': 'application/x-www-form-urlencoded'})\n        if b'<html' in reply.lower():          # a login page comes back when the credentials are wrong\n            raise SystemExit('Sign-in failed: check the address, the user name and the password.')\n\n    def get(self, path):\n        reply = self.call(path)\n        try:\n            return json.loads(reply).get('data', [])\n        except ValueError:\n            raise SystemExit('The Manager did not return JSON for ' + path + '. Is the session still valid?')\n\n    def logout(self):\n        try:\n            token = self.call('/dataservice/client/token').decode().strip()\n            self.call('/logout', data=b'', headers={'X-XSRF-TOKEN': token}, method='POST')\n        except Exception:\n            pass                               # signing out is best effort\n\n\ndef main():\n    ap = argparse.ArgumentParser(description='Read the design of a running Cisco SD-WAN (read-only).')\n    ap.add_argument('--manager', required=True, help='Manager address, with :port if needed')\n    ap.add_argument('--user', required=True)\n    ap.add_argument('--edge', help='system IP of the WAN Edge router to inspect')\n    ap.add_argument('--insecure', action='store_true', help='accept a self-signed certificate (labs and sandboxes only)')\n    ap.add_argument('--save', metavar='DIR', help='save the raw JSON replies in this folder')\n    a = ap.parse_args()\n    password = os.environ.get('SDWAN_PASS') or getpass.getpass('Password for ' + a.user + ': ')\n\n    def save(name, data):\n        if a.save:\n            os.makedirs(a.save, exist_ok=True)\n            with open(os.path.join(a.save, name + '.json'), 'w') as f:\n                json.dump(data, f, indent=1)\n\n    m = Manager(a.manager, a.insecure)\n    try:\n        m.login(a.user, password)\n    except urllib.error.URLError as e:\n        raise SystemExit('Cannot reach the Manager: %s\\n(For a sandbox with a self-signed certificate, add --insecure. For a reservable sandbox, connect the VPN first.)' % e.reason)\n    try:\n        # 1. inventory\n        devices = m.get('/dataservice/device'); save('device', devices)\n        print('\\n1. Who is here?   GET /dataservice/device')\n        table(devices, [('host-name', 'host-name'), ('device-type', 'device-type'), ('system-ip', 'system-ip'), ('site-id', 'site-id'), ('reachability', 'reachability')])\n        count = {}\n        for d in devices: count[d.get('device-type', '?')] = count.get(d.get('device-type', '?'), 0) + 1\n        names = {'vmanage': 'Manager', 'vsmart': 'Controller', 'vbond': 'Validator', 'vedge': 'WAN Edge router'}\n        print('  Roles: ' + ', '.join('%d x %s (%s)' % (n, names.get(t, t), t) for t, n in sorted(count.items())))\n        edges = [d for d in devices if d.get('device-type') == 'vedge']\n        edge = a.edge or next((d.get('system-ip') for d in edges if d.get('reachability') == 'reachable'), None)\n        if not edge:\n            raise SystemExit('No reachable WAN Edge router found. Use --edge <system-ip>.')\n        q = '?deviceId=' + urllib.parse.quote(edge)\n        me = next((d for d in devices if d.get('system-ip') == edge), {})\n        print('\\n  Inspecting %s (%s), site %s' % (me.get('host-name', '?'), edge, me.get('site-id', '?')))\n\n        # 2. control connections\n        ctl = m.get('/dataservice/device/control/connections' + q); save('control_connections', ctl)\n        print('\\n2. Is it connected to its controllers?   GET /dataservice/device/control/connections')\n        table(ctl, [('peer-type', 'peer-type'), ('system-ip', 'system-ip'), ('local-color', 'local-color'), ('protocol', 'protocol'), ('state', 'state')])\n\n        # 3. tunnels\n        bfd = m.get('/dataservice/device/bfd/sessions' + q); save('bfd_sessions', bfd)\n        print('\\n3. Which tunnels does it have?   GET /dataservice/device/bfd/sessions')\n        table(bfd, [('system-ip', 'remote system-ip'), ('site-id', 'site-id'), ('local-color', 'local-color'), ('color', 'remote-color'), ('state', 'state')])\n\n        # 4. routes\n        omp = m.get('/dataservice/device/omp/routes/received' + q); save('omp_routes_received', omp)\n        seen, routes = set(), []\n        for r in omp:\n            k = (str(r.get('vpn-id', '-')), r.get('prefix', '-'))\n            if k not in seen:\n                seen.add(k); routes.append({'vpn-id': k[0], 'prefix': k[1], 'originator': r.get('originator', '-')})\n        print('\\n4. Which routes has it received?   GET /dataservice/device/omp/routes/received   (each prefix once per VPN)')\n        table(routes[:40], [('vpn-id', 'vpn-id'), ('prefix', 'prefix'), ('originator', 'originator')])\n        if len(routes) > 40: print('  … and %d more' % (len(routes) - 40))\n\n        # what the output suggests\n        print('\\nWhat this suggests (check it against the tables above):')\n        colours = sorted({s.get('local-color', '?') for s in bfd} | {c.get('local-color', '?') for c in ctl})\n        print('  Colours on this router: ' + (', '.join(colours) or 'none seen'))\n        cross = [s for s in bfd if s.get('local-color') != s.get('color')]\n        down = sum(1 for s in cross if s.get('state') != 'up')\n        if down: print('  (Cross-colour tunnels that stay down usually mean the transports do not meet and restrict is missing.)')\n        print('  Tunnels between different colours: ' + ('%d (%d of them down)' % (len(cross), down) if cross else 'none, so the colours are restricted'))\n        other_sites = {str(d.get('site-id')) for d in edges} - {str(me.get('site-id'))}\n        tunnel_sites = {str(s.get('site-id')) for s in bfd if s.get('state') == 'up'}\n        if other_sites:\n            if other_sites <= tunnel_sites:\n                print('  Topology: tunnels to every other WAN Edge site (%d of %d). This looks like a full mesh.' % (len(other_sites), len(other_sites)))\n            else:\n                print('  Topology: tunnels to %d of the %d other WAN Edge sites (sites %s). This looks like hub and spoke, or a partial mesh.' % (\n                    len(tunnel_sites & other_sites), len(other_sites), ', '.join(sorted(tunnel_sites)) or 'none'))\n        vpns = sorted({r['vpn-id'] for r in routes}, key=lambda v: (len(v), v))\n        print('  Service VPNs in the received routes: ' + (', '.join(vpns) or 'none seen'))\n        if a.save: print('\\nRaw replies saved in ' + a.save)\n    finally:\n        m.logout()\n    print('\\nSigned out.')\n\n\nif __name__ == '__main__':\n    try:\n        main()\n    except KeyboardInterrupt:\n        sys.exit(1)\n"}], "needs": ["An SD-WAN Manager you are allowed to read. Easiest: sign in to the Cisco DevNet Sandbox catalogue (devnetsandbox.cisco.com) with a free Cisco account, search for \"SD-WAN\", and launch the Catalyst SD-WAN sandbox that is offered today. A reservable sandbox also needs a reservation and the VPN connection that DevNet sends you. Check first that an SD-WAN sandbox is listed: the service is being rebuilt during 2026 and what is on offer changes. If none is offered, use your own lab; the Manager of any test overlay will do.", "The Manager address, user name and password shown on that sandbox’s page. Use only those. Never use production credentials for a course lab.", "A terminal with curl and python3, or just python3 if you use the script."], "scenario": "You have taken over an SD-WAN from another team and the design document is out of date. Before you change anything, you read the design from the network itself. Every step is read-only. The sandbox will not look like the retail chain in the lessons: the point is to read whatever design you find.", "tables": [{"title": "Table 1: inventory and roles (fill in from step 3)", "head": ["Role", "API device-type", "How many", "Reachable?"], "rows": [["Manager", "vmanage", "…", "…"], ["Controller", "vsmart", "…", "…"], ["Validator", "vbond", "…", "…"], ["WAN Edge routers", "vedge", "…", "…"]]}, {"title": "Table 2: transports, topology and segments of one WAN Edge router (fill in from steps 4 to 6)", "head": ["Question", "Your answer"], "rows": [["Which colours does the router use?", "…"], ["Control connections: to how many Controllers, over which colours?", "…"], ["Tunnels: to which site IDs? Any between different colours?", "…"], ["Topology: full mesh or hub and spoke?", "…"], ["Service VPNs seen in the received routes", "…"]]}], "answer_step": 6, "answers": "There is no single right answer, because every sandbox is built differently. A good answer names the evidence. Roles: count the device-type values in step 3. Colours: the local-color values in steps 4 and 5. Restrict: if there are no rows at all that join two different colours, the colours are restricted. If there are such rows and they are down, the transports do not meet and restrict is missing. Topology: if a branch router has tunnels to every other site ID, it is a full mesh; if it only has tunnels to one or two hub sites, it is hub and spoke and a control policy is hiding the other sites. Segments: the distinct vpn-id values in step 6 are the service VPNs; a 0.0.0.0/0 route in a VPN shows where its internet traffic goes. Small sandboxes often show a full mesh with one or two colours and a single service VPN.", "steps": [{"title": "Choose your Manager and note its details", "text": "Open the page of the sandbox you launched and note three things: the Manager address, the user name and the password. If the sandbox is reservable, connect the VPN first and check that the Manager’s login page opens in your browser. Sandbox Managers use a self-signed certificate, which is why the commands below use the -k option. Never use -k against a production system.", "expect": "You can open https://<manager-address> in a browser and see the SD-WAN Manager login page."}, {"title": "Sign in and keep the session cookie", "text": "Set three variables, then post the user name and password to the Manager. It answers with a session cookie, which curl saves in cookie.txt. Releases from 20.18 also offer token-based (JWT) sign-in; the session method below works on every release.", "code": "export MANAGER=<manager-address>          # host name or IP, add :port if the sandbox page shows one\nexport SDWAN_USER=<username>\nexport SDWAN_PASS='<password>'\n\ncurl -sk -c cookie.txt https://$MANAGER/j_security_check \\\n  -d \"j_username=$SDWAN_USER\" --data-urlencode \"j_password=$SDWAN_PASS\" | head -c 200", "expect": "No output at all. An empty reply means you are signed in. If you see HTML (a login page), the address, user name or password is wrong."}, {"title": "Who is here? Read the inventory", "text": "Ask for every device the Manager knows. The python part only prints the columns you need. Count the device types and fill in Table 1.", "code": "curl -sk -b cookie.txt https://$MANAGER/dataservice/device | python3 -c '\nimport json, sys\nfor d in json.load(sys.stdin)[\"data\"]:\n    print(d.get(\"host-name\", \"-\").ljust(24), d.get(\"device-type\", \"-\").ljust(9), d.get(\"system-ip\", \"-\").ljust(16), str(d.get(\"site-id\", \"-\")).ljust(8), d.get(\"reachability\", \"-\"))' ", "expect": "One line for each device: host name, device type (vmanage, vsmart, vbond or vedge), system IP, site ID and reachability. Note the system IP of one vedge for the next steps."}, {"title": "Is one router connected to its controllers?", "text": "Pick one WAN Edge router from step 3 and put its system IP in a variable. Then ask for its control connections.", "code": "export EDGE=<system-ip-of-one-vedge>\n\ncurl -sk -b cookie.txt \"https://$MANAGER/dataservice/device/control/connections?deviceId=$EDGE\" | python3 -c '\nimport json, sys\nfor c in json.load(sys.stdin)[\"data\"]:\n    print(c.get(\"peer-type\", \"-\").ljust(9), c.get(\"system-ip\", \"-\").ljust(16), c.get(\"local-color\", \"-\").ljust(16), c.get(\"protocol\", \"-\").ljust(6), c.get(\"state\", \"-\"))' ", "expect": "Rows for the Controllers (vsmart), usually one per transport, and one row for the Manager (vmanage), all in state up. There is normally no vbond row: the connection to the Validator is only kept while the router is joining."}, {"title": "Which tunnels does it have?", "text": "Now the data plane. Each row is one tunnel from this router to another site, with the local colour, the remote colour and the state.", "code": "curl -sk -b cookie.txt \"https://$MANAGER/dataservice/device/bfd/sessions?deviceId=$EDGE\" | python3 -c '\nimport json, sys\nfor s in json.load(sys.stdin)[\"data\"]:\n    print(s.get(\"system-ip\", \"-\").ljust(16), str(s.get(\"site-id\", \"-\")).ljust(8), s.get(\"local-color\", \"-\").ljust(16), s.get(\"color\", \"-\").ljust(16), s.get(\"state\", \"-\"))' ", "expect": "One row per tunnel: remote system IP, remote site ID, local colour, remote colour and state. Look at which sites appear, and whether any tunnel joins two different colours."}, {"title": "Which routes has it received?", "text": "Ask for the routes the router has received from the Controllers. The vpn-id column shows the service VPNs. The output can be long, so the command prints each prefix only once per VPN.", "code": "curl -sk -b cookie.txt \"https://$MANAGER/dataservice/device/omp/routes/received?deviceId=$EDGE\" | python3 -c '\nimport json, sys\nseen = set()\nfor r in json.load(sys.stdin)[\"data\"]:\n    k = (str(r.get(\"vpn-id\", \"-\")), r.get(\"prefix\", \"-\"))\n    if k not in seen:\n        seen.add(k); print(k[0].ljust(6), k[1].ljust(22), r.get(\"originator\", \"-\"))' ", "expect": "Lines with a VPN number, a prefix and the system IP of the router that originated it. The distinct VPN numbers are the service VPNs."}, {"title": "Fill in the design tables", "text": "Use what you collected to complete Table 1 and Table 2. For each answer, write down which output proves it. Then say in one sentence what kind of design this is. When you have written your answer, compare it with the model answer.", "expect": "Both tables filled in, with the evidence for each line, and one sentence such as: \"Two colours, full mesh between four sites, one service VPN.\""}, {"title": "Sign out", "text": "A Manager allows only a limited number of sessions for each user, so always sign out. Then delete the cookie file.", "code": "curl -sk -b cookie.txt -X POST https://$MANAGER/logout | head -c 100\nrm cookie.txt", "expect": "A short reply or nothing at all. Repeating a step 3 command now returns a login page instead of data."}]}}</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('course-data').textContent);
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)){ if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
const fmt = s => { s = Math.round(s); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const mins = s => Math.max(1, Math.round(s/60)) + ' min';

/* ---------- progress (kept in this browser only) ---------- */
const KEY = D.course.storage_key || ('ces-academy-' + D.course.id + '-v1');
let S = {done:{}, quiz:{}, lab:[]};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const ITEMS = [...D.lessons.map(l => ({id:l.id, n:String(l.n), title:l.title, sub:(l.x ? 'Interactive, ' + mins(l.duration) : mins(l.duration)+' video')+', '+l.quiz.length+' questions'})),
               {id:'lab', n:'L', title:'Hands-on lab', sub:D.lab.duration}];
const PASS = 3;

/* ---------- routing ---------- */
let cur = 'home';
const valid = id => id === 'home' || ITEMS.some(i => i.id === id);
function go(id, push){
  cur = valid(id) ? id : 'home';
  if (push !== false){ try { history.replaceState(null, '', cur === 'home' ? '#home' : '#'+cur); } catch(e){ try{ location.hash = cur; }catch(_){} } }
  render();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== cur) go(id, false); });

function renderChrome(){
  const total = ITEMS.length, n = ITEMS.filter(i => S.done[i.id]).length;
  $('progText').textContent = n + ' of ' + total + ' complete';
  $('progBar').style.width = (100*n/total) + '%';
  const o = $('outline'); o.textContent = '';
  o.append(h('div', {class:'eyebrow'}, 'Course outline'));
  o.append(h('button', {class:'oi', 'aria-current': cur==='home' ? 'page' : null, onclick:()=>go('home')}, h('span',{class:'dot'},'⌂'), h('span',{},'Overview')));
  for (const it of ITEMS){
    o.append(h('button', {class:'oi'+(S.done[it.id]?' done':''), 'aria-current': cur===it.id ? 'page' : null, onclick:()=>go(it.id)},
      h('span',{class:'dot'}, S.done[it.id] ? '✓' : it.n),
      h('span',{}, it.title, h('small',{}, it.sub))));
  }
}

function render(){

SIMS.s2 = api => {
  const s = {m:0, i:0}, p = 'sim-' + api.lessonId + '-';
  const calc = () => { const mm = s.m !== 2, cross = s.m === 0 && s.i === 0; return {mm, cross, up: (mm ? 1 : 0) + 1, down: cross ? 2 : 0}; };
  const paint = () => { const c = calc(); api.show('g-mm', c.mm); api.show('g-off', !c.mm); api.show('g-x', c.cross);
    api.text('d-set1', 'MPLS tunnel: ' + ['default', 'restrict', 'shut down'][s.m]); api.text('d-set2', 'internet tunnel: ' + ['default', 'restrict'][s.i]); api.text('d-cnt', 'dashboard: press refresh', 'mono dim'); };
  return { intro: 'Change the tunnel settings, refresh the dashboard, then check your design.',
    reset(){ s.m = 0; s.i = 0; paint(); api.msg('Two stores, four possible tunnels'); },
    controls(){ return [
      simChoice(p + 'mpls', 'MPLS tunnel interface', ['Default: build tunnels to every colour', 'Restrict: build tunnels only to the same colour', 'Shut the tunnel down'], s.m, v => { s.m = v; paint(); }),
      simChoice(p + 'inet', 'Internet tunnel interface', ['Default: build tunnels to every colour', 'Restrict: build tunnels only to the same colour'], s.i, v => { s.i = v; paint(); })]; },
    tests: [{label:'Refresh the dashboard', run(){ const c = calc();
      api.text('d-cnt', 'dashboard: ' + c.up + ' up, ' + c.down + ' down', c.down ? 'mono badt' : 'mono okt');
      api.msg(c.down ? 'Two tunnels are attempted that can never come up' : (c.mm ? 'Every attempted tunnel is up' : 'Green, but only one transport is left'), c.down || !c.mm ? 'badt' : 'okt');
      return c.down ? 'Between these two stores: ' + c.up + ' tunnels up, 2 down. The MPLS-to-internet tunnels are still being attempted.' : c.mm ? 'Between these two stores: 2 tunnels up, none down.' : 'Between these two stores: 1 tunnel up, none down. The MPLS path is gone.'; }}],
    check(){ const c = calc();
      if (!c.mm) return {ok:false, msg:'That clears the red tunnels, but the stores have lost their MPLS path, and with it their second transport.'};
      if (c.cross) return {ok:false, msg:'The routers still try to build MPLS-to-internet tunnels, and those can never come up.'};
      if (s.i === 1) return {ok:false, msg: (s.m === 1 ? 'Restrict on MPLS is right. But restrict on the internet colour as well' : 'That clears the dashboard for these two stores. But restrict on the internet colour') + ' would later stop sites with LTE from building LTE-to-internet tunnels. Restrict the MPLS colour only, and leave the internet colour open.'};
      return {ok:true}; },
    solved(){ api.text('d-cnt', 'dashboard: 2 up, 0 down', 'mono okt'); api.msg('Both transports in use, nothing red', 'okt'); } };
};

  };
  const video = L.x ? null : h('video',{controls:true, preload:'metadata', playsinline:true, poster:L.id+'.jpg', src:L.id+'.mp4', id:'video-'+L.id});
  const cues = L.cues.map((c,i) => h('button',{class:'cue', type:'button', onclick:()=>{ if (P) P.goto(i); else { video.currentTime = c.s + 0.05; video.play().catch(()=>{}); } }}, h('time',{}, L.x ? String(i+1) : fmt(c.s)), h('span',{}, c.text)));
  const tr = h('div',{class:'transcript', id:'transcript-'+L.id}, cues);
  if (L.x) P = makePlayer(L, {onItem: mark, toQuiz: () => { show('quiz'); tabs.scrollIntoView({block:'start'}); }});
  else video.addEventListener('timeupdate', () => { const t = video.currentTime; mark(L.cues.findIndex(c => t >= c.s && t < c.e)); });
  const body = h('div',{});
  const panes = {
    transcript: () => [h('p',{class:'muted'}, 'Select a line to jump to that point in the ' + (L.x ? 'lesson.' : 'video.')), tr],
    points: () => [h('ul',{class:'plain'}, L.keypoints.map(k => h('li',{}, k)))],
    quiz: () => [quizBlock(L, nextId)],
  };
  const tabs = h('div',{class:'tabs', role:'tablist'});
  const names = {transcript:'Transcript', points:'Key points', quiz:'Quiz' + (S.done[L.id] ? ' ✓' : '')};
  function show(t){
    tab = t; tabs.textContent = '';
    for (const k in names) tabs.append(h('button',{class:'tab', role:'tab', type:'button', 'aria-selected': String(k===t), onclick:()=>show(k)}, names[k]));
    body.textContent = ''; body.append(h('div',{class:'panel', role:'tabpanel'}, panes[t]()));
  }
  show('transcript');
  return [
    h('div',{class:'head'}, h('div',{class:'eyebrow'}, 'Lesson '+L.n+' of '+D.lessons.length+' · '+(L.x ? 'interactive · about ' + mins(L.duration) : fmt(L.duration))), h('h1',{}, L.title), h('p',{class:'lede'}, L.summary)),
    L.x ? P.el : h('div',{class:'player'}, video),
    L.x && D.course.scenario_note ? h('p',{class:'muted'}, D.course.scenario_note) : null,
    h('div',{}, tabs, body),
    h('div',{class:'row spread'},
      idx > 0 ? h('button',{class:'btn ghost', onclick:()=>go(D.lessons[idx-1].id)}, '← ' + D.lessons[idx-1].title) : h('span',{}),
      h('button',{class:'btn ghost', onclick:()=>go(nextId)}, (nextId==='lab' ? 'Hands-on lab' : D.lessons[idx+1].title) + ' →')),
  ];
}

function quizBlock(L, nextId){
  const st = S.quiz[L.id] || (S.quiz[L.id] = {a:[], checked:false});
  const wrap = h('div',{class:'quiz'});
  function draw(){
    wrap.textContent = '';
    wrap.append(h('p',{class:'muted'}, 'Answer all ' + L.quiz.length + ' questions. ' + PASS + ' correct marks the lesson complete.'));
    L.quiz.forEach((q,qi) => {
      const fs = h('fieldset',{class:'q'}, h('legend',{}, (qi+1)+'. '+q.q));
      q.o.forEach((o,oi) => {
        const id = 'q-'+L.id+'-'+qi+'-'+oi;
        const cls = 'opt' + (st.checked && oi === q.a ? ' right' : st.checked && st.a[qi] === oi ? ' wrong' : '');
        fs.append(h('label',{class:cls, for:id},
          h('input',{type:'radio', id, name:'q-'+L.id+'-'+qi, checked: st.a[qi] === oi, disabled: st.checked, onchange:()=>{ st.a[qi] = oi; save(); btn.disabled = !ready(); }}),
          h('span',{}, o)));
      });
      if (st.checked) fs.append(h('div',{class:'why'}, (st.a[qi] === q.a ? 'Correct. ' : 'Not quite. ') + q.why));
      wrap.append(fs);
    });
    const ready = () => L.quiz.every((_,i) => st.a[i] != null);
    const score = L.quiz.filter((q,i) => st.a[i] === q.a).length;
    const btn = h('button',{class:'btn', type:'button', disabled: !ready(), onclick:()=>{ st.checked = true; if (L.quiz.filter((q,i)=>st.a[i]===q.a).length >= PASS) S.done[L.id] = true; save(); renderChrome(); draw(); }}, 'Check answers');
    if (!st.checked) wrap.append(btn);
    else wrap.append(h('div',{class:'row'},
      h('span',{class:'score'}, score + ' of ' + L.quiz.length + ' correct. ' + (score >= PASS ? 'Lesson complete.' : 'You need ' + PASS + ' to complete the lesson.')),
      h('button',{class:'btn ghost', type:'button', onclick:()=>{ st.a = []; st.checked = false; save(); draw(); }}, 'Try again'),
      score >= PASS ? h('button',{class:'btn', type:'button', onclick:()=>go(nextId)}, nextId === 'lab' ? 'Go to the lab' : 'Next lesson') : null));
  }
  draw();
  return wrap;
}

/* ---------- lab ---------- */
function copyBtn(text){
  const b = h('button',{class:'copy', type:'button'}, 'Copy');
  b.addEventListener('click', () => {
    const ok = () => { b.textContent = 'Copied'; setTimeout(()=>b.textContent='Copy', 1500); };
    const sel = () => { const pre = b.closest('.codebox').querySelector('pre'); const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected, press Ctrl+C'; };
    try { navigator.clipboard.writeText(text).then(ok, sel); } catch(e){ sel(); }
  });
  return b;
}
const codeBox = (label, text) => h('div',{class:'codebox'}, h('div',{class:'codebar'}, h('span',{}, label), copyBtn(text)), h('pre',{}, text));

function viewLab(){
  const Lb = D.lab;
  const stepsEl = h('div',{class:'panel'});
  function draw(){
    stepsEl.textContent = '';
    stepsEl.append(h('h2',{}, 'Steps'));
    const list = h('div',{});
    Lb.steps.forEach((s,i) => {
      const id = 'lab-step-'+i;
      list.append(h('div',{class:'step'+(S.lab[i]?' ok':'')},
        h('div',{class:'num'}, S.lab[i] ? '✓' : String(i+1)),
        h('div',{class:'step-b'},
          h('h3',{}, s.title), h('p',{}, s.text),
          s.code ? codeBox(s.file || 'terminal', s.code) : null,
          s.code2 ? codeBox('terminal', s.code2) : null,
          h('p',{class:'expect'}, h('b',{}, 'Expected: '), s.expect),
          i === Lb.answer_step ? answerBlock() : null,
          h('label',{class:'check', for:id}, h('input',{type:'checkbox', id, checked: !!S.lab[i], onchange:(e)=>{ S.lab[i] = e.target.checked; S.done.lab = Lb.steps.every((_,k)=>S.lab[k]); save(); renderChrome(); draw(); }}), 'Step done'))));
    });
    stepsEl.append(list);
    if (S.done.lab) stepsEl.append(h('div',{class:'done-banner'}, 'Lab complete.'));
  }
  function answerBlock(){
    const box = h('div',{});
    const b = h('button',{class:'btn ghost', type:'button', onclick:()=>{ box.textContent=''; box.append(h('div',{class:'why'}, Lb.answers)); }}, 'Show model answer');
    box.append(b); return box;
  }
  draw();
  return [
    h('div',{class:'head'}, h('div',{class:'eyebrow'}, 'Hands-on lab · ' + Lb.duration), h('h1',{}, Lb.heading), h('p',{class:'lede'}, Lb.summary)),
    Lb.notice ? h('div',{class:'notice'}, h('b',{}, Lb.notice[0] + ' '), Lb.notice[1]) : null,
    Lb.downloads && Lb.downloads.length ? h('div',{class:'panel'}, h('h2',{}, 'Files for this lab'), h('ul',{class:'plain'}, Lb.downloads.map(d => h('li',{}, window.CES_STANDALONE ? h('a',{href:d.href, download:d.href}, d.label) : h('b',{}, d.label), d.note ? ' ' + d.note : '', d.content ? h('details',{class:'dl'}, h('summary',{}, 'Show ' + d.label + ' (to copy it and save it as a file)'), codeBox(d.label, d.content)) : null)))) : null,
    h('div',{class:'panel'}, h('h2',{}, 'You need'), h('ul',{class:'plain'}, Lb.needs.map(n => h('li',{}, n)))),
    h('div',{class:'panel'}, h('h2',{}, 'Scenario'), h('p',{style:'max-width:72ch'}, Lb.scenario),
      (Lb.tables || []).map(t => [h('h3',{}, t.title), h('div',{class:'tblwrap'}, h('table',{}, h('thead',{}, h('tr',{}, t.head.map(x => h('th',{}, x)))), h('tbody',{}, t.rows.map(r => h('tr',{}, r.map(c => h('td',{}, c)))))))])),
    stepsEl,
    h('div',{class:'row'}, h('button',{class:'btn ghost', onclick:()=>go(D.lessons[D.lessons.length-1].id)}, '← ' + D.lessons[D.lessons.length-1].title), h('button',{class:'btn ghost', onclick:()=>go('home')}, 'Back to overview')),
  ];
}

/* ---------- tutor ---------- */
let sample = null, tutorReady = false, turns = [], ctl = null, busy = false, dead = false;
const MATERIAL = (() => {
  let t = '';
  for (const L of D.lessons){
    t += '\n\n## Lesson ' + L.n + ': ' + L.title + '\nKey points:\n' + L.keypoints.map(k=>'- '+k).join('\n') + '\nTranscript:\n' + L.cues.map(c=>c.text).join(' ');
  }
  const B = D.lab;
  t += '\n\n## Lab: ' + B.summary + '\nScenario: ' + B.scenario;
  for (const tb of (B.tables || [])) t += '\n' + tb.title + ': ' + tb.head.join(' | ') + '\n' + tb.rows.map(r=>r.join(' | ')).join('\n');
  B.steps.forEach((s,i) => { t += '\nStep ' + (i+1) + ' - ' + s.title + ': ' + s.text + (s.code ? '\n' + (s.file||'command') + ':\n' + s.code : '') + (s.code2 ? '\n' + s.code2 : '') + '\nExpected: ' + s.expect; });
  if (B.answers) t += '\nModel answer for lab step ' + (B.answer_step + 1) + ' (give hints first, reveal only if the learner asks for it): ' + B.answers;
  return t;
})();
const RULES = 'You are the course tutor for "' + D.course.title + '", a ' + D.course.subject + ' course from CES Tech Academy. The learner is a network engineer.\n' +
  'Rules:\n- Ground answers in the course material below and say which lesson covers the point.\n- If the question goes beyond the course, you may answer from general ' + D.course.subject + ' knowledge, but say it is beyond the course.\n- Never invent CLI commands, API classes, fault codes, defaults or scale numbers. If you are not sure, say so and point the learner to Cisco documentation for ' + D.course.release_note + '.\n- For the lab step that has a model answer, guide with hints before giving it.\n- Decline topics unrelated to ' + D.course.domain + ' in one sentence.\n- Keep answers under 150 words unless asked for more. Plain short paragraphs. Use "- " bullets, backticks for object names, and fenced code blocks for payloads. No headings and no tables.\n\nCOURSE MATERIAL' + MATERIAL;

function md(el, text){
  el.textContent = '';
  const parts = text.split(/```[a-zA-Z]*\n?/);
  parts.forEach((part, i) => {
    if (i % 2){ el.append(h('pre',{}, part.replace(/\n$/,''))); return; }
    let list = null, para = [];
    const flush = () => { if (para.length){ const p = h('p',{}); inline(p, para.join(' ')); el.append(p); para = []; } };
    for (const line of part.split('\n')){
      const m = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
      if (m){ flush(); if (!list){ list = h('ul',{}); el.append(list); } const li = h('li',{}); inline(li, m[1]); list.append(li); }
      else if (!line.trim()){ flush(); list = null; }
      else { list = null; para.push(line.trim()); }
    }
    flush();
  });
}
function inline(el, s){
  const re = /(`[^`]+`|\*\*[^*]+\*\*)/g; let last = 0, m;
  while ((m = re.exec(s))){
    if (m.index > last) el.append(s.slice(last, m.index));
    const tok = m[0];
    el.append(tok[0] === '`' ? h('code',{}, tok.slice(1,-1)) : h('b',{}, tok.slice(2,-2)));
    last = m.index + tok.length;
  }
  if (last < s.length) el.append(s.slice(last));
}
const ERR = {
  not_granted:'The tutor is off because this page was not allowed to use Claude. Reload the page to be asked again.',
  sampling_disabled:'Claude is not available for this account, so the tutor is off.',
  not_declared:'The tutor is not enabled on this page.', capability_disabled:'The tutor cannot run in this view.', capability_removed:'The tutor cannot run in this view.',
  rate_limited:'Too many questions at once, or your Claude usage limit was reached. Wait a little and ask again.',
  session_expired:'Your session has expired. Sign in to Claude again, then ask again.',
  refused:'The tutor could not answer that. Try rephrasing the question.',
  empty_completion:'The tutor returned nothing. Try a simpler question.',
  prompt_too_large:'That conversation got too long. Close and reopen the tutor to start again.',
};
const FATAL = ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
function suggestions(){
  const SG = D.course.suggestions || {}, base = SG[cur] || SG.default || ['Quiz me on this lesson'];
  return h('div',{class:'chips'}, base.map(q => h('button',{class:'chip', type:'button', onclick:()=>ask(q)}, q)));
}
function openTutor(){
  $('tutor').hidden = false; $('tutorBtn').hidden = true;
  const log = $('tLog');
  if (!log.childElementCount){
    log.append(h('div',{class:'msg ai'}, h('p',{}, 'Ask me about any lesson or lab step. I answer from this course, and I will say so when a question goes beyond it.')), suggestions());
  }
  $('tInput').focus();
}
function closeTutor(){ $('tutor').hidden = true; $('tutorBtn').hidden = !tutorReady; }
function where(){ const it = ITEMS.find(i => i.id === cur); return cur === 'home' ? 'the course overview' : cur === 'lab' ? 'the hands-on lab' : 'Lesson ' + it.n + ': ' + it.title; }
function setBusy(b){ busy = b; const s = $('tSend'); s.textContent = b ? 'Stop' : 'Send'; $('tInput').disabled = b || dead; }
async function ask(q){
  q = (q||'').trim(); if (!q || busy || dead || !sample) return;
  const log = $('tLog');
  log.querySelectorAll('.chips').forEach(c => c.remove());
  log.append(h('div',{class:'msg me'}, q));
  const bubble = h('div',{class:'msg ai'}, h('p',{class:'muted'}, 'Thinking…'));
  log.append(bubble); log.scrollTop = log.scrollHeight;
  turns.push({role:'user', content:'[The learner is viewing ' + where() + ']\n' + q});
  if (turns.length > 14) turns = turns.slice(-14);
  ctl = new AbortController(); setBusy(true);
  try {
    const res = await sample([{role:'user', content:RULES}, ...turns], {cache:false, signal:ctl.signal,
      onText: ({text}) => { const stick = log.scrollTop + log.clientHeight > log.scrollHeight - 60; md(bubble, text); if (stick) log.scrollTop = log.scrollHeight; }});
    md(bubble, res.text);
    turns.push({role:'assistant', content:res.text});
    if (res.truncated) log.append(h('div',{class:'msg sys'}, 'That answer was cut short. Ask for a shorter answer or one part at a time.'));
  } catch(e){
    const code = e && e.code || 'upstream_error';
    if (e && e.text && code !== 'refused'){ md(bubble, e.text); turns.push({role:'assistant', content:e.text}); } else bubble.remove();
    if (code !== 'cancelled'){
      log.append(h('div',{class:'msg sys'}, ERR[code] || 'The tutor was interrupted. Ask again in a moment.'));
      if (FATAL.includes(code)){ dead = true; }
    }
  } finally { setBusy(false); log.scrollTop = log.scrollHeight; if (!dead) $('tInput').focus(); }
}
$('tForm').addEventListener('submit', e => { e.preventDefault(); if (busy){ ctl && ctl.abort(); return; } const v = $('tInput').value; $('tInput').value = ''; ask(v); });
$('tInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('tForm').requestSubmit(); } });
$('tutorBtn').addEventListener('click', openTutor);
$('tutorClose').addEventListener('click', closeTutor);
$('homeBtn').addEventListener('click', () => go('home'));

const first = location.hash.slice(1);
cur = valid(first) ? first : 'home';
render();
(async () => {
  try { sample = (window.claude && window.claude.use) ? await window.claude.use('sample') : null; } catch(e){ sample = null; }
  if (sample){ tutorReady = true; if ($('tutor').hidden) $('tutorBtn').hidden = false; const t = $('tutorHint'); if (t) t.textContent = 'Stuck at any point? Use Ask the tutor at the bottom right.'; const mt = $('metaTutor'); if (mt) mt.hidden = false; }
  if (window.CES_STANDALONE) $('allCourses').hidden = false;
  if (window.CES_STANDALONE) $('tNote').textContent = 'Answers come from an AI model (Claude). Check anything release-specific against Cisco documentation.';
})();
})();
</script>
