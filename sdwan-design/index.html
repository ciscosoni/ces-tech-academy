<script>
/* Bridge between the course page and the CES Tech Academy backend (backend/server.py).
   The page asks for an AI helper with window.claude.use('sample'). Inside a Claude artifact that object already exists.
   On the standalone site we provide it here: if a backend answers at CES_BACKEND + /api/health and says the tutor is on
   (CES_BACKEND comes from config.js at the site root; empty means the site's own address),
   the tutor and the AI marking work; if not, the page hides the tutor and shows model answers instead. */
window.CES_STANDALONE = !window.claude;
window.claude = window.claude || { use: async function (name) {
  if (name !== 'sample' || window.CES_BACKEND === null) return null;
  var base = String(window.CES_BACKEND || '..').replace(/\/$/, ''), api = function (p) { return base + '/api/' + p; };
  try {
    var r = await fetch(api('health'), {cache: 'no-store'}); if (!r.ok) return null;
    var j = await r.json(); if (!j || !j.tutor) return null;
  } catch (e) { return null; }
  return async function (input, opts) {
    opts = opts || {};
    var messages = typeof input === 'string' ? [{role: 'user', content: input}] : input, res;
    try { res = await fetch(api('ask'), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({messages: messages}), signal: opts.signal}); }
    catch (e) { var err = new Error('tutor'); err.code = e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error'; throw err; }
    if (!res.ok) { var er = new Error('tutor'); er.code = res.status === 429 ? 'rate_limited' : 'upstream_error'; throw er; }
    var out = await res.json();
    if (opts.onText) opts.onText({text: out.text, delta: out.text});
    return {text: out.text, truncated: !!out.truncated};
  };
}};
</script>

<style>
/* Layout: a learning workspace. Navy masthead, course outline on the left, one lesson at a time on the right, tutor in a corner drawer. */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --sunk:#E9EFF6;
  --ink:#1B2A4A; --text:#333333; --muted:#5A6880; --line:#D3DDE8;
  --navy:#1B2A4A; --on-navy:#FFFFFF; --on-navy-dim:#BFD9EC;
  --accent:#4FA8D6; --accent-ink:#1D6C9A; --accent-wash:#E6F2FA;
  --good:#1B7A4B; --good-wash:#E3F4EA; --bad:#B23A30; --bad-wash:#FBE9E7;
  --warn-ink:#6B4700; --warn-wash:#FFF3DC; --warn-line:#D98A00;
  --code-bg:#10203C; --code-ink:#E3EEF8;
  --sans:Carlito,Calibri,"Segoe UI",Candara,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1524; --surface:#152038; --sunk:#0F192C;
  --ink:#EAF1F8; --text:#CDD7E4; --muted:#93A3BA; --line:#2A3B5A;
  --navy:#111C33; --on-navy:#FFFFFF; --on-navy-dim:#A9C6DC;
  --accent:#4FA8D6; --accent-ink:#7FC4EA; --accent-wash:#18304A;
  --good:#5CC98F; --good-wash:#133324; --bad:#F08A80; --bad-wash:#3A1B18;
  --warn-ink:#F2CF8A; --warn-wash:#33280F; --warn-line:#D98A00;
  --code-bg:#0A1222; --code-ink:#DCE8F5; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#152038; --sunk:#0F192C;
  --ink:#EAF1F8; --text:#CDD7E4; --muted:#93A3BA; --line:#2A3B5A;
  --navy:#111C33; --on-navy:#FFFFFF; --on-navy-dim:#A9C6DC;
  --accent:#4FA8D6; --accent-ink:#7FC4EA; --accent-wash:#18304A;
  --good:#5CC98F; --good-wash:#133324; --bad:#F08A80; --bad-wash:#3A1B18;
  --warn-ink:#F2CF8A; --warn-wash:#33280F; --warn-line:#D98A00;
  --code-bg:#0A1222; --code-ink:#DCE8F5; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.5;margin:0}
h1,h2,h3{color:var(--ink);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,1.2rem + 2vw,2.4rem)}
h2{font-size:1.3rem}
h3{font-size:1.08rem}
p{margin:0}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent-ink)}
.muted{color:var(--muted)}

/* masthead */
.top{background:var(--navy);color:var(--on-navy);border-bottom:4px solid var(--accent)}
.allc{color:var(--on-navy-dim);font-size:15px;text-decoration:none;border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:5px 14px;margin-left:auto}
.allc:hover,.allc:focus-visible{color:#fff;border-color:#fff}
.dl{margin-top:8px}.dl summary{cursor:pointer;color:var(--accent-ink)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:0;background:none;border:0;padding:0;text-align:left;color:var(--on-navy)}
.brand b{font-size:1.35rem;letter-spacing:.01em}
.brand b span{font-weight:400;color:var(--on-navy-dim)}
.brand i{font-size:.8rem;color:var(--on-navy-dim)}
.prog{display:flex;align-items:center;gap:12px;font-size:.9rem;color:var(--on-navy-dim);min-width:0}
.prog-bar{width:160px;max-width:40vw;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.prog-bar div{height:100%;background:var(--accent);width:0;transition:width .3s}

/* shell */
.shell{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:28px 120px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:36px;align-items:start}
.outline{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.outline .eyebrow{margin:0 0 8px 12px}
.oi{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:6px;padding:10px 12px;color:var(--text);line-height:1.25}
.oi:hover{background:var(--sunk)}
.oi[aria-current="page"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-weight:700}
.oi small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;color:var(--muted);background:var(--surface)}
.oi.done .dot{background:var(--good);border-color:var(--good);color:#fff}
main{min-width:0;display:flex;flex-direction:column;gap:26px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:16px 120px}
  .outline{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .outline .eyebrow{display:none}
  .oi{flex:0 0 auto;grid-template-columns:28px auto;white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
  .oi small{display:none}
}

/* blocks */
.head{display:flex;flex-direction:column;gap:8px}
.lede{font-size:1.12rem;max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.notice{background:var(--warn-wash);color:var(--warn-ink);border-left:5px solid var(--warn-line);padding:12px 16px;font-size:.95rem;border-radius:0 6px 6px 0}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.95rem;color:var(--muted)}
.meta b{color:var(--ink)}
.btn{background:var(--navy);color:var(--on-navy);border:0;border-radius:6px;padding:11px 20px;font-weight:700;align-self:flex-start}
.btn:hover{filter:brightness(1.25)}
.btn.ghost{background:transparent;color:var(--accent-ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn[disabled]{opacity:.5;cursor:default}
:root[data-theme="dark"] .btn:not(.ghost){background:var(--accent);color:#0D1524}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn:not(.ghost){background:var(--accent);color:#0D1524} }
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.spread{justify-content:space-between}
ul.plain{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.mods{display:flex;flex-direction:column}
.mod{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:var(--text)}
.mod:first-child{border-top:0}
.mod:hover b{color:var(--accent-ink)}
.mod b{color:var(--ink);display:block}
.mod span.t{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mod.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.done-banner{background:var(--good-wash);color:var(--good);border-radius:8px;padding:16px 20px;font-weight:700}

/* video + tabs */
.player{background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9;max-width:100%;border:1px solid var(--line)}
.player video{width:100%;height:100%;display:block}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.transcript{max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:6px}
.cue{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;color:var(--text);line-height:1.45}
.cue:hover{background:var(--sunk)}
.cue time{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.cue.on{background:var(--accent-wash);color:var(--ink)}

/* quiz */
.q{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.q legend{font-weight:700;color:var(--ink);padding:0;margin-bottom:8px;max-width:72ch}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.opt input{margin:4px 0 0;accent-color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-wash)}
.opt.wrong{border-color:var(--bad);background:var(--bad-wash)}
.why{font-size:.95rem;padding:8px 12px;border-left:4px solid var(--accent);background:var(--accent-wash);border-radius:0 6px 6px 0;color:var(--ink)}
.score{font-weight:700;color:var(--ink)}
.quiz{display:flex;flex-direction:column;gap:24px}

/* lab */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{background:var(--navy);color:var(--on-navy);text-align:left;padding:9px 12px;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:.84rem;white-space:nowrap}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding:20px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:0}
.step-b{display:flex;flex-direction:column;gap:12px;min-width:0}
.num{width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--on-navy);font-weight:700;display:flex;align-items:center;justify-content:center}
.step.ok .num{background:var(--good)}
.codebox{background:var(--code-bg);border-radius:6px;overflow:hidden;min-width:0}
.codebar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;color:#9FB6CF;font-family:var(--mono);font-size:.76rem;border-bottom:1px solid rgba(255,255,255,.1)}
.copy{background:rgba(255,255,255,.1);border:0;color:#E3EEF8;border-radius:4px;padding:4px 10px;font-size:.78rem;font-family:var(--sans)}
.copy:hover{background:rgba(255,255,255,.2)}
pre{margin:0;padding:14px;overflow:auto;max-height:340px;color:var(--code-ink);font-family:var(--mono);font-size:.8rem;line-height:1.55;tab-size:2}
.expect{font-size:.95rem;color:var(--muted)}
.expect b{color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;font-size:.95rem;cursor:pointer;align-self:flex-start}
.check input{width:18px;height:18px;accent-color:var(--good)}
code{font-family:var(--mono);font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:4px;color:var(--ink)}

/* interactive lesson */
.xp{display:flex;flex-direction:column;gap:12px}
.stage-wrap{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#16264A;aspect-ratio:16/9;max-width:100%}
.stage{width:100%;height:100%;display:block}
.stage text{font-family:var(--sans);fill:#fff}
.stage .t{font-size:34px}.stage .tb{font-size:36px;font-weight:700}.stage .ts{font-size:27px;fill:#C5DCEF}.stage .ts.wt{fill:#fff}
.stage .mono{font-family:var(--mono);font-size:25px;fill:#C5DCEF}
.stage .hand{font-family:Kalam,"Segoe Print","Comic Sans MS",cursive;font-size:38px;fill:#F6C453}
.stage .hand.dimh{fill:#7F9AC4;font-size:32px}
.stage .num{font-size:40px;font-weight:700;fill:#16264A}
.stage .okt{fill:#6FD39A}.stage .badt{fill:#F0776B}.stage .amt{fill:#F6C453}
.stage .ln{fill:none;stroke:#9CD0F0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.stage .ln2{fill:none;stroke:#4E6E9E;stroke-width:2.5}
.stage .bx{fill:#1F3463;stroke:#9CD0F0;stroke-width:3}
.stage .bxa{fill:#235E8C;stroke:#BFE3F7;stroke-width:3}
.stage .plate{fill:#101D3A;stroke:#9CD0F0;stroke-width:2.5}
.stage .chip{fill:#101D3A;stroke:#4FA8D6;stroke-width:3}
.stage .pf{fill:#C5DCEF}
.stage .amber{stroke:#F6C453}.stage .famber{fill:#F6C453}
.stage .okc{stroke:#6FD39A;fill:none}.stage .okf{fill:#6FD39A}.stage .badf{fill:#F0776B}
.stage .pill rect{fill:#F6C453}.stage .pill text{fill:#16264A;font-weight:700;font-size:27px;letter-spacing:.05em}
.stage .pill.blue rect{fill:#9CD0F0}.stage .pill.redp rect{fill:#F0776B}.stage .pill.redp text{fill:#fff}
.stage .lk .lkb{fill:#F0776B}.stage .lk .lks{stroke:#F0776B}
.stage .lk.green .lkb{fill:#6FD39A}.stage .lk.green .lks{stroke:#6FD39A}
.stage .lk .lkb,.stage .lk .lks{transition:fill .3s,stroke .3s}
.stage .cx{opacity:0;transition:opacity .3s}.stage .cx.show{opacity:1}
.stage #xm,.stage #pk{transition:opacity .3s}
.stage [data-in]{opacity:0;transition:opacity .45s ease,transform .45s ease}
.stage [data-in].on{opacity:1;transition-delay:var(--d,0s)}
.stage .rise{transform:translateY(16px)}.stage .rise.on{transform:none}
.stage .draw{stroke-dasharray:var(--len,3000);stroke-dashoffset:var(--len,3000);transition:stroke-dashoffset 1s ease,opacity .2s}
.stage .draw.on{stroke-dashoffset:0;transition-delay:var(--d,0s)}
.stage.instant *{transition:none!important}
.stage .ripple{fill:none;stroke:#F6C453;stroke-width:5;transform-box:fill-box;transform-origin:center;animation:xp-rip 2.4s ease-out infinite}
@keyframes xp-rip{0%{opacity:.9;transform:scale(.04)}100%{opacity:0;transform:scale(1)}}
.xp-cover{position:absolute;inset:0;background:rgba(16,29,58,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;color:#fff}
.xp-cover .eyebrow{color:#9CD0F0}
.xp-cover-t{font-size:clamp(1.3rem,1rem + 2.4vw,2.4rem);font-weight:700;line-height:1.1}
.xp-cover-s{font-size:.9rem;color:#C5DCEF;max-width:46ch}
.xp-start{display:flex;align-items:center;gap:12px;background:#F6C453;color:#16264A;border:0;border-radius:32px;padding:14px 26px 14px 20px;font-weight:700;font-size:1.1rem}
.xp-start:hover{filter:brightness(1.08)}
.xp-play-ic{width:34px;height:34px;border-radius:50%;background:#16264A;color:#F6C453;display:flex;align-items:center;justify-content:center;font-size:.85rem;padding-left:3px}
.xp-prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.12)}
.xp-prog div{height:100%;width:0;background:#F6C453;transition:width .4s}
.xp-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.xp-ctl .btn{align-self:auto;padding:8px 16px}
.xp-pp{min-width:104px}
.xp-speed{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.xp-chapters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.xp-ch{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:.86rem;color:var(--muted);white-space:nowrap}
.xp-ch.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.xp-cap{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-height:3.2em;max-width:none;color:var(--ink)}
.xp-panel:empty{display:none}
.xp-card{background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.xp-opts{display:flex;flex-direction:column;gap:8px}
.xp-opt,.xp-m{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:11px 14px;color:var(--text);line-height:1.3}
.xp-opt:hover:not(:disabled),.xp-m:hover:not(:disabled){border-color:var(--accent);background:var(--accent-wash)}
.xp-opt.right{border-color:var(--good);background:var(--good-wash);color:var(--ink);font-weight:700}
.xp-opt.wrong{border-color:var(--bad);background:var(--bad-wash)}
.xp-fb{font-size:.97rem;color:var(--muted)}.xp-fb.ok{color:var(--good);font-weight:700}.xp-fb.no{color:var(--bad);font-weight:700}
.xp-skip{align-self:flex-start;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:.88rem}
.xp-match{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
.xp-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.xp-m.term{font-weight:700;color:var(--ink)}
.xp-m.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-wash)}
.xp-m.matched{border-color:var(--good);background:var(--good-wash);color:var(--ink);opacity:1}
.xp-n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;font-size:.78rem;font-weight:700;align-items:center;justify-content:center;margin-right:8px}
.xp-sim{display:flex;flex-direction:column;gap:8px}
.xp-simrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.xp-simrow .btn{align-self:auto;padding:7px 14px}
.xp-tog{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:700;color:var(--ink)}
.xp-tog input{width:20px;height:20px;accent-color:var(--good)}
.xp-tog small{font-weight:400;color:var(--muted);font-family:var(--mono)}
@media (max-width:520px){ .xp-match{grid-template-columns:minmax(0,1fr)} }

.stage .badc{stroke:#F0776B;fill:none}

<script type="application/json" id="course-data">{"course": {"id": "sdwan-design", "title": "Cisco SD-WAN Design in Practice", "brand": "CES Tech Academy", "tagline": "Beyond IT Services, We Deliver Solutions.", "level": "Intermediate", "audience": "Network engineers who know routing, VPNs and WAN circuits, and are new to designing a Cisco Catalyst SD-WAN.", "outcomes": ["Explain the four roles of a Cisco SD-WAN and how a new router joins the overlay", "Design transports, colours and TLOCs so that only useful tunnels are built", "Segment a network with VPNs and choose a topology with a control policy", "Steer applications with SLA classes and decide where traffic breaks out to the internet", "Plan a migration in waves and produce a seven-table SD-WAN design pack", "Read the design of a running fabric through the SD-WAN Manager API"], "subject": "Cisco SD-WAN", "domain": "wide area networking", "release_note": "their SD-WAN release", "order": 2, "motif": "wan", "artifact_title": "Cisco SD-WAN Design in Practice", "card": "Bring a router into the overlay, tame the tunnels, segment and shape the topology, steer applications, plan the rollout. Ends with a narrated lab demonstration and a sandbox lab.", "tags": ["WAN", "Cisco Catalyst SD-WAN"], "lede": "Design a Cisco SD-WAN the way it is done on a real rollout: bring routers into the overlay, build only the tunnels that can work, segment and shape the topology, steer applications by measured quality, and migrate a hundred and twenty stores in waves. The course ends with a lab demonstration and a hands-on sandbox lab.", "notice": "The lessons, narration, quizzes and lab on this page were produced with AI. An independent AI review against Cisco documentation found no factual errors, and its ten corrections are applied. A human subject-matter expert has not reviewed the course yet. The lab demonstration shows sample output, and the hands-on lab has not yet been run against a live SD-WAN Manager.", "scenario_note": "The retail chain, its stores and its addresses are an illustrative scenario, not a specific customer.", "suggestions": {"lab": ["Why do I need a token as well as a cookie?", "How do I tell hub and spoke from full mesh in the BFD output?", "Give me a hint for step 7"], "l2": ["What exactly is a TLOC?", "When should I use restrict?", "Private or public colour for an internet line behind NAT?"], "l3": ["How does a control policy create hub and spoke?", "What is VPN 0 for?", "Why does the hub need to advertise a summary route?"], "l4": ["Explain SLA classes with an example", "How fast does application-aware routing react?", "What must change when I use direct internet access?"], "l5": ["How do migrated and old sites reach each other?", "What goes in the policy matrix?", "How many Controllers and Validators do I need?"], "l6": ["Which API call shows the tunnels of a router?", "Why is there no Validator in the control connections?", "Quiz me on reading the output"], "default": ["What does each of the four roles do?", "Why did Store 47 not join the overlay?", "Quiz me on this lesson"]}}, "lessons": [{"id": "l1", "n": 1, "title": "The four roles", "summary": "Store 47 opens tomorrow and its new router will not join the network. Meet the four roles of a Cisco SD-WAN, follow a router as it joins, and bring the store online yourself.", "keypoints": ["Four roles: the Manager (vManage) configures and monitors, the Controller (vSmart) distributes routes and policies, the Validator (vBond) admits new routers, and WAN Edge routers carry the traffic.", "A router joins in four steps: authenticate with the Validator, learn where the Manager and Controller are, build secure control connections, then receive configuration, routes and policies and build tunnels.", "The Validator accepts a router only if the organization name matches, the serial number is on the authorized WAN Edge list that the Manager sends to the controllers, and the certificates are valid.", "Control plane and data plane are separate. If the Controllers are unreachable, existing tunnels keep forwarding with the last known routes (twelve hours by default).", "Design at least two Controllers and two Validators."], "quiz": [{"q": "Which role is the first point of contact for a new WAN Edge router?", "o": ["The Controller", "The Manager", "The Validator", "Another WAN Edge router"], "a": 2, "why": "The Validator authenticates the new router and then tells it where the Manager and the Controller are."}, {"q": "A new router has power, a working internet line and an IP address, but never joins the overlay. Which of these is a likely cause?", "o": ["Its serial number is not on the authorized list held by the controllers", "No service VPN has been configured", "BFD timers are too long", "Its LAN ports are not connected yet"], "a": 0, "why": "The Validator only accepts a router whose serial number is on the authorized WAN Edge list, with a matching organization name and valid certificates."}, {"q": "What does the Controller (vSmart) do?", "o": ["It terminates the IPsec tunnels from the stores", "It forwards user traffic between sites", "It distributes routes, TLOCs and policies to the routers", "It stores device templates and software images"], "a": 2, "why": "The Controller is the control plane. It never carries user traffic."}, {"q": "All Controllers become unreachable for a few minutes. What happens to traffic between sites?", "o": ["It falls back to the Validator", "It stops at once", "It keeps flowing on the existing tunnels with the last known routes", "It is rerouted through the Manager"], "a": 2, "why": "Control plane and data plane are separate. By default the routers keep their last known routes for twelve hours (the OMP graceful restart timer)."}], "duration": 214.9, "cues": [{"s": 0.35, "e": 10.94, "text": "It's six in the evening, and Store 47 opens tomorrow morning. It's the newest store of a retail chain with a hundred and twenty stores, and the first one built on the new SD-WAN."}, {"s": 11.61, "e": 20.481, "text": "The engineer on site has done everything right. The router has power. The internet line is connected. The router even has an IP address."}, {"s": 21.151, "e": 32.066, "text": "But on the management dashboard, Store 47 doesn't appear. The router never joins the network. The tills can't reach the data center, and the store manager wants to know what time it will work."}, {"s": 32.736, "e": 36.716, "text": "So, where do you look first? Pick a check, and I'll show you what you find."}, {"s": 49.202, "e": 65.396, "text": "Cisco's SD-WAN splits the work of a network into four roles. The first is the Manager, which older documents call vManage. It's the single screen where you configure and monitor everything. Think of an airline. The Manager is the operations centre."}, {"s": 66.066, "e": 81.005, "text": "The second is the Controller, once called vSmart. It's the control plane. It tells every router which routes exist, and which policies apply. In the airline, it's air traffic control. It directs every aircraft, but it never carries a passenger."}, {"s": 81.675, "e": 92.27, "text": "The third is the Validator, once called vBond. It's the first point of contact. It checks who you are, and then it tells you where the Manager and the Controller are. That's the check-in desk."}, {"s": 92.94, "e": 104.218, "text": "And the fourth is the WAN Edge router, at every site. It's the data plane. It carries the user traffic directly from site to site, through encrypted tunnels. Those are the aircraft."}, {"s": 104.888, "e": 108.149, "text": "Your turn. Match each job to the role that does it."}, {"s": 113.016, "e": 137.18, "text": "A new router joins in four steps. First, it contacts the Validator, and the two authenticate each other with certificates. Second, the Validator tells the router where the Manager and the Controller are. Third, the router builds secure control connections to both of them. And fourth, it receives its configuration from the Manager, and its routes and policies from the Controller. Then it builds tunnels to the other sites."}, {"s": 138.08, "e": 156.187, "text": "Step one is where Store 47 failed. The Validator only accepts a router when three things are right. The organization name on the router matches the overlay. The router's serial number is on the authorized list, which the Manager sends to the controllers. And the certificates on both sides are valid."}, {"s": 156.857, "e": 161.776, "text": "If any one of them is wrong, the router is turned away at the check-in desk, and nothing else can happen."}, {"s": 162.676, "e": 170.449, "text": "So let's get Store 47 online. Here are the three checks. Fix what's wrong, then power on the router and watch how far it gets."}, {"s": 182.985, "e": 189.082, "text": "One question always comes up in a design review. What happens to the stores if the Controller goes down?"}, {"s": 189.752, "e": 196.352, "text": "What do you think? The Controller is unreachable for five minutes. What happens to the traffic between the stores?"}, {"s": 213.181, "e": 227.603, "text": "By default, a router keeps using its last known routes for twelve hours without a Controller. What you lose in that time is change. No new routes, and no new policies. That's why a design always has at least two Controllers, and two Validators."}, {"s": 228.503, "e": 241.308, "text": "So what happened to Store 47? Nothing was wrong with the line, the firewall or the router. Its serial number had never been added to the authorized list. One upload later, the store was online, and it opened on time."}, {"s": 241.978, "e": 251.849, "text": "Take three things with you. First: four roles. The Manager manages, the Controller directs, the Validator admits, and the WAN Edge routers carry the traffic."}, {"s": 252.519, "e": 259.064, "text": "Second: a router must be trusted before anything else can happen. Organization name, serial number, certificates."}, {"s": 259.734, "e": 265.472, "text": "And third: the control plane and the data plane are separate, so a controller failure doesn't stop the traffic."}, {"s": 266.142, "e": 273.332, "text": "In the next lesson, we look at the tunnels themselves, and at a dashboard that turned red for no good reason. Try the quiz below first."}], "x": {"items": [{"t": "say", "scene": "w1_hook", "step": 0, "chapter": "Store 47", "text": "It's six in the evening, and Store 47 opens tomorrow morning. It's the newest store of a retail chain with a hundred and twenty stores, and the first one built on the new SD-WAN.", "a": [0.35, 10.94], "cues": []}, {"t": "say", "scene": "w1_hook", "step": 1, "text": "The engineer on site has done everything right. The router has power. The internet line is connected. The router even has an IP address.", "a": [11.61, 20.481], "cues": []}, {"t": "say", "scene": "w1_hook", "step": 2, "text": "But on the management dashboard, Store 47 doesn't appear. The router never joins the network. The tills can't reach the data center, and the store manager wants to know what time it will work.", "a": [21.151, 32.066], "cues": []}, {"t": "probe", "id": "q1", "scene": "w1_hook", "step": 3, "text": "So, where do you look first? Pick a check, and I'll show you what you find.", "prompt": "The new router has power, a line and an IP address, but never joins the overlay. What do you check?", "checks": [{"k": "ip", "label": "The internet line itself", "result": "The line is up and the router can reach the internet. Not the cause."}, {"k": "dns", "label": "The DNS lookup for the Validator's name", "result": "The name resolves to the right address. Not the cause."}, {"k": "fw", "label": "The firewall rules in front of the router", "result": "The SD-WAN control ports, UDP 12346 and upward, are open toward the controllers. Not the cause."}, {"k": "list", "label": "The list of authorized routers on the controllers", "result": "The router's serial number is not on the authorized list, so the Validator refuses it. This is the cause.", "cause": true}], "done": "That's it. The network isn't broken. The router is knocking on the door, and nobody recognises it. To see who answers that door, let's meet the four roles of an SD-WAN.", "a": [32.736, 36.716], "cues": [], "d": [37.386, 48.302]}, {"t": "say", "scene": "w1_roles", "step": 0, "chapter": "Four roles", "text": "Cisco's SD-WAN splits the work of a network into four roles. The first is the Manager, which older documents call vManage. It's the single screen where you configure and monitor everything. Think of an airline. The Manager is the operations centre.", "a": [49.202, 65.396], "cues": []}, {"t": "say", "scene": "w1_roles", "step": 1, "text": "The second is the Controller, once called vSmart. It's the control plane. It tells every router which routes exist, and which policies apply. In the airline, it's air traffic control. It directs every aircraft, but it never carries a passenger.", "a": [66.066, 81.005], "cues": []}, {"t": "say", "scene": "w1_roles", "step": 2, "text": "The third is the Validator, once called vBond. It's the first point of contact. It checks who you are, and then it tells you where the Manager and the Controller are. That's the check-in desk.", "a": [81.675, 92.27], "cues": []}, {"t": "say", "scene": "w1_roles", "step": 3, "text": "And the fourth is the WAN Edge router, at every site. It's the data plane. It carries the user traffic directly from site to site, through encrypted tunnels. Those are the aircraft.", "a": [92.94, 104.218], "cues": []}, {"t": "match", "id": "m1", "scene": "w1_roles", "step": 3, "text": "Your turn. Match each job to the role that does it.", "prompt": "Match each job to the role that does it.", "pairs": [["Checks a new router's identity and introduces it to the others", "Validator"], ["Distributes routes and policies to every router", "Controller"], ["Configuration, templates, monitoring and software upgrades", "Manager"], ["Encrypts and forwards user traffic between sites", "WAN Edge router"]], "done": "Good. Now let's follow a new router as it joins.", "a": [104.888, 108.149], "cues": [], "d": [108.819, 112.116]}, {"t": "say", "scene": "w1_bring", "step": 0, "chapter": "Joining the overlay", "text": "A new router joins in four steps. First, it contacts the Validator, and the two authenticate each other with certificates. Second, the Validator tells the router where the Manager and the Controller are. Third, the router builds secure control connections to both of them. And fourth, it receives its configuration from the Manager, and its routes and policies from the Controller. Then it builds tunnels to the other sites.", "a": [113.016, 137.18], "cues": [115.388, 120.557, 125.021, 128.942]}, {"t": "say", "scene": "w1_trust", "step": 0, "chapter": "Why the door stays shut", "text": "Step one is where Store 47 failed. The Validator only accepts a router when three things are right. The organization name on the router matches the overlay. The router's serial number is on the authorized list, which the Manager sends to the controllers. And the certificates on both sides are valid.", "a": [138.08, 156.187], "cues": [144.434, 148.126, 153.78]}, {"t": "say", "scene": "w1_trust", "step": 4, "text": "If any one of them is wrong, the router is turned away at the check-in desk, and nothing else can happen.", "a": [156.857, 161.776], "cues": []}, {"t": "sim", "id": "s1", "scene": "w1_sim", "step": 0, "chapter": "Fix it", "text": "So let's get Store 47 online. Here are the three checks. Fix what's wrong, then power on the router and watch how far it gets.", "prompt": "Bring Store 47 into the overlay. Fix what is wrong, then power on the router.", "done": "Store 47 is online. The serial number was added to the authorized list, and the list was sent to the controllers. The Validator accepted the router, and the rest followed by itself.", "a": [162.676, 170.449], "cues": [], "d": [171.119, 182.085]}, {"t": "say", "scene": "w1_planes", "step": 0, "chapter": "When a controller fails", "text": "One question always comes up in a design review. What happens to the stores if the Controller goes down?", "a": [182.985, 189.082], "cues": []}, {"t": "ask", "id": "q2", "scene": "w1_planes", "step": 0, "text": "What do you think? The Controller is unreachable for five minutes. What happens to the traffic between the stores?", "prompt": "The Controller is unreachable for five minutes. What happens to traffic between sites?", "options": ["All traffic stops immediately", "Traffic keeps flowing on the existing tunnels", "Traffic falls back to the Manager"], "answer": 1, "right": "Correct. The routers keep the routes they already have, and the tunnels stay up. The control plane and the data plane are separate.", "wrong": "Not quite. The Controller never carries user traffic. The routers keep the routes they already have, and the tunnels stay up.", "a": [189.752, 196.352], "cues": [], "r": [197.022, 204.439], "w": [205.109, 212.511]}, {"t": "say", "scene": "w1_planes", "step": 1, "text": "By default, a router keeps using its last known routes for twelve hours without a Controller. What you lose in that time is change. No new routes, and no new policies. That's why a design always has at least two Controllers, and two Validators.", "a": [213.181, 227.603], "cues": []}, {"t": "say", "scene": "w1_hook", "step": 5, "chapter": "Case closed", "text": "So what happened to Store 47? Nothing was wrong with the line, the firewall or the router. Its serial number had never been added to the authorized list. One upload later, the store was online, and it opened on time.", "a": [228.503, 241.308], "cues": []}, {"t": "say", "scene": "w1_recap", "step": 0, "text": "Take three things with you. First: four roles. The Manager manages, the Controller directs, the Validator admits, and the WAN Edge routers carry the traffic.", "a": [241.978, 251.849], "cues": []}, {"t": "say", "scene": "w1_recap", "step": 1, "text": "Second: a router must be trusted before anything else can happen. Organization name, serial number, certificates.", "a": [252.519, 259.064], "cues": []}, {"t": "say", "scene": "w1_recap", "step": 2, "text": "And third: the control plane and the data plane are separate, so a controller failure doesn't stop the traffic.", "a": [259.734, 265.472], "cues": []}, {"t": "say", "scene": "w1_recap", "step": 3, "text": "In the next lesson, we look at the tunnels themselves, and at a dashboard that turned red for no good reason. Try the quiz below first.", "a": [266.142, 273.332], "cues": []}], "teachback": {"prompt": "In two or three sentences, explain why the Store 47 router did not join the overlay, and what the Validator checks before it accepts a router.", "model": "The router's serial number was not on the authorized list held by the controllers, so the Validator refused it at the first step. The Validator accepts a router only when the organization name matches, the serial number is on the authorized list, and the certificates are valid.", "points": ["the serial number was missing from the authorized list (or the list had not been sent to the controllers)", "the Validator is the first point of contact and authenticates the router", "the three checks: organization name, serial number on the authorized list, valid certificates"]}, "onthejob": "On a WAN Edge router running IOS XE, show sdwan control connections lists its connections to the Controllers and the Manager, and show sdwan control connection-history shows why an attempt failed. Confirm the syntax for your software release.", "poster": ["w1_hook", 1]}}, {"id": "l2", "n": 2, "title": "Tunnels, colours and TLOCs", "summary": "A week into the pilot, half of the tunnels on the dashboard are red and nobody is complaining. Learn what a TLOC is, how colours decide which tunnels are attempted, and clear the dashboard in a simulator.", "keypoints": ["Every transport gets a colour (for example mpls, biz-internet, lte). A TLOC is where a router attaches to a transport: system IP, colour and encapsulation.", "Routers advertise their TLOCs and prefixes to the Controller with OMP. The Controller passes them on, and the routers build IPsec tunnels directly to each other.", "BFD runs inside every tunnel. It shows whether the tunnel is up and measures loss, latency and jitter.", "By default a router tries to build tunnels from every TLOC to every remote TLOC, whatever the colour. Use restrict on a colour whose transport cannot reach the others, such as MPLS.", "Between two private colours the routers use private addresses. If either colour is public they use the public, post-NAT address. Choose the colour by what the transport really is.", "Routers that share a site ID do not build overlay tunnels to each other."], "quiz": [{"q": "What three things together make up a TLOC?", "o": ["System IP, colour and encapsulation", "Public IP, private IP and port", "Site ID, VPN and colour", "Host name, serial number and organization name"], "a": 0, "why": "A TLOC is the point where a router attaches to a transport: system IP, colour and encapsulation."}, {"q": "Stores have an MPLS circuit and an internet line that are not connected to each other. Half of the tunnels show as down. What is the cleanest fix?", "o": ["Increase the BFD timers", "Use the restrict option on the MPLS colour", "Shut down the MPLS tunnel interface", "Give both lines the same colour"], "a": 1, "why": "With restrict, a TLOC only builds tunnels to TLOCs of the same colour, so the impossible MPLS-to-internet tunnels are never attempted."}, {"q": "Which protocol carries TLOCs, routes and policies between the routers and the Controller?", "o": ["IPsec", "OMP", "BGP", "BFD"], "a": 1, "why": "OMP, the Overlay Management Protocol, runs between each router and the Controllers."}, {"q": "An internet line sits behind NAT. Which kind of colour should its tunnel interface use?", "o": ["No colour", "A private colour such as mpls", "A public colour such as biz-internet", "The same colour as the MPLS circuit"], "a": 2, "why": "With a public colour the routers use the public, post-NAT address. Two private colours would try the private addresses and the tunnel would not come up."}], "duration": 223.9, "cues": [{"s": 0.35, "e": 9.856, "text": "It's Monday morning, one week into the pilot. Ten stores are now on the SD-WAN, and each has two lines: a private MPLS circuit, and an internet line."}, {"s": 10.526, "e": 19.839, "text": "The project manager opens the dashboard, and half of the tunnels are red, which means down. And yet nobody is complaining. The tills work, and so do the phones."}, {"s": 20.509, "e": 21.713, "text": "What's your first thought?"}, {"s": 39.336, "e": 53.491, "text": "Start with the underlay. Each store has two transports. The SD-WAN gives every transport a label, which it calls a colour. Here, the MPLS circuit has the colour MPLS, and the internet line has the colour biz-internet."}, {"s": 54.161, "e": 63.754, "text": "Notice one thing. These two clouds aren't connected to each other. A packet that leaves on the MPLS circuit can never arrive on somebody's internet line."}, {"s": 64.654, "e": 89.535, "text": "Each router has a system IP. It's the router's identity in the overlay, like a router ID, and it doesn't change. Each point where a router touches a transport is called a TLOC, a transport locator. A TLOC is three things together: the system IP, the colour, and the encapsulation, which is normally IPsec. So a store with two lines has two TLOCs, and a tunnel always runs from one TLOC to another."}, {"s": 90.205, "e": 101.899, "text": "One more number matters, and that's the site ID. Every router at the same location shares it. Routers with the same site ID never build tunnels to each other, and that prevents loops inside a site."}, {"s": 102.799, "e": 120.553, "text": "Routers don't discover each other by themselves. Each router tells the Controller about its TLOCs and its prefixes, using a protocol called OMP. The Controller passes them on to the other routers. Then the routers build IPsec tunnels straight to each other, and the Controller is never in the data path."}, {"s": 121.223, "e": 132.519, "text": "Inside every tunnel runs a small heartbeat called BFD. It tells the router whether the tunnel is up, and it measures loss, delay and jitter. Remember that, because we'll build on it in Lesson 4."}, {"s": 133.189, "e": 136.291, "text": "Your turn. Match each description to its name."}, {"s": 140.598, "e": 161.581, "text": "Here's the default behaviour. A router tries to build a tunnel from each of its TLOCs to every TLOC at every other site, whatever the colour. Between two stores, that makes four tunnels. MPLS to MPLS works. Internet to internet works. But MPLS to internet can never work, in either direction, because the two clouds don't meet."}, {"s": 162.251, "e": 171.998, "text": "Two tunnels out of four, down for ever. That's the red half of the dashboard. Nothing is broken. The design simply never said which colours may talk to each other."}, {"s": 172.898, "e": 178.86, "text": "You can fix that with one setting on the tunnel interface. Change the design, then refresh the dashboard."}, {"s": 195.818, "e": 216.306, "text": "Colours do one more job. Some colours are private, such as MPLS and metro-ethernet. Others are public, such as biz-internet, public-internet and LTE. When both ends of a tunnel use a private colour, the routers use their own private addresses. When either end uses a public colour, they use the public address, the one that's seen after NAT."}, {"s": 216.976, "e": 225.889, "text": "So choose the colour by what the transport really is. A private colour on an internet line behind NAT is a classic reason for tunnels that never come up."}, {"s": 226.559, "e": 234.121, "text": "Quick check. Two routers sit in the same large store, and they share one site ID. Will they build an overlay tunnel to each other?"}, {"s": 249.896, "e": 260.888, "text": "So the red dashboard was never an outage. The routers were trying to build tunnels between two clouds that don't meet. One word on the MPLS tunnel, restrict, and the dashboard went green."}, {"s": 261.558, "e": 269.781, "text": "Take three things with you. First: a tunnel runs from TLOC to TLOC, and a TLOC is a system IP, a colour and an encapsulation."}, {"s": 270.451, "e": 276.456, "text": "Second: by default, every colour tries to reach every colour. Use restrict where the transports don't meet."}, {"s": 277.126, "e": 284.23, "text": "And third: choose private or public colours by what the transport really is, because that decides which address the tunnel uses."}, {"s": 284.9, "e": 290.275, "text": "Next, we decide who may talk to whom: segments and topology. Try the quiz below first."}], "x": {"items": [{"t": "say", "scene": "w2_hook", "step": 0, "chapter": "The red dashboard", "text": "It's Monday morning, one week into the pilot. Ten stores are now on the SD-WAN, and each has two lines: a private MPLS circuit, and an internet line.", "a": [0.35, 9.856], "cues": []}, {"t": "say", "scene": "w2_hook", "step": 1, "text": "The project manager opens the dashboard, and half of the tunnels are red, which means down. And yet nobody is complaining. The tills work, and so do the phones.", "a": [10.526, 19.839], "cues": []}, {"t": "ask", "id": "q1", "scene": "w2_hook", "step": 2, "text": "What's your first thought?", "prompt": "Half of the tunnels show as down, but no user has a problem. What is the most likely explanation?", "options": ["A provider outage on half of the lines", "Tunnels are being attempted over paths that can never work", "The dashboard is showing old data"], "answer": 1, "right": "Good instinct. Those tunnels were never up, and they never can be. To see why, we need to look at how a tunnel is defined.", "wrong": "It's a fair guess, but the clue is that nobody is affected. Those tunnels were never up, and they never can be. Let's look at how a tunnel is defined.", "a": [20.509, 21.713], "cues": [], "r": [22.383, 29.46], "w": [30.13, 38.436]}, {"t": "say", "scene": "w2_under", "step": 0, "chapter": "Transports and colours", "text": "Start with the underlay. Each store has two transports. The SD-WAN gives every transport a label, which it calls a colour. Here, the MPLS circuit has the colour MPLS, and the internet line has the colour biz-internet.", "a": [39.336, 53.491], "cues": [47.459]}, {"t": "say", "scene": "w2_under", "step": 2, "text": "Notice one thing. These two clouds aren't connected to each other. A packet that leaves on the MPLS circuit can never arrive on somebody's internet line.", "a": [54.161, 63.754], "cues": []}, {"t": "say", "scene": "w2_tloc", "step": 0, "chapter": "What a TLOC is", "text": "Each router has a system IP. It's the router's identity in the overlay, like a router ID, and it doesn't change. Each point where a router touches a transport is called a TLOC, a transport locator. A TLOC is three things together: the system IP, the colour, and the encapsulation, which is normally IPsec. So a store with two lines has two TLOCs, and a tunnel always runs from one TLOC to another.", "a": [64.654, 89.535], "cues": [71.723, 76.681, 83.849]}, {"t": "say", "scene": "w2_tloc", "step": 4, "text": "One more number matters, and that's the site ID. Every router at the same location shares it. Routers with the same site ID never build tunnels to each other, and that prevents loops inside a site.", "a": [90.205, 101.899], "cues": []}, {"t": "say", "scene": "w2_omp", "step": 0, "chapter": "Who tells whom", "text": "Routers don't discover each other by themselves. Each router tells the Controller about its TLOCs and its prefixes, using a protocol called OMP. The Controller passes them on to the other routers. Then the routers build IPsec tunnels straight to each other, and the Controller is never in the data path.", "a": [102.799, 120.553], "cues": [105.519, 111.731, 114.801]}, {"t": "say", "scene": "w2_omp", "step": 4, "text": "Inside every tunnel runs a small heartbeat called BFD. It tells the router whether the tunnel is up, and it measures loss, delay and jitter. Remember that, because we'll build on it in Lesson 4.", "a": [121.223, 132.519], "cues": []}, {"t": "match", "id": "m1", "scene": "w2_omp", "step": 4, "text": "Your turn. Match each description to its name.", "prompt": "Match each description to its name.", "pairs": [["The router's fixed identity in the overlay", "System IP"], ["A label for a transport, such as mpls or biz-internet", "Colour"], ["System IP, colour and encapsulation together", "TLOC"], ["Carries TLOCs, routes and policies to and from the Controller", "OMP"], ["A heartbeat inside each tunnel that measures its quality", "BFD"]], "done": "Good. Now, back to the red dashboard.", "a": [133.189, 136.291], "cues": [], "d": [136.961, 139.698]}, {"t": "say", "scene": "w2_mesh", "step": 0, "chapter": "Why it is red", "text": "Here's the default behaviour. A router tries to build a tunnel from each of its TLOCs to every TLOC at every other site, whatever the colour. Between two stores, that makes four tunnels. MPLS to MPLS works. Internet to internet works. But MPLS to internet can never work, in either direction, because the two clouds don't meet.", "a": [140.598, 161.581], "cues": [148.934, 151.615, 154.171, 156.143]}, {"t": "say", "scene": "w2_mesh", "step": 4, "text": "Two tunnels out of four, down for ever. That's the red half of the dashboard. Nothing is broken. The design simply never said which colours may talk to each other.", "a": [162.251, 171.998], "cues": []}, {"t": "sim", "id": "s2", "scene": "w2_sim", "step": 0, "chapter": "Fix it", "text": "You can fix that with one setting on the tunnel interface. Change the design, then refresh the dashboard.", "prompt": "Clear the red tunnels between the two stores, without losing a transport.", "done": "The dashboard is green. With restrict, a TLOC only builds tunnels to TLOCs of the same colour. Both transports are still in use, and every tunnel that's attempted can actually come up. On a private transport like MPLS, restrict is the normal design.", "a": [172.898, 178.86], "cues": [], "d": [179.53, 194.918]}, {"t": "say", "scene": "w2_nat", "step": 0, "chapter": "Private and public colours", "text": "Colours do one more job. Some colours are private, such as MPLS and metro-ethernet. Others are public, such as biz-internet, public-internet and LTE. When both ends of a tunnel use a private colour, the routers use their own private addresses. When either end uses a public colour, they use the public address, the one that's seen after NAT.", "a": [195.818, 216.306], "cues": [205.5, 210.84]}, {"t": "say", "scene": "w2_nat", "step": 3, "text": "So choose the colour by what the transport really is. A private colour on an internet line behind NAT is a classic reason for tunnels that never come up.", "a": [216.976, 225.889], "cues": []}, {"t": "ask", "id": "q2", "scene": "w2_nat", "step": 3, "text": "Quick check. Two routers sit in the same large store, and they share one site ID. Will they build an overlay tunnel to each other?", "prompt": "Two WAN Edge routers in one store share the same site ID. Do they build an overlay tunnel to each other?", "options": ["Yes, on every colour", "No. Routers with the same site ID do not build tunnels to each other", "Only over MPLS"], "answer": 1, "right": "Right. Same site ID, no tunnel. That's what keeps a site with two routers free of loops.", "wrong": "Not quite. Routers with the same site ID never build tunnels to each other. That's what keeps a site with two routers free of loops.", "a": [226.559, 234.121], "cues": [], "r": [234.791, 240.523], "w": [241.193, 248.996]}, {"t": "say", "scene": "w2_hook", "step": 5, "chapter": "Case closed", "text": "So the red dashboard was never an outage. The routers were trying to build tunnels between two clouds that don't meet. One word on the MPLS tunnel, restrict, and the dashboard went green.", "a": [249.896, 260.888], "cues": []}, {"t": "say", "scene": "w2_recap", "step": 0, "text": "Take three things with you. First: a tunnel runs from TLOC to TLOC, and a TLOC is a system IP, a colour and an encapsulation.", "a": [261.558, 269.781], "cues": []}, {"t": "say", "scene": "w2_recap", "step": 1, "text": "Second: by default, every colour tries to reach every colour. Use restrict where the transports don't meet.", "a": [270.451, 276.456], "cues": []}, {"t": "say", "scene": "w2_recap", "step": 2, "text": "And third: choose private or public colours by what the transport really is, because that decides which address the tunnel uses.", "a": [277.126, 284.23], "cues": []}, {"t": "say", "scene": "w2_recap", "step": 3, "text": "Next, we decide who may talk to whom: segments and topology. Try the quiz below first.", "a": [284.9, 290.275], "cues": []}], "teachback": {"prompt": "In two or three sentences, explain why half of the tunnels were shown as down, and what the restrict option changes.", "model": "By default each router tries to build tunnels from every TLOC to every remote TLOC, whatever the colour, so it also tried MPLS-to-internet tunnels. The MPLS network and the internet are not connected, so those tunnels could never come up. With restrict on the MPLS colour, an MPLS TLOC only builds tunnels to other MPLS TLOCs.", "points": ["by default tunnels are attempted between all colours", "the MPLS and internet transports are not connected, so cross-colour tunnels can never come up", "restrict limits a TLOC to tunnels with TLOCs of the same colour"]}, "onthejob": "On a WAN Edge router, show sdwan bfd sessions lists every tunnel with its local colour, remote colour and state, and show sdwan omp tlocs shows the TLOCs learned from the Controller. Confirm the syntax for your software release.", "poster": ["w2_hook", 1]}}, {"id": "l3", "n": 3, "title": "Segments and topology", "summary": "A security review finds guests and tills in one segment, and stores talking to each other directly. Separate them with VPNs, turn the full mesh into hub and spoke with a control policy, and prove both fixes in a simulator.", "keypoints": ["A VPN is a VRF. VPN 0 is the transport side, VPN 512 is out-of-band management, and service VPNs carry user traffic.", "A service VPN is isolated from end to end: a label inside the tunnel keeps the VPNs apart, so one tunnel can carry several.", "With no policy, the overlay is a full mesh: every site is told about every other site's TLOCs and builds tunnels to all of them.", "A centralized control policy runs on the Controller and changes which routes and TLOCs it advertises. Hide the stores' TLOCs from other stores and the store-to-store tunnels are never built.", "In hub and spoke, the hub advertises a summary or default route so that store-to-store traffic passes through it, where a firewall can inspect it."], "quiz": [{"q": "What is VPN 0 used for?", "o": ["The first service VPN", "Out-of-band management", "The transport side: provider lines and tunnel endpoints", "Guest users"], "a": 2, "why": "VPN 0 is the transport VPN. VPN 512 is for out-of-band management, and service VPNs carry user traffic."}, {"q": "Guest Wi-Fi and the payment tills must never reach each other. What is the design answer?", "o": ["Put them in different site IDs", "Give them different colours", "Put them in different service VPNs", "Use a longer BFD timer for guests"], "a": 2, "why": "A service VPN is a separate routing table, isolated from end to end by a label inside the tunnel."}, {"q": "With no policy configured, which topology does the overlay build?", "o": ["Full mesh", "A ring", "No tunnels at all", "Hub and spoke"], "a": 0, "why": "By default the Controller advertises every TLOC to every site, so every site builds tunnels to every other site."}, {"q": "How does a centralized control policy create a hub-and-spoke topology?", "o": ["It blocks packets between stores on the data center firewall", "It removes the stores from the authorized list", "It shuts tunnel interfaces on the stores", "It changes which TLOCs and routes the Controller advertises to the stores"], "a": 3, "why": "A store that is never told about another store’s TLOC never builds a tunnel to it. The hub advertises a summary or default route for store-to-store traffic."}], "duration": 195.4, "cues": [{"s": 0.35, "e": 8.139, "text": "Two weeks before the rollout, the chain's security team reviews the pilot. Their report has two findings, and both are about who can talk to whom."}, {"s": 8.809, "e": 23.805, "text": "Finding one: in the pilot stores, the guest Wi-Fi and the payment tills share the same network segment. Finding two: any store can reach any other store directly, although company policy says that traffic between stores must pass through the data center firewall."}, {"s": 24.475, "e": 32.703, "text": "Let's start with finding two. Nobody configured tunnels between the stores, so why do they exist? Pick a check, and I'll show you what you find."}, {"s": 43.587, "e": 61.527, "text": "In this SD-WAN, a segment is called a VPN, and it's simply a VRF: a separate routing table. Two of them exist on every router. VPN 0 is the transport side. It holds the lines to the providers, and the tunnels start there. VPN 512 is for out-of-band management."}, {"s": 62.197, "e": 84.484, "text": "Everything else is a service VPN, and you choose the numbers. Here, VPN 10 is for the tills, VPN 20 is for corporate users, and VPN 30 is for guests. A service VPN is isolated from end to end. Inside the tunnel, every packet carries a label that says which VPN it belongs to, so one tunnel can carry all three, and they never mix."}, {"s": 85.154, "e": 94.451, "text": "So finding one has a simple answer. Give the guest Wi-Fi its own VPN. With no route between the two VPNs, a guest phone has no path to a till."}, {"s": 95.121, "e": 98.223, "text": "Your turn. Match each description to its name."}, {"s": 103.423, "e": 120.868, "text": "By default, the overlay is a full mesh. Every site learns every other site's TLOCs, and builds tunnels to all of them. For a hundred and twenty stores, that's more than seven thousand pairs of sites. Small store routers have to hold all of those tunnels, and no firewall sees the traffic between stores."}, {"s": 121.538, "e": 130.888, "text": "The alternative is hub and spoke. Stores build tunnels only to the data centers. Traffic between two stores goes through the hub, where the firewall can inspect it."}, {"s": 131.788, "e": 155.063, "text": "You don't build that topology router by router. You write one centralized control policy, and the Controller enforces it. Remember, the Controller tells every router which TLOCs exist. A control policy changes what it tells them. Here, the Controller stops advertising the stores' TLOCs to the other stores. A store that never hears about another store's TLOC never builds a tunnel to it."}, {"s": 155.733, "e": 170.511, "text": "One more piece is needed. The stores still need a route to each other, through the hub. So the data center advertises a summary route, or a default route, into the overlay. Store traffic follows it to the hub, crosses the firewall, and goes back out to the other store."}, {"s": 171.181, "e": 175.112, "text": "Quick check. Where is a centralized control policy enforced?"}, {"s": 192.138, "e": 196.922, "text": "Now close both findings yourself. Set the design, then send traffic to prove it."}, {"s": 211.151, "e": 220.775, "text": "The security review ended with two changes, and nobody had to log in to a store router. One new VPN in the template, and one control policy on the Controller."}, {"s": 221.445, "e": 233.321, "text": "Take three things with you. First: a VPN is a VRF. VPN 0 is transport, VPN 512 is management, and service VPNs keep users apart from end to end."}, {"s": 233.991, "e": 237.424, "text": "Second: the overlay is a full mesh until you say otherwise."}, {"s": 238.094, "e": 244.957, "text": "And third: topology is a control policy on the Controller. It changes what the routers are told, and the tunnels follow."}, {"s": 245.627, "e": 251.983, "text": "Next: which path should an application take, and what happens when a line gets worse? Try the quiz below first."}], "x": {"items": [{"t": "say", "scene": "w3_hook", "step": 0, "chapter": "The security review", "text": "Two weeks before the rollout, the chain's security team reviews the pilot. Their report has two findings, and both are about who can talk to whom.", "a": [0.35, 8.139], "cues": []}, {"t": "say", "scene": "w3_hook", "step": 1, "text": "Finding one: in the pilot stores, the guest Wi-Fi and the payment tills share the same network segment. Finding two: any store can reach any other store directly, although company policy says that traffic between stores must pass through the data center firewall.", "a": [8.809, 23.805], "cues": [14.785]}, {"t": "probe", "id": "q1", "scene": "w3_hook", "step": 3, "text": "Let's start with finding two. Nobody configured tunnels between the stores, so why do they exist? Pick a check, and I'll show you what you find.", "prompt": "Stores can reach each other directly, and nobody remembers configuring that. Where does it come from?", "checks": [{"k": "static", "label": "Static routes on the store routers", "result": "There are no static routes between stores. Not the cause."}, {"k": "fw", "label": "A rule on the data center firewall", "result": "The firewall never sees this traffic, so no rule there can explain it. Not the cause."}, {"k": "def", "label": "The default behaviour of the overlay", "result": "By default the Controller advertises every site's TLOCs and routes to every other site, so every site builds tunnels to every other site. This is the cause.", "cause": true}], "done": "Exactly. Nobody configured a full mesh. It's what you get when you configure nothing. Let's take the two findings one at a time, starting with segments.", "a": [24.475, 32.703], "cues": [], "d": [33.373, 42.687]}, {"t": "say", "scene": "w3_vpn", "step": 0, "chapter": "Segments", "text": "In this SD-WAN, a segment is called a VPN, and it's simply a VRF: a separate routing table. Two of them exist on every router. VPN 0 is the transport side. It holds the lines to the providers, and the tunnels start there. VPN 512 is for out-of-band management.", "a": [43.587, 61.527], "cues": [52.197, 58.363]}, {"t": "say", "scene": "w3_vpn", "step": 3, "text": "Everything else is a service VPN, and you choose the numbers. Here, VPN 10 is for the tills, VPN 20 is for corporate users, and VPN 30 is for guests. A service VPN is isolated from end to end. Inside the tunnel, every packet carries a label that says which VPN it belongs to, so one tunnel can carry all three, and they never mix.", "a": [62.197, 84.484], "cues": [76.581]}, {"t": "say", "scene": "w3_vpn", "step": 5, "text": "So finding one has a simple answer. Give the guest Wi-Fi its own VPN. With no route between the two VPNs, a guest phone has no path to a till.", "a": [85.154, 94.451], "cues": []}, {"t": "match", "id": "m1", "scene": "w3_vpn", "step": 5, "text": "Your turn. Match each description to its name.", "prompt": "Match each description to its name.", "pairs": [["The lines to the providers, where the tunnels start", "VPN 0"], ["Out-of-band management", "VPN 512"], ["Tills, corporate users and guests: one each", "Service VPNs"], ["Keeps the VPNs apart inside a shared tunnel", "VPN label"]], "done": "Good. Segments are done. Now the topology.", "a": [95.121, 98.223], "cues": [], "d": [98.893, 102.523]}, {"t": "say", "scene": "w3_topo", "step": 0, "chapter": "Topology", "text": "By default, the overlay is a full mesh. Every site learns every other site's TLOCs, and builds tunnels to all of them. For a hundred and twenty stores, that's more than seven thousand pairs of sites. Small store routers have to hold all of those tunnels, and no firewall sees the traffic between stores.", "a": [103.423, 120.868], "cues": [110.595]}, {"t": "say", "scene": "w3_topo", "step": 2, "text": "The alternative is hub and spoke. Stores build tunnels only to the data centers. Traffic between two stores goes through the hub, where the firewall can inspect it.", "a": [121.538, 130.888], "cues": []}, {"t": "say", "scene": "w3_policy", "step": 0, "chapter": "Control policy", "text": "You don't build that topology router by router. You write one centralized control policy, and the Controller enforces it. Remember, the Controller tells every router which TLOCs exist. A control policy changes what it tells them. Here, the Controller stops advertising the stores' TLOCs to the other stores. A store that never hears about another store's TLOC never builds a tunnel to it.", "a": [131.788, 155.063], "cues": [139.102, 145.902, 150.607]}, {"t": "say", "scene": "w3_policy", "step": 4, "fx": "viaHub", "text": "One more piece is needed. The stores still need a route to each other, through the hub. So the data center advertises a summary route, or a default route, into the overlay. Store traffic follows it to the hub, crosses the firewall, and goes back out to the other store.", "a": [155.733, 170.511], "cues": []}, {"t": "ask", "id": "q2", "scene": "w3_policy", "step": 4, "text": "Quick check. Where is a centralized control policy enforced?", "prompt": "Where is a centralized control policy enforced?", "options": ["On every WAN Edge router, packet by packet", "On the Controller, on the routing information it sends and receives", "On the Validator, when a router joins"], "answer": 1, "right": "Right. It acts on routes and TLOCs at the Controller, so the routers simply receive a different view of the network.", "wrong": "Not quite. A control policy acts on routes and TLOCs at the Controller. The routers simply receive a different view of the network.", "a": [171.181, 175.112], "cues": [], "r": [175.782, 182.412], "w": [183.082, 191.238]}, {"t": "sim", "id": "s3", "scene": "w3_sim", "step": 0, "chapter": "Fix it", "text": "Now close both findings yourself. Set the design, then send traffic to prove it.", "prompt": "Close both findings: guests must not reach the tills, and store-to-store traffic must pass the data center firewall.", "done": "Both findings are closed. Guests have their own VPN, so they have no path to the tills. And the Controller hides the stores from each other, so traffic between stores follows the summary route through the data center firewall.", "a": [192.138, 196.922], "cues": [], "d": [197.592, 210.251]}, {"t": "say", "scene": "w3_hook", "step": 5, "chapter": "Case closed", "text": "The security review ended with two changes, and nobody had to log in to a store router. One new VPN in the template, and one control policy on the Controller.", "a": [211.151, 220.775], "cues": []}, {"t": "say", "scene": "w3_recap", "step": 0, "text": "Take three things with you. First: a VPN is a VRF. VPN 0 is transport, VPN 512 is management, and service VPNs keep users apart from end to end.", "a": [221.445, 233.321], "cues": []}, {"t": "say", "scene": "w3_recap", "step": 1, "text": "Second: the overlay is a full mesh until you say otherwise.", "a": [233.991, 237.424], "cues": []}, {"t": "say", "scene": "w3_recap", "step": 2, "text": "And third: topology is a control policy on the Controller. It changes what the routers are told, and the tunnels follow.", "a": [238.094, 244.957], "cues": []}, {"t": "say", "scene": "w3_recap", "step": 3, "text": "Next: which path should an application take, and what happens when a line gets worse? Try the quiz below first.", "a": [245.627, 251.983], "cues": []}], "teachback": {"prompt": "In two or three sentences, explain how the design keeps guests away from the tills, and how it forces store-to-store traffic through the data center.", "model": "Guests get their own service VPN, which is a separate routing table, so there is no route from the guest VPN to the tills' VPN. A centralized control policy on the Controller stops advertising the stores' TLOCs to other stores, so no direct tunnels are built, and the data center advertises a summary route so store-to-store traffic goes through the hub and its firewall.", "points": ["guests and tills are placed in different service VPNs (separate routing tables)", "a control policy on the Controller hides the stores' TLOCs from each other, so no store-to-store tunnels form", "the data center advertises a summary or default route, so traffic between stores passes through the hub firewall"]}, "onthejob": "On a store router, show sdwan omp routes vpn 10 lists the routes received for that VPN and the TLOC each one points to. If the only usable route that covers another store is the summary or default route from the data center, pointing to a data center TLOC, the hub-and-spoke policy is working. Confirm the syntax for your software release.", "poster": ["w3_hook", 2]}}, {"id": "l4", "n": 4, "title": "Application-aware routing and internet breakout", "summary": "Every Monday the weekly sales call breaks up. Find out which tunnel the calls are on, give voice an SLA class and a preferred colour in a simulator, and decide where internet traffic should leave.", "keypoints": ["BFD probes measure loss, latency and jitter on every tunnel, all the time.", "An SLA class sets the loss, latency and jitter an application can accept. An application-aware routing policy maps an application to an SLA class and, optionally, a preferred colour.", "A tunnel that breaks the class is taken out of use for that application. Traffic with no policy keeps using all tunnels equally.", "By default measurements are averaged over ten-minute periods and six periods are considered, so reactions are slow. Shorter timers react faster but can make traffic flap. Decide and test them.", "Three kinds of policy: centralized control policy (Controller, routes and topology), centralized data policy including application-aware routing (sent to the routers, applied to packets), and localized policy (one router: queues, access lists).", "Direct internet access sends traffic straight out at the store with NAT. The security must move with it: a firewall on the router or a cloud security service."], "quiz": [{"q": "What does BFD measure on every overlay tunnel?", "o": ["Loss, latency and jitter", "Routes, prefixes and labels", "Bandwidth, MTU and duplex", "CPU, memory and temperature"], "a": 0, "why": "BFD probes run inside each tunnel. They show whether it is up, and they measure loss, latency and jitter."}, {"q": "What is an SLA class?", "o": ["A group of sites in a control policy", "A queue on the WAN interface", "A licence tier for the routers", "The limits of loss, latency and jitter that an application can accept"], "a": 3, "why": "An application-aware routing policy maps applications to an SLA class and, optionally, a preferred colour."}, {"q": "With default timers, how quickly does application-aware routing move traffic away from a tunnel that has become bad?", "o": ["Only after an administrator approves it", "Within one second", "It can take many minutes, because measurements are averaged over ten-minute periods", "Only after the tunnel goes down completely"], "a": 2, "why": "By default the poll interval is ten minutes and six intervals are considered. Timers can be shortened, at the price of more sensitivity."}, {"q": "A design sends guest traffic straight to the internet from each store. What must be decided at the same time?", "o": ["Which Controller the store uses", "The colour of the data center TLOCs", "The site ID of the guest VPN", "Which firewall or cloud security service inspects that traffic"], "a": 3, "why": "With direct internet access the traffic no longer passes the data center firewall, so the security has to move with it."}], "duration": 215.7, "cues": [{"s": 0.35, "e": 9.781, "text": "Every Monday at half past nine, the chain holds its weekly sales call. And every Monday, the store managers complain. The audio breaks up, and the video freezes."}, {"s": 10.451, "e": 19.245, "text": "Each store has a clean MPLS circuit and a busy internet line. The call is the most important traffic of the week, and something is sending it the wrong way."}, {"s": 19.915, "e": 23.347, "text": "Where do you look? Pick a check, and I'll show you what you find."}, {"s": 35.811, "e": 53.526, "text": "Remember the heartbeat inside every tunnel. BFD sends a probe every second, and from those probes the router works out three numbers for each tunnel: loss, latency and jitter. So at any moment, the router knows that the MPLS tunnel is clean, and that the internet tunnel is losing four percent."}, {"s": 54.426, "e": 75.228, "text": "Application-aware routing puts those numbers to work. First you define an SLA class: the limits that an application can live with. For voice, a common starting point is one percent loss, a hundred and fifty milliseconds of latency, and thirty milliseconds of jitter. Then a policy says: voice traffic needs the voice class, and it prefers the MPLS colour."}, {"s": 75.898, "e": 87.54, "text": "From then on, the router checks every tunnel against the class. A tunnel that breaks the limits is taken out of use for voice, and the calls move to a tunnel that still meets them. Other traffic doesn't have to move."}, {"s": 88.21, "e": 100.022, "text": "Quick check. The internet tunnel has four percent loss, and the voice class allows one percent. An email is sent at the same moment, and email has no SLA class. What happens to the email?"}, {"s": 115.743, "e": 132.109, "text": "One warning before you promise anything to the business. The router doesn't act on a single lost probe. By default, it averages the measurements over ten minutes, and it looks at six of those periods. So with the default timers, moving traffic away from a bad line can take a long time."}, {"s": 132.779, "e": 145.256, "text": "You can shorten those timers, and many designs do. But shorter timers mean more sensitivity, and a line that's only briefly bad can make traffic jump back and forth. So decide the timers on purpose, and test them."}, {"s": 146.156, "e": 150.779, "text": "Now fix Monday morning. Set the policy for voice, then replay the sales call."}, {"s": 166.984, "e": 190.784, "text": "You've now met two kinds of policy, and there's a third. A centralized control policy runs on the Controller, and shapes routes and topology. A centralized data policy, which includes application-aware routing, is sent by the Controller to the routers, and the routers apply it to packets. And a localized policy lives on one router. It covers things like queues for quality of service, and access lists."}, {"s": 191.454, "e": 195.485, "text": "Your turn. Match each need to the kind of policy that meets it."}, {"s": 202.611, "e": 222.534, "text": "Today, when a guest in a store opens a web page, the traffic is carried all the way to the data center, and out to the internet from there. That's a detour through the data center, and it loads the data center's lines twice. The alternative is direct internet access. The store router sends that traffic straight out of its own internet line, using NAT."}, {"s": 223.204, "e": 237.712, "text": "It's faster and cheaper. But the traffic no longer passes the data center firewall, so the security has to move with it: a firewall on the router itself, or a cloud security service. Decide which traffic may break out locally, and what inspects it."}, {"s": 238.612, "e": 249.599, "text": "And Monday's sales call? The router had been measuring the bad line all along. One policy told it what voice needs, and which line voice prefers. The next Monday, nobody complained."}, {"s": 250.269, "e": 256.328, "text": "Take three things with you. First: every tunnel is measured, all the time, for loss, latency and jitter."}, {"s": 256.998, "e": 264.427, "text": "Second: an SLA class and a preferred colour tell the router what an application needs. Without them, all tunnels are equal."}, {"s": 265.097, "e": 270.082, "text": "And third: know your timers. And when traffic breaks out locally, move the security with it."}, {"s": 270.752, "e": 277.6, "text": "In the next lesson, we plan the rollout to a hundred and twenty stores, and we build the design pack. Try the quiz below first."}], "x": {"items": [{"t": "say", "scene": "w4_hook", "step": 0, "chapter": "The Monday call", "text": "Every Monday at half past nine, the chain holds its weekly sales call. And every Monday, the store managers complain. The audio breaks up, and the video freezes.", "a": [0.35, 9.781], "cues": []}, {"t": "say", "scene": "w4_hook", "step": 1, "fx": "callSplit", "text": "Each store has a clean MPLS circuit and a busy internet line. The call is the most important traffic of the week, and something is sending it the wrong way.", "a": [10.451, 19.245], "cues": []}, {"t": "probe", "id": "q1", "scene": "w4_hook", "step": 2, "text": "Where do you look? Pick a check, and I'll show you what you find.", "prompt": "Calls from the stores break up every Monday morning. What do you check?", "checks": [{"k": "bw", "label": "How full the two lines are", "result": "Neither line is more than half used. Bandwidth is not the cause."}, {"k": "path", "label": "Which tunnels the calls are using", "result": "The calls are shared equally between the MPLS tunnel and the internet tunnel. That is the default behaviour. Useful, but not yet the whole answer."}, {"k": "stat", "label": "The measured quality of each tunnel at that hour", "result": "The MPLS tunnel is clean. The internet tunnel loses four percent of its packets on Monday mornings, and half of the calls are on it. This is the cause.", "cause": true}], "done": "That's the picture. The router treats both tunnels as equal, so half of the calls ride on a line that's losing packets. The router has the measurements. Nobody told it to use them.", "a": [19.915, 23.347], "cues": [], "d": [24.017, 34.911]}, {"t": "say", "scene": "w4_bfd", "step": 0, "chapter": "What t
